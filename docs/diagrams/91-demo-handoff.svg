<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="560" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Onboarding hand-off: guided tour -&gt; the real chooser  (v0.83.1)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">First run plays the tour inside the app, then drops the user into the genuine “Choose your side” modal — with no coach-marks.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="112" width="250" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="112" width="6" height="132" rx="3" fill="#4f9dff"/><text x="60" y="136" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">LOAD  app loads (index.html)</text><circle cx="64" cy="153" r="3" fill="#4f9dff"/><text x="76" y="156" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">?side= deep link wins</text><circle cx="64" cy="167" r="3" fill="#4f9dff"/><text x="76" y="170" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">else saved side -&gt; straight in</text><circle cx="64" cy="181" r="3" fill="#4f9dff"/><text x="76" y="184" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">else first-run -&gt; show the tour</text><rect x="56" y="214" width="218" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="229" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">viewer_demo_seen gates it</text>
<text x="306" y="180" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="322" y="112" width="250" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="322" y="112" width="6" height="132" rx="3" fill="#1d9e75"/><text x="342" y="136" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">TOUR  demo in an iframe</text><circle cx="346" cy="153" r="3" fill="#1d9e75"/><text x="358" y="156" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">src = /demo?embed=1</text><circle cx="346" cy="167" r="3" fill="#1d9e75"/><text x="358" y="170" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">self-contained ES5 walkthrough</text><circle cx="346" cy="181" r="3" fill="#1d9e75"/><text x="358" y="184" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Back/Next/Skip/Autoplay + dots</text><rect x="338" y="214" width="218" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="348" y="229" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">embed mode detected</text>
<text x="588" y="180" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="604" y="112" width="250" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="604" y="112" width="6" height="132" rx="3" fill="#caa24a"/><text x="624" y="136" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">FINISH  Finish / Skip</text><circle cx="628" cy="153" r="3" fill="#caa24a"/><text x="640" y="156" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">postMessage {viewerDemo:&#x27;finish&#x27;}</text><circle cx="628" cy="167" r="3" fill="#caa24a"/><text x="640" y="170" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">parent closes the iframe</text><circle cx="628" cy="181" r="3" fill="#caa24a"/><text x="640" y="184" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">sets viewer_demo_seen</text><rect x="620" y="214" width="218" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="630" y="229" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">hand-off signal</text>
<text x="870" y="180" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="886" y="112" width="254" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="886" y="112" width="6" height="132" rx="3" fill="#2f7d4f"/><text x="906" y="136" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">CHOOSER  real #sidegate modal</text><circle cx="910" cy="153" r="3" fill="#2f7d4f"/><text x="922" y="156" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">openSideChooser() — no guides</text><circle cx="910" cy="167" r="3" fill="#2f7d4f"/><text x="922" y="170" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Operator (-10) / Mechanic (-20)</text><circle cx="910" cy="181" r="3" fill="#2f7d4f"/><text x="922" y="184" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">choice saved -&gt; into the app</text><rect x="902" y="214" width="222" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="912" y="229" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">the genuine onboarding</text>
<rect x="40" y="270" width="545" height="96" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="294" font-size="12" font-weight="700" fill="#7f77dd" text-anchor="start">Standalone (DEMO.bat / file://)</text>
<text x="58" y="314" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Same tour, but Finish has no parent app to message. It navigates to</text><text x="58" y="327" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">http://127.0.0.1:8765/?onboard=1 , and the app honors ?onboard=1 by forcing the real</text><text x="58" y="340" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">chooser. So either way you end in the genuine modal.</text>
<rect x="596" y="270" width="544" height="96" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="614" y="294" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">Replay &amp; escape hatches</text>
<text x="614" y="314" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">“▶ Watch the guided tour” button in the chooser footer replays it anytime. A “Skip tour → choose</text><text x="614" y="327" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">side” button is pinned on the tour overlay. Returning users with a saved side never see the</text><text x="614" y="340" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">tour.</text>
<rect x="40" y="382" width="1100" height="56" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="404" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">Compatibility (R1)</text>
<text x="58" y="422" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Additive and behavior-preserving: a saved side still bypasses everything; only the first-run path changed. iframe + postMessage + localStorage are all ES5/legacy-safe. Rollback = revert the index.html load</text><text x="58" y="434" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">block + the demo embed branch.</text>
<text x="40" y="552" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Data-flow diagram. Dark (R3). v0.83.1 · 2026-06-04 · index.html load + #demogate iframe · demo.html finishTour() · /demo?embed=1. Backwards-compatible (R1).</text>
</svg>