<svg viewBox="0 0 1180 660" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect x="0" y="0" width="1180" height="660" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="21" font-weight="700" fill="#e6e9ee" text-anchor="start">PUB LOG via the FLIS Reading Room — direct CSVs (built)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">v0.23.0 · No Windows app needed: the Reading Room publishes monthly CSVs. enrich --publog-dir merges them per NSN (append-only, R6). Correction to 0.22.x.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="104" width="420" height="310" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="58" y="128" font-size="11.5" font-weight="700" fill="#caa24a" text-anchor="start">DOWNLOAD (free, no CAC) — direct monthly CSVs</text>
<rect x="58" y="146" width="384" height="30" rx="6" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="70" y="165" font-size="10.3" font-weight="700" fill="#e6e9ee" text-anchor="start">Identification</text>
<text x="430" y="165" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="end">NSN → item name</text>
<rect x="58" y="182" width="384" height="30" rx="6" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="70" y="201" font-size="10.3" font-weight="700" fill="#e6e9ee" text-anchor="start">H-Series (H6)</text>
<text x="430" y="201" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="end">approved item names</text>
<rect x="58" y="218" width="384" height="30" rx="6" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="70" y="237" font-size="10.3" font-weight="700" fill="#e6e9ee" text-anchor="start">Reference</text>
<text x="430" y="237" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="end">part # + CAGE</text>
<rect x="58" y="254" width="384" height="30" rx="6" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="70" y="273" font-size="10.3" font-weight="700" fill="#e6e9ee" text-anchor="start">Characteristics</text>
<text x="430" y="273" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="end">size / thread / material (Tier 2.5)</text>
<rect x="58" y="290" width="384" height="30" rx="6" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="70" y="309" font-size="10.3" font-weight="700" fill="#e6e9ee" text-anchor="start">Management</text>
<text x="430" y="309" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="end">AAC + I&amp;S substitutes</text>
<rect x="58" y="326" width="384" height="30" rx="6" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="70" y="345" font-size="10.3" font-weight="700" fill="#e6e9ee" text-anchor="start">CAGE</text>
<text x="430" y="345" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="end">manufacturer per CAGE</text>
<rect x="58" y="362" width="384" height="30" rx="6" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="70" y="381" font-size="10.3" font-weight="700" fill="#e6e9ee" text-anchor="start">History</text>
<text x="430" y="381" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="end">INACTIVE / cancelled NSNs (kept, R6)</text>
<path d="M460,260 L508,260" stroke="#caa24a" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="508" y="180" width="300" height="160" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="526" y="204" font-size="11.5" font-weight="700" fill="#4f9dff" text-anchor="start">enrich --publog-dir &lt;folder&gt;</text>
<text x="526" y="226" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Reads every CSV; keeps only in-index NSNs;</text><text x="526" y="239" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">composes NSN from FSC+NIIN if needed;</text><text x="526" y="252" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">MERGES fields per NSN across files —</text><text x="526" y="265" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">non-clobbering. Appends every version to</text><text x="526" y="278" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">ref_nsn_log (R6).</text>
<path d="M808,260 L856,260" stroke="#2f7d4f" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="856" y="180" width="284" height="160" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="874" y="204" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">ONE MERGED RECORD</text>
<text x="874" y="226" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Identification→name ·</text><text x="874" y="239" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Reference→part#/CAGE ·</text><text x="874" y="252" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Characteristics→size — combined into the</text><text x="874" y="265" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">cited offline reference; cart auto-fills</text><text x="874" y="278" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">part# + AAC.</text>
<rect x="40" y="430" width="1100" height="80" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="58" y="454" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED</text>
<text x="58" y="476" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Folder ingest of 3 Reading-Room-style files (Identification + Reference + Characteristics) for one NSN → a single merged record (name + part# + CAGE + characteristics), with</text><text x="58" y="489" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">3 versions retained in ref_nsn_log (non-clobbering UPSERT + append-only). Only the download is heavy; the ingest is fast (your NSNs only).</text>
<rect x="40" y="524" width="1100" height="86" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="58" y="548" font-size="11.5" font-weight="700" fill="#caa24a" text-anchor="start">CORRECTION &amp; R6 NOTE</text>
<text x="58" y="570" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Earlier I said the PUB LOG fill needed DLA&#x27;s Windows app + Batch/SQL export — the Reading Room makes that unnecessary; these are plain CSVs. And History.zip means even</text><text x="58" y="583" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">decommissioned NSNs in your corpus get nomenclature/part# — kept, never removed (R6).</text>
<text x="40" y="650" font-size="9.0" font-weight="400" fill="#6b7280" text-anchor="start">Built &amp; verified. Dark (R3) · CHANGELOG 0.23.0 (R4) · visual panel (R5) · quickstart in docs/PUBLOG-EXPORT-QUICKSTART.md.</text>
</svg>