size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">are the vision-heavy few: rotation-aware GD&amp;T from drawings (§4.6), full layout analysis (§2.4), callout-number OCR (§4.5, needs easyocr host-side), and vision-language page QA (§10.1). Everything additive, sidecar-only, corpus authoritative — the</text><text x="58" y="376" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">repository increasingly stands on its own (R12).</text></svg>