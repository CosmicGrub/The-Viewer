<text x="469" y="157" font-size="8.6" font-weight="400" fill="#7fd8b6" text-anchor="start">Weekly</text>
<text x="56" y="182" font-size="10" font-weight="400" fill="#cdd8e4" text-anchor="start">“TABLE 2-1. PREVENTIVE MAINTENANCE CHECKS AND SERVICES. Interval: BEFORE, DURING, AFTER, WEEKLY. Item: engine oil level…”</text>
<text x="56" y="226" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">+ intervals inferred: Monthly / Annually on continuation pages.</text>
<line x1="40" y1="258" x2="1060" y2="258" stroke="#2b333f"/>
<text x="40" y="286" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="start">HOW / VERIFIED / R1</text>
<rect x="40" y="300" width="1020" height="168" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<circle cx="56" cy="321" r="2.6" fill="#2f7d4f"/>
<text x="66" y="324" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">pmcs.find(): FTS-match (&#x27;preventive maintenance checks&#x27; OR PMCS OR &#x27;checks and services&#x27;); dedup by doc+page; infer interval from text.</text>
<circle cx="56" cy="340" r="2.6" fill="#2f7d4f"/>
<text x="66" y="343" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Vehicle filters on documents.vehicle LIKE — NOT the page body. A self-test caught the original body-FTS bug (vehicle isn&#x27;t in the body) and it was fixed.</text>
<circle cx="56" cy="359" r="2.6" fill="#2f7d4f"/>
<text x="66" y="362" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Verified in-sandbox on a synthetic FTS index: HMMWV → 2 PMCS pages w/ correct intervals; wrong vehicle → 0; no-vehicle → all.</text>
<circle cx="56" cy="378" r="2.6" fill="#2f7d4f"/>
<text x="66" y="381" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">/api/pmcs + /pmcs page + 🗓 in palette + Tools menu; pmcs.py in audit + VERIFY-099 + verify_ui. Read-only on the index (R1/R6).</text>
<text x="40" y="532" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Markup. Dark (R3). v0.99.23 · 2026-07-01 · pmcs.py + /api/pmcs + /pmcs. Read-only. R1/R6.</text>
