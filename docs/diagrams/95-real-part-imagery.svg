<text x="476" y="166" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">caption-anchored / graphic-union /</text><text x="476" y="177" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">top-62%</text>
<text x="664" y="162" font-size="13" font-weight="700" fill="#9aa6b6" text-anchor="start">→</text>
