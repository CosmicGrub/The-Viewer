<path class="edge d" d="M684,337 L718,316"/>

<!-- SECTION C: search flow -->
<line class="rule" x1="32" y1="392" x2="968" y2="392"/>
<text x="32" y="422" class="sec">3 · Search Query Flow</text>
<rect x="32" y="440" width="140" height="56" rx="9" fill="#1c2430" stroke="#38414e"/>
<text x="102" y="464" text-anchor="middle" class="lbl">Type query</text>
<text x="102" y="480" text-anchor="middle" class="sub">part# · NSN · keyword</text>
<rect x="206" y="440" width="150" height="56" rx="9" fill="#1a2740" stroke="#3a4d6e"/>
<text x="281" y="464" text-anchor="middle" class="lbl">FTS5 prefix</text>
<text x="281" y="480" text-anchor="middle" class="sub">predictive, BM25</text>
<rect x="390" y="440" width="150" height="56" rx="9" fill="#1a2740" stroke="#3a4d6e"/>
<text x="465" y="464" text-anchor="middle" class="lbl">Rank + boost</text>
<text x="465" y="480" text-anchor="middle" class="sub">title / TM# / NSN</text>
<rect x="574" y="440" width="160" height="56" rx="9" fill="#16301f" stroke="#2f5a3e"/>
<text x="654" y="464" text-anchor="middle" class="lbl">Results</text>
<text x="654" y="480" text-anchor="middle" class="sub">vehicle · page · snippet</text>
<rect x="768" y="440" width="200" height="56" rx="9" fill="#1c2430" stroke="#38414e"/>
<text x="868" y="464" text-anchor="middle" class="lbl">Open page · Ctrl+F</text>
<text x="868" y="480" text-anchor="middle" class="sub">→ add to parts request</text>
