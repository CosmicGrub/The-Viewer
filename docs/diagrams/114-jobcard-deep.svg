<text x="54" y="175" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">→ _task_intent →</text>
<text x="54" y="190" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">kind=Replacement,</text>
<text x="54" y="205" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">focus=&#x27;alternator&#x27;</text>
