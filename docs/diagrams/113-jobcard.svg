<svg viewBox="0 0 1180 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="720" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Job Card / Work Order — one bay-ready PDF for a TASK   v0.99.9</text>
<text x="40" y="70" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Requirement C of the brief: a complete instructional rundown — how to remove/install, what tools, what torque — assembled from what&#x27;s already in the index.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="118" width="300" height="132" rx="11" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="54" y="140" font-size="12" font-weight="700" fill="#caa24a" text-anchor="start">procedure_for()</text>
<text x="54" y="162" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">kind (Removal/Install/…),</text>
<text x="54" y="177" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">numbered steps, tools</text>
<text x="54" y="192" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">required, WARNING/CAUTION/</text>
<text x="54" y="207" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">NOTE callouts — cited.</text>
<rect x="348" y="118" width="300" height="132" rx="11" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="362" y="140" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">torque_specs()</text>
<text x="362" y="162" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">stated torque values near</text>
<text x="362" y="177" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;torque&#x27;/&#x27;tighten&#x27; + unit</text>
<text x="362" y="192" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">(ft-lb / in-lb / N·m),</text>
<text x="362" y="207" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">each cited to its page.</text>
<rect x="40" y="260" width="300" height="132" rx="11" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="54" y="282" font-size="12" font-weight="700" fill="#1d9e75" text-anchor="start">partlocate + figureparts</text>
<text x="54" y="304" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">every part on the task&#x27;s</text>
<text x="54" y="319" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">figures (NSN/P-N/CAGE/SMR),</text>
<text x="54" y="334" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">deduped across the pages.</text>
<rect x="348" y="260" width="300" height="132" rx="11" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="362" y="282" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">fitz page render</text>
<text x="362" y="304" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">the actual TM figure pages</text>
<text x="362" y="319" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">rasterized (source of truth)</text>
<text x="362" y="334" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">appended after the text.</text>
<rect x="664" y="118" width="476" height="274" rx="12" fill="#171d26" stroke="#7fbfff" stroke-width="1.5"/>
<text x="682" y="146" font-size="13" font-weight="700" fill="#7fbfff" text-anchor="start">jobcard.build_pdf()  →  Work Order .pdf</text>
<text x="682" y="168" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">GET /api/jobcard?q=&lt;task | part | NSN&gt;</text>
<circle cx="688" cy="193" r="2.6" fill="#2f7d4f"/>
<text x="700" y="196" font-size="10" font-weight="400" fill="#e6e9ee" text-anchor="start">Cover — task, part label, NSN, counts, SAFETY line</text>
<circle cx="688" cy="215" r="2.6" fill="#2f7d4f"/>
<text x="700" y="218" font-size="10" font-weight="400" fill="#e6e9ee" text-anchor="start">1 · Procedures — steps + tools + WARNING/CAUTION</text>
<circle cx="688" cy="237" r="2.6" fill="#2f7d4f"/>
<text x="700" y="240" font-size="10" font-weight="400" fill="#e6e9ee" text-anchor="start">2 · Torque values — value + context + citation</text>
<circle cx="688" cy="259" r="2.6" fill="#2f7d4f"/>
<text x="700" y="262" font-size="10" font-weight="400" fill="#e6e9ee" text-anchor="start">3 · Parts on the figures — NSN / P-N / CAGE / SMR</text>
<circle cx="688" cy="281" r="2.6" fill="#2f7d4f"/>
<text x="700" y="284" font-size="10" font-weight="400" fill="#e6e9ee" text-anchor="start">4 · Figure pages — rendered from the source TMs</text>
<text x="682" y="376" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Pure reportlab + PyMuPDF + Pillow · offline · read-only · dark theme (R3)</text>
<line x1="348" y1="184" x2="660" y2="255" stroke="#4a6a8a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="656" y1="184" x2="660" y2="255" stroke="#4a6a8a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="348" y1="326" x2="660" y2="255" stroke="#4a6a8a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="656" y1="326" x2="660" y2="255" stroke="#4a6a8a" stroke-width="1.6" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4a6a8a"/></marker></defs>
<line x1="40" y1="410" x2="1140" y2="410" stroke="#2b333f"/>
<text x="40" y="438" font-size="13" font-weight="700" fill="#4f9dff" text-anchor="start">WHY IT MATTERS</text>
<rect x="40" y="452" width="1100" height="84" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="476" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">Everything the app had — search, procedures, torque, the locator, figure rendering — was separate. The Job Card fuses them into the one artifact a mechanic actually carries into the bay: a single work order for &#x27;replace the</text><text x="58" y="491" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">alternator&#x27; with the steps, the tools, the safety callouts, the torque, the parts and the figures, every line cited to the real TM page. This is the brief&#x27;s requirement C.</text>
<line x1="40" y1="552" x2="1140" y2="552" stroke="#2b333f"/>
<text x="40" y="580" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED / R1</text>
<rect x="40" y="594" width="1100" height="96" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<circle cx="56" cy="613" r="2.6" fill="#2f7d4f"/>
<text x="66" y="616" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">build_pdf() self-test produced a valid 4-page PDF from synthetic content (cover + text page + 2 figure pages); rendered &amp; eyeballed (docs/jobcard_proof*.png).</text>
<circle cx="56" cy="629" r="2.6" fill="#2f7d4f"/>
<text x="66" y="632" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Auto page-break, WARNING/CAUTION in orange, torque in green, parts with NSN/P-N/CAGE/SMR — all correct. locate.html JS passes node --check.</text>
<circle cx="56" cy="645" r="2.6" fill="#2f7d4f"/>
<text x="66" y="648" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Route /api/jobcard gathers procedures+torque from the LIVE features (core.db injected) then calls the pure assembler. 🧾 Work Order button on /locate.</text>
<circle cx="56" cy="661" r="2.6" fill="#2f7d4f"/>
<text x="66" y="664" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Additive &amp; rollbackable: one module + one read-only route + one button. Nothing writes the index (R1/R6). Host-verify in VERIFY-099.bat.</text>
<text x="40" y="712" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Markup. Dark (R3). v0.99.9 · 2026-07-01 · jobcard.py //api/jobcard · 🧾 on /locate. Read-only. R1/R6.</text>
</svg>