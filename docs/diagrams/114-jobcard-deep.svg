<text x="330" y="160" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">procedure_for + torque_specs</text>
<text x="330" y="175" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">+ part_differences</text>
<text x="330" y="190" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">(look-alike) + partlocate</text>
<text x="330" y="205" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">/ figureparts (parts+figs)</text>
