<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="600" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Tighter sorting — cache + overrides + corroboration  (v0.74.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Built on the operator/mechanic split: higher accuracy, constant speed, RPS-safe. Index never written (R1/R6).</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="200" rx="3" fill="#2f7d4f"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">⚡  Side-map cache (speed)</text><circle cx="64" cy="149" r="3" fill="#2f7d4f"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Classify every document ONCE.</text><circle cx="64" cy="163" r="3" fill="#2f7d4f"/><text x="76" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Keyed on doc-count + max id + override mtime.</text><circle cx="64" cy="177" r="3" fill="#2f7d4f"/><text x="76" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">/api/by_side, counts, side-search reuse it.</text><circle cx="64" cy="191" r="3" fill="#2f7d4f"/><text x="76" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Rebuilds only when docs/overrides change -&gt; O(1).</text><rect x="56" y="278" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="293" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Faster, never slower.</text>
<rect x="412" y="108" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="108" width="6" height="200" rx="3" fill="#1d9e75"/><text x="432" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">✍  Manual overrides (accuracy)</text><circle cx="436" cy="149" r="3" fill="#1d9e75"/><text x="448" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">sides_override.json sidecar (append-only + log).</text><circle cx="436" cy="163" r="3" fill="#1d9e75"/><text x="448" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Pin any doc: operator / mechanic / both.</text><circle cx="436" cy="177" r="3" fill="#1d9e75"/><text x="448" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Overrides always win; POST /api/side_override.</text><circle cx="436" cy="191" r="3" fill="#1d9e75"/><text x="448" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Review-uncertain panel = one-click pins.</text><rect x="428" y="278" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="293" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Fix the tail, no guessing.</text>
<rect x="784" y="108" width="356" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="108" width="6" height="200" rx="3" fill="#caa24a"/><text x="804" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  Cover/MAC corroboration</text><circle cx="808" cy="149" r="3" fill="#caa24a"/><text x="820" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">LOW-confidence docs only (no TM code).</text><circle cx="808" cy="163" r="3" fill="#caa24a"/><text x="820" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Reads OCR&#x27;d page 1 already in the index.</text><circle cx="808" cy="177" r="3" fill="#caa24a"/><text x="820" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;OPERATOR&#x27;S MANUAL&#x27; -&gt; operator;</text><circle cx="808" cy="191" r="3" fill="#caa24a"/><text x="820" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;MAINTENANCE ALLOCATION CHART&#x27; -&gt; mechanic.</text><rect x="800" y="278" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="293" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Evidence, not defaults. No global cost.</text>
<rect x="40" y="326" width="1100" height="70" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="348" font-size="11.5" font-weight="700" fill="#7f77dd" text-anchor="start">confidence on every classification</text>
<text x="58" y="368" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">tm_side() now returns high (from the coverage code) / medium (title or cover wording) / low (defaulted), and &#x27;override&#x27; once pinned. The UI surfaces low+medium as &#x27;uncertain&#x27; for review, and ?side=</text><text x="58" y="381" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">deep links open straight to a side; operator-side declutters the parts-request CTA (reversible).</text>
<rect x="40" y="406" width="1100" height="72" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="427" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED</text>
<text x="58" y="447" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">tm_side confidence 5/5. sides_feature end-to-end on a 6-doc fixture with OCR cover pages + an override: counts 3 operator / 4 mechanic / 1 both / 1 uncertain; cover-&gt;operator, MAC-&gt;mechanic, override</text><text x="58" y="460" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">flips the doc and the cache rebuilds. Route added to the host suite (RUN-ALL-TESTS.bat) — sandbox mount was stale at build time.</text>
<rect x="40" y="488" width="1100" height="76" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="509" font-size="11.5" font-weight="700" fill="#4f9dff" text-anchor="start">Phase-2 (planned, not built): chapter-level routing</text>
<text x="58" y="529" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">A combined -12/-13/-14 has operator AND maintenance chapters on different pages. Using the OCR&#x27;d table of contents, drop each side into its own chapters of the book. Sidecar + cache + override, falls</text><text x="58" y="542" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">back to whole-book. See docs/SIDE-CHAPTER-ROUTING-PLAN.md — trigger after reviewing the real-corpus split.</text>
<text x="40" y="594" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.74.0 · 2026-06-03 · sides_feature.py (cache/override/corroborate) · /api/side_override · /api/side_uncertain. Additive (R1/R6).</text>
</svg>