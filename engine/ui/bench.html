<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Bench — THE VIEWER</title>
<link rel="stylesheet" href="/base.css"><script src="/shared.js"></script>
<style>
  body{background:#0c1116;color:#e6edf4;font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0}
  .wrap{max-width:900px;margin:0 auto;padding:22px 18px 70px}
  h1{font-size:20px;margin:0 0 4px} .muted{color:#8a98a8;font-size:12.5px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
  a.btn,button{background:#1b2735;color:#cfe;border:1px solid #2f4858;border-radius:8px;padding:9px 13px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
  .item{display:flex;align-items:center;gap:12px;background:#10151c;border:1px solid #223;border-radius:10px;padding:11px 14px;margin:8px 0}
  .item a.open{flex:1;color:#e6edf4;text-decoration:none;font-weight:600;font-size:13.5px}
  .item a.open:hover{color:#7fbfff}
  .item .q{color:#8a98a8;font-size:11.5px}
  .item .rm{color:#8a98a8;cursor:pointer;border:1px solid #2f4858;border-radius:6px;padding:3px 9px;font-size:12px}
  .item .rm:hover{color:#f2a49c;border-color:#6b4636}
  .empty{color:#6b7787;font-size:13px;padding:16px 0;line-height:1.6}
  .empty code{background:#16202b;border:1px solid #26333f;border-radius:5px;padding:1px 6px}
</style></head><body>
<div class="wrap">
  <h1>★ My Bench</h1>
  <div class="muted">The parts, procedures, and pages you've pinned while working a job — kept on this computer so you can jump back instantly.</div>
  <div class="bar">
    <a class="btn" href="/">← search</a>
    <button id="clear" title="Remove everything from the bench">Clear bench</button>
  </div>
  <div id="list"></div>
</div>
<script>
(function(){
  function $(s){return document.querySelector(s);}
  /* esc()/toast() come from /shared.js — and since v1.56.0 (multi-window PR 13, feature D) so does
     the bench accessor itself: VW.bench.get() / VW.bench.put(). The page-local get()/put() pair that
     used to sit right here is deleted, not kept as a fallback. It was one of two independent copies
     of the same two lines (palette.js's ☆ pin pill had the other), and promoting it into shared.js
     is what lets every write publish the cross-tab change notification this page subscribes to
     below. shared.js is loaded in this page's <head>, before this script runs. */
  function render(){
    var l=VW.bench.get(), host=$('#list');
    if(!l.length){ host.innerHTML='<div class="empty">Nothing pinned yet.<br>On any page, click the <b>☆ pin</b> button (bottom-right, next to ⌘K) to add it here — a part dossier, a procedure, a torque spec, a figure. It stays until you remove it.</div>'; return; }
    var h='';
    l.forEach(function(it,i){
      h+='<div class="item"><a class="open" href="'+esc(it.url)+'" target="_blank">'+esc(it.title||it.url)+(it.q?' <span class="q">“'+esc(it.q)+'”</span>':'')+'</a><span class="rm" data-i="'+i+'" data-url="'+esc(it.url)+'">✕ remove</span></div>';
    });
    host.innerHTML=h;
    host.querySelectorAll('.rm').forEach(function(b){ b.onclick=function(){
      /* Find the row by its url rather than by the index it was painted at: now that another window
         can pin or remove something between this list being drawn and this click, a stale index
         would delete the wrong pin. The painted index is only the fallback, for an entry that was
         somehow stored without a url. */
      var l=VW.bench.get(), u=b.getAttribute('data-url'), at=-1;
      for(var k=0;k<l.length;k++){ if(String(l[k].url)===u){ at=k; break; } }
      if(at<0){ var i=parseInt(b.getAttribute('data-i'),10); if(i>=0&&i<l.length) at=i; }
      if(at>=0){ l.splice(at,1); VW.bench.put(l); }
      render();
    }; });
  }
  $('#clear').onclick=function(){ if(confirm('Clear the whole bench?')){ VW.bench.put([]); render(); } };
  /* D — live-synced bench across tabs. VW.bench.put() publishes a thin {action, count, at} hint on
     VW.channel after every committed write; storage is already shared across every tab on this
     origin, so the hint only ever means "re-read and repaint", never a second copy of the list.
     Neither channel transport echoes back to the tab that published, so this tab's own edits repaint
     exactly once — from their own call sites above — rather than twice. Conflicts are
     last-write-wins with no merge, per the design spec: this repaint simply shows whatever is really
     stored now. The toast is here because a row appearing or vanishing on its own, with no click
     behind it, otherwise reads as a glitch rather than as the other window's doing. */
  VW.channel.subscribe('bench', function(){ render(); toast('Bench updated in another window'); });
  render();

  // v1.63.0 (A2, multi-window PR 14): a zero-config pop-out control for THIS page (button + Ctrl+K
  // palette entry, both from shared.js). VW is already known-present on this page (used above), but
  // the guard stays for consistency with the same call on the other 4 adopting pages.
  if(window.VW && typeof VW.popoutControl==="function"){ VW.popoutControl(); }
})();
</script>
<script src="/palette.js"></script>
</body></html>
