<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="600" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Preflight hang FIX + audit pass  (v0.72.3)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Why startup froze, what it does now, and what the top-to-bottom audit + mutation testing turned up.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="40" y="116" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">The hang, in one line</text>
<rect x="40" y="128" width="1100" height="66" rx="12" fill="#171d26" stroke="#c4585a" stroke-width="1"/>
<text x="58" y="150" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">Startup verified EVERY page of the 3.65 GB index (a full PRAGMA quick_check). Instant when the database was small; a multi-minute freeze once OCR filled it. The program wasn&#x27;t broken — it was grinding</text><text x="58" y="163" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">through a needless full scan before the server could start.</text>
<rect x="40" y="202" width="1100" height="66" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="224" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">FIX</text>
<text x="58" y="244" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">Startup now does a millisecond open-and-read probe. Databases over 512 MB auto-skip the full scan. The deep scan is opt-in (--deep) and time-budgeted (20 s) so it can NEVER hang. The watchdog and</text><text x="58" y="257" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">/healthz share this code, so they got faster too.</text>
<text x="40" y="300" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">Audit findings — 5 fixed, 3 flagged, 0 critical open</text>
<rect x="40" y="314" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="314" width="6" height="200" rx="3" fill="#2f7d4f"/><text x="60" y="338" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">✓  Fixed</text><circle cx="64" cy="355" r="3" fill="#2f7d4f"/><text x="76" y="358" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">V-01 preflight hang (full scan on 3.65 GB).</text><circle cx="64" cy="369" r="3" fill="#2f7d4f"/><text x="76" y="372" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">V-02 /api/threed_refs 500 (orphaned helper) -&gt; test_routes</text><text x="76" y="383" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">34/34.</text><circle cx="64" cy="394" r="3" fill="#2f7d4f"/><text x="76" y="397" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">V-03 procedure parser infinite loop (i-=1) -&gt; restored +</text><text x="76" y="408" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">new test.</text><circle cx="64" cy="419" r="3" fill="#2f7d4f"/><text x="76" y="422" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">V-04/05 two DB connection leaks (procedure_full,</text><text x="76" y="433" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">threed_refs).</text><rect x="56" y="484" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="499" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Additive, rollbackable.</text>
<rect x="412" y="314" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="314" width="6" height="200" rx="3" fill="#caa24a"/><text x="432" y="338" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">⚠  Flagged for your call</text><circle cx="436" cy="355" r="3" fill="#caa24a"/><text x="448" y="358" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">V-06 safeguard.py still runs a full quick_check (same hang</text><text x="448" y="369" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">class).</text><circle cx="436" cy="380" r="3" fill="#caa24a"/><text x="448" y="383" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">V-07 procedure parser weakly tested (20% mutation kill).</text><circle cx="436" cy="394" r="3" fill="#caa24a"/><text x="448" y="397" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">V-08 dev-only: sandbox mount tears big-file reads.</text><rect x="428" y="484" width="328" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="438" y="499" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">No code changed; awaiting sign-off.</text>
<rect x="784" y="314" width="356" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="314" width="6" height="200" rx="3" fill="#4f9dff"/><text x="804" y="338" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">⚡  Mutation testing</text><circle cx="808" cy="355" r="3" fill="#4f9dff"/><text x="820" y="358" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">New mutate.py: auto-breaks one token at a time, re-runs</text><text x="820" y="369" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">tests.</text><circle cx="808" cy="380" r="3" fill="#4f9dff"/><text x="820" y="383" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">patterns.py: 13/13 killed = 100% (tests are airtight).</text><circle cx="808" cy="394" r="3" fill="#4f9dff"/><text x="820" y="397" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">procedure_feature.py: 20% (the V-07 gap).</text><circle cx="808" cy="408" r="3" fill="#4f9dff"/><text x="820" y="411" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Full pass on your PC via RUN-MUTATION.bat.</text><rect x="800" y="484" width="324" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="810" y="499" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">Survivors = test blind spots.</text>
<rect x="40" y="526" width="1100" height="46" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="547" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Verify on your PC: start the app (no more hang), run RUN-ALL-TESTS.bat (test_routes 34/34, new test_procedure), and RUN-MUTATION.bat for the full mutation pass. Report: docs/audit/AUDIT-REPORT.html +</text><text x="58" y="559" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">findings.json.</text>
<text x="40" y="592" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.72.3 · 2026-06-03 · preflight fast-probe · mutate.py · conn-leak fixes · additive (R1/R6).</text>
</svg>