<text x="500" y="416" fill="#c9d1d9" font-size="12.5" text-anchor="middle">"Transcribe onto the authoritative DA 2407 / 5990-E (GCSS-Army).</text>
<text x="500" y="436" fill="#c9d1d9" font-size="12.5" text-anchor="middle">Verify the requested work against the TM." &#8212; never the system of record</text>

