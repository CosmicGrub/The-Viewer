<svg viewBox="0 0 1160 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1160" height="470" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/><text x="40" y="46" font-size="17" font-weight="700" fill="#e6e9ee" text-anchor="start">Provenance audit — the one place links live, for the operator only   v1.2.1</text><line x1="40" y1="70" x2="1120" y2="70" stroke="#2b333f"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9aa6b6"/></marker></defs><rect x="40" y="96" width="320" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="96" width="6" height="150" rx="3" fill="#caa24a"/><text x="60" y="120" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🌐  enrich.db</text><circle cx="64" cy="137" r="3" fill="#caa24a"/><text x="76" y="140" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Every external gap-fill</text><circle cx="64" cy="151" r="3" fill="#caa24a"/><text x="76" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">with FULL provenance:</text><circle cx="64" cy="165" r="3" fill="#caa24a"/><text x="76" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">archived Wayback URL · orig URL · ts</text><rect x="56" y="216" width="288" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="66" y="231" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">SIDECAR (audit)</text><rect x="420" y="96" width="300" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="420" y="96" width="6" height="150" rx="3" fill="#1d9e75"/><text x="440" y="120" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  enrich.provenance_rows()</text><circle cx="444" cy="137" r="3" fill="#1d9e75"/><text x="456" y="140" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">/api/provenance · /audit page</text><circle cx="444" cy="151" r="3" fill="#1d9e75"/><text x="456" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">filter by subject or list all</text><circle cx="444" cy="165" r="3" fill="#1d9e75"/><text x="456" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">tolerates pre-1.1.3 sidecars</text><rect x="436" y="216" width="268" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="446" y="231" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">OPERATOR-ONLY</text><rect x="780" y="96" width="340" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="780" y="96" width="6" height="150" rx="3" fill="#2f7d4f"/><text x="800" y="120" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🧑‍🔧  mechanic views</text><circle cx="804" cy="137" r="3" fill="#2f7d4f"/><text x="816" y="140" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Masterfile · dossier · Work Order</text><circle cx="804" cy="151" r="3" fill="#2f7d4f"/><text x="816" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">consolidated values only</text><circle cx="804" cy="165" r="3" fill="#2f7d4f"/><text x="816" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">NO links surfaced (R11)</text><rect x="796" y="216" width="308" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="806" y="231" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">LINK-FREE</text><path d="M360 171 L420 171" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M360 210 C 560 300, 620 300, 780 200" stroke="#9aa6b6" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="470" y="300" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">same data, links stripped</text><line x1="40" y1="270" x2="1120" y2="270" stroke="#2b333f"/><text x="40" y="296" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">Why split them</text><rect x="40" y="308" width="1080" height="128" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><text x="58" y="332" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Chris&#x27;s rule (R11): mechanics should never see external links — only the raw + filtered data correlated to the authoritative manuals. But someone still has to be able to VERIFY where an external value came from. The /audit page keeps that</text><text x="58" y="348" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">capability in one operator-only place: it shows the archived Wayback snapshot URL, the original live URL, and the snapshot date for every gap-fill, so a source can be spot-checked — without ever leaking a link into the mechanic-facing</text><text x="58" y="364" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Masterfile, dossier, or Work Order. The manuals stay authoritative; external values remain labelled unconfirmed everywhere.</text></svg>