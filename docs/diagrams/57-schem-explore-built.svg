<text x="622" y="232" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">A filmstrip of the SAME vehicle&#x27;s other schematic/wiring sheets (left-side,</text><text x="622" y="244" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">right-side, power, lighting…) — one click to switch. So every sensible view of</text><text x="622" y="256" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">the system is reachable, plus everything in between.</text>
<text x="622" y="296" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Per page: pan (drag) · zoom-to-cursor (wheel) · Clean · Blueprint · tilt X/Y · mirror · ⟲ reset · ←/→ paging.</text>
<text x="622" y="340" font-size="8.8" font-weight="400" fill="#2f7d4f" text-anchor="start">All on the REAL rendered page — themed, tilted and navigated, never altered.</text>
<rect x="40" y="392" width="1100" height="150" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="416" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">THOROUGH, AND STILL GROUNDED (R1/R6)</text>
<text x="58" y="436" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;As thoroughly as possible&#x27;: you can now examine a schematic from the left, the right, above, below, any angle in between, and the back — and hop across all the related sheets for</text><text x="58" y="449" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">that vehicle without leaving the viewer. It&#x27;s presentation-only: the tilt is an honest flat-sheet rotation (CSS perspective), the mirror is a flip, and the page itself is never</text><text x="58" y="462" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">modified. A 2D schematic has no true hidden 3D, so we don&#x27;t fabricate one — we let you explore the real sheet and its real companions fully.</text>
<text x="58" y="524" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Reachable from the home header (📐 Schematics). Pairs with the 3D Library. OCR (in progress) will add full-text search inside these sheets.</text>
<text x="40" y="588" font-size="9.2" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.41.0 · 2026-06-02 · engine/ui/schematics.html.</text>
