<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="640" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Interactive demo / onboarding tour  (v0.83.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Double-click DEMO.bat -&gt; a self-contained guided walkthrough of every core feature, for both sides of the house. No server needed.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="250" height="120" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="120" rx="3" fill="#4f9dff"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">BAT  DEMO.bat</text><circle cx="64" cy="149" r="3" fill="#4f9dff"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">double-click in the project root</text><circle cx="64" cy="163" r="3" fill="#4f9dff"/><text x="76" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">start &quot;&quot; demo.html</text><circle cx="64" cy="177" r="3" fill="#4f9dff"/><text x="76" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">opens in the default browser</text><rect x="56" y="198" width="218" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="213" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">no server, no install</text>
<text x="306" y="172" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="322" y="108" width="250" height="120" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="322" y="108" width="6" height="120" rx="3" fill="#1d9e75"/><text x="342" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">HTML  demo.html (ES5)</text><circle cx="346" cy="149" r="3" fill="#1d9e75"/><text x="358" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">pure ES5 + inline CSS/SVG</text><circle cx="346" cy="163" r="3" fill="#1d9e75"/><text x="358" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">zero external dependencies</text><circle cx="346" cy="177" r="3" fill="#1d9e75"/><text x="358" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">RPS-safe: runs on old browsers</text><rect x="338" y="198" width="218" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="348" y="213" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">deterministic, always renders</text>
<text x="588" y="172" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="604" y="108" width="250" height="120" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="604" y="108" width="6" height="120" rx="3" fill="#caa24a"/><text x="624" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">GATE  Choose your side</text><circle cx="628" cy="149" r="3" fill="#caa24a"/><text x="640" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Operator (-10) / Mechanic (-20)</text><circle cx="628" cy="163" r="3" fill="#caa24a"/><text x="640" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">filters steps by op / mech / both</text><circle cx="628" cy="177" r="3" fill="#caa24a"/><text x="640" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">switch sides any time</text><rect x="620" y="198" width="218" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="630" y="213" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">right depth for the viewer</text>
<text x="870" y="172" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="886" y="108" width="254" height="120" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="886" y="108" width="6" height="120" rx="3" fill="#2f7d4f"/><text x="906" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">TOUR  coach-mark engine</text><circle cx="910" cy="149" r="3" fill="#2f7d4f"/><text x="922" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">scrim + spotlight cutout</text><circle cx="910" cy="163" r="3" fill="#2f7d4f"/><text x="922" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">SVG arrows + callout tooltips</text><circle cx="910" cy="177" r="3" fill="#2f7d4f"/><text x="922" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Back/Next/Skip/Autoplay + dots</text><rect x="902" y="198" width="222" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="912" y="213" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">step-by-step, highlighted</text>
<rect x="40" y="250" width="545" height="150" rx="12" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="58" y="274" font-size="12.5" font-weight="700" fill="#1d9e75" text-anchor="start">OPERATOR (-10) path</text>
<text x="58" y="294" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">1  Search a fault (offline, instant) + predictive suggestions</text>
<text x="58" y="311" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">2  Results tagged by side — operator hits first</text>
<text x="58" y="328" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">3  Open the exact manual page</text>
<text x="58" y="345" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">4  Find-in-manual (Ctrl+F) with highlighted hits</text>
<text x="58" y="362" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">5  Operator checks (safety-first; escalate when needed)</text>
<text x="58" y="379" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">6  Solve-it hub</text>
<rect x="596" y="250" width="544" height="150" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="614" y="274" font-size="12.5" font-weight="700" fill="#caa24a" text-anchor="start">MECHANIC (-20) path  (adds, on top of the above)</text>
<text x="614" y="294" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">4  Procedure / how-to: ordered steps + tools + warnings</text>
<text x="614" y="311" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">5  Torque &amp; fastener reference (dry vs. lubed)</text>
<text x="614" y="328" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">6  3-D parts: real manual figure + live parametric model</text>
<text x="614" y="345" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">7  Look-alike part-diff: flags thread/length/source</text>
<text x="614" y="362" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">8  Circuit Lab: trace + simulate the schematic</text>
<text x="614" y="379" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">9  Smart Collections   +   10  Add documents (ingest)</text>
<rect x="40" y="418" width="1100" height="64" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="442" font-size="11.5" font-weight="700" fill="#7f77dd" text-anchor="start">Why this one always works</text>
<text x="58" y="462" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">The demo is decoupled from the live server and live data (faithful in-HTML mock screens), so it is immune to the port / stale-process issue that was masking earlier changes. Also exposed in-app at /demo. Purely</text><text x="58" y="475" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">additive (R1): two files + one route; rollback = delete them.</text>
<text x="40" y="632" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Data-flow diagram. Dark (R3). v0.83.0 · 2026-06-04 · DEMO.bat + engine/ui/demo.html + /demo route. ES5/RPS-safe, backwards-compatible &amp; rollbackable (R1).</text>
</svg>