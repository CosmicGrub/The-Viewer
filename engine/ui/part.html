<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Part — everything — THE VIEWER</title>
<link rel="stylesheet" href="/base.css"><script src="/shared.js"></script>
<style>
  body{background:#0c1116;color:#e6edf4;font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 16px 70px}
  h1{font-size:20px;margin:0 0 2px}.muted{color:#8a98a8;font-size:12.5px}
  .search{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
  .search input{flex:1;min-width:240px;background:#10151c;border:1px solid #2f4858;border-radius:8px;color:#e6edf4;padding:11px 13px;font-size:15px}
  button.go{background:#1f6feb;border:1px solid #1f6feb;color:#fff;font-weight:600;border-radius:8px;padding:10px 14px;cursor:pointer}
  a.btn,button.alt{background:#1b2735;color:#cfe;border:1px solid #2f4858;border-radius:8px;padding:9px 13px;text-decoration:none;cursor:pointer;font-size:13.5px;display:inline-block}
  a.pkg{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:700}
  .idcard{background:#111823;border:1px solid #24303c;border-radius:12px;padding:14px 16px;margin:12px 0}
  .nsn{font-size:22px;font-weight:800;color:#7fd6a0;letter-spacing:.5px}
  .iname{font-size:16px;font-weight:700}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .alert{border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13px}
  .alert.obs{background:#2a1414;border:1px solid #6a2f2a;color:#e39b95}
  .alert.verd{background:#1a130a;border:1px solid #4a3a17;color:#e8c07a}
  h2{font-size:14px;margin:18px 0 6px;color:#9fb3c8}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .card{background:#111823;border:1px solid #1c2530;border-radius:10px;padding:12px 14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 9px;border-bottom:1px solid #1c2530;vertical-align:top}
  th{color:#8a98a8;font-weight:600;font-size:11px;text-transform:uppercase}
  .val{font-weight:700;color:#7fd6a0}.tq{color:#e7c06a;font-weight:700}
  .caut{border-left:3px solid #6a2f2a;padding:4px 8px;margin:4px 0;font-size:12.5px;color:#e6b9b4;background:#1a1010;border-radius:4px}
  .none{color:#8a98a8;font-size:12.5px;padding:8px 0}
  .proc{border-bottom:1px solid #1a222d;padding:6px 0;font-size:13px}
  .kind{display:inline-block;background:#1c2836;border:1px solid #2f4858;border-radius:5px;padding:1px 7px;font-size:11px;color:#9fd0ff;margin-right:6px}
</style></head><body>
<div class="wrap">
  <h1>🪪 Part — everything in one pane</h1>
  <div class="muted">One authoritative summary per part: identity, alerts, parts-to-order, dimensions, torque, cautions,
    and the procedure — plus one-click a <b>complete job-package PDF</b>. Every value cites the manual.</div>
  <div class="search">
    <input id="q" placeholder="Part name · NSN · part number" aria-label="Search by part name, NSN, or part number" autofocus>
    <button class="go" id="go">Open</button>
    <a class="btn" href="/scan">📷 Scan</a><a class="btn" href="/">← search</a>
  </div>
  <div id="head" class="muted"></div>
  <div id="out"></div>
</div>
<script>
(function(){
  function $(s){return document.querySelector(s);}
  /* esc()/toast() from /shared.js */
  // v1.41 (readiness audit): gj() used to collapse a real transport/server failure and a genuine
  // "nothing here" into the exact same falsy/`!j.ok` shape, so every panel below rendered them
  // identically -- a technician had no way to tell "this part has no field notes" from "the server
  // just failed to answer" for a safety-relevant panel like one-time-use fasteners. gj() now always
  // resolves (never rejects, so no call-site .then() shape changes) to {ok,status,body}: ok is true
  // only for a 2xx response with a JSON body that actually parsed; every other outcome (network/DNS
  // failure, HTTP error status, unparseable body) is ok:false so callers can render a distinct,
  // honest "couldn't load" message instead of silently agreeing with an empty result.
  function gj(u){
    return fetch(u).then(function(r){
      return r.json().catch(function(){ return null; }).then(function(body){
        return { ok: r.ok && body!==null, status: r.status, body: body };
      });
    }).catch(function(){
      return { ok:false, status:0, body:null };
    });
  }
  function failCard(what){ return '<div class="alert verd">⚠ Couldn\'t load '+what+' — try again.</div>'; }

  function run(){
    var q=$('#q').value.trim(); if(q.length<2){ $('#head').textContent='Type a part / NSN.'; return; }
    history.replaceState(null,'','/part?q='+encodeURIComponent(q));
    $('#head').textContent='Assembling…'; $('#out').innerHTML='';
    gj('/api/partsummary?q='+encodeURIComponent(q)).then(function(res){
      if(!res.ok){ $('#head').textContent="Couldn't reach the server — check your connection and try again."; return; }
      var j=res.body, s=j.summary||{};
      // /api/partsummary sends {ok:true} on every successful request >=2 chars (verified against
      // jobcards.py) -- it never legitimately reports ok:false, so the old `!j.ok` check here was
      // dead for real no-match queries and almost always fired on a masked transport failure
      // instead. Honest-empty is now judged on the summary's own content -- NOT s.title, which
      // jobcards.py's _jobpack_data() always sets to the raw query string `q` as a baseline
      // fallback (pkg={"title":q,...}) even when nothing actually matched, so it is never a
      // trustworthy found-a-record signal (confirmed live: a nonsense query still comes back
      // {ok:true, summary:{title:"<the query>", procedures:[], ...}}).
      var hasContent = !!(s.nsn||s.item_name) || (s.parts&&s.parts.length) || (s.dims&&s.dims.length) || (s.procedures&&s.procedures.length) || (s.torque&&s.torque.length) || (s.cautions&&s.cautions.length);
      if(!hasContent){ $('#head').textContent='Nothing found.'; return; }
      $('#head').textContent=''; render(q, s);
      lazyModel(q); lazyConflicts(q); lazyValidate(q); lazyOneuse(q);
      lazyServiceability(q); lazyTorqueSeq(q); lazyKit(q); lazyNotes(q);
      // v1.30 (roadmap Next-tier item 7): 3 real, self-tested, route-registered modules that had
      // zero UI callers for 16-18 versions -- confirmed live before wiring, same lazy pattern as
      // every card above.
      lazyCrossmethod(q); lazyMac(q); lazyWiring(q); lazyCommonality(q); lazyXref(q); lazyRpstl(q);
    });
  }

  function render(q, s){
    var enc=encodeURIComponent(q);
    var h='<div class="idcard"><div><span class="nsn">'+esc(s.nsn||'')+'</span> <span class="iname">'+esc(s.item_name||s.title||q)+'</span></div>'
      +(s.fsc_title?('<div class="muted" style="margin-top:4px">'+esc(s.fsc_title)+'</div>'):'');
    // alerts
    var sup=s.supersession||{};
    if(sup.status==='obsolete/terminal') h+='<div class="alert obs">⚠ OBSOLETE / TERMINAL'+(sup.aac_meaning?(' — '+esc(sup.aac_meaning)):'')+(sup.replaced_by&&sup.replaced_by.length?('; replaced by '+esc(sup.replaced_by.join(', '))):'')+'. Confirm the current NSN before ordering.</div>';
    // action buttons
    h+='<div class="links"><a class="btn pkg" href="/api/jobpack?q='+enc+'" target="_blank">📦 Complete job-package PDF</a>'
      +'<a class="btn" href="/procedure?q='+enc+'" target="_blank">🔧 How-to</a>'
      +'<a class="btn" href="/exploded?q='+enc+'" target="_blank">🧩 Exploded</a>'
      +'<a class="btn" href="/publog?nsn='+enc+'" target="_blank">🗄 Catalog</a>'
      +'<a class="btn" href="/partdiff?q='+enc+'" target="_blank">🔍 Look-alike</a>'
      +'<a class="btn" href="/dossier?q='+enc+'" target="_blank">📋 Dossier</a>'
      +'<a class="btn" href="/packet?q='+enc+'" target="_blank">🖨 Packet</a></div></div>';

    h+='<div id="conflictcard"></div><div id="oneusecard"></div><div id="crossmethodcard"></div>';
    h+='<div class="grid2">';
    // parts to order
    h+='<div><h2>Part to order</h2>';
    if(s.parts&&s.parts.length){ h+='<div class="card"><table><tr><th>NSN</th><th>UOC</th><th>CAGEC</th></tr>'
      +s.parts.map(function(p){return '<tr><td>'+esc(p.nsn)+'</td><td>'+esc(p.uoc||'—')+'</td><td>'+esc(p.cagec||'—')+'</td></tr>';}).join('')+'</table>'
      +(s.parts.length>1?'<div class="muted" style="margin-top:4px">Multiple variants — confirm the UOC for THIS vehicle.</div>':'')+'</div>'; }
    else h+='<div class="none">No catalogued NSN variants — confirm on the cited figure.</div>';
    h+='</div>';
    // key dimensions
    h+='<div><h2>Key dimensions</h2>';
    if(s.dims&&s.dims.length){ h+='<div class="card"><table>'
      +s.dims.map(function(d){var src=(d.authoritative?'manual':'ext');
        var c=d.page_url?('<a href="'+esc(d.page_url)+'" target="_blank" style="color:#4f9dff">'+src+' · cited ↗</a>')
                        :(src+' · <a href="/measures?q='+enc+'" target="_blank" style="color:#7fd6a0">verify</a>');
        return '<tr><td>'+esc(d.type)+'</td><td class="val">'+esc(d.value)+' '+esc(d.unit||'')+'</td><td class="muted">'+c+'</td></tr>';}).join('')+'</table></div>'
      +'<div class="muted" style="font-size:11px;margin-top:3px">Cited values deep-link to the manual page. "verify" opens the cited measurements on /measures — consolidated values are never shown as if page-cited.</div>'; }
    else h+='<div class="none">No consolidated dimensions yet (build the Masterfile).</div>';
    h+='</div></div>';

    // torque
    if(s.torque&&s.torque.length){ h+='<h2>Torque (cited)</h2><div class="card">'
      +s.torque.slice(0,10).map(function(t){return '<div class="proc"><span class="tq">'+esc(t.value)+'</span> <span class="muted">— '+esc(t.context||'')+(t.page?(' · p.'+esc(t.page)):'')+'</span></div>';}).join('')+'</div>'; }
    // cautions
    if(s.cautions&&s.cautions.length){ h+='<h2>Safety callouts</h2>'
      // Review finding (R13 safety-relevant): this page's cautions come from the SAME
      // cautions.find_for_query() (via /api/partsummary) that dossier.html was fixed to show the
      // OCR-quality confidence flag for -- part.html (the app's main per-part summary page) was
      // missed. c.confidence is already in the response; just render it, matching dossier.html.
      +s.cautions.slice(0,8).map(function(c){var cite=c.page?(' <span class="muted">· p.'+esc(c.page)+(c.doc?(' <a href="/deepzoom?doc='+esc(c.doc)+'&page='+esc(c.page)+'" target="_blank" style="color:#4f9dff">open ↗</a>'):'')+'</span>'):'';
        var qual=(c.confidence&&c.confidence!=="clean")?(' <span style="color:var(--amb)" title="OCR text quality: '+esc(c.confidence)+'">⚠ verify on page — OCR quality: '+esc(c.confidence)+'</span>'):"";
        return '<div class="caut"><b>'+esc(c.severity||'NOTE')+'</b> — '+esc(c.text||'')+qual+cite+'</div>';}).join(''); }
    // procedures
    if(s.procedures&&s.procedures.length){ h+='<h2>Procedure</h2><div class="card">'
      +s.procedures.map(function(p){return '<div class="proc"><span class="kind">'+esc(p.kind||'')+'</span>'+esc(p.vehicle||'')+(p.page?(' · p.'+esc(p.page)):'')+' <span class="muted">— '+(p.n_steps||0)+' steps · '+(p.n_tools||0)+' tools</span> <a href="/procedure?q='+enc+'" target="_blank" style="color:#4f9dff">open ↗</a></div>';}).join('')+'</div>'; }

    h+='<div id="svccard"></div><div id="seqcard"></div><div id="kitcard"></div><div id="notescard"></div>';
    h+='<div id="modelcard"></div><div id="maccard"></div><div id="rpstlcard"></div><div id="wirecard"></div><div id="commoncard"></div><div id="xrefcard"></div>';
    h+='<div class="muted" style="margin-top:16px">Assembled from the cited manuals + PUBLOG. Verify torque, sequence &amp; CAUTIONS on the actual page before working.</div>';
    $('#out').innerHTML=h;
  }

  function lazyValidate(q){
    gj('/api/validate?q='+encodeURIComponent(q)).then(function(res){ var box=$('#conflictcard'); if(!box)return;
      if(!res.ok){ box.insertAdjacentHTML('beforeend', failCard('the data-integrity check')); return; }
      var j=res.body; if(!j||!j.ok)return;
      var c=j.counts||{}; if(!(c.quarantine||c.suspect)) return;
      var held=(j.rows||[]).filter(function(r){return r.validation&&r.validation.status!=='ok';}).slice(0,6);
      var h='<div class="alert obs" style="background:#241016;border-color:#8a1c1c"><b>⚠ Data-integrity check</b> — '
        +(c.quarantine||0)+' value(s) HELD (garbled/impossible), '+(c.suspect||0)+' to verify. These are withheld or flagged, not shown as fact.';
      held.forEach(function(r){ h+='<div class="muted" style="margin-top:4px">'+esc(r.type)+' <b>'+esc(r.value)+'</b> — <span class="warn">'+esc(r.validation.status)+'</span>: '+esc(r.validation.reason)+'</div>'; });
      h+='</div>';
      box.insertAdjacentHTML('beforeend', h);
    });
  }
  function lazyConflicts(q){
    // Renders into #conflictcard via insertAdjacentHTML (append), same as lazyValidate above --
    // NEVER box.innerHTML=... here, that would silently wipe out whatever lazyValidate already
    // wrote into the shared box (a real correctness bug fixed alongside the honest-error pass,
    // since both functions now also write failure markers into this same box).
    gj('/api/conflicts?q='+encodeURIComponent(q)).then(function(res){ var box=$('#conflictcard'); if(!box)return;
      if(!res.ok){ box.insertAdjacentHTML('beforeend', '<div class="alert verd">⚠ Couldn\'t check for cross-manual conflicts — try again. Do not treat this as "no conflicts."</div>'); return; }
      var j=res.body; if(!j)return;
      var cs=(j.conflicts||[]);
      if(!cs.length){ box.insertAdjacentHTML('beforeend', '<div class="none">No cross-manual conflicts found.</div>'); return; }
      var h='<div class="alert obs" style="background:#2a1414;border-color:#8a1c1c"><b>⚠ Cross-manual conflict — verify before working</b>';
      cs.slice(0,5).forEach(function(c){
        // v1.26 (conflicts.py vehicle-annotation fix): cross_vehicle=true means the disagreeing
        // values came from documents tagged with DIFFERENT vehicle labels — could be a genuine
        // cross-manual conflict for one real vehicle filed under two folder names, or could be two
        // unrelated vehicles that happen to share this search term (conflicts.py's own docstring: this
        // is disclosed, not solved). Either way, show it — never hide it — but flag it distinctly from
        // a confirmed single-vehicle hit so a technician knows to double-check the vehicle match first.
        var cv=!!c.cross_vehicle;
        h+='<div style="margin-top:6px'+(cv?';padding-left:8px;border-left:3px solid #d98c3f':'')+'">'+esc(c.type)+' ('+esc(c.unit)+'): '
          +c.values.map(function(v){return '<b>'+esc(v.value)+'</b>'+(v.tm?(' <span class="muted">'+esc(v.tm)+(v.page?(' p.'+esc(v.page)):'')+(cv&&v.vehicle?(' — '+esc(v.vehicle)):'')+'</span>'):'');}).join(' &nbsp;vs&nbsp; ')
          +' <span class="muted">('+esc(c.spread_pct)+'% apart, '+esc(c.severity)+')</span>'
          +(cv?('<div class="warn" style="margin-top:2px">⚠ Spans '+(c.vehicles?c.vehicles.length:'multiple')+' different vehicle labels ('+esc((c.vehicles||[]).join(', '))+') — confirm these are really the same vehicle/serial before trusting this as one conflict.</div>'):'')
          +'</div>';
      });
      h+='<div class="muted" style="margin-top:6px;color:#e39b95">The manuals disagree on these values. Use the one for YOUR vehicle/serial; when in doubt, the newest applicable TM governs.</div></div>';
      box.insertAdjacentHTML('beforeend', h);
    });
  }
  function lazyOneuse(q){
    // v1.13 (#41/#42 SAFETY): one-time-use / torque-to-yield fastener flags — each is the manual's
    // own sentence, cited to its page (extractive; nothing inferred).
    gj('/api/oneuse?q='+encodeURIComponent(q)).then(function(res){ var box=$('#oneusecard'); if(!box)return;
      if(!res.ok){ box.innerHTML='<div class="alert verd">⚠ Couldn\'t check for one-time-use/TTY fasteners — try again. Do not treat this as "none flagged."</div>'; return; }
      var j=res.body; if(!j||!j.ok)return;
      var fs=(j.flags||[]); if(!fs.length){ box.innerHTML='<div class="none">No one-time-use/TTY fasteners flagged for this part.</div>'; return; }
      var lbl={one_time_use:'ONE-TIME USE',torque_to_yield:'TORQUE-TO-YIELD',discard_after_removal:'DISCARD AFTER REMOVAL'};
      var h='<div class="alert obs" style="background:#2a1414;border:1px solid #c0392b"><b>⚠ One-time-use / TTY fasteners — replace, never reuse</b>';
      fs.slice(0,6).forEach(function(f){
        h+='<div style="margin-top:6px"><b>'+esc(lbl[f.kind]||f.kind)+'</b> — “'+esc(f.sentence)+'”'
          +' <span class="muted">'+esc(f.tm||'')+(f.page?(' p.'+esc(f.page)):'')
          +((f.doc_id&&f.page)?(' <a href="/deepzoom?doc='+esc(f.doc_id)+'&page='+esc(f.page)+'" target="_blank" style="color:#4f9dff">open ↗</a>'):'')
          +'</span></div>';
      });
      h+='<div class="muted" style="margin-top:6px;color:#e39b95">Each flag is the manual’s exact sentence with its page cite. Verify on the cited page; order replacements before starting the job.</div></div>';
      box.innerHTML=h;
    });
  }
  function lazyCrossmethod(q){
    // v1.30 (roadmap Next-tier item 7): crossmethod.py -- the positive counterpart to the conflict
    // card above. conflicts.py compares MANUALS; this compares independent EXTRACTION METHODS for
    // the same value (e.g. measures-parsed text vs PUBLOG characteristics) -- if they agree, that's
    // real corroboration worth showing; if they disagree, crossmethod already classifies it a
    // "conflict" too (conflicts.py's own conflict card already covers manual-vs-manual disagreement,
    // so this card only surfaces the CONFIRMED/agreement rows -- showing its own conflicts again
    // here would just duplicate the alert above for no new information).
    gj('/api/crossmethod?q='+encodeURIComponent(q)).then(function(res){ var box=$('#crossmethodcard'); if(!box)return;
      if(!res.ok){ box.innerHTML=failCard('cross-method confirmation'); return; }
      var j=res.body; if(!j||!j.ok)return;
      var rows=(j.reconciled||[]).filter(function(r){return r.status==='confirmed';}); if(!rows.length) return;
      var h='<div class="card" style="border-color:#1c4a2e"><b style="color:#7fd6a0">✓ Independently confirmed</b> — the same value was extracted two different ways and they agree:';
      rows.slice(0,6).forEach(function(r){
        h+='<div class="proc">'+esc(r.type)+': <span class="val">'+esc(r.consensus)+'</span> '+esc(r.unit||'')
          +' <span class="muted">— confirmed by '+(r.methods||[]).map(esc).join(' + ')+'</span></div>';
      });
      h+='</div>';
      box.innerHTML=h;
    });
  }
  function lazyMac(q){
    // v1.30 (roadmap Next-tier item 7): macchart.py -- Maintenance Allocation Chart rows (at what
    // level do you replace this, and how long does it take). Route is /api/mac, not /api/macchart.
    gj('/api/mac?q='+encodeURIComponent(q)).then(function(res){ var box=$('#maccard'); if(!box)return;
      if(!res.ok){ box.innerHTML=failCard('the maintenance allocation chart'); return; }
      var j=res.body; if(!j||!j.ok)return;
      if(!j.rows||!j.rows.length){ box.innerHTML='<h2>Maintenance allocation</h2><div class="none">No maintenance allocation chart data for this part.</div>'; return; }
      var h='<h2>Maintenance allocation <span class="muted" style="font-weight:400">— who fixes this, and how long</span></h2><div class="card"><table><tr><th>Component</th><th>Task</th><th>Level</th><th>Hours</th></tr>'
        +j.rows.slice(0,10).map(function(r){return '<tr><td>'+esc(r.component||'')+'</td><td>'+esc(r.function||'')+'</td><td>'+esc(r.level_name||r.level||'')+'</td><td>'+esc(r.man_hours||'—')+'</td></tr>';}).join('')+'</table>'
        +'<div class="muted" style="margin-top:4px">Extracted from the TM MAC line — verify the level/hours against the actual chart.</div></div>';
      box.innerHTML=h;
    });
  }
  function lazyWiring(q){
    // v1.30 (roadmap Next-tier item 7): harnesstrace.py (continuity across connectors) + pinouts.py
    // (per-connector pin/wire-color tables) -- harnesstrace's own response already includes the full
    // connectors[] breakdown pinouts.py would return on its own, plus the nets[] continuity inference
    // on top, so one call covers both modules' real value without a redundant second fetch.
    gj('/api/harnesstrace?q='+encodeURIComponent(q)).then(function(res){ var box=$('#wirecard'); if(!box)return;
      if(!res.ok){ box.innerHTML=failCard('wiring / pinout data'); return; }
      var j=res.body; if(!j||!j.ok)return;
      var nets=(j.nets||[]), cons=(j.connectors||[]);
      if(!nets.length && !cons.length){ box.innerHTML='<h2>Wiring / pinouts</h2><div class="none">No wiring/pinout data for this part.</div>'; return; }
      var h='<h2>Wiring / pinouts <span class="muted" style="font-weight:400">— connector pins &amp; continuity</span></h2><div class="card">';
      if(nets.length){ h+=nets.slice(0,8).map(function(n){
        return '<div class="proc"><b>'+esc(n.signal||'')+'</b> — '+(n.points||[]).map(function(p){return esc(p.connector)+'-'+esc(p.pin);}).join(', ')
          +' <span class="muted">('+esc(n.method||'')+', '+esc(n.confidence||'')+' confidence)</span></div>';
      }).join(''); }
      else { h+=cons.slice(0,6).map(function(c){
        return '<div class="proc"><b>'+esc(c.connector||'')+'</b> — '+(c.pins||[]).slice(0,8).map(function(p){return esc(p.pin)+':'+esc(p.signal||p.wire_color||'');}).join(', ')+'</div>';
      }).join(''); }
      h+='<div class="muted" style="margin-top:4px">Continuity inferred from the pinout tables (shared signal), not measured — confirm with a meter before trusting a net as continuous.</div></div>';
      box.innerHTML=h;
    });
  }
  function lazyCommonality(q){
    // v1.30 (roadmap Next-tier item 7, placement corrected): commonality.py answers "which vehicles
    // use THIS part, and is it fleet-common or single-platform" -- a part-scoped question, so it
    // belongs here alongside every other part-scoped card, not on readiness.html (vehicle-scoped:
    // /api/fluids & /api/intervals both take a VEHICLE, and commonality.py's own /api/commonality
    // does an EXACT nsn/name/part_number lookup -- confirmed live it returns commonality:"unknown"
    // for a vehicle-shaped query). The roadmap's own nav-tooltip citation ("readiness.html already
    // promises fleet shared-parts, by vehicle") describes a DIFFERENT, unbuilt aggregate view -- not
    // simply calling this module -- so that promise stays open rather than being force-fit here.
    gj('/api/commonality?q='+encodeURIComponent(q)).then(function(res){ var box=$('#commoncard'); if(!box)return;
      if(!res.ok){ box.innerHTML=failCard('fleet commonality data'); return; }
      var j=res.body; if(!j||!j.ok||!j.n||j.commonality==='unknown')return;
      var lbl={'fleet-common':'Fleet-common — used across many platforms, worth stocking deep',
                'shared':'Shared — used on a handful of platforms',
                'single-platform':'Single-platform — not shared with other vehicles in this corpus'};
      var h='<h2>Fleet commonality</h2><div class="card"><div class="proc">'+esc(lbl[j.commonality]||j.commonality)
        +'</div><div class="muted" style="margin-top:2px">Seen on: '+(j.vehicles||[]).map(esc).join(', ')+'</div></div>';
      box.innerHTML=h;
    });
  }
  function lazyXref(q){
    // v1.30 (roadmap Next-tier item 8): xref.py -- assemblies/siblings/see_also, previously only
    // reachable via the standalone /related page (its own docstring already said it was meant to
    // power "a related panel on the dossier" -- neither part.html nor dossier.html called it before
    // now). Rendering logic mirrors related.html's own three sections.
    gj('/api/xref?q='+encodeURIComponent(q)).then(function(res){ var box=$('#xrefcard'); if(!box)return;
      if(!res.ok){ box.innerHTML=failCard('related parts &amp; assemblies'); return; }
      var j=res.body; if(!j||!j.found)return;
      if(!(j.assemblies&&j.assemblies.length)&&!(j.siblings&&j.siblings.length)&&!(j.see_also&&j.see_also.length)) return;
      var h='<h2>Related parts &amp; assemblies</h2><div class="card">';
      if(j.assemblies&&j.assemblies.length){ h+='<div class="proc"><b>On this figure:</b> '+j.assemblies.slice(0,4).map(function(a){
        var lbl=esc(a.fig_title||a.fig_no||'figure')+(a.page?(' p.'+esc(a.page)):'');
        return a.locate_url?('<a href="'+esc(a.locate_url)+'" target="_blank" style="color:#4f9dff">'+lbl+' ↗</a>'):lbl;
      }).join(' · ')+'</div>'; }
      if(j.siblings&&j.siblings.length){ h+='<div class="proc"><b>Same figure (siblings):</b> '+j.siblings.slice(0,10).map(function(s){
        var lbl=esc(s.name||s.part_number||s.nsn||'part');
        return s.dossier_url?('<a href="'+esc(s.dossier_url)+'" target="_blank" style="color:#4f9dff">'+lbl+'</a>'):lbl;
      }).join(' · ')+'</div>'; }
      if(j.see_also&&j.see_also.length){ h+='<div class="proc"><b>See also:</b> '+j.see_also.slice(0,10).map(function(s){
        return '<a href="'+esc(s.dossier_url)+'" target="_blank" style="color:#4f9dff">'+esc(s.name||s.nsn)+'</a>';
      }).join(' · ')+'</div>'; }
      h+='</div>';
      box.innerHTML=h;
    });
  }
  function lazyRpstl(q){
    // v1.31 (gap-sweep item 4): rpstl.py's own base lookup (/api/rpstl) -- distinct from the
    // already-wired /api/rpstl_review and /api/rpstl_override admin-queue routes (a naive grep for
    // "/api/rpstl" false-positives on those two calls elsewhere in this file). Same shape gap as
    // commonality/crossmethod before this fix -- a real, self-tested route with zero UI callers.
    gj('/api/rpstl?q='+encodeURIComponent(q)).then(function(res){ var box=$('#rpstlcard'); if(!box)return;
      if(!res.ok){ box.innerHTML=failCard('the RPSTL breakdown'); return; }
      var j=res.body; if(!j||!j.ok)return;
      if(!j.rows||!j.rows.length){ box.innerHTML='<h2>RPSTL breakdown</h2><div class="none">No RPSTL breakdown for this part.</div>'; return; }
      var h='<h2>RPSTL breakdown <span class="muted" style="font-weight:400">— figure/item/SMR from the parts list</span></h2><div class="card"><table><tr><th>Fig</th><th>Item</th><th>SMR</th><th>CAGEC</th><th>P/N</th><th>NSN</th><th>Qty</th><th>Nomenclature</th></tr>'
        +j.rows.slice(0,15).map(function(r){return '<tr><td>'+esc(r.figure||'—')+'</td><td>'+esc(r.item||'—')+'</td><td>'+esc(r.smr||'—')+'</td><td>'+esc(r.cagec||'—')+'</td><td>'+esc(r.part_number||'—')+'</td><td>'+esc(r.nsn||'—')+'</td><td>'+esc(r.qty!=null?String(r.qty):'—')+'</td><td class="muted">'+esc(r.nomenclature||'')+'</td></tr>';}).join('')
        +'</table><div class="muted" style="margin-top:4px">Parsed from the manual\'s own Repair Parts &amp; Special Tools List table — confirm SMR/qty on the cited figure before ordering.</div></div>';
      box.innerHTML=h;
    });
  }
  function lazyServiceability(q){
    gj('/api/serviceability?q='+encodeURIComponent(q)).then(function(res){ var box=$('#svccard'); if(!box)return;
      if(!res.ok){ box.innerHTML=failCard('serviceable / wear limits'); return; }
      var j=res.body; if(!j||!j.ok)return;
      if(!j.limits||!j.limits.length){ box.innerHTML='<h2>Serviceable / wear limits</h2><div class="none">No serviceable/wear limits for this part.</div>'; return; }
      var h='<h2>Serviceable / wear limits <span class="muted" style="font-weight:400">— when to replace</span></h2><div class="card">'
        +j.limits.slice(0,8).map(function(l){return '<div class="proc"><b>'+esc(l.bound.toUpperCase())+'</b> '+esc(l.value)+' '+esc(l.unit||'')+' <span class="muted">— '+esc(l.kind)+(l.page?(' · p.'+esc(l.page)):'')+'</span></div>';}).join('')
        +'<div class="muted" style="margin-top:4px">Confirm the limit on the cited TM page before condemning a part.</div></div>';
      box.innerHTML=h;
    });
  }
  function lazyTorqueSeq(q){
    gj('/api/torqueseq?q='+encodeURIComponent(q)).then(function(res){ var box=$('#seqcard'); if(!box)return;
      if(!res.ok){ box.innerHTML=failCard('the torque sequence diagram'); return; }
      var j=res.body; if(!j||!j.ok)return;
      if(!j.enough||!j.svg){ box.innerHTML='<h2>Torque sequence</h2><div class="none">Not enough torque data for a sequence diagram on this part.</div>'; return; }
      box.innerHTML='<h2>Torque sequence '+(j.stages&&j.stages.length?('· stages '+j.stages.join(' → ')):'')+'</h2><div class="card"><div style="max-width:340px;border:1px solid #24303c;border-radius:8px;overflow:hidden">'+j.svg+'</div><div class="muted" style="margin-top:4px">'+esc(j.pattern)+' pattern · numbered = tightening order · confirm against the TM figure'+(j.page?(' (p.'+esc(j.page)+')'):'')+'.</div></div>';
    });
  }
  function lazyKit(q){
    gj('/api/bom?q='+encodeURIComponent(q)).then(function(res){ var box=$('#kitcard'); if(!box)return;
      if(!res.ok){ box.innerHTML=failCard('the job kit / bill of materials'); return; }
      var j=res.body; if(!j||!j.ok)return;
      var k=j.kit||{};
      if(!(k.counts&&(k.counts.parts||k.counts.tools||k.counts.consumables||k.counts.warnings))){ box.innerHTML='<h2>Job kit / bill of materials</h2><div class="none">No job kit / bill of materials for this part.</div>'; return; }
      var h='<h2>Job kit / bill of materials</h2><div class="card">';
      if(k.warnings&&k.warnings.length) h+='<div class="proc" style="color:#e39b95"><b>⚠ Replace-only fasteners:</b> '+k.warnings.slice(0,3).map(function(w){return '“'+esc(w.sentence)+'”'+(w.page?(' (p.'+esc(w.page)+')'):'');}).join(' · ')+'</div>';
      if(k.consumables&&k.consumables.length) h+='<div class="proc"><b>Consumables:</b> '+k.consumables.map(function(c){return esc(c.item);}).join(', ')+'</div>';
      if(k.tools&&k.tools.length) h+='<div class="proc"><b>Tools:</b> '+k.tools.slice(0,20).map(esc).join(', ')+'</div>';
      if(k.parts&&k.parts.length) h+='<div class="proc"><b>Parts:</b> '+k.parts.length+' line(s), '+(k.counts.total_pieces||0)+' pieces</div>';
      h+='<div class="muted" style="margin-top:4px">Included in the <a href="/api/jobpack?q='+encodeURIComponent(q)+'" target="_blank" style="color:#4f9dff">job-package PDF</a>. Confirm consumables per the procedure.</div></div>';
      box.innerHTML=h;
    });
  }
  function lazyNotes(q){
    gj('/api/notes?q='+encodeURIComponent(q)).then(function(res){ var box=$('#notescard'); if(!box)return;
      if(!res.ok){ box.innerHTML='<h2>Field notes</h2>'+failCard('field notes'); return; }
      var j=res.body; if(!j)return; var ns=(j.notes||[]);
      var h='<h2>Field notes <a href="/review" style="font-size:12px;color:#4f9dff" title="add/endorse notes">＋ add / endorse</a></h2>';
      if(!ns.length){ h+='<div class="card muted">No field notes yet for this part. Seasoned mechanics can add cited tips (endorsed by an SME) via the review page.</div>'; }
      else { h+='<div class="card">'+ns.slice(0,6).map(function(n){return '<div class="proc">'+(n.verified?'✅ ':'• ')+esc(n.text)+' <span class="muted">— '+esc(n.by||'')+(n.endorsements?(' · '+n.endorsements+' endorsement(s)'):'')+(n.retracted?' · RETRACTED':'')+'</span></div>';}).join('')+'</div>'; }
      box.innerHTML=h;
    });
  }
  function lazyModel(q){
    gj('/api/dimscad?q='+encodeURIComponent(q)).then(function(res){ var box=$('#modelcard'); if(!box)return;
      if(!res.ok){ box.innerHTML=failCard('the approximate model'); return; }
      var dc=res.body;
      if(dc&&dc.ok&&dc.enough&&dc.svg){ box.innerHTML='<h2>Approximate model (from dimensions)</h2><div class="card"><div style="max-width:420px;border:1px solid #24303c;border-radius:8px;overflow:hidden">'+dc.svg+'</div><div class="muted" style="margin-top:4px">'+esc(dc.primitive)+' sketch · <a href="/api/dimscad?obj=1&q='+encodeURIComponent(q)+'" target="_blank" style="color:#4f9dff">.OBJ ↗</a></div></div>'; }
      else { box.innerHTML='<h2>Approximate model</h2><div class="none">No approximate model available (not enough dimension data).</div>'; }
    });
  }

  $('#go').onclick=run; $('#q').addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  var pre=new URLSearchParams(location.search).get('q'); if(pre){ $('#q').value=pre; run(); }
})();
</script>
<script src="/palette.js"></script>
<script src="/scanner.js"></script>
