<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="640" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Cross-reference engine — tiers &amp; what gets matched (your call)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Decisively tie OCR-noisy parts to their vehicles and every breakdown/asset. Pick any mix.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="360" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="176" rx="3" fill="#2f7d4f"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔧  X1 · FLIS repair pass</text><circle cx="64" cy="149" r="3" fill="#2f7d4f"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">For every low-confidence row: PN+CAGEC→NSN, NSN→name,</text><circle cx="64" cy="163" r="3" fill="#2f7d4f"/><text x="76" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">fix digits, fill CAGEC/SMR from FLIS. Confidence ladder.</text><circle cx="64" cy="177" r="3" fill="#2f7d4f"/><text x="76" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Pure offline. The biggest accuracy jump.</text><rect x="56" y="254" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="269" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Recommended core.</text>
<rect x="412" y="108" width="360" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="108" width="6" height="176" rx="3" fill="#1d9e75"/><text x="432" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🚛  X2 · Vehicle assignment</text><circle cx="436" cy="149" r="3" fill="#1d9e75"/><text x="448" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">NSN → vehicle(s) via nsn_platforms (45,068) + FLIS</text><circle cx="436" cy="163" r="3" fill="#1d9e75"/><text x="448" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">applicability. Decisively bind each part + breakdown</text><circle cx="436" cy="177" r="3" fill="#1d9e75"/><text x="448" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">to its assorted vehicles (many-to-many).</text><rect x="428" y="254" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="269" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">The &#x27;match to vehicles&#x27; ask.</text>
<rect x="784" y="108" width="356" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="108" width="6" height="176" rx="3" fill="#caa24a"/><text x="804" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔗  X3 · Asset cross-link</text><circle cx="808" cy="149" r="3" fill="#caa24a"/><text x="820" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">One part record links: figure/breakdown image, schematic</text><circle cx="808" cy="163" r="3" fill="#caa24a"/><text x="820" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">set, procedure/how-to, tags + colloquial names, photos/</text><circle cx="808" cy="177" r="3" fill="#caa24a"/><text x="820" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">scans, interchangeable/superseded, manufacturer.</text><rect x="800" y="254" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="269" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Everything, tied by NSN/PN.</text>
<rect x="40" y="298" width="360" height="166" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="298" width="6" height="166" rx="3" fill="#7f77dd"/><text x="60" y="322" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🌐  X4 · Internet enrich (opt-in)</text><circle cx="64" cy="339" r="3" fill="#7f77dd"/><text x="76" y="342" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Residual unknowns only. Public NSN catalogs / maker</text><circle cx="64" cy="353" r="3" fill="#7f77dd"/><text x="76" y="356" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">cross-ref / colloquial names. CACHED to a sidecar so</text><circle cx="64" cy="367" r="3" fill="#7f77dd"/><text x="76" y="370" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">offline keeps it. Gated + ITAR/copyright-aware.</text><rect x="56" y="434" width="328" height="22" rx="6" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/><text x="66" y="449" font-size="8.8" font-weight="700" fill="#7f77dd" text-anchor="start">Optional, never runtime.</text>
<rect x="412" y="298" width="360" height="166" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="298" width="6" height="166" rx="3" fill="#c4585a"/><text x="432" y="322" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🧑  X5 · Review &amp; provenance</text><circle cx="436" cy="339" r="3" fill="#c4585a"/><text x="448" y="342" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Every repaired field keeps source + confidence (auditable,</text><circle cx="436" cy="353" r="3" fill="#c4585a"/><text x="448" y="356" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">reversible). Unresolved → the Part# review queue.</text><circle cx="436" cy="367" r="3" fill="#c4585a"/><text x="448" y="370" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Bulk-confirm; your fixes always win.</text><rect x="428" y="434" width="328" height="22" rx="6" fill="#1c2430" stroke="#c4585a" stroke-width="1"/><text x="438" y="449" font-size="8.8" font-weight="700" fill="#c4585a" text-anchor="start">Nothing silently wrong.</text>
<rect x="784" y="298" width="356" height="166" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="802" y="320" font-size="11.5" font-weight="700" fill="#4f9dff" text-anchor="start">Confidence ladder</text>
<text x="802" y="344" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">low (OCR only)</text>
<text x="802" y="363" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">→ +FLIS name match</text>
<text x="802" y="382" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">→ +PN→NSN confirmed</text>
<text x="802" y="401" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">→ +vehicle applicability</text>
<text x="802" y="420" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">→ +manufacturer/colloquial</text>
<text x="802" y="439" font-size="9.2" font-weight="700" fill="#2f7d4f" text-anchor="start">→ = decided ✓ (else review)</text>
<rect x="40" y="478" width="1100" height="86" rx="12" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="58" y="499" font-size="11.5" font-weight="700" fill="#1d9e75" text-anchor="start">What gets matched (your list)</text>
<text x="58" y="519" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">TMs · models · parts · instructions/procedures · schematics · tags · pictures/photos/breakdown images · scans of all types — all keyed to NSN/part#/CAGEC and bound to their assorted vehicles and</text><text x="58" y="531" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">breakdowns. Built host-side into a sidecar xref.db (index never written, R1/R6); the app reads it instantly. Surfaced in the part card, dossier, 3-D, procedure, and a coverage report (how many parts</text><text x="58" y="543" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">fully resolved vs in review).</text>
<text x="40" y="634" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Proposal diagram. Dark (R3). Tiers X1–X5 for the cross-reference engine. No build yet — awaiting your final call.</text>
</svg>