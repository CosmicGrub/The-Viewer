<svg viewBox="0 0 1180 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="520" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Shape + colour + material on EVERY 3-D image  (v0.81.1)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">The parametric shape and the scan&#x27;s colour/material/finish now apply consistently across all 3-D representations.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="360" height="190" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="190" rx="3" fill="#4f9dff"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🧩  Shape (parametric)</text><circle cx="64" cy="149" r="3" fill="#4f9dff"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Family chosen from the part name — now broader:</text><circle cx="64" cy="163" r="3" fill="#4f9dff"/><text x="76" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">grommet→o-ring, filter/coupling/cable→tube,</text><circle cx="64" cy="177" r="3" fill="#4f9dff"/><text x="76" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">valve/plug/key→shaft, terminal/lug→bracket.</text><circle cx="64" cy="191" r="3" fill="#4f9dff"/><text x="76" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Geometry generated from FLIS dimensions.</text><rect x="56" y="268" width="328" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="283" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">Actual shapes, not boxes.</text>
<rect x="412" y="108" width="360" height="190" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="108" width="6" height="190" rx="3" fill="#2f7d4f"/><text x="432" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🎨  Colour + material (scan)</text><circle cx="436" cy="149" r="3" fill="#2f7d4f"/><text x="448" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Full vocabulary in the client now: military colours,</text><circle cx="436" cy="163" r="3" fill="#2f7d4f"/><text x="448" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">metals, polymers, platings/paint -&gt; colour + finish.</text><circle cx="436" cy="177" r="3" fill="#2f7d4f"/><text x="448" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Mirrors the server material_feature exactly.</text><circle cx="436" cy="191" r="3" fill="#2f7d4f"/><text x="448" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Cards + SVG fallback + modal all read the same.</text><rect x="428" y="268" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="438" y="283" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Looks like the real part.</text>
<rect x="784" y="108" width="356" height="190" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="108" width="6" height="190" rx="3" fill="#1d9e75"/><text x="804" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔗  Everywhere + correlated</text><circle cx="808" cy="149" r="3" fill="#1d9e75"/><text x="820" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Applied to every collection card, the SVG fallback,</text><circle cx="808" cy="163" r="3" fill="#1d9e75"/><text x="820" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">and the modal (which then refines with authoritative</text><circle cx="808" cy="177" r="3" fill="#1d9e75"/><text x="820" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">FLIS material). Paired with the cited scan (Manual</text><circle cx="808" cy="191" r="3" fill="#1d9e75"/><text x="820" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">illustration) and the cross-reference record.</text><rect x="800" y="268" width="324" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="810" y="283" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Consistent across the app.</text>
<rect x="40" y="316" width="1100" height="76" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="58" y="337" font-size="11.5" font-weight="700" fill="#caa24a" text-anchor="start">The whole CAD experience, unified</text>
<text x="58" y="357" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Each 3-D item is now: a parametric shape (from the name) + dimensions (from FLIS) + colour/material/finish (from the scan&#x27;s description) + its cited breakdown image + its cross-reference</text><text x="58" y="369" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">(vehicles/maker/interchange). Editable live in the Parametric CAD panel. Procedural and offline — not a scanned OEM solid (ITAR), but dimensionally + materially grounded and paired with the</text><text x="58" y="381" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">authoritative illustration.</text>
<rect x="40" y="400" width="1100" height="74" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="421" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED</text>
<text x="58" y="441" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Client material port matches the server (rubber→matte black, steel+zinc→silvery metallic, olive-drab+paint→flat olive, brass→warm gloss); expanded classifier maps the new families; all 13 geometry</text><text x="58" y="453" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">families build valid meshes. Client-only ES5; WebGL with SVG fallback (RPS-safe).</text>
<text x="40" y="514" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.81.1 · 2026-06-03 · threed.html appearance() full vocab · partgeo.js classifier · render3D material fallback.</text>
</svg>