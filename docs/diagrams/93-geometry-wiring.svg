<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="640" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">3-D geometry wiring — every shape resolves to a real mesh, in both views</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Audited host-side: 22 families, every classifier output + every NSN/FSC value has a builder, every builder makes a valid mesh.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="110" width="250" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="110" width="6" height="132" rx="3" fill="#4f9dff"/><text x="60" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">1  classify(name,chars,nsn)</text><circle cx="64" cy="151" r="3" fill="#4f9dff"/><text x="76" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">name -&gt; family() (24 keywords)</text><circle cx="64" cy="165" r="3" fill="#4f9dff"/><text x="76" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">if box -&gt; NSN Federal Supply Class</text><circle cx="64" cy="179" r="3" fill="#4f9dff"/><text x="76" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">FSC/FSG table -&gt; shape</text><rect x="56" y="212" width="218" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="227" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">98.5% get a real family</text>
<text x="306" y="178" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="322" y="110" width="250" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="322" y="110" width="6" height="132" rx="3" fill="#1d9e75"/><text x="342" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">2  PartGeo.build(fam, dims)</text><circle cx="346" cy="151" r="3" fill="#1d9e75"/><text x="358" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">22 builders (bolt..canister)</text><circle cx="346" cy="165" r="3" fill="#1d9e75"/><text x="358" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">driven by FLIS L/W/H/dia/bore</text><circle cx="346" cy="179" r="3" fill="#1d9e75"/><text x="358" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">unknown -&gt; f_box (safety net)</text><rect x="338" y="212" width="218" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="348" y="227" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">returns {V, F, smooth}</text>
<text x="588" y="178" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="604" y="110" width="254" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="604" y="110" width="6" height="132" rx="3" fill="#caa24a"/><text x="624" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">3  one detailed mesh</text><circle cx="628" cy="151" r="3" fill="#caa24a"/><text x="640" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">hex-head bolt · races+balls bearing</text><circle cx="628" cy="165" r="3" fill="#caa24a"/><text x="640" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">toothed gear · holed gasket · helix</text><circle cx="628" cy="179" r="3" fill="#caa24a"/><text x="640" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">same mesh for every view</text><rect x="620" y="212" width="222" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="630" y="227" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">{V,F} shared, not re-derived</text>
<text x="731" y="262" font-size="20" fill="#9aa6b6">&#8595;</text>
<rect x="40" y="274" width="360" height="96" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="298" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">Artist approximation (drawn SVG)</text>
<text x="58" y="318" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">The grid card thumbnail AND the no-WebGL modal fallback render the SAME detailed mesh (renderSVG</text><text x="58" y="331" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">projects {V,F}, depth-shaded). Runs on legacy browsers.</text>
<rect x="420" y="274" width="360" height="96" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="438" y="298" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">Representative rendering (WebGL)</text>
<text x="438" y="318" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">The opened modal renders the SAME mesh live in 3D (GL3D.load) — orbit + zoom — with the material</text><text x="438" y="331" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">uniform. Parameter panel rebuilds it live.</text>
<rect x="800" y="274" width="340" height="96" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="818" y="298" font-size="12" font-weight="700" fill="#7f77dd" text-anchor="start">Layered on top</text>
<text x="818" y="318" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Colour/material from appearance() (FLIS scan). Real cited figure from /figcrop as the &#x27;Manual</text><text x="818" y="331" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">illustration&#x27; tab. NSN cross-ref + refs.</text>
<rect x="40" y="392" width="1100" height="92" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="58" y="416" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">Wiring audit (host-side, authoritative)</text>
<text x="58" y="436" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">name classifier  -&gt; 22 distinct families ............ all 22 have a builder      OK</text>
<text x="58" y="451" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">NSN FSC + FSG    -&gt; 95 mappings / 20 values ......... all are builders            OK</text>
<text x="58" y="466" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">22 builders      -&gt; real f_* functions .............. all build a valid mesh       OK</text>
<text x="58" y="481" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">unknown family   -&gt; f_box fallback .................. nothing renders empty         OK</text>
<text x="40" y="632" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Diagram. Dark (R3). v0.84.1-0.84.2 · 2026-06-04 · engine/ui/partgeo.js (classify/build/22 families) + threed.html (buildModel/renderSVG/open3D). R1.</text>
</svg>