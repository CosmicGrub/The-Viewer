<svg viewBox="0 0 1180 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect x="0" y="0" width="1180" height="680" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="20" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — Tight, seamless loupe  (v0.34.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">The magnifier now tracks the cursor with ZERO latency and sharpens the instant you pause — no lag, no blank frames. All accessibility toggles share one responsive feel.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="56" y="116" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">1 · INSTANT LOCAL ZOOM  +  SHARPEN-ON-PAUSE</text>
<rect x="40" y="126" width="1100" height="250" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="80" y="156" font-size="11" font-weight="700" fill="#caa24a" text-anchor="start">while moving</text>
<circle cx="160" cy="232" r="56" fill="#0a0e12" stroke="#4f9dff" stroke-width="2"/>
<line x1="112" y1="200" x2="208" y2="200" stroke="#5a6675" stroke-width="2" opacity="0.6"/>
<line x1="112" y1="216" x2="208" y2="216" stroke="#5a6675" stroke-width="2" opacity="0.6"/>
<line x1="112" y1="232" x2="208" y2="232" stroke="#5a6675" stroke-width="2" opacity="0.6"/>
<line x1="112" y1="248" x2="208" y2="248" stroke="#5a6675" stroke-width="2" opacity="0.6"/>
<line x1="112" y1="264" x2="208" y2="264" stroke="#5a6675" stroke-width="2" opacity="0.6"/>
<text x="160" y="300" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="middle">local CSS zoom of the page image</text>
<text x="160" y="314" font-size="8.4" font-weight="400" fill="#2f7d4f" text-anchor="middle">follows cursor every frame (rAF) — instant, soft</text>
<path d="M240,232 L300,232" stroke="#1d9e75" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="270" y="222" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="middle">pause</text>
<text x="330" y="156" font-size="11" font-weight="700" fill="#2f7d4f" text-anchor="start">when you pause (60 ms)</text>
<circle cx="410" cy="232" r="56" fill="#0a0e12" stroke="#2f7d4f" stroke-width="2"/>
<line x1="362" y1="200" x2="458" y2="200" stroke="#cdd6e0" stroke-width="2.4"/>
<line x1="362" y1="216" x2="458" y2="216" stroke="#cdd6e0" stroke-width="2.4"/>
<line x1="362" y1="232" x2="458" y2="232" stroke="#cdd6e0" stroke-width="2.4"/>
<line x1="362" y1="248" x2="458" y2="248" stroke="#cdd6e0" stroke-width="2.4"/>
<line x1="362" y1="264" x2="458" y2="264" stroke="#cdd6e0" stroke-width="2.4"/>
<text x="410" y="300" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="middle">high-DPI crop swaps in (/page?clip=…)</text>
<text x="410" y="314" font-size="8.4" font-weight="400" fill="#2f7d4f" text-anchor="middle">crisp, real resolution — cached for revisits</text>
<rect x="520" y="150" width="600" height="200" rx="10" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<circle cx="536" cy="172" r="3" fill="#4f9dff"/>
<text x="548" y="176" font-size="9.8" font-weight="700" fill="#e6e9ee" text-anchor="start">rAF positioning</text>
<text x="548" y="190" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">one transform update per frame — no layout thrash, buttery follow</text>
<circle cx="536" cy="201" r="3" fill="#4f9dff"/>
<text x="548" y="205" font-size="9.8" font-weight="700" fill="#e6e9ee" text-anchor="start">zero-latency base</text>
<text x="548" y="219" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">local magnification shows immediately; never a blank/white loupe</text>
<circle cx="536" cy="230" r="3" fill="#4f9dff"/>
<text x="548" y="234" font-size="9.8" font-weight="700" fill="#e6e9ee" text-anchor="start">debounced fetch</text>
<text x="548" y="248" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">the server crop is requested only when the cursor settles (60 ms)</text>
<circle cx="536" cy="259" r="3" fill="#4f9dff"/>
<text x="548" y="263" font-size="9.8" font-weight="700" fill="#e6e9ee" text-anchor="start">cell cache</text>
<text x="548" y="277" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">crops are keyed by region+zoom; revisiting a spot is instant</text>
<circle cx="536" cy="288" r="3" fill="#4f9dff"/>
<text x="548" y="292" font-size="9.8" font-weight="700" fill="#e6e9ee" text-anchor="start">wheel to zoom</text>
<text x="548" y="306" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">scroll over the loupe to change magnification (1.8×–6×), live</text>
<circle cx="536" cy="317" r="3" fill="#4f9dff"/>
<text x="548" y="321" font-size="9.8" font-weight="700" fill="#e6e9ee" text-anchor="start">cursor handoff</text>
<text x="548" y="335" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">the pointer hides and the loupe becomes the cursor — seamless</text>
<text x="56" y="408" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">2 · ALL ACCESSIBILITY CONTROLS — ONE DYNAMIC FEEL</text>
<rect x="40" y="418" width="1100" height="180" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="60" y="440" width="74" height="30" rx="7" fill="#16223a" stroke="#4f9dff" stroke-width="1"/>
<text x="97.0" y="460" font-size="9.2" font-weight="700" fill="#e6e9ee" text-anchor="middle">🧹 Clean</text>
<rect x="144" y="440" width="86" height="30" rx="7" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="187.0" y="460" font-size="9.2" font-weight="700" fill="#9aa6b6" text-anchor="middle">contrast</text>
<rect x="240" y="440" width="74" height="30" rx="7" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="277.0" y="460" font-size="9.2" font-weight="700" fill="#9aa6b6" text-anchor="middle">tilt Y</text>
<rect x="324" y="440" width="74" height="30" rx="7" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="361.0" y="460" font-size="9.2" font-weight="700" fill="#9aa6b6" text-anchor="middle">tilt X</text>
<rect x="408" y="440" width="86" height="30" rx="7" fill="#16223a" stroke="#4f9dff" stroke-width="1"/>
<text x="451.0" y="460" font-size="9.2" font-weight="700" fill="#e6e9ee" text-anchor="middle">↔ Mirror</text>
<rect x="504" y="440" width="74" height="30" rx="7" fill="#16223a" stroke="#4f9dff" stroke-width="1"/>
<text x="541.0" y="460" font-size="9.2" font-weight="700" fill="#e6e9ee" text-anchor="middle">✦ HD</text>
<rect x="588" y="440" width="74" height="30" rx="7" fill="#16223a" stroke="#4f9dff" stroke-width="1"/>
<text x="625.0" y="460" font-size="9.2" font-weight="700" fill="#e6e9ee" text-anchor="middle">🔎 Loupe</text>
<text x="60" y="498" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Active toggles share a state: accent border + subtle glow; smooth .12s transitions; press feedback (scale).</text>
<text x="60" y="516" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">They compose cleanly — the loupe reflects Clean/contrast in its crop; HD raises full-page DPI; tilt/mirror are CSS overlays.</text>
<text x="60" y="544" font-size="9.2" font-weight="400" fill="#2f7d4f" text-anchor="start">All presentation-only and reversible (R1/R6): none of these touch the page data, the index, search, or the 104th sheet. The loupe is the same real drawing, re-rasterised sharper —</text><text x="60" y="557" font-size="9.2" font-weight="400" fill="#2f7d4f" text-anchor="start">nothing invented.</text>
<text x="40" y="668" font-size="9.2" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.34.0 · 2026-06-02.</text>
</svg>