<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Job Card, deeper — understands the task, warns on look-alikes   v0.99.10</text>
<text x="40" y="70" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">From &#x27;a part&#x27; to &#x27;a job&#x27;: free-text intent, materials &amp; referenced manuals, a look-alike safety warning, and a preview-first builder page.</text>
