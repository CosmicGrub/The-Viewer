<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 936" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>THE VIEWER — Architecture &amp; Data Flow (dark)</title>
<desc>Dark-themed consolidated diagrams: system architecture, ingestion data-flow and queue, search query flow, and the data model.</desc>
<style>
  .bg{fill:#0f1419}
  .title{font-size:20px;font-weight:700;fill:#e6e9ee}
  .h{font-size:12px;font-weight:700;fill:#93a1b3;letter-spacing:.6px}
  .lbl{font-size:12.5px;font-weight:600;fill:#e6e9ee}
  .sub{font-size:10px;fill:#9aa6b6}
  .mono{font-size:9.5px;fill:#dfe5ec;font-family:ui-monospace,Consolas,monospace}
  .edge{stroke:#9aa5b1;stroke-width:1.7;fill:none;marker-end:url(#a)}
  .edge.d{stroke-dasharray:5 4}
  .leg{font-size:10.5px;fill:#9aa6b6}
  .sec{font-size:14px;font-weight:700;fill:#e6e9ee}
  .rule{stroke:#2a2f37;stroke-width:1}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1000" height="936"/>
<text x="32" y="44" class="title">THE VIEWER — Architecture &amp; Data Flow</text>
<text x="32" y="64" class="sub">Dark standard (rule R3) · offline · backwards-compatible (R1)</text>
<line class="rule" x1="32" y1="78" x2="968" y2="78"/>

<!-- SECTION A: system architecture -->
<text x="32" y="108" class="sec">1 · System Architecture</text>
<rect x="32" y="124" width="150" height="78" rx="10" fill="#1c2430" stroke="#38414e"/>
<text x="107" y="150" text-anchor="middle" class="lbl">Corpus</text>
<text x="107" y="168" text-anchor="middle" class="sub">E:\ALL MILITARY TMS</text>
<text x="107" y="184" text-anchor="middle" class="sub">read-only · ~85 GB</text>

<rect x="214" y="124" width="160" height="78" rx="10" fill="#1a2740" stroke="#3a4d6e"/>
<text x="294" y="150" text-anchor="middle" class="lbl">Ingestion pipeline</text>
<text x="294" y="168" text-anchor="middle" class="sub">crawl · extract text-first</text>
<text x="294" y="184" text-anchor="middle" class="sub">queue scanned → OCR</text>

<rect x="406" y="124" width="160" height="78" rx="10" fill="#1c2430" stroke="#38414e"/>
<text x="486" y="150" text-anchor="middle" class="lbl">Index · viewer.db</text>
<text x="486" y="168" text-anchor="middle" class="sub">SQLite + FTS5</text>
<text x="486" y="184" text-anchor="middle" class="sub">versioned (migrations)</text>

<rect x="598" y="124" width="160" height="78" rx="10" fill="#1a2740" stroke="#3a4d6e"/>
<text x="678" y="150" text-anchor="middle" class="lbl">Local web engine</text>
<text x="678" y="168" text-anchor="middle" class="sub">offline service</text>
<text x="678" y="184" text-anchor="middle" class="sub">search + serve + export</text>

<rect x="790" y="124" width="178" height="78" rx="10" fill="#1c2430" stroke="#38414e"/>
<text x="879" y="150" text-anchor="middle" class="lbl">GUI (browser)</text>
<text x="879" y="168" text-anchor="middle" class="sub">onboarding · search</text>
<text x="879" y="184" text-anchor="middle" class="sub">viewer · parts request</text>

<path class="edge" d="M182,163 L214,163"/>
<path class="edge" d="M374,163 L406,163"/>
<path class="edge" d="M566,163 L598,163"/>
<path class="edge" d="M758,163 L790,163"/>

<!-- SECTION B: ingestion queue -->
<line class="rule" x1="32" y1="232" x2="968" y2="232"/>
<text x="32" y="262" class="sec">2 · Ingestion Data Flow &amp; Queue</text>
<rect x="32" y="280" width="120" height="56" rx="9" fill="#1c2430" stroke="#38414e"/>
<text x="92" y="304" text-anchor="middle" class="lbl">File</text>
<text x="92" y="320" text-anchor="middle" class="sub">new / changed</text>
<rect x="186" y="280" width="130" height="56" rx="9" fill="#1a2740" stroke="#3a4d6e"/>
<text x="251" y="304" text-anchor="middle" class="lbl">Fingerprint</text>
<text x="251" y="320" text-anchor="middle" class="sub">size+mtime, skip done</text>
<rect x="350" y="280" width="130" height="56" rx="9" fill="#1a2740" stroke="#3a4d6e"/>
<text x="415" y="304" text-anchor="middle" class="lbl">Classify</text>
<text x="415" y="320" text-anchor="middle" class="sub">pdf / image / office</text>
<rect x="514" y="252" width="170" height="50" rx="9" fill="#16301f" stroke="#2f5a3e"/>
<text x="599" y="272" text-anchor="middle" class="lbl">Extract text → FTS5</text>
<text x="599" y="288" text-anchor="middle" class="sub">+ TM# / NSN / title</text>
<rect x="514" y="312" width="170" height="50" rx="9" fill="#3a2f1a" stroke="#6b5526"/>
<text x="599" y="332" text-anchor="middle" class="lbl">OCR queue</text>
<text x="599" y="348" text-anchor="middle" class="sub">pending → running → done</text>
<rect x="718" y="280" width="160" height="56" rx="9" fill="#1c2430" stroke="#38414e"/>
<text x="798" y="304" text-anchor="middle" class="lbl">viewer.db</text>
<text x="798" y="320" text-anchor="middle" class="sub">durable, resumable</text>

<path class="edge" d="M152,308 L186,308"/>
<path class="edge" d="M316,308 L350,308"/>
<path class="edge" d="M480,300 L514,283"/>
