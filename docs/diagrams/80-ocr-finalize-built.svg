<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="560" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — OCR scan COMPLETE: the full corpus wired in  (v0.66.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">The text layer has been live in search/find/collections/callouts/3D as it filled. FINALIZE-OCR.bat (host-side) locks in the now-COMPLETE scan.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="100" width="1100" height="56" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="122" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">ALREADY LIVE (auto-wired by the FTS trigger as OCR filled each page):</text>
<text x="58" y="140" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Search · Find-in-manual · Smart Collections (auto-fill + &#x27;new&#x27; badges) · page/schematic callouts · 3D part references. Every page became searchable the moment it was OCR&#x27;d — no rebuild.</text>
<rect x="40" y="172" width="360" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="172" width="6" height="132" rx="3" fill="#4f9dff"/><text x="58" y="195" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">1⃣  Refresh structured parts</text><text x="58" y="216" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">viewer_ingest.py parts re-extracts NSN/figure/nomenclature</text><text x="58" y="227" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">from every now-readable RPSTL page.</text><rect x="54" y="276" width="332" height="20" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="62" y="290" font-size="8.5" font-weight="700" fill="#4f9dff" text-anchor="start">Parts index reflects the WHOLE scan.</text>
<rect x="412" y="172" width="360" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="172" width="6" height="132" rx="3" fill="#1d9e75"/><text x="430" y="195" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">2⃣  Optimize the index</text><text x="430" y="216" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">optimize_index.py rebuilds suggest_terms from the COMPLETE</text><text x="430" y="227" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">vocab + ANALYZE + WAL + indexes.</text><rect x="426" y="276" width="332" height="20" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="434" y="290" font-size="8.5" font-weight="700" fill="#1d9e75" text-anchor="start">Predictive type-ahead now covers everything.</text>
<rect x="784" y="172" width="356" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="172" width="6" height="132" rx="3" fill="#caa24a"/><text x="802" y="195" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">3⃣  Milestone backup</text><text x="802" y="216" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">safeguard snapshot --with-db takes a consistent copy of the</text><text x="802" y="227" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">finished index (+ off-disk mirror).</text><rect x="798" y="276" width="328" height="20" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="806" y="290" font-size="8.5" font-weight="700" fill="#caa24a" text-anchor="start">The finished corpus is protected.</text>
<rect x="40" y="318" width="360" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="318" width="6" height="132" rx="3" fill="#7f77dd"/><text x="58" y="341" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">4⃣  Completion report</text><text x="58" y="362" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">ocr_report.py --full writes the OCR completion report (pages,</text><text x="58" y="373" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">coverage, engine).</text><rect x="54" y="422" width="332" height="20" rx="6" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/><text x="62" y="436" font-size="8.5" font-weight="700" fill="#7f77dd" text-anchor="start">A record of the finished run.</text>
<rect x="412" y="318" width="360" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="318" width="6" height="132" rx="3" fill="#2f7d4f"/><text x="430" y="341" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">5⃣  Top nomenclatures</text><text x="430" y="362" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">top_nomenclature.py answers &#x27;which part comes up most&#x27;</text><text x="430" y="373" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">(battery / a specific bolt / gasket ...).</text><rect x="426" y="422" width="332" height="20" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="434" y="436" font-size="8.5" font-weight="700" fill="#2f7d4f" text-anchor="start">Answers the standing question #37.</text>
<rect x="784" y="318" width="356" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="318" width="6" height="132" rx="3" fill="#c4585a"/><text x="802" y="341" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">6⃣  Health check</text><text x="802" y="362" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">verify_all + RPS lint confirm the additives pass and legacy</text><text x="802" y="373" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">parity holds after finalizing.</text><rect x="798" y="422" width="328" height="20" rx="6" fill="#1c2430" stroke="#c4585a" stroke-width="1"/><text x="806" y="436" font-size="8.5" font-weight="700" fill="#c4585a" text-anchor="start">Green before and after.</text>
<rect x="40" y="472" width="1100" height="56" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="493" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">ONE BUTTON, HOST-SIDE:  FINALIZE-OCR.bat</text>
<text x="58" y="511" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Runs the six steps in order on Windows (the multi-GB index can&#x27;t be written from a sandbox). top_nomenclature.py verified against the fixture; FINALIZE-OCR.bat + the scripts confirmed on host. After</text><text x="58" y="523" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">it, the complete scan is fully leveraged across the whole program.</text>
<text x="40" y="552" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.66.0 · 2026-06-03 · FINALIZE-OCR.bat · top_nomenclature.py · optimize_index/viewer_ingest parts · safeguard --with-db. Additive (R1/R6).</text>
