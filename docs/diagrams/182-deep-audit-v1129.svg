<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Segoe UI,Arial,sans-serif">
<rect width="1000" height="580" fill="#0d1117"/>
<text x="500" y="40" fill="#e6edf3" font-size="26" font-weight="700" text-anchor="middle">v1.12.9 Deep Audit &#8212; what the green build was hiding</text>
<text x="500" y="68" fill="#8b949e" font-size="14" text-anchor="middle">"test_routes 87/87 PASS" was testing NONE of the v1.12 work</text>

<rect x="45" y="100" width="290" height="170" rx="10" fill="#161b22" stroke="#f85149"/>
<text x="190" y="128" fill="#f85149" font-size="15" font-weight="700" text-anchor="middle">FOUND (real)</text>
<text x="190" y="154" fill="#c9d1d9" font-size="12" text-anchor="middle">8 new routes: ZERO coverage</text>
<text x="190" y="174" fill="#c9d1d9" font-size="12" text-anchor="middle">68 of 133 API routes untested</text>
<text x="190" y="194" fill="#c9d1d9" font-size="12" text-anchor="middle">decoders UNREACHABLE (no UI)</text>
<text x="190" y="214" fill="#c9d1d9" font-size="12" text-anchor="middle">/reference clashed w/ /api/reference</text>
<text x="190" y="234" fill="#c9d1d9" font-size="12" text-anchor="middle">verify_ui gate = hardcoded list</text>
<text x="190" y="256" fill="#8b949e" font-size="11" text-anchor="middle">green build, 51% of API never hit</text>

<rect x="365" y="100" width="270" height="170" rx="10" fill="#161b22" stroke="#238636"/>
<text x="500" y="128" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">FIXED (structural)</text>
<text x="500" y="154" fill="#c9d1d9" font-size="12" text-anchor="middle">curated cases 87 &#8594; 106</text>
<text x="500" y="174" fill="#c9d1d9" font-size="12" text-anchor="middle">+ error paths (400 / null / reasons)</text>
<text x="500" y="196" fill="#7fd6a0" font-size="12" font-weight="700" text-anchor="middle">+ blanket registry.GET sweep</text>
<text x="500" y="214" fill="#8b949e" font-size="11" text-anchor="middle">every route hit bare &#8594; no 5xx</text>
<text x="500" y="236" fill="#8b949e" font-size="11" text-anchor="middle">new routes auto-covered forever</text>
<text x="500" y="258" fill="#c9d1d9" font-size="12" text-anchor="middle">/reference &#8594; /decode (no clash)</text>

<rect x="665" y="100" width="290" height="170" rx="10" fill="#161b22" stroke="#1f6feb"/>
<text x="810" y="128" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">REACHABLE + HARDENED</text>
<text x="810" y="154" fill="#c9d1d9" font-size="12" text-anchor="middle">/decode page + palette command</text>
<text x="810" y="174" fill="#c9d1d9" font-size="12" text-anchor="middle">paste any code &#8594; auto-detect kind</text>
<text x="810" y="194" fill="#c9d1d9" font-size="12" text-anchor="middle">NSN / SMR / CAGE / MS-MIL-SAE</text>
<text x="810" y="216" fill="#f0883e" font-size="11.5" text-anchor="middle">nulls shown honestly, not hidden</text>
<text x="810" y="240" fill="#7fd6a0" font-size="12" font-weight="700" text-anchor="middle">24,000 fuzz cases: 0 crashes</text>
<text x="810" y="258" fill="#8b949e" font-size="11" text-anchor="middle">R13 invariants held under fuzz</text>

<rect x="150" y="330" width="700" height="150" rx="10" fill="#161b22" stroke="#8957e5"/>
<text x="500" y="358" fill="#a371f7" font-size="15" font-weight="700" text-anchor="middle">R13 invariants asserted under 24k hostile inputs</text>
<text x="500" y="386" fill="#c9d1d9" font-size="12.5" text-anchor="middle">curated flag &#8596; named item agree &#183; NIIN=9 / FSC=4 &#183; every name is None-or-str (NEVER fabricated)</text>
<text x="500" y="408" fill="#c9d1d9" font-size="12.5" text-anchor="middle">CAGE valid XOR reasons &#183; harness nets never singleton &#183; MAC rows always name a real function</text>
<text x="500" y="438" fill="#8b949e" font-size="12" text-anchor="middle">The point of the audit: a passing suite that never runs the code is worse than no suite &#8212;</text>
<text x="500" y="458" fill="#8b949e" font-size="12" text-anchor="middle">it buys false confidence. The sweep makes that failure mode structurally impossible.</text>

<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/></marker></defs>
<line x1="335" y1="185" x2="363" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
<line x1="635" y1="185" x2="663" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
<line x1="500" y1="272" x2="500" y2="328" stroke="#8957e5" stroke-width="2" marker-end="url(#a)"/>
<text x="500" y="520" fill="#8b949e" font-size="12" text-anchor="middle">additive (R1) &#183; verification logic strengthened, never weakened &#183; VERSION 1.12.9</text>
<text x="500" y="544" fill="#8b949e" font-size="12" text-anchor="middle">no duplicate routes &#183; no missing page files &#183; all 42 palette destinations resolve</text>
</svg>