<svg viewBox="0 0 1140 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1140" height="430" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/><text x="40" y="46" font-size="17" font-weight="700" fill="#e6e9ee" text-anchor="start">Read routes degrade gracefully on un-built sidecars   v1.3.4</text><text x="40" y="64" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">One error boundary, now classifying DB errors instead of blanket-500</text><line x1="40" y1="80" x2="1100" y2="80" stroke="#2b333f"/><text x="40" y="106" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">GET /api/* raises ...</text><rect x="40" y="128" width="560" height="34" rx="8" fill="#171d26" stroke="#2b333f" stroke-width="1"/><text x="56" y="150" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">registry.ParamError  (bad ?limit=abc)</text><path d="M604 145 L648 145" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><rect x="652" y="128" width="448" height="34" rx="8" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="668" y="150" font-size="10.5" font-weight="700" fill="#4f9dff" text-anchor="start">-&gt; 400</text><rect x="40" y="172" width="560" height="34" rx="8" fill="#171d26" stroke="#2b333f" stroke-width="1"/><text x="56" y="194" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">FileNotFoundError  (missing doc/page/crop)</text><path d="M604 189 L648 189" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><rect x="652" y="172" width="448" height="34" rx="8" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="668" y="194" font-size="10.5" font-weight="700" fill="#4f9dff" text-anchor="start">-&gt; 404</text><rect x="40" y="216" width="560" height="34" rx="8" fill="#171d26" stroke="#2b333f" stroke-width="1"/><text x="56" y="238" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">OperationalError &quot;no such table&quot;  (sidecar NOT built)</text><path d="M604 233 L648 233" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><rect x="652" y="216" width="448" height="34" rx="8" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="668" y="238" font-size="10.5" font-weight="700" fill="#2f7d4f" text-anchor="start">-&gt; 200  {ok:false, unavailable:true}</text><rect x="40" y="260" width="560" height="34" rx="8" fill="#171d26" stroke="#2b333f" stroke-width="1"/><text x="56" y="282" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">OperationalError &quot;no such column&quot; / locked / corrupt</text><path d="M604 277 L648 277" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><rect x="652" y="260" width="448" height="34" rx="8" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="668" y="282" font-size="10.5" font-weight="700" fill="#caa24a" text-anchor="start">-&gt; 500 + log ref  (real DB issue)</text><rect x="40" y="304" width="560" height="34" rx="8" fill="#171d26" stroke="#2b333f" stroke-width="1"/><text x="56" y="326" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">KeyError / TypeError / any logic bug</text><path d="M604 321 L648 321" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><rect x="652" y="304" width="448" height="34" rx="8" fill="#1c2430" stroke="#e0564f" stroke-width="1"/><text x="668" y="326" font-size="10.5" font-weight="700" fill="#e0564f" text-anchor="start">-&gt; 500 + log ref  (stays visible)</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9aa6b6"/></marker></defs><line x1="40" y1="356" x2="1100" y2="356" stroke="#2b333f"/><text x="40" y="382" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">Why</text><rect x="40" y="394" width="1060" height="60" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/><text x="58" y="416" font-size="10.3" font-weight="400" fill="#9aa6b6" text-anchor="start">THE VIEWER now has many OPTIONAL sidecars (measures/tables/enrich/masterfile/kg/sides/chapters). A route hitting one that hasn&#x27;t been built should say &#x27;not built yet&#x27;, not crash with a 500. This fixes the read-route 5xx class the HTTP fuzz</text><text x="58" y="431" font-size="10.3" font-weight="400" fill="#9aa6b6" text-anchor="start">flags, WITHOUT hiding genuine bugs (those still 500 with a log ref). The originally-reported 500 list was from stale 0.99.34 code -- re-run RUN-HTTP-FUZZ.bat for a current signal.</text></svg>