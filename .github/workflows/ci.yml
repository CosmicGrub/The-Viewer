name: CI

# Previously nothing here at all -- no .github/, no CI of any kind (audit finding #18). This runs
# the project's own single health-check entrypoint, engine/tests/verify_all.py, which auto-
# discovers and runs every engine/tests/test_*.py file (22 as of this writing) plus the RPS
# ES5-lint gate. All 22 test files are self-contained (tempfile-based fixtures, no real corpus, no
# GPU, no network egress -- see each file's own docstring) and every optional native dependency
# (cv2/pytesseract/tesseract binary) is already try/except-guarded in the modules under test, so a
# bare `pip install -r requirements.txt` on a stock runner is sufficient.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Run verify_all.py
        # --snapshot: a fresh checkout has no backups/vault yet (backups/ is gitignored), so a bare
        # `verify_all.py` would always report "safeguard verify: no snapshots yet" as FAILED even
        # when every real test suite passes. --snapshot takes a self-baseline snapshot of the
        # just-checked-out tree first, then verifies against it in the same run -- safe because no
        # test suite mutates tracked source files (all use tempfile.mkdtemp() fixtures).
        run: python tests/verify_all.py --snapshot
