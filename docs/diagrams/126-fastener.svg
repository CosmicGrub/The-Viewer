<text x="40" y="308" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED / R1</text>
<rect x="40" y="322" width="1020" height="140" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<circle cx="56" cy="343" r="2.6" fill="#2f7d4f"/>
<text x="66" y="346" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Geometry is exact standard (inch major-dia + TPI; metric pitch) — verifiable engineering reference.</text>
<circle cx="56" cy="362" r="2.6" fill="#2f7d4f"/>
<text x="66" y="365" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Torque is DELIBERATELY deferred to the TM (bold caveat): each row links to /torque and /?q= — never a generic chart on safety-critical joints.</text>
<circle cx="56" cy="381" r="2.6" fill="#2f7d4f"/>
<text x="66" y="384" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Client-side (offline, ES5); inline JS passes node --check. Wired: /fastener + 🔧 in palette + Tools menu + verify_ui.py.</text>
<circle cx="56" cy="400" r="2.6" fill="#2f7d4f"/>
<text x="66" y="403" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Additive &amp; rollbackable: one page + two menu entries. Nothing writes the index (R1/R6).</text>
<text x="40" y="512" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Markup. Dark (R3). v0.99.22 · 2026-07-01 · ui/fastener.html + /fastener. Read-only. R1/R6.</text>
