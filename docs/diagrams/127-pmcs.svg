<text x="56" y="132" font-size="12" font-weight="700" fill="#cfe" text-anchor="start">HMMWV M998 · TM 9-2320-280-10 · p.40</text>
<rect x="500" y="120" width="90" height="16" rx="6" fill="#16202b" stroke="#2f4858" stroke-width="1"/>
<text x="510" y="132" font-size="8.4" font-weight="400" fill="#4f9dff" text-anchor="start">view page ↗</text>
<rect x="56" y="144" width="128" height="18" rx="999" fill="#123a2c" stroke="#1d9e75" stroke-width="1"/>
<text x="64" y="157" font-size="8.6" font-weight="400" fill="#7fd8b6" text-anchor="start">Before operation</text>
<rect x="191" y="144" width="128" height="18" rx="999" fill="#123a2c" stroke="#1d9e75" stroke-width="1"/>
<text x="199" y="157" font-size="8.6" font-weight="400" fill="#7fd8b6" text-anchor="start">During operation</text>
<rect x="326" y="144" width="128" height="18" rx="999" fill="#123a2c" stroke="#1d9e75" stroke-width="1"/>
<text x="334" y="157" font-size="8.6" font-weight="400" fill="#7fd8b6" text-anchor="start">After operation</text>
