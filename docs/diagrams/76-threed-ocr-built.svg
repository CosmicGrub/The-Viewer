<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa6b6"/></marker></defs>
<rect x="0" y="0" width="1180" height="600" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — 3D library, wired to the manuals  (v0.62.0)   ·  Batch 3 of 3</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Open a representative 3D part and the side panel now shows the real TM pages that mention its NSN — pulled live from the OCR&#x27;d text — plus its dossier, look-alikes, and the collections it appears in.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="230" height="92" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="133" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">🧊  Open a 3D part</text>
<text x="58" y="153" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">a representative shape (FLIS dims) —</text><text x="58" y="164" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">it carries the part&#x27;s NSN + part</text><text x="58" y="175" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">number.</text>
<rect x="306" y="108" width="230" height="92" rx="12" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="324" y="133" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">🔢  NSN → text phrase</text>
<text x="324" y="153" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">the NSN becomes an FTS phrase &quot;2540</text><text x="324" y="164" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">01 123 4567&quot; that matches the dashed</text><text x="324" y="175" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">form in the text.</text>
<rect x="572" y="108" width="230" height="92" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="590" y="133" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  Read the text layer</text>
<text x="590" y="153" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">find every page mentioning it + test</text><text x="590" y="164" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">each collection&#x27;s query — all</text><text x="590" y="175" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">read-only.</text>
<rect x="838" y="108" width="302" height="92" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="856" y="133" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">📋  Side panel of jumps</text>
<text x="856" y="153" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">clickable manual pages (highlighted), dossier,</text><text x="856" y="164" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Look-Alike Parts, and the collections it&#x27;s in.</text>
<line x1="270" y1="154" x2="306" y2="154" stroke="#9aa6b6" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="536" y1="154" x2="572" y2="154" stroke="#9aa6b6" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="802" y1="154" x2="838" y2="154" stroke="#9aa6b6" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="224" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="224" width="6" height="200" rx="3" fill="#caa24a"/><text x="60" y="248" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔗  From a shape to the real pages</text><circle cx="64" cy="265" r="3" fill="#caa24a"/><text x="76" y="268" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">The 3D library was a dead end — a shape with FLIS specs</text><text x="76" y="279" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">and nothing more.</text><circle cx="64" cy="290" r="3" fill="#caa24a"/><text x="76" y="293" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Now each part links to the TM pages that actually</text><text x="76" y="304" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">reference its NSN, opened with the NSN highlighted.</text><circle cx="64" cy="315" r="3" fill="#caa24a"/><text x="76" y="318" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Also one-click to the part dossier and Look-Alike Parts</text><text x="76" y="329" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">for the same NSN.</text><circle cx="64" cy="340" r="3" fill="#caa24a"/><text x="76" y="343" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Grows on its own as OCR makes more pages searchable.</text><rect x="56" y="394" width="328" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="66" y="409" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">The 3D shape is now a doorway into the manuals.</text>
<rect x="412" y="224" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="224" width="6" height="200" rx="3" fill="#1d9e75"/><text x="432" y="248" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🗂  Collections it belongs to</text><circle cx="436" cy="265" r="3" fill="#1d9e75"/><text x="448" y="268" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">For each collection, a cheap EXISTS asks: is there a page</text><text x="448" y="279" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">matching BOTH this part&#x27;s NSN AND the collection&#x27;s query?</text><circle cx="436" cy="290" r="3" fill="#1d9e75"/><text x="448" y="293" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">So a gasket can show &#x27;In collections: Torque specs&#x27; if</text><text x="448" y="304" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">it&#x27;s referenced on a torque page.</text><circle cx="436" cy="315" r="3" fill="#1d9e75"/><text x="448" y="318" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Reuses the same collection definitions from Batches 1/1+.</text><rect x="428" y="394" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="409" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Ties the 3D part to the living collections.</text>
<rect x="784" y="224" width="356" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="224" width="6" height="200" rx="3" fill="#2f7d4f"/><text x="804" y="248" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🛡  Read-only &amp; RPS-safe</text><circle cx="808" cy="265" r="3" fill="#2f7d4f"/><text x="820" y="268" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">One /api/threed_refs fetch per part: an FTS read + a</text><text x="820" y="279" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">handful of EXISTS. No writes (R1/R6).</text><circle cx="808" cy="290" r="3" fill="#2f7d4f"/><text x="820" y="293" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">WAL → never blocks the OCR writer; safe to use mid-scan.</text><circle cx="808" cy="304" r="3" fill="#2f7d4f"/><text x="820" y="307" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">The 3D itself already degrades to SVG on old machines;</text><text x="820" y="318" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">the refs panel is plain DOM + fetch, so it works there</text><text x="820" y="329" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">too.</text><rect x="800" y="394" width="324" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="810" y="409" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">No OCR contention · works on the SVG-fallback path.</text>
<rect x="40" y="440" width="1100" height="84" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="462" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED  ·  COMPLETES THE 3-BATCH OCR WIRING</text>
<text x="58" y="480.0" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Isolation test: the NSN phrase matched the dashed form on the right page (and correctly ignored an unrelated page); collection membership returned &#x27;Torque specs&#x27;, and after an OCR page added</text><text x="58" y="492.5" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">a WARNING mentioning the same NSN, &#x27;Warnings&#x27; appeared too — the live-growth property. loadRefs JS syntax-checks; server function + /api/threed_refs route confirmed on host. With Batch 1</text><text x="58" y="505.0" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">(collections), Batch 2 (page callouts) and this, the OCR text layer is now wired into search, the page/schematic viewers, collections, and the 3D library.</text>
<text x="40" y="588" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.62.0 · 2026-06-02 · viewer_app.py (threed_refs + /api/threed_refs) · threed.html (loadRefs side panel). Read-only / additive (R1/R6).</text>
</svg>