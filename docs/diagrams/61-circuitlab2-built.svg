<svg viewBox="0 0 1180 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="720" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — Circuit Lab, deepened  (v0.44.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Active devices, save / load / export, and parts that link to the catalog — on the same validated MNA engine. Still an overlay on the real schematic.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="56" y="116" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">1 · NEW ACTIVE DEVICES (all unit-tested in the engine)</text>
<rect x="40" y="126" width="1100" height="168" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="58" y="150" width="256" height="128" rx="10" fill="#1c2430" stroke="#caa24a" stroke-width="1"/>
<text x="70" y="172" font-size="10.5" font-weight="700" fill="#caa24a" text-anchor="start">AC source</text>
<text x="70" y="192" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">time-varying sine V(t)=A·sin(2πft); drives</text><text x="70" y="203" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">real transient/ringing demos</text>
<rect x="326" y="150" width="256" height="128" rx="10" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/>
<text x="338" y="172" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">MOSFET (N-ch)</text>
<text x="338" y="192" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">square-law level-1, Newton-solved;</text><text x="338" y="203" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">switches &amp; amplifies (on: drain→0.02 V)</text>
<rect x="594" y="150" width="256" height="128" rx="10" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/>
<text x="606" y="172" font-size="10.5" font-weight="700" fill="#7f77dd" text-anchor="start">Op-amp</text>
<text x="606" y="192" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">ideal high-gain VCVS; non-inverting ×2</text><text x="606" y="203" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">gives exactly 2.000 V</text>
<rect x="862" y="150" width="256" height="128" rx="10" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/>
<text x="874" y="172" font-size="10.5" font-weight="700" fill="#2f7d4f" text-anchor="start">Relay</text>
<text x="874" y="192" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">behavioral coil + contact; 12 V energizes</text><text x="874" y="203" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">the 120 Ω coil → contact CLOSES → lamp</text><text x="874" y="214" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">lights</text>
<text x="58" y="288" font-size="8.8" font-weight="400" fill="#2f7d4f" text-anchor="start">Relays matter for vehicle electrical systems — coils and contacts are everywhere in the wiring TMs.</text>
<text x="56" y="326" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">2 · WHAT MADE IT POSSIBLE + THE NEW WORKFLOW</text>
<rect x="40" y="336" width="545" height="250" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="58" y="360" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">Generalised N-pin model</text>
<text x="58" y="380" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">• Parts now carry a pin-offset table (not just 2 leads)</text>
<text x="58" y="398" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">• rotation rotates the offsets; union-find still assigns nodes</text>
<text x="58" y="416" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">• 3-pin (MOSFET, op-amp) and 4-pin (relay) devices just work</text>
<text x="58" y="434" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">• netlist() emits each device in the engine&#x27;s pin order</text>
<text x="58" y="462" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">8 demo circuits</text>
<text x="58" y="482" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">• divider · RC · RLC · diode+LED</text>
<text x="58" y="500" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">• AC+RC · MOSFET switch · relay-driven lamp · op-amp ×2</text>
<text x="58" y="518" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">• each validated end-to-end (build→netlist→solve)</text>
<rect x="604" y="336" width="536" height="250" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="622" y="360" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">Save / load / export</text>
<text x="622" y="380" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">• 💾 Save / 📂 Load — persists in the browser (localStorage)</text>
<text x="622" y="398" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">• ⬇ .json — download the full circuit; ⬆ import it back</text>
<text x="622" y="416" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">• ⬇ netlist — SPICE-style .cir (R/C/L/V/SIN/D/M/relay notes)</text>
<text x="622" y="434" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">• portable: share a circuit as a file, reopen it anywhere</text>
<text x="622" y="462" font-size="10.5" font-weight="700" fill="#caa24a" text-anchor="start">Parts link to the catalog</text>
<text x="622" y="482" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Tag any component with a TM part # / NSN. It shows on the symbol and is a</text><text x="622" y="494" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">one-click jump to the Look-Alike Parts recognizer (/partdiff) — so a drawn relay</text><text x="622" y="506" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">or resistor connects straight to the real cataloged part and its variants.</text>
<rect x="40" y="604" width="1100" height="100" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="628" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">GROUNDED &amp; ADDITIVE (R1/R6) · RPS (R7)</text>
<text x="58" y="648" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Same validated MNA core (all 10 unit tests pass: divider/RC/diode/RLC + AC/MOSFET/op-amp/relay). The circuit is grounded in what you build; the simulator never rewrites the TM and the</text><text x="58" y="661" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">cited sheet stays behind the overlay. Save/export are local files — nothing leaves the machine. RPS: still a modern-browser feature; the Win7/Vista legacy build keeps the</text><text x="58" y="674" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">static-overlay fallback. Fully additive — same routes, richer editor.</text>
<text x="40" y="708" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.44.0 · 2026-06-02 · engine/ui/circuitlab.html + circuitsim.js. Engine: 10/10 unit tests pass.</text>
</svg>