<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="600" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Cross-reference &amp; verification engine — BUILT  v0.79.0</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">One provenance-tracked part record. FLIS-validated name · vehicles it fits · interchange · manufacturer · breakdown image.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="360" height="178" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="178" rx="3" fill="#2f7d4f"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔧  X1 · FLIS repair ✓</text><circle cx="64" cy="149" r="3" fill="#2f7d4f"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">NSN→official name (ref_nsn). PREFERRED, OCR kept visible,</text><circle cx="64" cy="163" r="3" fill="#2f7d4f"/><text x="76" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">conflict FLAGGED. &#x27;HOSE NONMET&#x27; → HOSE,NONMETALLIC.</text><circle cx="64" cy="177" r="3" fill="#2f7d4f"/><text x="76" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">+ PN+CAGEC→NSN recovery from PUB LOG (pn_nsn.json).</text><rect x="56" y="256" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="271" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Verified, conf 0.9.</text>
<rect x="412" y="108" width="360" height="178" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="108" width="6" height="178" rx="3" fill="#1d9e75"/><text x="432" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🚛  X2 · Vehicle assignment ✓</text><circle cx="436" cy="149" r="3" fill="#1d9e75"/><text x="448" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">NSN→vehicles via nsn_platforms (45,068), noise-filtered.</text><circle cx="436" cy="163" r="3" fill="#1d9e75"/><text x="448" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">M915 / HMMWV bound to the part + its breakdown.</text><circle cx="436" cy="177" r="3" fill="#1d9e75"/><text x="448" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Many-to-many.</text><rect x="428" y="256" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="271" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">The &#x27;match to vehicles&#x27; ask.</text>
<rect x="784" y="108" width="356" height="178" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="108" width="6" height="178" rx="3" fill="#caa24a"/><text x="804" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔗  X3 · Asset cross-link ✓</text><circle cx="808" cy="149" r="3" fill="#caa24a"/><text x="820" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">One record links: breakdown image, schematic, procedure,</text><circle cx="808" cy="163" r="3" fill="#caa24a"/><text x="820" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">look-alike, tags, manufacturer (CAGEC→company,</text><text x="820" y="177" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">cage.json),</text><circle cx="808" cy="188" r="3" fill="#caa24a"/><text x="820" y="191" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">interchangeable + superseded.</text><rect x="800" y="256" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="271" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Everything, by NSN/PN.</text>
<rect x="40" y="300" width="540" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="300" width="6" height="150" rx="3" fill="#7f77dd"/><text x="60" y="324" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🌐  X4 · Online enrich ✓ (off by default)</text><circle cx="64" cy="341" r="3" fill="#7f77dd"/><text x="76" y="344" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Public-data-only, CACHED (xref_online.json), ITAR/EAR-aware.</text><circle cx="64" cy="355" r="3" fill="#7f77dd"/><text x="76" y="358" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Gated by VIEWER_XREF_ONLINE + your endpoint; app only READS</text><circle cx="64" cy="369" r="3" fill="#7f77dd"/><text x="76" y="372" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">the cache, never fetches while serving. docs/XREF-ONLINE-SETUP.</text><rect x="56" y="420" width="508" height="22" rx="6" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/><text x="66" y="435" font-size="8.8" font-weight="700" fill="#7f77dd" text-anchor="start">Opt-in, never runtime.</text>
<rect x="600" y="300" width="540" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="600" y="300" width="6" height="150" rx="3" fill="#c4585a"/><text x="620" y="324" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🧑  X5 · Provenance &amp; review ✓</text><circle cx="624" cy="341" r="3" fill="#c4585a"/><text x="636" y="344" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Every field tags its SOURCE; record carries CONFIDENCE.</text><circle cx="624" cy="355" r="3" fill="#c4585a"/><text x="636" y="358" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">FLIS-vs-OCR conflicts flagged in the part card (⚠ OCR read).</text><circle cx="624" cy="369" r="3" fill="#c4585a"/><text x="636" y="372" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Residual → 🔧 Part# review queue (bulk fix, your fixes win).</text><rect x="616" y="420" width="508" height="22" rx="6" fill="#1c2430" stroke="#c4585a" stroke-width="1"/><text x="626" y="435" font-size="8.8" font-weight="700" fill="#c4585a" text-anchor="start">Nothing silently wrong.</text>
<rect x="40" y="462" width="1100" height="100" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="483" font-size="11.5" font-weight="700" fill="#4f9dff" text-anchor="start">VERIFIED + how to run</text>
<text x="58" y="503" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">part_record(&#x27;12420572-010&#x27;) on a fixture: PN→NSN, FLIS name preferred (OCR kept + conflict flagged), vehicles M915/HMMWV (junk filtered), interchangeable NSN, confidence 0.9, full provenance;</text><text x="58" y="515" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">cage.json/xref_online.json reads add manufacturer + colloquial. Run order on your PC: BUILD-RPSTL.bat → BUILD-XREF.bat (PUB LOG) → search a part number. X4 stays off unless you set VIEWER_XREF_ONLINE.</text><text x="58" y="527" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Routes in RUN-ALL-TESTS.bat; index never written (R1/R6).</text>
<text x="40" y="594" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.79.0 · 2026-06-03 · xref_feature.py · build_xref.py · xref_online.py · /api/part_record. Offline-first, additive (R1/R6).</text>
