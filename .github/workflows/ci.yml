name: CI

# Previously nothing here at all -- no .github/, no CI of any kind (audit finding #18). This runs
# the project's own single health-check entrypoint, engine/tests/verify_all.py, which auto-
# discovers and runs every engine/tests/test_*.py file (glob-based -- the count grows as test files
# are added, so it isn't restated here) plus the RPS ES5-lint gate. Every one of those test files is
# self-contained (tempfile-based fixtures, no real corpus, no GPU, no network egress -- see each
# file's own docstring) and every optional native dependency (cv2/pytesseract) is already
# try/except-guarded in the modules under test, so `pip install -r requirements.txt` alone is
# sufficient for those.
#
# The tesseract BINARY is a different story, and its own line above used to lump it in with the
# pip-installable ones -- wrong. pytesseract (the pip package requirements.txt installs) is just a
# thin subprocess wrapper around a real, separately-installed `tesseract` executable; without it on
# PATH, the OCR call doesn't raise (it's already guarded, per above) -- it just returns empty text,
# so every check downstream of "OCR actually ran" fails instead of erroring. Confirmed live: the
# first real run of this workflow failed the exact same 5 checks on all four matrix jobs (Ubuntu
# 3.12/3.13/3.14 + Windows) -- every one an OCR-content assertion (test_ingest_routes.py's "image's
# OCR'd text is real", pagetrim OCR-path header/body/FTS) -- while every local repro attempt
# (fresh clone, venv matching requirements.txt exactly) passed clean, because the dev machine
# already had tesseract installed system-wide from earlier project work, masking the gap. Installed
# explicitly below on both runners now.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requirements.txt's own header says 3.11-3.14 are all supported (3.14 fully, not just
        # "should work") -- this is the first time any of that is actually tested instead of assumed.
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install tesseract
        # fonts-dejavu-core: test_ingest_routes.py's real-OCR fixtures need an actual (non-bitmap)
        # TrueType font to render OCR-able text -- ubuntu-latest is generally believed to ship this
        # already, but "generally believed" is exactly the kind of assumption that produced this
        # job's tesseract-binary gap in the first place; install it explicitly rather than rely on
        # base-image contents that could change.
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Run verify_all.py
        # --snapshot: a fresh checkout has no backups/vault yet (backups/ is gitignored), so a bare
        # `verify_all.py` would always report "safeguard verify: no snapshots yet" as FAILED even
        # when every real test suite passes. --snapshot takes a self-baseline snapshot of the
        # just-checked-out tree first, then verifies against it in the same run -- safe because no
        # test suite mutates tracked source files (all use tempfile.mkdtemp() fixtures).
        run: python tests/verify_all.py --snapshot

  test-windows:
    # This app's own test docstrings repeatedly say "RUN ON WINDOWS" (it's the only OS this project
    # actually targets -- see docs/SYSTEM-REQUIREMENTS.md), and one real code path is Windows-only:
    # ocr_supervisor.py's _kill_tree() uses `taskkill /F /T` when os.name == "nt", falling back to
    # proc.kill() everywhere else -- a ubuntu-only CI matrix can only ever exercise the POSIX branch.
    # A single Python version here is enough; the goal is OS coverage, not another version matrix.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install tesseract
        # choco's own install updates machine PATH via the registry, which doesn't reliably
        # propagate to the CURRENT job's later steps on GH Actions Windows runners (each step is a
        # fresh shell, but the runner doesn't always re-read registry PATH mid-job) -- append the
        # known install dir to GITHUB_PATH explicitly so `tesseract` resolves in the steps after this
        # one without relying on that.
        run: |
          choco install tesseract -y --no-progress
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Run verify_all.py
        run: python tests/verify_all.py --snapshot
