<text x="56" y="138" font-size="12.5" font-weight="700" fill="#2f7d4f" text-anchor="start">coverage.pct(a,b)</text>
<text x="56" y="156" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">pct ∈ [0,100] for 0≤a≤b; exactly 0.0 when b==0; never raises. High-volume (per-iteration loop).</text>
<rect x="40" y="176" width="1100" height="52" rx="10" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="56" y="198" font-size="12.5" font-weight="700" fill="#1d9e75" text-anchor="start">partlocate.locate</text>
<text x="56" y="216" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">count == len(appearances) ≤ limit; every URL (deepzoom/vectorize/page) absolute; deduped by (doc,page,fig); never raises.</text>
<rect x="40" y="236" width="1100" height="52" rx="10" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="56" y="258" font-size="12.5" font-weight="700" fill="#4f9dff" text-anchor="start">coverage.overview</text>
<text x="56" y="276" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">never raises; every percentage-named value stays within [0,100]. DB-backed, sampled.</text>
<line x1="40" y1="300" x2="1140" y2="300" stroke="#2b333f"/>
