<svg viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa6b6"/></marker></defs>
<rect x="0" y="0" width="1180" height="610" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — OCR-driven Smart Collections  (v0.59.0)   ·  Batch 1 of 3</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">A collection is a saved search that evaluates LIVE against the full-text index — so it fills itself as OCR turns image-only pages into text. Nothing is materialized; nothing re-scans.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="210" height="96" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="58" y="134" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">🔤  OCR fills a page</text>
<text x="58" y="154" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">writes body_text on a previously</text><text x="58" y="165" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">blank, image-only page</text><text x="58" y="176" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">(source=&#x27;ocr&#x27;).</text>
<rect x="286" y="108" width="210" height="96" rx="12" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="304" y="134" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">⚙  FTS trigger fires</text>
<text x="304" y="154" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">pages_au AFTER UPDATE OF body_text</text><text x="304" y="165" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">re-syncs pages_fts instantly — no</text><text x="304" y="176" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">rebuild.</text>
<rect x="532" y="108" width="210" height="96" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="550" y="134" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  Collection re-queries</text>
<text x="550" y="154" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">each collection is just a</text><text x="550" y="165" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">pages_fts MATCH, run read-only at</text><text x="550" y="176" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">view time.</text>
<rect x="778" y="108" width="362" height="96" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="796" y="134" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">🗂  /collections — count &amp; hits grow on their own</text>
<text x="796" y="154" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">The card&#x27;s live count ticks up and new pages appear in the</text><text x="796" y="165" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">list the next time it&#x27;s opened — automatically, as the</text><text x="796" y="176" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">scan proceeds.</text>
<line x1="250" y1="156" x2="286" y2="156" stroke="#9aa6b6" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="496" y1="156" x2="532" y2="156" stroke="#9aa6b6" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="742" y1="156" x2="778" y2="156" stroke="#9aa6b6" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="224" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="224" width="6" height="200" rx="3" fill="#caa24a"/><text x="60" y="248" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🗂  Built-in + saved collections</text><circle cx="64" cy="265" r="3" fill="#caa24a"/><text x="76" y="268" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Six built-in seeds ship in code: Warnings &amp; Cautions,</text><text x="76" y="279" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Torque specs, Wiring &amp; schematics, Hydraulics, Lubrication</text><text x="76" y="290" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">&amp; PMCS, Removal &amp; installation.</text><circle cx="64" cy="301" r="3" fill="#caa24a"/><text x="76" y="304" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Save your own from any search terms (same OR / phrase</text><text x="76" y="315" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">syntax as the main box).</text><circle cx="64" cy="326" r="3" fill="#caa24a"/><text x="76" y="329" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Built-ins can be hidden (reversible); saved ones can be</text><text x="76" y="340" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">deleted.</text><rect x="56" y="394" width="328" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="66" y="409" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">AUTO-FILLS as OCR adds text — no re-scan, no materialized rows.</text>
<rect x="412" y="224" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="224" width="6" height="200" rx="3" fill="#2f7d4f"/><text x="432" y="248" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🛡  Sidecar = zero OCR contention</text><circle cx="436" cy="265" r="3" fill="#2f7d4f"/><text x="448" y="268" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Definitions live in collections.db — its OWN file and</text><text x="448" y="279" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">lock, like correlations.db / reviews.db.</text><circle cx="436" cy="290" r="3" fill="#2f7d4f"/><text x="448" y="293" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Listing &amp; evaluating are READ-ONLY on the index (WAL →</text><text x="448" y="304" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">reads never block the OCR writer).</text><circle cx="436" cy="315" r="3" fill="#2f7d4f"/><text x="448" y="318" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Saving/deleting writes only the sidecar, never the main</text><text x="448" y="329" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">index (R1/R6).</text><circle cx="436" cy="340" r="3" fill="#2f7d4f"/><text x="448" y="343" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">If the sidecar is absent, the six seeds still work.</text><rect x="428" y="394" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="438" y="409" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Safe to use WHILE the scan runs — batches never overlap.</text>
<rect x="784" y="224" width="356" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="224" width="6" height="200" rx="3" fill="#1d9e75"/><text x="804" y="248" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">⚡  Fast &amp; legacy-safe</text><circle cx="808" cy="265" r="3" fill="#1d9e75"/><text x="820" y="268" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">List counts are BOUNDED (COUNT over a LIMIT 2000</text><text x="820" y="279" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">subquery) so the page stays quick on the multi-GB index;</text><text x="820" y="290" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">shows &#x27;2000+&#x27; when capped.</text><circle cx="808" cy="301" r="3" fill="#1d9e75"/><text x="820" y="304" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Click a hit → opens that exact page with the term</text><text x="820" y="315" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">highlighted (reuses the /page hl render).</text><circle cx="808" cy="326" r="3" fill="#1d9e75"/><text x="820" y="329" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Page is ES5-safe (XHR, var, no arrow/template) + rps.js —</text><text x="820" y="340" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">full RPS/legacy parity.</text><rect x="800" y="394" width="324" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="810" y="409" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Bounded counts · highlighted jump · IE11-ready.</text>
<rect x="40" y="448" width="1100" height="80" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="470" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED — AND IT GROWS ON ITS OWN</text>
<text x="58" y="488.0" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Isolation test on a temp index with the real FTS triggers: a blank page was OCR-filled mid-test; the &#x27;Warnings&#x27; count went 1→2 and &#x27;Wiring&#x27; 0→1 with NO reindex, and the OCR&#x27;d page</text><text x="58" y="500.5" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">appeared in the live results — exactly the auto-fill behaviour. Save / delete / seed-hide against the sidecar all pass. collections.html JS is syntax-clean and ES5-clean (0 arrow fns, 0</text><text x="58" y="513.0" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">template literals). Server functions + GET/POST routes confirmed on the host.</text>
<text x="40" y="598" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.59.0 · 2026-06-02 · viewer_app.py (smart_collections_* + /collections + /api/collections) · ui/collections.html · sidecar collections.db. Additive (R1/R6).</text>
</svg>