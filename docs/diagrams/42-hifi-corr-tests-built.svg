<text x="60" y="789" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Faults injected: flip the FSC vehicle test · AND→OR in search · last-4→last-3 · disable the NSN path · flip &#x27;confidence IS NOT NULL&#x27; · wrong tech-status code · offset coverage % · hide</text><text x="60" y="802" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">interchangeability · reorder tech codes. Every one was caught.</text>
