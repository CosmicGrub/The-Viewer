<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect x="0" y="0" width="1180" height="620" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="20" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — Page zoom: slider + scroll-to-cursor  (v0.35.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Slide the schematic closer, or hover a spot and scroll to zoom in/out toward it — smooth and instant, composed into the same transform as tilt/mirror.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="56" y="116" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">1 · TWO WAYS TO ZOOM</text>
<rect x="40" y="126" width="1100" height="210" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="70" y="156" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">A · Zoom slider (like tilt X/Y)</text>
<rect x="70" y="168" width="360" height="34" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="86" y="190" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">zoom</text>
<rect x="126" y="182" width="280" height="8" rx="6" fill="#0a0e12" stroke="#2b333f" stroke-width="1"/>
<circle cx="250" cy="186" r="8" fill="#4f9dff"/>
<text x="86" y="222" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">100% ───────────── 400%, continuous</text>
<text x="70" y="244" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Drag to scale the page about its centre. The % readout</text><text x="70" y="256" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">combines the render DPI and the slider so it always reads</text><text x="70" y="268" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">true.</text>
<text x="560" y="156" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">B · Hover + scroll (loupe OFF)</text>
<circle cx="640" cy="240" r="50" fill="none" stroke="#2b333f"/>
<rect x="610" y="210" width="60" height="60" rx="6" fill="#0a0e12" stroke="#4f9dff" stroke-width="1"/>
<text x="640" y="245" font-size="20" fill="#e6e9ee" text-anchor="middle">✛</text>
<path d="M700,224 L740,210" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="744" y="210" font-size="9" font-weight="400" fill="#2f7d4f" text-anchor="start">scroll up → zoom in toward the spot</text>
<path d="M700,256 L740,270" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="744" y="272" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">scroll down → zoom out</text>
<text x="560" y="300" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Zooms toward the point under the cursor (transform-origin follows the pointer).</text><text x="560" y="312" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Double-click resets to fit. When the loupe is ON, the wheel drives the loupe</text><text x="560" y="324" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">instead — no conflict.</text>
<text x="56" y="368" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">2 · ONE TRANSFORM PIPELINE</text>
<rect x="40" y="378" width="1100" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="70" y="400" width="190" height="40" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="165" y="425" font-size="9.4" font-weight="700" fill="#e6e9ee" text-anchor="middle">scale(zoom)</text>
<path d="M260,420 L272,420" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="272" y="400" width="190" height="40" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="367" y="425" font-size="9.4" font-weight="700" fill="#e6e9ee" text-anchor="middle">perspective</text>
<path d="M462,420 L474,420" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="474" y="400" width="190" height="40" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="569" y="425" font-size="9.4" font-weight="700" fill="#e6e9ee" text-anchor="middle">rotateY (tilt Y)</text>
<path d="M664,420 L676,420" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="676" y="400" width="190" height="40" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="771" y="425" font-size="9.4" font-weight="700" fill="#e6e9ee" text-anchor="middle">rotateX (tilt X)</text>
<path d="M866,420 L878,420" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="878" y="400" width="190" height="40" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="973" y="425" font-size="9.4" font-weight="700" fill="#e6e9ee" text-anchor="middle">scaleX(-1) mirror</text>
<text x="70" y="470" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Zoom is one more term in the viewer&#x27;s CSS transform, so it stacks cleanly with tilt and mirror and stays GPU-smooth. Resets per page. The stage scrolls (overflow:auto) so you can pan a</text><text x="70" y="483" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">zoomed page; HD + the loupe keep fine detail crisp.</text>
<text x="70" y="512" font-size="9.2" font-weight="400" fill="#2f7d4f" text-anchor="start">Presentation-only &amp; reversible (R1/R6): the page data, index, search and 104th sheet are untouched.</text>
<text x="40" y="610" font-size="9.2" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.35.0 · 2026-06-02.</text>
</svg>