<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="600" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">CAD images for the representative 3-D library  (v0.86.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Every part rendered to a shaded isometric CAD image — scaled to its FLIS dimensions — cached as a sidecar, served on demand.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="110" width="250" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="110" width="6" height="132" rx="3" fill="#4f9dff"/><text x="60" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">1  classify + build (Python)</text><circle cx="64" cy="151" r="3" fill="#4f9dff"/><text x="76" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">cad_render.py mirrors partgeo.js</text><circle cx="64" cy="165" r="3" fill="#4f9dff"/><text x="76" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">22 families + NSN/FSC fallback</text><circle cx="64" cy="179" r="3" fill="#4f9dff"/><text x="76" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">scaled to FLIS L/W/H/dia</text><rect x="56" y="212" width="218" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="227" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">same shapes as the WebGL</text>
<text x="306" y="178" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="322" y="110" width="250" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="322" y="110" width="6" height="132" rx="3" fill="#1d9e75"/><text x="342" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">2  render (Pillow)</text><circle cx="346" cy="151" r="3" fill="#1d9e75"/><text x="358" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">shaded iso + edge lines</text><circle cx="346" cy="165" r="3" fill="#1d9e75"/><text x="358" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">dimension callouts (in.)</text><circle cx="346" cy="179" r="3" fill="#1d9e75"/><text x="358" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">title block: NSN/name/shape</text><rect x="338" y="212" width="218" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="348" y="227" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">no GPU, no heavy deps</text>
<text x="588" y="178" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="604" y="110" width="250" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="604" y="110" width="6" height="132" rx="3" fill="#caa24a"/><text x="624" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">3  cache (sidecar)</text><circle cx="628" cy="151" r="3" fill="#caa24a"/><text x="640" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">index/cadcache/&lt;nsn&gt;.png</text><circle cx="628" cy="165" r="3" fill="#caa24a"/><text x="640" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">never touches the index (R1)</text><circle cx="628" cy="179" r="3" fill="#caa24a"/><text x="640" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">render-once, then instant</text><rect x="620" y="212" width="218" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="630" y="227" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">resumable batch or on-demand</text>
<text x="870" y="178" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="886" y="110" width="254" height="132" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="886" y="110" width="6" height="132" rx="3" fill="#2f7d4f"/><text x="906" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">4  serve + show</text><circle cx="910" cy="151" r="3" fill="#2f7d4f"/><text x="922" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">/cadimg?nsn= (figcrop pattern)</text><circle cx="910" cy="165" r="3" fill="#2f7d4f"/><text x="922" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">3-D library thumbnails</text><circle cx="910" cy="179" r="3" fill="#2f7d4f"/><text x="922" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">SVG/WebGL stay as fallback/live</text><rect x="902" y="212" width="222" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="912" y="227" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">the whole ~20,869 set</text>
<rect x="40" y="268" width="545" height="96" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="292" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">Two ways to populate</text>
<text x="58" y="312" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">MAKE-CAD.bat pre-renders the whole representative set (ref_nsn with FLIS dims +</text><text x="58" y="325" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">figure-bearing parts) with progress + ETA, resumable. Or skip it: /cadimg renders each part</text><text x="58" y="338" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">the first time it is viewed and caches it.</text>
<rect x="596" y="268" width="544" height="96" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="614" y="292" font-size="12" font-weight="700" fill="#7f77dd" text-anchor="start">What a CAD image shows</text>
<text x="614" y="312" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">A clean three-quarter shaded view of the part&#x27;s shape, the overall bounding dimensions called out</text><text x="614" y="325" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">in inches, and a title block with the NSN, nomenclature and shape family. Labeled REPRESENTATIVE —</text><text x="614" y="338" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">not a manufacturing drawing.</text>
<rect x="40" y="380" width="1100" height="52" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="401" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">Verified</text>
<text x="58" y="419" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Sample families rendered in isolation (bolt/gear/bearing/canister/bracket/switch) and end-to-end through the live server (/cadimg?nsn= -&gt; valid PNG). Additive + legacy-safe: static PNGs need no WebGL, a real</text><text x="58" y="431" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">win for old machines.</text>
<text x="40" y="592" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Diagram. Dark (R3). v0.86.0 · 2026-06-04 · engine/cad_render.py + /cadimg route + make_cad.py/MAKE-CAD.bat · index/cadcache sidecar. R1.</text>
</svg>