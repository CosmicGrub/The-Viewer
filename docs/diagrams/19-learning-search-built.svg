<rect x="58" y="150" width="294" height="30" rx="9" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="70" y="170" font-size="10.5" font-weight="400" fill="#e6e9ee" text-anchor="start">POST /api/request → build the 104th PDF</text>
<path d="M205,180 L205,192" stroke="#9aa5b1" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="58" y="194" width="294" height="30" rx="9" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
