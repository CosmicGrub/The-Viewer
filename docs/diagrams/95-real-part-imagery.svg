<rect x="40" y="218" width="360" height="164" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="218" width="6" height="164" rx="3" fill="#2f7d4f"/><text x="60" y="242" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📄  Manual illustration (default)</text><circle cx="64" cy="259" r="3" fill="#2f7d4f"/><text x="76" y="262" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">The cited exploded-view figure, cropped from the page.</text><circle cx="64" cy="273" r="3" fill="#2f7d4f"/><text x="76" y="276" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Public-domain US Army TM art — authoritative &amp; exact.</text><circle cx="64" cy="287" r="3" fill="#2f7d4f"/><text x="76" y="290" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Shown in the preview box + the modal&#x27;s first tab.</text><rect x="56" y="352" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="367" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Accurate, legal, offline.</text>
<rect x="412" y="218" width="360" height="164" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="218" width="6" height="164" rx="3" fill="#1d9e75"/><text x="432" y="242" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">◳  Representative 3D (kept)</text><circle cx="436" cy="259" r="3" fill="#1d9e75"/><text x="448" y="262" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">FLIS-dimension parametric mesh for primitive families.</text><circle cx="436" cy="273" r="3" fill="#1d9e75"/><text x="448" y="276" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Clearly labeled &#x27;representative — not a CAD model&#x27;.</text><circle cx="436" cy="287" r="3" fill="#1d9e75"/><text x="448" y="290" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Interactive tab, paired with the real figure.</text><rect x="428" y="352" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="367" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Truthful where it&#x27;s accurate.</text>
<rect x="784" y="218" width="356" height="164" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="218" width="6" height="164" rx="3" fill="#caa24a"/><text x="804" y="242" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">⚠  Approximation (opt-in)</text><circle cx="808" cy="259" r="3" fill="#caa24a"/><text x="820" y="262" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">OFF by default; a checkbox enables it.</text><circle cx="808" cy="273" r="3" fill="#caa24a"/><text x="820" y="276" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Watermarked &#x27;ARTISTIC APPROXIMATION — NOT TO SCALE&#x27;.</text><circle cx="808" cy="287" r="3" fill="#caa24a"/><text x="820" y="290" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Local image-&gt;3D model is a documented future hook.</text><rect x="800" y="352" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="367" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Never authoritative.</text>
<rect x="40" y="398" width="1100" height="70" rx="12" fill="#171d26" stroke="#c4585a" stroke-width="1"/>
<text x="58" y="419" font-size="11.5" font-weight="700" fill="#c4585a" text-anchor="start">Why not &#x27;real CAD for every part&#x27;</text>
<text x="58" y="439" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Military NSN CAD + repair data is ITAR-controlled technical data — not freely downloadable/bundleable; web CAD is license-locked and rarely matches the exact NSN; AI 3D is an approximation, unsafe as</text><text x="58" y="451" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">authoritative in a maintenance tool. So we use the manual&#x27;s own cited figure instead. Sources: pmddtc.state.gov, federalregister.gov.</text>
<rect x="40" y="476" width="1100" height="86" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="497" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED</text>
<text x="58" y="517" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Region heuristic on a synthetic page: found &#x27;Figure 5&#x27; caption, cropped top→caption (excludes the parts table). Full path on a fixture index: NSN -&gt; cited figure (doc1/p.1/fig5) -&gt; extracted+cached</text><text x="58" y="529" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">crop (18 KB PNG), cache hit on repeat, unknown NSN handled. Run EXTRACT-FIGURES.bat to prewarm the whole corpus; routes in RUN-ALL-TESTS.bat.</text>
<text x="40" y="614" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.76.0 · 2026-06-03 · figures_feature.py · /api/part_image · /figcrop · figcache sidecar · extract_figures.py. Additive (R1/R6).</text>
