<svg viewBox="0 0 1140 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1140" height="440" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/><text x="40" y="46" font-size="17" font-weight="700" fill="#e6e9ee" text-anchor="start">Duplicate route collisions fixed + audit guard   v1.3.5</text><text x="40" y="64" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">A {path:handler} registry silently drops one of two same-path handlers</text><line x1="40" y1="80" x2="1100" y2="80" stroke="#2b333f"/><text x="40" y="106" font-size="12.5" font-weight="700" fill="#e0564f" text-anchor="start">Before — collision (one handler DEAD)</text><rect x="40" y="118" width="520" height="130" rx="12" fill="#171d26" stroke="#e0564f" stroke-width="1"/><text x="58" y="142" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">@get /figcrop  (doc/page crop)   &lt;- deepzoom/rpstl/xref</text><text x="58" y="160" font-size="9.6" font-weight="700" fill="#f2c3ad" text-anchor="start">@get /figcrop  (name crop)       &lt;- visual search   ⟵ wins</text><text x="58" y="182" font-size="9.6" font-weight="700" fill="#e0564f" text-anchor="start">=&gt; doc/page figure crops 404 all over the app</text><text x="58" y="210" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">@get /api/coverage  overview     &lt;- /coverage,/ops</text><text x="58" y="228" font-size="9.6" font-weight="700" fill="#f2c3ad" text-anchor="start">@get /api/coverage  per-vehicle  &lt;- home  ⟵ wins</text><text x="600" y="106" font-size="12.5" font-weight="700" fill="#2f7d4f" text-anchor="start">After — merged, branch on param</text><rect x="600" y="118" width="500" height="130" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/><text x="618" y="142" font-size="9.8" font-weight="400" fill="#8fd6ab" text-anchor="start">/figcrop:  ?name= -&gt; figcache file</text><text x="618" y="160" font-size="9.8" font-weight="400" fill="#8fd6ab" text-anchor="start">           else  -&gt; doc/page crop</text><text x="618" y="190" font-size="9.8" font-weight="400" fill="#8fd6ab" text-anchor="start">/api/coverage:  ?vehicle= -&gt; per-vehicle</text><text x="618" y="208" font-size="9.8" font-weight="400" fill="#8fd6ab" text-anchor="start">                else      -&gt; overview</text><text x="618" y="236" font-size="9.6" font-weight="700" fill="#2f7d4f" text-anchor="start">both callers work; no dead handler</text><line x1="40" y1="266" x2="1100" y2="266" stroke="#2b333f"/><text x="40" y="292" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">Guard so it can&#x27;t recur</text><rect x="40" y="304" width="1060" height="96" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/><text x="58" y="328" font-size="10.4" font-weight="400" fill="#9aa6b6" text-anchor="start">audit_features.py [0] now scans the routes source for repeated @get/@post on the same (method, path) and FAILs on any duplicate -- the runtime dict hid these. GET+POST on one path (legit read/write) is not flagged. Verified: 101 decorators, 0</text><text x="58" y="343" font-size="10.4" font-weight="400" fill="#9aa6b6" text-anchor="start">same-method duplicates. Runs in VERIFY-099. Pairs with v1.3.4 (read routes degrade instead of 500 when a sidecar isn&#x27;t built).</text></svg>