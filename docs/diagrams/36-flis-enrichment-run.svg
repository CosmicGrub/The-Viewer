<text x="58" y="534" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">SAFE</text>
<text x="58" y="554" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Written with TRUNCATE journaling; the interrupted first attempt (slowed only by a full-DB integrity check) committed nothing; the index re-reads cleanly with all 39,683 docs.</text><text x="58" y="567" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Additive (R1), append-only (R6).</text>
