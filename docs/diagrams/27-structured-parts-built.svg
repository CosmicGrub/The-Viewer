<text x="70" y="162" font-size="10.5" font-weight="700" fill="#cfe0ff" text-anchor="start">viewer_ingest.py  parts</text>
<text x="70" y="178" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">scans RPSTL pages (&#x27;Usable On Code&#x27;)</text>
<path d="M220,188 L220,202" stroke="#4f9dff" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="58" y="204" width="324" height="42" rx="9" fill="#101a14" stroke="#2f7d4f" stroke-width="1"/>
<text x="70" y="224" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">parts table (migration 0004): NSN · FIG# · figure</text><text x="70" y="236" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">title · doc · page · vehicle — cited.</text>
<text x="58" y="270" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Auto-refreshes after run / ocrall.</text>
<rect x="420" y="104" width="320" height="150" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="438" y="128" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">PROVEN ON YOUR INDEX</text>
