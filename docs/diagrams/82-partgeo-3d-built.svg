<svg viewBox="0 0 1180 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="520" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — 3D viewer: detailed parametric models  (v0.68.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">The WebGL renderer was already glossy; the geometry was blocky. partgeo.js builds the real part shape from the measured dimensions + FLIS characteristics.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="360" height="196" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="196" rx="3" fill="#4f9dff"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔩  Family-specific meshes</text><circle cx="64" cy="149" r="3" fill="#4f9dff"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">bolt = hex head + threaded shank · nut = chamfered hex +</text><text x="76" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">bore · washer/gasket = ring (gasket with bolt-holes).</text><circle cx="64" cy="174" r="3" fill="#4f9dff"/><text x="76" y="177" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">bearing = outer/inner races + a ring of balls · gear =</text><text x="76" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">teeth + bore · spring = helix.</text><circle cx="64" cy="199" r="3" fill="#4f9dff"/><text x="76" y="202" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">tube = hollow cylinder · o-ring/seal = torus · pin/shaft =</text><text x="76" y="213" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">chamfered ends · bracket = L + holes · battery = body +</text><text x="76" y="224" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">posts.</text><rect x="56" y="274" width="328" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="289" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">12 families, classified from the item name.</text>
<rect x="412" y="108" width="360" height="196" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="108" width="6" height="196" rx="3" fill="#1d9e75"/><text x="432" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📐  Driven by real measurements</text><circle cx="436" cy="149" r="3" fill="#1d9e75"/><text x="448" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Pulls overall length / width / height / diameter / bore</text><text x="448" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">from the FLIS characteristics already shown in the panel.</text><circle cx="436" cy="174" r="3" fill="#1d9e75"/><text x="448" y="177" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">So sizes and proportions match the catalogued part, not a</text><text x="448" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">generic block.</text><circle cx="436" cy="199" r="3" fill="#1d9e75"/><text x="448" y="202" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Still honest: a representative parametric model (no CAD</text><text x="448" y="213" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">geometry exists in a TM), but it looks like the part.</text><rect x="428" y="274" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="289" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Proportions from the catalogue.</text>
<rect x="784" y="108" width="356" height="196" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="108" width="6" height="196" rx="3" fill="#caa24a"/><text x="804" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🖥  Both renderers, gallery stays fast</text><circle cx="808" cy="149" r="3" fill="#caa24a"/><text x="820" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">partgeo.js returns a plain {V,F} mesh used by BOTH the</text><text x="820" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">WebGL shader (smooth normals, glossy) and the SVG</text><text x="820" y="174" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">fallback (legacy).</text><circle cx="808" cy="185" r="3" fill="#caa24a"/><text x="820" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Gallery thumbnails keep the light primitive (fast grid);</text><text x="820" y="199" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">opening a part upgrades to the detailed mesh.</text><circle cx="808" cy="210" r="3" fill="#caa24a"/><text x="820" y="213" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Served at /partgeo.js. No new dependency, offline.</text><rect x="800" y="274" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="289" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Detail where it counts; speed in the grid.</text>
<rect x="40" y="320" width="1100" height="84" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="342" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED</text>
<text x="58" y="362" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">partgeo.js node-validated: all 13 families produce finite, non-degenerate meshes (no NaN, valid indices) — bolt 399 verts (hex head + thread grooves), bearing 1342 (races + balls), spring 2120</text><text x="58" y="374" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">(helix), gear with teeth. Family classifier 12/12 on real nomenclatures. threed.html wiring + the /partgeo.js route confirmed on host. The same {V,F} reaches the SVG legacy path, so legacy gets the</text><text x="58" y="386" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">detailed shapes too (flat-shaded).</text>
<text x="40" y="512" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.68.0 · 2026-06-03 · ui/partgeo.js · threed.html (buildModel/open3D) · /partgeo.js route. Additive (R1/R6).</text>
</svg>