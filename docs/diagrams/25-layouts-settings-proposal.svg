<svg viewBox="0 0 1180 860" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect x="0" y="0" width="1180" height="860" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="22" font-weight="700" fill="#e6e9ee" text-anchor="start">Switchable layouts behind a Settings button — proposal</text>
<text x="40" y="70" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Consolidate today&#x27;s scattered toggles into one Settings panel + named presets. Presentation only — the dataset, search, and the 104th flow never change.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="104" width="540" height="150" rx="12" fill="#171d26" stroke="#3a4d6e" stroke-width="1"/>
<text x="58" y="128" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">PRESENTATION LAYER  ·  what a layout changes</text>
<text x="60" y="154" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">• Text size · density/compact · spacing</text>
<text x="60" y="176" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">• Simple ↔ Advanced fields · which chrome shows</text>
<text x="60" y="198" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">• Default match (All/Any) · viewer defaults</text>
<text x="60" y="220" font-size="10" font-weight="700" fill="#caa24a" text-anchor="start">• = CSS classes on &lt;body&gt; + a saved preference</text>
<rect x="600" y="104" width="540" height="150" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="618" y="128" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">INVARIANT CORE  ·  never changes with layout</text>
<text x="620" y="154" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">• The dataset / index (server-side)</text>
<text x="620" y="176" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">• Search (FTS5, NSN, Last-4, synonyms, ranking)</text>
<text x="620" y="198" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">• End-to-end: modal → cart → tech gate → 104th PDF</text>
<text x="620" y="220" font-size="10" font-weight="700" fill="#2f7d4f" text-anchor="start">• = server endpoints; identical for every layout</text>
<path d="M580,179 L600,179" stroke="#9aa5b1" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="590" y="150" font-size="9" font-weight="400" fill="#7c8696" text-anchor="middle">settings only style the UI →</text>
<text x="590" y="205" font-size="9" font-weight="700" fill="#e0564f" text-anchor="middle">✗ never cross into data / search / request</text>
<rect x="40" y="276" width="540" height="300" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="58" y="304" font-size="14" font-weight="700" fill="#e6e9ee" text-anchor="start">⚙  Settings</text>
<text x="58" y="326" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">One place for everything that&#x27;s a header button today.</text>
<text x="58" y="354" font-size="9" font-weight="700" fill="#caa24a" text-anchor="start">LAYOUT PRESET</text>
<rect x="58" y="362" width="504" height="34" rx="8" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/>
<text x="72" y="384" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">Shop floor / Touch</text>
<text x="548" y="384" font-size="12" font-weight="400" fill="#9aa6b6" text-anchor="end">▾</text>
<text x="58" y="408" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">Text size</text>
<text x="562" y="408" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="end">Normal · Large · X-Large</text>
<line x1="58" y1="416" x2="562" y2="416" stroke="#2b333f"/>
<text x="58" y="435" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">Density</text>
<text x="562" y="435" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="end">Comfortable · Compact</text>
<line x1="58" y1="443" x2="562" y2="443" stroke="#2b333f"/>
<text x="58" y="462" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">Fields</text>
<text x="562" y="462" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="end">Simple · Advanced</text>
<line x1="58" y1="470" x2="562" y2="470" stroke="#2b333f"/>
<text x="58" y="489" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">Search match</text>
<text x="562" y="489" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="end">All words · Any word</text>
<line x1="58" y1="497" x2="562" y2="497" stroke="#2b333f"/>
<text x="58" y="516" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">Viewer</text>
<text x="562" y="516" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="end">Thumbnails / highlight defaults</text>
<line x1="58" y1="524" x2="562" y2="524" stroke="#2b333f"/>
<rect x="58" y="546" width="150" height="24" rx="7" fill="none" stroke="#2b333f" stroke-width="1"/>
<text x="133" y="563" font-size="9.5" font-weight="600" fill="#9aa6b6" text-anchor="middle">Reset to default</text>
<text x="562" y="563" font-size="9" font-weight="400" fill="#7c8696" text-anchor="end">saved on this device</text>
<text x="600" y="278" font-size="12" font-weight="700" fill="#caa24a" text-anchor="start">NAMED PRESETS  ·  each bundles the settings at left</text>
<rect x="600" y="292" width="540" height="62" rx="10" fill="#1e3a26" stroke="#2b333f" stroke-width="1"/>
<text x="616" y="316" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">Simple / Junior</text>
<text x="616" y="334" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Large text · simple fields · minimal chrome — fast for new mechanics.</text>
<rect x="600" y="362" width="540" height="62" rx="10" fill="#1a2740" stroke="#2b333f" stroke-width="1"/>
<text x="616" y="386" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">Advanced / SME</text>
<text x="616" y="404" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">All fields · compact density · every facet — max info for experts.</text>
<rect x="600" y="432" width="540" height="62" rx="10" fill="#3a2f1a" stroke="#2b333f" stroke-width="1"/>
<text x="616" y="456" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">Shop floor / Touch</text>
<text x="616" y="474" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">X-large text · big tap targets · high contrast — phone/tablet at the</text><text x="616" y="487" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">vehicle.</text>
<rect x="600" y="502" width="540" height="62" rx="10" fill="#243042" stroke="#2b333f" stroke-width="1"/>
<text x="616" y="526" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">Compact / Desktop</text>
<text x="616" y="544" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Dense · small text · keyboard-first — most on screen at once.</text>
<rect x="40" y="596" width="1100" height="110" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="58" y="622" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">WHY IT CAN&#x27;T BREAK THE PROGRAM</text>
<text x="58" y="644" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Layout state is CSS classes + a saved preference; it never alters the request payload, the search calls, or the dataset. Unknown/missing settings fall back to the</text><text x="58" y="658" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">default layout, and Reset-to-default is always one click — so a bad custom layout can&#x27;t strand you (backwards-compatible &amp; rollbackable, R1). The end-to-end process</text><text x="58" y="672" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">runs identically under every preset.</text>
<text x="40" y="724" font-size="11" font-weight="700" fill="#4f9dff" text-anchor="start">RECOMMENDATION:</text>
<text x="195" y="724" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">Add a ⚙ Settings panel that absorbs the existing header toggles, plus the four presets above and a Reset. Persist per device. Verify each preset still</text><text x="195" y="739" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">passes the core flow (search → view → add → generate sheet).</text>
<text x="40" y="846" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">Proposal only — nothing built yet. Dark (R3). On approval: data-flow diagram (R2), CHANGELOG (R4) + visual panel (R5).</text>
</svg>