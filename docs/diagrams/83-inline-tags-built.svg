<svg viewBox="0 0 1180 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="470" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — inline part tagging (background pencil)  (v0.69.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Tagging lives in the background while you browse, not as a foreground feature page — a small pencil on every part, click to add your words.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="360" height="188" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="188" rx="3" fill="#4f9dff"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">✎  A quiet pencil on every part</text><circle cx="64" cy="149" r="3" fill="#4f9dff"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">tagger.js drops a small, low-key pencil on each part —</text><text x="76" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">NSN-bearing search results and every 3D library card</text><text x="76" y="174" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">(dossier / Look-Alike next).</text><circle cx="64" cy="185" r="3" fill="#4f9dff"/><text x="76" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Click it: a tiny popover to add/remove your own words</text><text x="76" y="199" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">(slang, common names, tags) for THAT part.</text><circle cx="64" cy="210" r="3" fill="#4f9dff"/><text x="76" y="213" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">ES5-safe, dependency-free, served at /tagger.js.</text><rect x="56" y="266" width="328" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="281" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">Tag the part in front of you, in place.</text>
<rect x="412" y="108" width="360" height="188" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="108" width="6" height="188" rx="3" fill="#1d9e75"/><text x="432" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  Tags teach search</text><circle cx="436" cy="149" r="3" fill="#1d9e75"/><text x="448" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">A tag is stored against the part (by NSN, else name) in</text><text x="448" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">keywords_user.json and folded into the offline search</text><text x="448" y="174" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">expansion, live.</text><circle cx="436" cy="185" r="3" fill="#1d9e75"/><text x="448" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">So a word you tag onto a part also FINDS that part — and</text><text x="448" y="199" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">tags on the same part find each other.</text><circle cx="436" cy="210" r="3" fill="#1d9e75"/><text x="448" y="213" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Directly teaches; indirectly improves every later search.</text><rect x="428" y="266" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="281" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Your word now finds the part.</text>
<rect x="784" y="108" width="356" height="188" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="108" width="6" height="188" rx="3" fill="#caa24a"/><text x="804" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">💤  Background, not foreground</text><circle cx="808" cy="149" r="3" fill="#caa24a"/><text x="820" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Removed the prominent Keywords nav button; the manager</text><text x="820" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">page stays only as a quiet &#x27;manage all&#x27; link inside the</text><text x="820" y="174" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">popover.</text><circle cx="808" cy="185" r="3" fill="#caa24a"/><text x="820" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">The system stays out of the way until you reach for the</text><text x="820" y="199" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">pencil.</text><circle cx="808" cy="210" r="3" fill="#caa24a"/><text x="820" y="213" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">All parts taggable, no dedicated feature field.</text><rect x="800" y="266" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="281" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Out of the way until you want it.</text>
<rect x="40" y="312" width="1100" height="80" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="334" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED</text>
<text x="58" y="354" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">tagger.js syntax-clean + ES5-clean (RPS gate covers it). Tag logic isolation-tested: tagging NSN 6140-01-485-1472 (&#x27;battery, storage&#x27;) with &#x27;juice box&#x27; makes &#x27;juice box&#x27; find the NSN AND the name;</text><text x="58" y="366" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">tags become mutually findable. Server functions + /api/tags + /tagger.js routes confirmed on host. Tags live-reload into search with no restart.</text>
<text x="40" y="462" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.69.0 · 2026-06-03 · ui/tagger.js · /api/tags + user_tags_* · keywords_user.json tags · index.html + threed.html pencils. Additive (R1/R6).</text>
</svg>