<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI,Arial,sans-serif">
<rect width="1000" height="560" fill="#0d1117"/>
<text x="500" y="42" fill="#e6edf3" font-size="26" font-weight="700" text-anchor="middle">macchart.py &#8212; Maintenance Allocation Chart Parser</text>
<text x="500" y="70" fill="#8b949e" font-size="14" text-anchor="middle">v1.12.8 &#183; roadmap Vol.2 #56 &#183; GET /api/mac &#183; extractive; unreadable columns left NULL, raw line kept (R13)</text>

<rect x="55" y="105" width="300" height="165" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="205" y="132" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">MAC rows in the TM</text>
<text x="205" y="158" fill="#c9d1d9" font-size="11.5" text-anchor="middle">0601 Water Pump Inspect 0.2 C</text>
<text x="205" y="178" fill="#c9d1d9" font-size="11.5" text-anchor="middle">          Replace 1.5 F</text>
<text x="205" y="198" fill="#c9d1d9" font-size="11.5" text-anchor="middle">          Repair  3.0 H</text>
<text x="205" y="218" fill="#c9d1d9" font-size="11.5" text-anchor="middle">0602 Fan Belt   Replace 0.5 O</text>
<text x="205" y="244" fill="#8b949e" font-size="11" text-anchor="middle">columnar; functions grouped</text>
<text x="205" y="260" fill="#8b949e" font-size="11" text-anchor="middle">under one component</text>

<rect x="400" y="95" width="230" height="185" rx="10" fill="#161b22" stroke="#1f6feb"/>
<text x="515" y="123" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">parse_row()</text>
<text x="515" y="149" fill="#c9d1d9" font-size="12" text-anchor="middle">group number (2-4 digits)</text>
<text x="515" y="169" fill="#c9d1d9" font-size="12" text-anchor="middle">FUNCTION keyword (fixed vocab)</text>
<text x="515" y="189" fill="#c9d1d9" font-size="12" text-anchor="middle">level C/O/F/H/D + name</text>
<text x="515" y="209" fill="#c9d1d9" font-size="12" text-anchor="middle">man-hours (decimal)</text>
<text x="515" y="231" fill="#f0883e" font-size="11.5" text-anchor="middle">no function keyword &#8594; not a row</text>
<text x="515" y="251" fill="#8b949e" font-size="11" text-anchor="middle">component carries down; raw kept</text>
<text x="515" y="270" fill="#8b949e" font-size="11" text-anchor="middle">for_component('water pump')</text>

<rect x="675" y="105" width="270" height="80" rx="10" fill="#161b22" stroke="#238636"/>
<text x="810" y="133" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">structured row</text>
<text x="810" y="156" fill="#c9d1d9" font-size="11.5" text-anchor="middle">{group, component, function,</text>
<text x="810" y="173" fill="#c9d1d9" font-size="11.5" text-anchor="middle">level, level_name, man_hours, raw}</text>

<rect x="675" y="200" width="270" height="80" rx="10" fill="#161b22" stroke="#f0883e"/>
<text x="810" y="228" fill="#f0883e" font-size="14" font-weight="700" text-anchor="middle">R13 honesty</text>
<text x="810" y="251" fill="#c9d1d9" font-size="11.5" text-anchor="middle">Overhaul w/ no readable level</text>
<text x="810" y="269" fill="#c9d1d9" font-size="11.5" text-anchor="middle">&#8594; level=None, man_hours=None</text>

<rect x="270" y="360" width="460" height="86" rx="10" fill="#161b22" stroke="#8957e5"/>
<text x="500" y="389" fill="#a371f7" font-size="15" font-weight="700" text-anchor="middle">"how do I service X, at what level?"</text>
<text x="500" y="414" fill="#c9d1d9" font-size="12.5" text-anchor="middle">Water Pump &#8594; Inspect@C(0.2), Replace@F(1.5), Repair@H(3.0)</text>
<text x="500" y="434" fill="#c9d1d9" font-size="12.5" text-anchor="middle">each row cites its raw MAC line for verification</text>

<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/></marker></defs>
<line x1="355" y1="185" x2="398" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
<line x1="630" y1="150" x2="673" y2="145" stroke="#238636" stroke-width="2" marker-end="url(#a)"/>
<line x1="630" y1="215" x2="673" y2="235" stroke="#f0883e" stroke-width="2" marker-end="url(#a)"/>
<line x1="500" y1="280" x2="500" y2="358" stroke="#8957e5" stroke-width="2" marker-end="url(#a)"/>
<text x="500" y="486" fill="#8b949e" font-size="12" text-anchor="middle">stdlib only &#183; pure + unit-testable &#183; additive (R1) &#183; complements smrdecode.py (source/maint codes) + serviceability.py</text>
<text x="500" y="510" fill="#8b949e" font-size="12" text-anchor="middle">self-test: 4 rows, Water-Pump carry-down, Overhaul null level/time, prose ignored, for_component=3</text>
</svg>