<svg viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1120" height="560" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Corpus-wide vectorization batch   v0.99.5</text>
<text x="40" y="70" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Pre-render every figure page to crisp SVG once, so the ⛭ Vector view opens instantly instead of vectorizing on demand.</text>
<line x1="40" y1="86" x2="1080" y2="86" stroke="#2b333f"/>
<rect x="40" y="118" width="346" height="116" rx="11" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="56" y="142" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">figure pages</text>
<text x="56" y="164" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">parts.fig_no -&gt; distinct</text>
<text x="56" y="179" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">(document_id, page) + path.</text>
<text x="56" y="194" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">read-only on the index.</text>
<text x="384" y="183" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="392" y="118" width="346" height="116" rx="11" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="408" y="142" font-size="12" font-weight="700" fill="#caa24a" text-anchor="start">vectorize.ensure</text>
<text x="408" y="164" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">render page (fitz) -&gt; OpenCV</text>
<text x="408" y="179" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">potrace-style -&gt; SVG. cached</text>
<text x="408" y="194" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">index/veccache/&lt;doc&gt;_&lt;pg&gt;_&lt;dpi&gt;.svg.</text>
<text x="408" y="209" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">skip if already cached (resumable).</text>
<text x="736" y="183" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="744" y="118" width="346" height="116" rx="11" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="760" y="142" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">coverage</text>
<text x="760" y="164" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">index/vectorize_coverage.tsv:</text>
<text x="760" y="179" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">doc, page, svg_bytes, contours.</text>
<text x="760" y="194" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">parallel: cpu_count-1 (cap 10).</text>
<line x1="40" y1="250" x2="1080" y2="250" stroke="#2b333f"/>
<text x="40" y="278" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED / NOTES</text>
<rect x="40" y="292" width="1040" height="96" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<circle cx="56" cy="311" r="2.6" fill="#2f7d4f"/>
<text x="66" y="314" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">build_vectorize.py parses; reuses the proven 0.99.4 vectorizer (docs/vectorize_proof.png).</text>
<circle cx="56" cy="328" r="2.6" fill="#2f7d4f"/>
<text x="66" y="331" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">BUILD-VECTORIZE.bat runs the full set (resumable, parallel); --limit for a quick slice.</text>
<circle cx="56" cy="345" r="2.6" fill="#2f7d4f"/>
<text x="66" y="348" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Same shape as build_schemgraph / make_cad (host batch, sidecar-only, R1/R6). Degrades cleanly without OpenCV.</text>
<circle cx="56" cy="362" r="2.6" fill="#2f7d4f"/>
<text x="66" y="365" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Deepens 0.99.4: on-demand vectorization -&gt; corpus-wide precompute, so figures are instantly crisp.</text>
<text x="40" y="550" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Markup. Dark (R3). v0.99.5 · 2026-07-01 · build_vectorize.py · index/veccache + vectorize_coverage.tsv · parallel/resumable. R1/R6.</text>
</svg>