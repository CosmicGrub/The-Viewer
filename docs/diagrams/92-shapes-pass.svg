<text x="58" y="520" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">Also fixed</text>
<text x="58" y="538" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">A real bug: CLAMP was read as a shaft because the pattern &#x27;LAMP&#x27; had no word boundary (matched cLAMP). Bounded LAMP/BULB/CAP/STUD/COIL. Residual box is large assemblies (engine, van, frame) that carry the</text><text x="58" y="550" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">real manual figure anyway. partgeo.js ?v= bumped so browsers reload.</text>
<text x="40" y="632" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Diagram. Dark (R3). v0.84.0 · 2026-06-04 · engine/ui/partgeo.js (family + 9 builders) · measured by ANALYZE-SHAPES.bat. Additive &amp; rollbackable (R1).</text>
