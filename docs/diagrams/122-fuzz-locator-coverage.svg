<text x="60" y="398" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">cases executed against the REAL modules · 0 violations</text>
<text x="60" y="422" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">No new bugs — unlike 0.99.15, where fuzzing vectorize caught a real cv2.resize crash. These read helpers</text><text x="60" y="435" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">hold.</text>
