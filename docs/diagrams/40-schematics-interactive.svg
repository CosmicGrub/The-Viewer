<svg viewBox="0 0 1180 1090" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect x="0" y="0" width="1180" height="1090" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="21" font-weight="700" fill="#e6e9ee" text-anchor="start">Readable, interactive schematics — options &amp; how it works</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">It&#x27;s the SAME drawing — enhanced for legibility (contrast/sharpen/de-speckle), deep-zoomable, with hover/highlight. No content invented; everything cited to its page.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="56" y="116" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">THE VIEWER (marked up)</text>
<rect x="40" y="126" width="520" height="300" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="56" y="140" width="488" height="26" rx="6" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="66" y="157" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">▣ zoom</text>
<text x="148" y="157" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">⟲ fit</text>
<text x="230" y="157" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">◧ clean: on</text>
<text x="312" y="157" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">contrast</text>
<text x="394" y="157" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">◎ loupe</text>
<text x="476" y="157" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">▭ highlight</text>
<rect x="56" y="176" width="488" height="234" rx="8" fill="#0a0e12" stroke="#2b333f" stroke-width="1"/>
<line x1="80" y1="206" x2="520" y2="206" stroke="#3a4452" stroke-width="1.2"/>
<line x1="80" y1="242" x2="520" y2="242" stroke="#3a4452" stroke-width="1.2"/>
<line x1="80" y1="278" x2="520" y2="278" stroke="#3a4452" stroke-width="1.2"/>
<line x1="80" y1="314" x2="520" y2="314" stroke="#3a4452" stroke-width="1.2"/>
<line x1="80" y1="350" x2="520" y2="350" stroke="#3a4452" stroke-width="1.2"/>
<line x1="96" y1="200" x2="96" y2="386" stroke="#3a4452" stroke-width="1"/>
<line x1="160" y1="200" x2="160" y2="386" stroke="#3a4452" stroke-width="1"/>
<line x1="224" y1="200" x2="224" y2="386" stroke="#3a4452" stroke-width="1"/>
<line x1="288" y1="200" x2="288" y2="386" stroke="#3a4452" stroke-width="1"/>
<line x1="352" y1="200" x2="352" y2="386" stroke="#3a4452" stroke-width="1"/>
<line x1="416" y1="200" x2="416" y2="386" stroke="#3a4452" stroke-width="1"/>
<line x1="480" y1="200" x2="480" y2="386" stroke="#3a4452" stroke-width="1"/>
<circle cx="176" cy="242" r="9" fill="#16223a" stroke="#4f9dff"/>
<text x="176" y="245" font-size="8.5" font-weight="700" fill="#bcd4ff" text-anchor="middle">3</text>
<circle cx="306" cy="314" r="9" fill="#16223a" stroke="#4f9dff"/>
<text x="306" y="317" font-size="8.5" font-weight="700" fill="#bcd4ff" text-anchor="middle">7</text>
<circle cx="416" cy="386" r="9" fill="#16223a" stroke="#4f9dff"/>
<text x="416" y="389" font-size="8.5" font-weight="700" fill="#bcd4ff" text-anchor="middle">12</text>
<rect x="256" y="276" width="120" height="74" fill="none" stroke="#caa24a" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="456" cy="246" r="26" fill="#0a0e12" stroke="#4f9dff" stroke-width="1.6"/>
<text x="456" y="250" font-size="13" font-weight="700" fill="#4f9dff" text-anchor="middle">+</text>
<path d="M544,206 L600,150" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<text x="606" y="150" font-size="9.5" font-weight="700" fill="#2f7d4f" text-anchor="start">① deep zoom / pan to any portion</text>
<path d="M416,386 L600,186" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<text x="606" y="186" font-size="9.5" font-weight="700" fill="#4f9dff" text-anchor="start">② callout numbers hover → highlight + open the part</text>
<path d="M316,313 L600,222" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<text x="606" y="222" font-size="9.5" font-weight="700" fill="#caa24a" text-anchor="start">③ spotlight / box-highlight a section</text>
<path d="M456,246 L600,258" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<text x="606" y="258" font-size="9.5" font-weight="700" fill="#4f9dff" text-anchor="start">④ magnifier loupe on hover</text>
<path d="M306,326 L600,294" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<text x="606" y="294" font-size="9.5" font-weight="700" fill="#2f7d4f" text-anchor="start">⑤ &#x27;clean&#x27; toggle + contrast = legibility</text>
<text x="606" y="330" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Example (real page): see the before/after image shared with this.</text>
<text x="606" y="360" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">LEGIBILITY PIPELINE (offline, grounded)</text>
<rect x="606" y="374" width="534" height="46" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="620" y="393" font-size="10.4" font-weight="700" fill="#e6e9ee" text-anchor="start">1 · Render page hi-DPI (PyMuPDF)</text>
<text x="620" y="408" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">crisp raster of the real page</text>
<path d="M873,420 L873,426" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="606" y="426" width="534" height="46" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="620" y="445" font-size="10.4" font-weight="700" fill="#e6e9ee" text-anchor="start">2 · Grayscale + auto-contrast</text>
<text x="620" y="460" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">stretch faded scans</text>
<path d="M873,472 L873,478" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="606" y="478" width="534" height="46" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="620" y="497" font-size="10.4" font-weight="700" fill="#e6e9ee" text-anchor="start">3 · Sharpen (unsharp) + de-speckle</text>
<text x="620" y="512" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">crisper lines, less scan noise</text>
<path d="M873,524 L873,530" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="606" y="530" width="534" height="46" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="620" y="549" font-size="10.4" font-weight="700" fill="#e6e9ee" text-anchor="start">4 · Optional: deskew · binarize · upscale</text>
<text x="620" y="564" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">straighten · black-on-white · enlarge low-res</text>
<path d="M873,576 L873,582" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="606" y="582" width="534" height="46" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="620" y="601" font-size="10.4" font-weight="700" fill="#e6e9ee" text-anchor="start">5 · Tile pyramid → deep-zoom viewer</text>
<text x="620" y="616" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">OpenSeadragon: smooth zoom/pan + overlays</text>
<text x="40" y="640" font-size="12" font-weight="700" fill="#caa24a" text-anchor="start">OPTIONS  (grounded → richer)</text>
<rect x="40" y="654" width="1100" height="58" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="654" width="6" height="58" rx="3" fill="#2f7d4f"/>
<text x="60" y="676" font-size="11.5" font-weight="700" fill="#e6e9ee" text-anchor="start">A · Legibility cleanup</text>
<rect x="992" y="664" width="136" height="22" rx="6" fill="#2f7d4f" stroke="#2b333f" stroke-width="1"/>
<text x="1060" y="679" font-size="9" font-weight="700" fill="#0f1419" text-anchor="middle">MINIMUM · NOW</text>
<text x="60" y="694" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Contrast / sharpen / de-speckle / deskew + a &#x27;clean&#x27; toggle and contrast slider. Proven on your scan</text><text x="60" y="706" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">(shared).</text>
<text x="900" y="699" font-size="8.6" font-weight="700" fill="#8fae8f" text-anchor="start">low effort · it&#x27;s the real drawing, enhanced</text>
<rect x="40" y="718" width="1100" height="58" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="718" width="6" height="58" rx="3" fill="#2f7d4f"/>
<text x="60" y="740" font-size="11.5" font-weight="700" fill="#e6e9ee" text-anchor="start">B · Deep zoom + pan</text>
<rect x="992" y="728" width="136" height="22" rx="6" fill="#2f7d4f" stroke="#2b333f" stroke-width="1"/>
<text x="1060" y="743" font-size="9" font-weight="700" fill="#0f1419" text-anchor="middle">RESIZE/ZOOM</text>
<text x="60" y="758" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Tile the page; OpenSeadragon for smooth zoom to any portion, fully offline.</text>
<text x="900" y="763" font-size="8.6" font-weight="700" fill="#8fae8f" text-anchor="start">low-med effort</text>
<rect x="40" y="782" width="1100" height="58" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="782" width="6" height="58" rx="3" fill="#4f9dff"/>
<text x="60" y="804" font-size="11.5" font-weight="700" fill="#e6e9ee" text-anchor="start">C · Hover loupe + box-highlight / spotlight</text>
<rect x="992" y="792" width="136" height="22" rx="6" fill="#4f9dff" stroke="#2b333f" stroke-width="1"/>
<text x="1060" y="807" font-size="9" font-weight="700" fill="#0f1419" text-anchor="middle">HOVER/HIGHLIGHT</text>
<text x="60" y="822" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Magnifier that follows the cursor; drag to highlight a region or dim everything outside it.</text>
<text x="900" y="827" font-size="8.6" font-weight="700" fill="#9bb3d6" text-anchor="start">med effort</text>
<rect x="40" y="846" width="1100" height="58" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="846" width="6" height="58" rx="3" fill="#caa24a"/>
<text x="60" y="868" font-size="11.5" font-weight="700" fill="#e6e9ee" text-anchor="start">D · Callout hotspots → parts</text>
<rect x="992" y="856" width="136" height="22" rx="6" fill="#caa24a" stroke="#2b333f" stroke-width="1"/>
<text x="1060" y="871" font-size="9" font-weight="700" fill="#0f1419" text-anchor="middle">SMART</text>
<text x="60" y="886" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Hover/click a FIG callout number to highlight it and open the part (NSN/part#). Ties to the parts index;</text><text x="60" y="898" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">needs OCR boxes.</text>
<text x="900" y="891" font-size="8.6" font-weight="700" fill="#cbb87a" text-anchor="start">med effort · OCR-gated</text>
<rect x="40" y="910" width="1100" height="58" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="910" width="6" height="58" rx="3" fill="#caa24a"/>
<text x="60" y="932" font-size="11.5" font-weight="700" fill="#e6e9ee" text-anchor="start">E · Vectorize the line art</text>
<rect x="992" y="920" width="136" height="22" rx="6" fill="#caa24a" stroke="#2b333f" stroke-width="1"/>
<text x="1060" y="935" font-size="9" font-weight="700" fill="#0f1419" text-anchor="middle">CRISPEST</text>
<text x="60" y="950" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Trace clean line drawings to SVG → infinite-zoom crispness + per-line hover/recolor. Best for clean</text><text x="60" y="962" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">schematics.</text>
<text x="900" y="955" font-size="8.6" font-weight="700" fill="#cbb87a" text-anchor="start">high effort</text>
<rect x="40" y="978" width="1100" height="84" rx="12" fill="#171d26" stroke="#e0564f" stroke-width="1"/>
<text x="58" y="1002" font-size="12" font-weight="700" fill="#e0564f" text-anchor="start">GROUNDING + RECOMMENDATION</text>
<text x="58" y="1022" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Enhancement (contrast, sharpen, de-speckle, deskew, interpolated upscale) is legitimate — it&#x27;s the same drawing, more legible, cited to its page. Avoid AI super-resolution</text><text x="58" y="1035" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">/ inpainting that fabricates strokes (it can invent detail). Recommended bundle: A (cleanup) + B (deep zoom) + C (loupe/highlight) now; D (callout→part) as OCR completes; E</text><text x="58" y="1048" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">(vectorize) optional for the cleanest line schematics.</text>
<text x="40" y="1078" font-size="9.4" font-weight="400" fill="#6b7280" text-anchor="start">Proposal — your call. Companion to the interactive-schematic plan (diagrams 28/29). Dark (R3).</text>
</svg>