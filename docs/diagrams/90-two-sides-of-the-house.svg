<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="600" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Two sides of the house — Operator (10) vs Mechanic (20)  (v0.73.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">The whole repository is split by maintenance level, and the program opens by asking which side you&#x27;re on.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="40" y="114" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">The rule (Army TM coverage indicator — the trailing level field of the TM number)</text>
<rect x="40" y="126" width="1100" height="70" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="150" font-size="11" font-weight="700" fill="#2f7d4f" text-anchor="start">10</text>
<text x="58" y="168" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Operator</text>
<text x="274" y="150" font-size="11" font-weight="700" fill="#caa24a" text-anchor="start">12 13 14 15</text>
<text x="274" y="168" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Operator + Maint = BOTH</text>
<text x="490" y="150" font-size="11" font-weight="700" fill="#1d9e75" text-anchor="start">20 23 24 25 / 30 34 35 40</text>
<text x="490" y="168" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Mechanic</text>
<text x="706" y="150" font-size="11" font-weight="700" fill="#1d9e75" text-anchor="start">…P / …&amp;P  (RPSTL)</text>
<text x="706" y="168" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Mechanic (parts)</text>
<text x="922" y="150" font-size="11" font-weight="700" fill="#1d9e75" text-anchor="start">LO</text>
<text x="922" y="168" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Mechanic (lube)</text>
<text x="58" y="188" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Combined -12/-13/-14 land on BOTH sides. Guards the commodity number (the &#x27;11&#x27; in TM 11-…) from being misread as a level.</text>
<text x="40" y="224" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">Startup: “Choose your side of the house”</text>
<rect x="40" y="238" width="540" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="238" width="6" height="150" rx="3" fill="#2f7d4f"/><text x="60" y="262" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🪖  Operator / 10-level</text><circle cx="64" cy="279" r="3" fill="#2f7d4f"/><text x="76" y="282" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Straight to the BROWSER.</text><circle cx="64" cy="293" r="3" fill="#2f7d4f"/><text x="76" y="296" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">SKIPS the parts-request sheet entirely.</text><circle cx="64" cy="307" r="3" fill="#2f7d4f"/><text x="76" y="310" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Sees -10 + the operator chapters of combined manuals.</text><rect x="56" y="358" width="508" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="373" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Find info fast, no paperwork.</text>
<rect x="600" y="238" width="540" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="600" y="238" width="6" height="150" rx="3" fill="#1d9e75"/><text x="620" y="262" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔧  Maintenance / Mechanic / 20-level</text><circle cx="624" cy="279" r="3" fill="#1d9e75"/><text x="636" y="282" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Opens the PARTS-REQUEST SHEET onboarding (104th).</text><circle cx="624" cy="293" r="3" fill="#1d9e75"/><text x="636" y="296" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Sees -20/-24/-34, RPSTL parts lists, LO, + combined.</text><circle cx="624" cy="307" r="3" fill="#1d9e75"/><text x="636" y="310" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Search + browse filtered to the mechanic side.</text><rect x="616" y="358" width="508" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="626" y="373" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Full maintenance + parts flow.</text>
<rect x="40" y="402" width="1100" height="72" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="424" font-size="11.5" font-weight="700" fill="#7f77dd" text-anchor="start">How it works</text>
<text x="58" y="444" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Classified LIVE per document by tm_side() — read-only on the index (R1/R6), so new docs sort themselves instantly. /api/by_side gives the counts + lists; /api/search?side= filters results. The choice</text><text x="58" y="457" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">is remembered and auto-applied next launch; the 🏠 Side button switches anytime. classify_sides.py writes the full sorted manifest (index/sides.json) host-side.</text>
<rect x="40" y="482" width="1100" height="82" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="503" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED</text>
<text x="58" y="523" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">tm_side: 11/11 cases incl. -10, -20, -24P, -12&amp;P, -13&amp;P, LO …-12, -34, -23&amp;P, and the TM 11-…-10 / TM 10-…-20 commodity-number traps. Manifest tally verified on a 6-doc fixture (3 operator / 5</text><text x="58" y="536" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">mechanic / 2 both / 1 uncertain). Run RUN-ALL-TESTS.bat (adds /api/by_side to the route suite) + CLASSIFY-SIDES.bat for your real split.</text>
<text x="40" y="592" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.73.0 · 2026-06-03 · patterns.tm_side · /api/by_side · side chooser modal · classify_sides.py. Additive (R1/R6).</text>
</svg>