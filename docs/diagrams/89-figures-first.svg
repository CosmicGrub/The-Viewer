<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="600" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Figures-first 3-D library  (v0.82.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Interim measure: while the broader approximation work continues, the page leads with the parts that ALREADY have a real manual image.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="110" width="250" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="110" width="6" height="150" rx="3" fill="#4f9dff"/><text x="60" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">DB  parts table</text><circle cx="64" cy="151" r="3" fill="#4f9dff"/><text x="76" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">each row = a part cited on a manual</text><text x="76" y="165" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">page</text><circle cx="64" cy="176" r="3" fill="#4f9dff"/><text x="76" y="179" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">has fig_no + page + document_id</text><circle cx="64" cy="190" r="3" fill="#4f9dff"/><text x="76" y="193" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">WHERE fig_no IS NOT NULL and NSN&lt;&gt;&#x27;&#x27;</text><rect x="56" y="230" width="218" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="245" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">source of truth for &#x27;has a figure&#x27;</text>
<text x="306" y="190" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="322" y="110" width="250" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="322" y="110" width="6" height="150" rx="3" fill="#1d9e75"/><text x="342" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">JOIN  LEFT JOIN ref_nsn</text><circle cx="346" cy="151" r="3" fill="#1d9e75"/><text x="358" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">pull name / part# / CAGEC / chars</text><circle cx="346" cy="165" r="3" fill="#1d9e75"/><text x="358" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">name backfills the shape classifier</text><circle cx="346" cy="179" r="3" fill="#1d9e75"/><text x="358" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">GROUP BY nsn, ORDER BY name</text><rect x="338" y="230" width="218" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="348" y="245" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">one card per distinct NSN</text>
<text x="588" y="190" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="604" y="110" width="250" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="604" y="110" width="6" height="150" rx="3" fill="#caa24a"/><text x="624" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">IMG  /figcrop image_url</text><circle cx="628" cy="151" r="3" fill="#caa24a"/><text x="640" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">every card carries a real crop URL</text><circle cx="628" cy="165" r="3" fill="#caa24a"/><text x="640" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">renders the cited figure region</text><circle cx="628" cy="179" r="3" fill="#caa24a"/><text x="640" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">cached PNG in index/figcache</text><rect x="620" y="230" width="218" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="630" y="245" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">no blank/blocky cards up top</text>
<text x="870" y="190" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="886" y="110" width="254" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="886" y="110" width="6" height="150" rx="3" fill="#2f7d4f"/><text x="906" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">UI  3-D library page</text><circle cx="910" cy="151" r="3" fill="#2f7d4f"/><text x="922" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">leads with working examples</text><circle cx="910" cy="165" r="3" fill="#2f7d4f"/><text x="922" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">card preview uses image_url first</text><circle cx="910" cy="179" r="3" fill="#2f7d4f"/><text x="922" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">per-card lookup only as fallback</text><rect x="902" y="230" width="222" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="912" y="245" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">you see the manual breakdown image</text>
<rect x="40" y="295" width="1100" height="64" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="321" font-size="12" font-weight="700" fill="#7f77dd" text-anchor="start">TOGGLE — “include parts without a manual figure”</text>
<text x="58" y="341" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Default (off) = figures-first set described above. Checked = /api/threed?all=1 falls back to the full FLIS-dimension set (representative parametric shapes, some without a figure). The hint line states</text><text x="58" y="354" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">which mode you&#x27;re in.</text>
<rect x="40" y="375" width="540" height="110" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="399" font-size="11.5" font-weight="700" fill="#4f9dff" text-anchor="start">What changed</text>
<text x="58" y="419" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">threed_list() defaults to figures_only=True and is sourced from parts (not ref_nsn), so</text><text x="58" y="432" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">membership is driven by &#x27;a figure actually exists.&#x27; /api/threed honors ?all=1 for the old full</text><text x="58" y="445" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">set. threed.html: checkbox + mode hint + card uses server image_url.</text>
<rect x="596" y="375" width="544" height="110" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="614" y="399" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">Compatibility (R1) + rollback</text>
<text x="614" y="419" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Purely additive: the all=1 path preserves prior behavior; no schema change; corpus untouched.</text><text x="614" y="432" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Front-end is no-cache so a normal reload picks it up; the server was restarted to load the Python</text><text x="614" y="445" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">change. Rollback = set threed_list default figures_only=False.</text>
<text x="40" y="592" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Data-flow diagram. Dark (R3). v0.82.0 · 2026-06-03 · engine/viewer_app.py threed_list + /api/threed · engine/ui/threed.html. Backwards-compatible &amp; rollbackable (R1).</text>
</svg>