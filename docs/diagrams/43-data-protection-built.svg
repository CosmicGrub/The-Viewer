<svg viewBox="0 0 1180 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect x="0" y="0" width="1180" height="900" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="20" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — Data protection: root cause · safeguard · recovery  (v0.29.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">The &#x27;truncation&#x27; was a sandbox read-cache artifact (your files were never damaged). We still built real protection: atomic writes, a snapshot vault, damage detection, and byte-for-byte recovery.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="56" y="116" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">1 · ROOT CAUSE (reproduced)</text>
<rect x="40" y="126" width="1100" height="118" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="60" y="144" width="470" height="84" rx="8" fill="#13241c" stroke="#2f7d4f" stroke-width="1"/>
<text x="80" y="166" font-size="10.5" font-weight="700" fill="#bfe6cf" text-anchor="start">guest writes -&gt; guest reads</text>
<text x="80" y="184" font-size="9" font-weight="400" fill="#8fbf9f" text-anchor="start">the Linux sandbox reading its own writes is ALWAYS coherent (47,843</text><text x="80" y="196" font-size="9" font-weight="400" fill="#8fbf9f" text-anchor="start">bytes out = in, even short-&gt;long re-edits).</text>
<text x="80" y="224" font-size="9.4" font-weight="700" fill="#2f7d4f" text-anchor="start">= NOT the problem</text>
<rect x="650" y="144" width="470" height="84" rx="8" fill="#2a1a1a" stroke="#e0564f" stroke-width="1"/>
<text x="670" y="166" font-size="10.5" font-weight="700" fill="#f0b3b0" text-anchor="start">host writes -&gt; guest reads</text>
<text x="670" y="184" font-size="9" font-weight="400" fill="#cf9a98" text-anchor="start">after the editor (host) rewrites a file, the sandbox page cache serves a</text><text x="670" y="196" font-size="9" font-weight="400" fill="#cf9a98" text-anchor="start">STALE shorter length until it revalidates. Host file stays intact.</text>
<text x="670" y="224" font-size="9.4" font-weight="700" fill="#e0564f" text-anchor="start">= the artifact (read-side only)</text>
<text x="56" y="274" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">2 · SAFEGUARD (engine/safeguard.py)  — atomic writes · snapshot vault · verify · recover</text>
<rect x="40" y="284" width="1100" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="60" y="304" width="150" height="60" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="135" y="328" font-size="10" font-weight="700" fill="#e6e9ee" text-anchor="middle">critical files</text>
<text x="135" y="344" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="middle">engine/ui/docs/db</text>
<path d="M210,334 L236,334" stroke="#1d9e75" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="240" y="304" width="200" height="60" rx="8" fill="#13241c" stroke="#2f7d4f" stroke-width="1"/>
<text x="340" y="326" font-size="10.5" font-weight="700" fill="#bfe6cf" text-anchor="middle">snapshot</text>
<text x="340" y="342" font-size="8.6" font-weight="400" fill="#8fbf9f" text-anchor="middle">SHA-256 per file</text>
<text x="340" y="356" font-size="8.4" font-weight="400" fill="#8fbf9f" text-anchor="middle">-&gt; vault/SNAP_&lt;ts&gt;</text>
<path d="M440,334 L466,334" stroke="#1d9e75" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="470" y="304" width="200" height="60" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="570" y="326" font-size="10.5" font-weight="700" fill="#caa24a" text-anchor="middle">verify</text>
<text x="570" y="342" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="middle">classify damage vs</text>
<text x="570" y="356" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="middle">last good snapshot</text>
<path d="M670,334 L696,334" stroke="#1d9e75" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="700" y="304" width="200" height="60" rx="8" fill="#13241c" stroke="#2f7d4f" stroke-width="1"/>
<text x="800" y="326" font-size="10.5" font-weight="700" fill="#bfe6cf" text-anchor="middle">recover</text>
<text x="800" y="342" font-size="8.6" font-weight="400" fill="#8fbf9f" text-anchor="middle">restore + re-hash</text>
<text x="800" y="356" font-size="8.4" font-weight="400" fill="#8fbf9f" text-anchor="middle">(the archaeologist)</text>
<rect x="930" y="304" width="190" height="60" rx="8" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="1025" y="326" font-size="9.6" font-weight="700" fill="#4f9dff" text-anchor="middle">atomic write</text>
<text x="1025" y="342" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="middle">temp+fsync+replace</text>
<text x="1025" y="356" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="middle">no half-written files</text>
<text x="60" y="392" font-size="9.4" font-weight="700" fill="#9aa6b6" text-anchor="start">verify classifies:</text>
<rect x="180" y="382" width="10" height="10" rx="2" fill="#2f7d4f"/>
<text x="196" y="391" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">OK</text>
<rect x="330" y="382" width="10" height="10" rx="2" fill="#caa24a"/>
<text x="346" y="391" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">TRUNCATED</text>
<rect x="480" y="382" width="10" height="10" rx="2" fill="#e0564f"/>
<text x="496" y="391" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">CORRUPTED</text>
<rect x="630" y="382" width="10" height="10" rx="2" fill="#caa24a"/>
<text x="646" y="391" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">EMPTY</text>
<rect x="780" y="382" width="10" height="10" rx="2" fill="#e0564f"/>
<text x="796" y="391" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">MISSING</text>
<rect x="930" y="382" width="10" height="10" rx="2" fill="#4f9dff"/>
<text x="946" y="391" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">MODIFIED</text>
<text x="60" y="418" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Heavy viewer.db: SQLite integrity_check always; consistent online-backup copy only on demand (/withdb). Corpus (E:\) is read-only source, not snapshotted. Snapshots are additive (R6);</text><text x="60" y="430" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">main index never modified (R1).</text>
<text x="56" y="490" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">3 · TESTED TO A STRANGLEHOLD</text>
<rect x="40" y="500" width="1100" height="330" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="60" y="518" width="346" height="58" rx="10" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/>
<text x="78" y="548" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">19 / 19</text>
<text x="210" y="548" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">pillar tests pass</text>
<rect x="420" y="518" width="346" height="58" rx="10" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/>
<text x="438" y="548" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">11 / 11</text>
<text x="570" y="548" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">truncation + recovery tests pass</text>
<rect x="780" y="518" width="346" height="58" rx="10" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/>
<text x="798" y="548" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">36 / 38</text>
<text x="930" y="548" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">mutants killed (95%) — 2 equivalent</text>
<text x="60" y="604" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">Damage deliberately injected &amp; recovered byte-for-byte:</text>
<text x="60" y="624" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ last line (light)</text>
<text x="280" y="624" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ 50% (medium)</text>
<text x="500" y="624" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ 10 bytes (hard)</text>
<text x="720" y="624" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ 0 bytes (empty)</text>
<text x="940" y="624" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ partial UTF-8</text>
<text x="60" y="644" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ byte-flip corrupt</text>
<text x="280" y="644" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ deleted (missing)</text>
<text x="500" y="644" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ multi-file</text>
<text x="720" y="644" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ corrupted vault relic</text>
<text x="940" y="644" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ corrupted DB header</text>
<text x="60" y="684" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">Mutation testing — 2 rounds:</text>
<rect x="60" y="696" width="520" height="52" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="74" y="716" font-size="10" font-weight="700" fill="#e6e9ee" text-anchor="start">Round 1 · engine logic (core_pillars)</text>
<text x="74" y="733" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">26 faults injected -&gt; 25 killed (96%)</text>
<rect x="600" y="696" width="520" height="52" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="614" y="716" font-size="10" font-weight="700" fill="#e6e9ee" text-anchor="start">Round 2 · safeguard itself</text>
<text x="614" y="733" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">12 faults injected -&gt; 11 killed (92%)</text>
<text x="60" y="772" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Round 2 mutates the protection layer (blind-to-missing, trunc-&gt;ok, skip-write, hash-blind, dbcheck-always-ok ...) and confirms the truncation suite catches them — the safeguard guards</text><text x="60" y="785" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">are themselves guarded. Survivors are provably equivalent mutants.</text>
<text x="40" y="888" font-size="9.2" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.29.0 · 2026-06-02 · companion: DATA-PROTECTION.md · run via run_safeguard.bat / run_tests.bat.</text>
</svg>