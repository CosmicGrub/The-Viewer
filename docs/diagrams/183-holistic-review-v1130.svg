<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Segoe UI,Arial,sans-serif">
<rect width="1000" height="600" fill="#0d1117"/>
<text x="500" y="40" fill="#e6edf3" font-size="25" font-weight="700" text-anchor="middle">v1.13.0 Holistic Review &#8212; implement · audit · harden · polish</text>
<text x="500" y="68" fill="#8b949e" font-size="13.5" text-anchor="middle">3 parallel reviewers (arch/perf · robustness/security · data-integrity/UX) &#8594; recommendations &#8594; built &#38; re-verified green</text>

<rect x="40" y="92" width="300" height="200" rx="10" fill="#161b22" stroke="#1f6feb"/>
<text x="190" y="118" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">Architecture / Perf</text>
<text x="190" y="144" fill="#c9d1d9" font-size="12" text-anchor="middle">features/corpus.py: 1 leak-free</text>
<text x="190" y="161" fill="#c9d1d9" font-size="12" text-anchor="middle">FTS retrieval (was ~15 leaky connects)</text>
<text x="190" y="181" fill="#c9d1d9" font-size="12" text-anchor="middle">doc_path() pooled lookup</text>
<text x="190" y="201" fill="#c9d1d9" font-size="12" text-anchor="middle">auto-optimize: WAL now +</text>
<text x="190" y="218" fill="#c9d1d9" font-size="12" text-anchor="middle">bg index build (OCR-safe)</text>
<text x="190" y="238" fill="#c9d1d9" font-size="12" text-anchor="middle">bounded worker pool</text>
<text x="190" y="258" fill="#8b949e" font-size="11" text-anchor="middle">fast state = shipped default,</text>
<text x="190" y="274" fill="#8b949e" font-size="11" text-anchor="middle">not a manual step</text>

<rect x="350" y="92" width="300" height="200" rx="10" fill="#161b22" stroke="#238636"/>
<text x="500" y="118" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">Robustness / Security</text>
<text x="500" y="144" fill="#c9d1d9" font-size="12" text-anchor="middle">_sent flag: no double-send</text>
<text x="500" y="161" fill="#c9d1d9" font-size="12" text-anchor="middle">(B9 boundary now structural)</text>
<text x="500" y="181" fill="#c9d1d9" font-size="12" text-anchor="middle">all sidecar writes &#8594; atomic_write</text>
<text x="500" y="198" fill="#c9d1d9" font-size="12" text-anchor="middle">(fsync + _replace_retry)</text>
<text x="500" y="218" fill="#c9d1d9" font-size="12" text-anchor="middle">chunked-TE reject · temp-PDF</text>
<text x="500" y="235" fill="#c9d1d9" font-size="12" text-anchor="middle">try/finally · layout/tables 500&#8594;empty</text>
<text x="500" y="258" fill="#c9d1d9" font-size="12" text-anchor="middle">exposure token off-loopback</text>
<text x="500" y="278" fill="#8b949e" font-size="11" text-anchor="middle">durable-write audit guard added</text>

<rect x="660" y="92" width="300" height="200" rx="10" fill="#161b22" stroke="#f0883e"/>
<text x="810" y="118" fill="#f0883e" font-size="15" font-weight="700" text-anchor="middle">Data-integrity / UX</text>
<text x="810" y="144" fill="#c9d1d9" font-size="12" text-anchor="middle">/measures validates + WITHHOLDS</text>
<text x="810" y="161" fill="#c9d1d9" font-size="12" text-anchor="middle">quarantined garble (R13)</text>
<text x="810" y="181" fill="#c9d1d9" font-size="12" text-anchor="middle">/part dims: real page cite or</text>
<text x="810" y="198" fill="#c9d1d9" font-size="12" text-anchor="middle">honest "verify" &#8212; never faked</text>
<text x="810" y="218" fill="#f26d6d" font-size="12" font-weight="700" text-anchor="middle">safety callouts cite RESTORED</text>
<text x="810" y="235" fill="#8b949e" font-size="11" text-anchor="middle">(refactor had silently dropped them)</text>
<text x="810" y="258" fill="#c9d1d9" font-size="12" text-anchor="middle">home-page kiosk/a11y fixed</text>
<text x="810" y="278" fill="#c9d1d9" font-size="12" text-anchor="middle">Tools menu: +part/measures/scan</text>

<rect x="150" y="325" width="700" height="95" rx="10" fill="#161b22" stroke="#8957e5"/>
<text x="500" y="352" fill="#a371f7" font-size="15" font-weight="700" text-anchor="middle">AUDIT of the new work (handle with care)</text>
<text x="500" y="378" fill="#c9d1d9" font-size="12.5" text-anchor="middle">2 of 3 review subagents WROTE code despite read-only &#8594; treated as unverified, re-ran the full battery.</text>
<text x="500" y="398" fill="#c9d1d9" font-size="12.5" text-anchor="middle">Caught 1 real regression: corpus key rename cautions&#8594;results dropped SAFETY callouts from /part. Fixed.</text>

<rect x="150" y="445" width="700" height="90" rx="10" fill="#161b22" stroke="#238636"/>
<text x="500" y="472" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">GREEN after audit</text>
<text x="500" y="498" fill="#c9d1d9" font-size="12.5" text-anchor="middle">11 regression suites · 279 route cases · 24k fuzz · audit 0 FAIL/0 WARN · durable-write guard PASS</text>
<text x="500" y="518" fill="#8b949e" font-size="12" text-anchor="middle">additive + rollback-safe (R1) · VERSION 1.13.0 · VERIFY.bat = one exit-code-truth gate</text>

<text x="500" y="565" fill="#8b949e" font-size="12" text-anchor="middle">"A passing suite that never runs the code is worse than no suite." &#8212; the audit exists to make that impossible.</text>
</svg>