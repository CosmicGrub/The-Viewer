<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deep Zoom — THE VIEWER</title>
<link rel="stylesheet" href="/base.css"><script src="/shared.js"></script>
<style>
  html,body{height:100%;margin:0;background:#0c1116;color:#e6edf4;font-family:system-ui,Segoe UI,Arial,sans-serif}
  .wrap{display:flex;flex-direction:column;height:100vh}
  .top{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#10151c;border-bottom:1px solid #223}
  .top b{color:#7fbfff}
  .muted{color:#8a98a8;font-size:12px}
  .top button,.top a.btn{background:#1b2735;color:#cfe;border:1px solid #2f4858;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;text-decoration:none}
  #stage{flex:1;min-height:0}
  #fpanel{position:fixed;top:44px;right:0;bottom:0;width:320px;background:#0f141b;border-left:1px solid #223;
          transform:translateX(100%);transition:transform .18s ease;overflow:auto;z-index:20;box-shadow:-8px 0 24px #0008}
  #fpanel.open{transform:translateX(0)}
  #fpanel h3{margin:0;padding:12px 14px;font-size:13px;color:#7fbfff;border-bottom:1px solid #223;
             position:sticky;top:0;background:#0f141b;display:flex;justify-content:space-between;align-items:center}
  #fpanel .fp{display:block;padding:9px 14px;border-bottom:1px solid #1a232e;text-decoration:none;color:#e6edf4;font-size:12px}
  #fpanel .fp:hover{background:#16202b}
  #fpanel .fp b{color:#cfe} #fpanel .fp .n{color:#8a98a8;font-size:11px}
  #fpanel .fpx{cursor:pointer;color:#8a98a8;font-size:16px;line-height:1}
  #symmodal{display:none;position:fixed;inset:0;background:#000c;z-index:50;overflow:auto}
  #symcard{max-width:920px;margin:30px auto;background:#0f141b;border:1px solid #223;border-radius:8px;padding:14px}
  #symimgwrap{position:relative;display:inline-block;max-width:100%;line-height:0}
  #symimg{display:block;max-width:100%;height:auto}
  #symcanvas{position:absolute;left:0;top:0;cursor:crosshair}
  .symrow{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .symrow input{flex:1;min-width:160px;background:#1b2735;color:#e6edf4;border:1px solid #2f4858;border-radius:6px;padding:6px 8px;font-size:12px}
  .symrow button{background:#1b2735;color:#cfe;border:1px solid #2f4858;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px}
</style></head><body>
<div class="wrap">
  <div class="top">
    <b>🔎 Deep Zoom</b>
    <span class="muted" id="meta">—</span>
    <span style="margin-left:auto"></span>
    <button id="prev">◀ page</button>
    <span class="muted" id="pg">p.1</span>
    <button id="next">page ▶</button>
    <a class="btn" id="opendoc" target="_blank">open full document ↗</a>
    <a class="btn" id="vec" target="_blank" title="Vectorize this page to crisp SVG line-art (offline, OpenCV)">⛭ Vectorize</a>
    <button id="fpbtn" title="List every part called out on this page (from the parts index)">🧩 Parts on page</button>
    <button id="edbtn" style="display:none" title="Other editions of this manual found in the corpus (index/dedup.db)">📚 Editions</button>
    <button id="symbtn" title="Find/teach schematic component &amp; safety symbols on this page (OpenCV template matching)">🔣 Symbols</button>
    <span class="muted" id="cinfo"></span>
  </div>
  <div id="stage"></div>
  <div id="fpanel"><h3><span id="fptitle">Parts on this page</span><span class="fpx" id="fpclose">×</span></h3><div id="fplist"></div></div>
  <div id="symmodal">
    <div id="symcard">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <b style="color:#7fbfff">🔣 Symbol detection &amp; templates</b>
        <span class="fpx" id="symclose">×</span>
      </div>
      <div class="muted" style="margin-bottom:8px">Drag a box around a symbol below, name it, and save it as a template — future scans find every occurrence of it automatically. Green boxes are matches already found with existing templates.</div>
      <div id="symimgwrap"><img id="symimg" alt=""><canvas id="symcanvas"></canvas></div>
      <div class="symrow">
        <input id="symname" placeholder="template name, e.g. warning_triangle">
        <button id="symsave">Save selection as template</button>
        <span class="muted" id="symstatus"></span>
      </div>
    </div>
  </div>
</div>
<script src="/deepzoom.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var doc=q.get('doc')||'', page=parseInt(q.get('page')||'1',10)||1;
  var dz=null;
  function $(s){return document.querySelector(s);}
  function mount(){
    if(dz){ try{dz.destroy();}catch(e){} }
    $('#pg').textContent='p.'+page;
    $('#opendoc').href='/page?doc='+encodeURIComponent(doc)+'&page='+page+'&dpi=200';
    $('#vec').href='/vectorize?doc='+encodeURIComponent(doc)+'&page='+page+'&dpi=200';
    if(!doc){ $('#stage').innerHTML='<div style="padding:24px;color:#8a98a8">No document specified. Open this page as <code>/deepzoom?doc=ID&page=N</code>.</div>'; return; }
    dz=DeepZoom.mount($('#stage'), doc, page, { onInfo:function(o){
      // UX finding #5: distinguish "nothing extracted" from "found some, just no position data yet"
      // (the latter used to read the exact same as the former -- confusing on every OCR-only page).
      var msg;
      if(o.total===0){ msg='no NSN/part/figure callouts detected in this page’s text.'; }
      else if(o.callouts>0){ msg=o.callouts+' callout'+(o.callouts===1?'':'s')+' — click a number to jump to the part'+(o.unboxed?(' ('+o.unboxed+' more listed below, no position data)'):''); }
      else { msg=o.total+' callout'+(o.total===1?'':'s')+' found but this page has no OCR position data yet — click below to open anyway.'; }
      $('#cinfo').textContent=msg;
    } });
  }
  // doc title in the meta line
  fetch('/api/doc?id='+encodeURIComponent(doc)).then(function(r){return r.json();}).then(function(j){
    if(j){ $('#meta').textContent=(j.vehicle||'')+(j.tm_number?(' · '+j.tm_number):'')+(j.title?(' · '+j.title):''); }
  }).catch(function(){});
  $('#prev').onclick=function(){ if(page>1){ page--; mount(); if(panelMode==='parts') loadParts(); } };
  $('#next').onclick=function(){ page++; mount(); if(panelMode==='parts') loadParts(); };

  // ---- shared side drawer: "parts on this page" (GET /api/figureparts) and "editions of this
  // document" (GET /api/editions, dedup.py) share the SAME #fpanel -- only one is open at a time,
  // so there's no reason to duplicate the drawer markup/CSS for a second, rarely-populated panel. ----
  var panelMode='parts';   // 'parts' | 'editions'
  var partsLoaded=-1, editionsLoaded=-1;
  /* esc()/toast() from /shared.js */
  function loadParts(){
    partsLoaded=-1;
    if(!doc) return;
    $('#fplist').innerHTML='<div style="padding:14px;color:#8a98a8;font-size:12px">Loading…</div>';
    fetch('/api/figureparts?doc='+encodeURIComponent(doc)+'&page='+page).then(function(r){return r.json();}).then(function(j){
      partsLoaded=(j&&j.count)||0;
      $('#fptitle').textContent=(j&&j.fig_no?(j.fig_no+' — '):'')+'Parts on p.'+page+(j&&j.count?(' ('+j.count+')'):'');
      var rows=(j&&j.parts)||[];
      if(!rows.length){ $('#fplist').innerHTML='<div style="padding:14px;color:#8a98a8;font-size:12px">No indexed parts on this page.</div>'; return; }
      var html='';
      for(var i=0;i<rows.length;i++){ var p=rows[i]; var href=p.dossier_url||p.locate_url||'#';
        html+='<a class="fp" href="'+esc(href)+'" target="_blank"><b>'+esc(p.name||p.part_number||p.nsn||'part')+'</b>'
             +(p.nsn?(' <span class="n">'+esc(p.nsn)+'</span>'):'')
             +(p.part_number?('<br><span class="n">P/N '+esc(p.part_number)+(p.cagec?(' · CAGE '+esc(p.cagec)):'')+(p.smr?(' · SMR '+esc(p.smr)):'')+'</span>'):'')
             +'</a>';
      }
      $('#fplist').innerHTML=html;
    }).catch(function(){ $('#fplist').innerHTML='<div style="padding:14px;color:#c66;font-size:12px">Could not load parts.</div>'; });
  }
  // editions don't change as you flip pages (they're a property of the DOCUMENT, not the page) --
  // loaded once per document, not re-fetched on every page navigation like loadParts() above.
  function loadEditions(){
    if(!doc) return;
    $('#fplist').innerHTML='<div style="padding:14px;color:#8a98a8;font-size:12px">Loading…</div>';
    fetch('/api/editions?doc='+encodeURIComponent(doc)).then(function(r){return r.json();}).then(function(j){
      var rows=(j&&j.editions)||[];
      editionsLoaded=rows.length;
      $('#fptitle').textContent='Other editions'+(rows.length?(' ('+rows.length+')'):'');
      if(!rows.length){ $('#fplist').innerHTML='<div style="padding:14px;color:#8a98a8;font-size:12px">No other editions found in the corpus.</div>'; return; }
      var html='';
      for(var i=0;i<rows.length;i++){ var e=rows[i];
        html+='<a class="fp" href="/deepzoom?doc='+encodeURIComponent(e.document_id)+'&page=1" target="_blank">'
             +'<b>'+esc(e.title||e.tm_number||('doc '+e.document_id))+'</b>'
             +(e.tm_number?(' <span class="n">'+esc(e.tm_number)+'</span>'):'')
             +'<br><span class="n">'+Math.round((e.similarity||0)*100)+'% similar'+(e.page_count?(' · '+e.page_count+' pg'):'')+'</span>'
             +'</a>';
      }
      $('#fplist').innerHTML=html;
    }).catch(function(){ editionsLoaded=0; $('#fplist').innerHTML='<div style="padding:14px;color:#c66;font-size:12px">Could not load editions.</div>'; });
  }
  $('#fpbtn').onclick=function(){ panelMode='parts'; var p=$('#fpanel'); p.classList.add('open'); loadParts(); };
  $('#edbtn').onclick=function(){ panelMode='editions'; var p=$('#fpanel'); p.classList.add('open'); loadEditions(); };
  $('#fpclose').onclick=function(){ $('#fpanel').classList.remove('open'); };
  // #edbtn stays hidden (no dead "0 editions" button on the common case) unless dedup.db actually
  // has a cluster for this document -- checked once, on load, not on every page flip.
  if(doc){
    fetch('/api/editions?doc='+encodeURIComponent(doc)).then(function(r){return r.json();}).then(function(j){
      if(j&&j.editions&&j.editions.length){ $('#edbtn').style.display=''; $('#edbtn').textContent='📚 Editions ('+j.editions.length+')'; }
    }).catch(function(){});
  }

  // ---- symbol detection + crop-and-save template tool (GET/POST /api/symbols*, symbols.py) --
  // the missing half of symbols.py the audit found: detect() was always fully built and self-
  // tested, but nothing in the app could ever get a template image into index/symbols/ in the
  // first place. Drag a box on a STATIC page render (its own dedicated /api/symbols_page_image,
  // not the live DeepZoom tile viewer -- avoids reasoning about that viewer's own zoom/pan
  // transform state; this modal is a simple, always-correct fixed-scale image instead). ----
  var SYM_DPI=150, symScaleX=1, symScaleY=1, symSel=null, symHits=[];
  function symResizeCanvas(){
    var img=$('#symimg'), cv=$('#symcanvas');
    cv.width=img.clientWidth; cv.height=img.clientHeight;
    cv.style.width=img.clientWidth+'px'; cv.style.height=img.clientHeight+'px';
    symScaleX=img.clientWidth/(img.naturalWidth||1);
    symScaleY=img.clientHeight/(img.naturalHeight||1);
    symRedraw();
  }
  function symRedraw(){
    var cv=$('#symcanvas'); if(!cv||!cv.getContext) return;
    var ctx=cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='#3ecf8e'; ctx.lineWidth=2;
    for(var i=0;i<symHits.length;i++){ var s=symHits[i];
      ctx.strokeRect(s.x*symScaleX, s.y*symScaleY, s.w*symScaleX, s.h*symScaleY);
    }
    if(symSel){
      ctx.strokeStyle='#7fbfff'; ctx.setLineDash([4,3]);
      ctx.strokeRect(Math.min(symSel.x0,symSel.x1), Math.min(symSel.y0,symSel.y1),
                     Math.abs(symSel.x1-symSel.x0), Math.abs(symSel.y1-symSel.y0));
      ctx.setLineDash([]);
    }
  }
  function symLoadDetections(){
    if(!doc) return;
    fetch('/api/symbols?doc='+encodeURIComponent(doc)+'&page='+page+'&dpi='+SYM_DPI).then(function(r){return r.json();}).then(function(j){
      symHits=(j&&j.symbols)||[]; symRedraw();
      $('#symstatus').textContent=symHits.length?(symHits.length+' match'+(symHits.length===1?'':'es')+' with existing templates.'):'';
    }).catch(function(){});
  }
  function symOpenModal(){
    if(!doc) return;
    $('#symmodal').style.display='block';
    $('#symstatus').textContent='Loading…'; symSel=null; symHits=[];
    var img=$('#symimg');
    img.onload=function(){ symResizeCanvas(); symLoadDetections(); };
    img.onerror=function(){ $('#symstatus').textContent='Could not render this page.'; };
    img.src='/api/symbols_page_image?doc='+encodeURIComponent(doc)+'&page='+page+'&dpi='+SYM_DPI+'&_='+Date.now();
  }
  $('#symbtn').onclick=symOpenModal;
  $('#symclose').onclick=function(){ $('#symmodal').style.display='none'; };
  (function(){
    var cv=$('#symcanvas'), dragging=false;
    function pos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
    cv.addEventListener('mousedown', function(e){ var p=pos(e); dragging=true; symSel={x0:p.x,y0:p.y,x1:p.x,y1:p.y}; symRedraw(); });
    cv.addEventListener('mousemove', function(e){ if(!dragging) return; var p=pos(e); symSel.x1=p.x; symSel.y1=p.y; symRedraw(); });
    window.addEventListener('mouseup', function(){ dragging=false; });
  })();
  $('#symsave').onclick=function(){
    if(!symSel){ $('#symstatus').textContent='Drag a box on the image first.'; return; }
    var name=($('#symname').value||'').trim();
    if(!name){ $('#symstatus').textContent='Name the template first.'; return; }
    var x0=Math.min(symSel.x0,symSel.x1), y0=Math.min(symSel.y0,symSel.y1);
    var w=Math.abs(symSel.x1-symSel.x0), hgt=Math.abs(symSel.y1-symSel.y0);
    if(w<6||hgt<6){ $('#symstatus').textContent='That selection is too small.'; return; }
    var nx=Math.round(x0/symScaleX), ny=Math.round(y0/symScaleY);
    var nw=Math.round(w/symScaleX), nh=Math.round(hgt/symScaleY);
    $('#symstatus').textContent='Saving…';
    fetch('/api/symbols_template',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({doc:doc,page:page,dpi:SYM_DPI,x:nx,y:ny,w:nw,h:nh,name:name})})
      .then(function(r){return r.json();}).then(function(j){
        if(!j||j.ok!==true){ $('#symstatus').textContent=(j&&j.error)||'Save failed.'; return; }
        $('#symstatus').textContent='Saved "'+j.name+'".';
        $('#symname').value=''; symSel=null;
        symLoadDetections();
      }).catch(function(){ $('#symstatus').textContent='Save failed.'; });
  };

  mount();
})();
</script>
<script src="/palette.js"></script>
</body></html>
