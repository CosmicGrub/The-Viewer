<text x="66" y="334" font-size="9.2" font-weight="400" fill="#e6e9ee" text-anchor="start">procedures_feature._parse_procedure now also pulls MATERIALS / CONSUMABLES and referenced manuals</text><text x="66" y="347" font-size="9.2" font-weight="400" fill="#e6e9ee" text-anchor="start">(TM/WP/LO/TB/TC) —</text>
<text x="70" y="365" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">additive keys, so /procedure benefits too. Digit-anchored regex: &#x27;LOCKWASHER&#x27;/&#x27;LOOSEN&#x27; no longer false-match</text><text x="70" y="378" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">as refs.</text>
