<svg viewBox="0 0 1180 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1180" height="520" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/><text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Structured-table extraction — jump straight to the spec numbers   v1.1.1</text><line x1="40" y1="70" x2="1140" y2="70" stroke="#2b333f"/><rect x="40" y="92" width="260" height="156" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="92" width="6" height="156" rx="3" fill="#4f9dff"/><text x="60" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📄  PDF page</text><circle cx="64" cy="133" r="3" fill="#4f9dff"/><text x="76" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Every page of every manual</text><circle cx="64" cy="147" r="3" fill="#4f9dff"/><text x="76" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Ruled tables detected by geometry</text><circle cx="64" cy="161" r="3" fill="#4f9dff"/><text x="76" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Read-only on the corpus (R1)</text><rect x="56" y="218" width="228" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="233" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">SOURCE</text><rect x="320" y="92" width="300" height="156" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="320" y="92" width="6" height="156" rx="3" fill="#1d9e75"/><text x="340" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  PyMuPDF find_tables</text><circle cx="344" cy="133" r="3" fill="#1d9e75"/><text x="356" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Recovers cells → rows/cols</text><circle cx="344" cy="147" r="3" fill="#1d9e75"/><text x="356" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">RPSTL · torque · PMCS grids</text><circle cx="344" cy="161" r="3" fill="#1d9e75"/><text x="356" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Leading-particulars / SPEC tables</text><circle cx="344" cy="175" r="3" fill="#1d9e75"/><text x="356" y="178" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Degrades to [] if fitz absent</text><rect x="336" y="218" width="268" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="346" y="233" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">tables.extract_page()</text><rect x="640" y="92" width="250" height="156" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="640" y="92" width="6" height="156" rx="3" fill="#caa24a"/><text x="660" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📐  _units_in() via measures</text><circle cx="664" cy="133" r="3" fill="#caa24a"/><text x="676" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Flatten cells → run measures</text><circle cx="664" cy="147" r="3" fill="#caa24a"/><text x="676" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">If cells carry units → SPEC table</text><circle cx="664" cy="161" r="3" fill="#caa24a"/><text x="676" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Records which dimension types</text><rect x="656" y="218" width="218" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="666" y="233" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">SPEC FLAG</text><rect x="910" y="92" width="230" height="156" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="910" y="92" width="6" height="156" rx="3" fill="#7f77dd"/><text x="930" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🗂  /api/tables + tables.db</text><circle cx="934" cy="133" r="3" fill="#7f77dd"/><text x="946" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">On-the-fly per doc+page</text><circle cx="934" cy="147" r="3" fill="#7f77dd"/><text x="946" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">BUILD-TABLES.bat → sidecar</text><circle cx="934" cy="161" r="3" fill="#7f77dd"/><text x="946" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Append-only (R1/R6)</text><rect x="926" y="218" width="198" height="22" rx="6" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/><text x="936" y="233" font-size="8.8" font-weight="700" fill="#7f77dd" text-anchor="start">OUTPUT</text><path d="M300 170 L320 170" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M620 170 L640 170" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M890 170 L910 170" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9aa6b6"/></marker></defs><line x1="40" y1="268" x2="1140" y2="268" stroke="#2b333f"/><text x="40" y="296" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">Worked example — a spec table becomes queryable numbers</text><rect x="40" y="310" width="520" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><text x="60" y="336" font-size="11" font-weight="700" fill="#e6e9ee" text-anchor="start">ITEM</text><text x="320" y="336" font-size="11" font-weight="700" fill="#e6e9ee" text-anchor="start">DIMENSION</text><text x="440" y="336" font-size="11" font-weight="700" fill="#e6e9ee" text-anchor="start">UNIT</text><text x="60" y="362" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Overall length</text><text x="320" y="362" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">180</text><text x="440" y="362" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">in</text><text x="60" y="388" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Curb weight</text><text x="320" y="388" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">5200</text><text x="440" y="388" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">lb</text><text x="60" y="448" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">→ flagged SPEC · units {length, weight}</text><rect x="600" y="310" width="540" height="150" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/><text x="618" y="336" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Why it matters: dimensional data in TMs lives in leading-particulars / specification tables that OCR flattens into</text><text x="618" y="351" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">unstructured text. Recovering the table structure — and flagging the ones that carry units — lets a mechanic land</text><text x="618" y="366" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">directly on the numbers instead of reading prose. Pairs with /measures.</text><text x="40" y="496" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">Additive &amp; rollbackable (R1). Self-test extracts a 3×3 spec table and flags it (host-side) — PASS.</text></svg>