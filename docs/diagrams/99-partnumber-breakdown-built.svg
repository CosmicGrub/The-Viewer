<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="620" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Part-number → breakdown image (BUILT)  v0.78.0</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Search a part number; get its exact item, FLIS-validated name, and the correlative breakdown image up top.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="208" height="66" rx="10" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="52" y="130" font-size="10.5" font-weight="700" fill="#4f9dff" text-anchor="start">type a part #</text>
<text x="52" y="146" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">12420572-010 (or -010X)</text>
<text x="250" y="144" font-size="13" font-weight="700" fill="#9aa6b6" text-anchor="start">→</text>
<rect x="262" y="108" width="208" height="66" rx="10" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="274" y="130" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">RPSTL row</text>
<text x="274" y="146" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">parsed: item7·SMR·NSN·CAGEC</text>
<text x="472" y="144" font-size="13" font-weight="700" fill="#9aa6b6" text-anchor="start">→</text>
<rect x="484" y="108" width="208" height="66" rx="10" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="496" y="130" font-size="10.5" font-weight="700" fill="#2f7d4f" text-anchor="start">FLIS validate</text>
<text x="496" y="146" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">→ HOSE,NONMETALLIC</text>
<text x="694" y="144" font-size="13" font-weight="700" fill="#9aa6b6" text-anchor="start">→</text>
<rect x="706" y="108" width="208" height="66" rx="10" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="718" y="130" font-size="10.5" font-weight="700" fill="#7f77dd" text-anchor="start">breakdown image</text>
<text x="718" y="146" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">/figcrop of FIG 12</text>
<text x="916" y="144" font-size="13" font-weight="700" fill="#9aa6b6" text-anchor="start">→</text>
<rect x="928" y="108" width="208" height="66" rx="10" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="940" y="130" font-size="10.5" font-weight="700" fill="#caa24a" text-anchor="start">🎯 zoom to item</text>
<text x="940" y="146" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">callout crop (gated)</text>
<text x="40" y="196" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">What was built (your four tiers)</text>
<rect x="40" y="208" width="360" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="208" width="6" height="176" rx="3" fill="#2f7d4f"/><text x="60" y="232" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🧱  T1 · RPSTL row parser</text><circle cx="64" cy="249" r="3" fill="#2f7d4f"/><text x="76" y="252" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">item/SMR/NSN/CAGEC/PART#/nomen/qty, confidence-scored.</text><circle cx="64" cy="263" r="3" fill="#2f7d4f"/><text x="76" y="266" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Codes excluded from the name -&gt; clean nomenclature.</text><circle cx="64" cy="277" r="3" fill="#2f7d4f"/><text x="76" y="280" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Variant grouping (-010 ↔ -010X). Sidecar rpstl.db.</text><rect x="56" y="354" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="369" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Verified on your example.</text>
<rect x="412" y="208" width="360" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="208" width="6" height="176" rx="3" fill="#1d9e75"/><text x="432" y="232" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔗  T2 · FLIS validate</text><circle cx="436" cy="249" r="3" fill="#1d9e75"/><text x="448" y="252" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">NSN -&gt; official INC name from PUB LOG (ref_nsn).</text><circle cx="436" cy="263" r="3" fill="#1d9e75"/><text x="448" y="266" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Repairs OCR: &#x27;HOSE NONMET&#x27; -&gt; &#x27;HOSE,NONMETALLIC&#x27;.</text><circle cx="436" cy="277" r="3" fill="#1d9e75"/><text x="448" y="280" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;WSHR&#x27; -&gt; &#x27;WASHER,LOCK&#x27;. CAGEC disambiguates makers.</text><rect x="428" y="354" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="369" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Accuracy lever, verified.</text>
<rect x="784" y="208" width="356" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="208" width="6" height="176" rx="3" fill="#caa24a"/><text x="804" y="232" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🎯  T3 · Callout (gated)</text><circle cx="808" cy="249" r="3" fill="#caa24a"/><text x="820" y="252" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">OCR the figure for the item-number balloon.</text><circle cx="808" cy="263" r="3" fill="#caa24a"/><text x="820" y="266" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Crop tight ONLY when found unambiguously.</text><circle cx="808" cy="277" r="3" fill="#caa24a"/><text x="820" y="280" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Else -&gt; whole-figure fallback. Never a wrong crop.</text><rect x="800" y="354" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="369" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Tight when sure, safe always.</text>
<rect x="40" y="398" width="540" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="398" width="6" height="150" rx="3" fill="#7f77dd"/><text x="60" y="422" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  T4 · Part-number-first UX</text><circle cx="64" cy="439" r="3" fill="#7f77dd"/><text x="76" y="442" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Search a part# -&gt; &#x27;PART NUMBER MATCH&#x27; card with the</text><circle cx="64" cy="453" r="3" fill="#7f77dd"/><text x="76" y="456" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">breakdown image, name, NSN→dossier, item/CAGEC/FIG,</text><circle cx="64" cy="467" r="3" fill="#7f77dd"/><text x="76" y="470" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">🎯 zoom-to-item / 🖼 whole-figure toggle.</text><rect x="56" y="518" width="508" height="22" rx="6" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/><text x="66" y="533" font-size="8.8" font-weight="700" fill="#7f77dd" text-anchor="start">The image displays directly.</text>
<rect x="596" y="398" width="544" height="150" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="614" y="420" font-size="11.5" font-weight="700" fill="#4f9dff" text-anchor="start">Review queue + override</text>
<text x="614" y="440" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Low-confidence rows get an inline ✎ Fix this match (correct the name/NSN) -&gt; append-only</text><text x="614" y="452" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">rpstl_override.json, which wins on the next search. GET /api/rpstl_review lists them. Nothing</text><text x="614" y="464" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">silently wrong.</text>
<text x="614" y="512" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Build it: BUILD-RPSTL.bat (host) → index/rpstl.db. Then search a part number.</text>
<text x="40" y="614" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.78.0 · 2026-06-03 · rpstl_feature.py · build_rpstl.py · /api/part_by_number · /api/callout_crop. Additive (R1/R6).</text>
</svg>