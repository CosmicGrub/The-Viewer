<text x="344" y="190" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">server renders ONLY that sub-rectangle</text><text x="344" y="202" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">of the real page</text>
<path d="M582,202 L594,202" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="604" y="150" width="250" height="104" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="616" y="172" font-size="10.2" font-weight="700" fill="#e6e9ee" text-anchor="start">3 · PyMuPDF get_pixmap(clip,dpi)</text>
<text x="616" y="190" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">~21x more pixels for the region vs a</text><text x="616" y="202" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">stretched 130-dpi crop</text>
<path d="M854,202 L866,202" stroke="#4f9dff" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="876" y="150" width="250" height="104" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="888" y="172" font-size="10.2" font-weight="700" fill="#e6e9ee" text-anchor="start">4 · 1:1 crisp crop in the loupe</text>
<text x="888" y="190" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">no CSS upscaling — fidelity increases as</text><text x="888" y="202" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">you zoom</text>
<text x="60" y="268" font-size="9" font-weight="400" fill="#2f7d4f" text-anchor="start">Grounded: it&#x27;s the same drawing re-rasterised at higher resolution (vector pages gain true detail; scans get best honest interpolation — nothing invented).</text>
<text x="56" y="300" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">2 · CORRELATIONS CONNECTED (additive sidecar — viewer.db untouched)</text>
