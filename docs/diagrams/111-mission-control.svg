<svg viewBox="0 0 1180 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="700" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Mission control: coverage · locator · doctor   v0.99.6</text>
<text x="40" y="70" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Turn the enrichment batches into things you can SEE and USE — measure the corpus, jump to any part&#x27;s figures, and health-check the whole system.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="118" width="366" height="150" rx="11" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="56" y="142" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="start">📊 /coverage</text>
<text x="56" y="166" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">coverage.py + /api/coverage.</text>
<text x="56" y="181" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">One roll-up: OCR% · CAD% ·</text>
<text x="56" y="196" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">vectorized% · schematic netlists ·</text>
<text x="56" y="211" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">models · figure crops · sidecar</text>
<text x="56" y="226" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">health. KPI bars + cards.</text>
<text x="56" y="241" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">Verified vs a synthetic index.</text>
<rect x="412" y="118" width="366" height="150" rx="11" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="428" y="142" font-size="13" font-weight="700" fill="#caa24a" text-anchor="start">🧭 /locate</text>
<text x="428" y="166" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">partlocate.py + /api/partlocate.</text>
<text x="428" y="181" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;Where does this part show up?&#x27;</text>
<text x="428" y="196" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">NSN/PN/name -&gt; every figure &amp;</text>
<text x="428" y="211" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">page that calls it out, deduped,</text>
<text x="428" y="226" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">with Deep-Zoom / Vector / open</text>
<text x="428" y="241" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">links. Verified: 3 hits / 2 docs.</text>
<rect x="784" y="118" width="366" height="150" rx="11" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="800" y="142" font-size="13" font-weight="700" fill="#1d9e75" text-anchor="start">🩺 DOCTOR.bat</text>
<text x="800" y="166" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">doctor.py: deps, CORPUS-PATH</text>
<text x="800" y="181" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">reachability (the #1 migration</text>
<text x="800" y="196" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">trap), coverage, cache counts,</text>
<text x="800" y="211" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">disk free, recent errors -&gt;</text>
<text x="800" y="226" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">docs/doctor_report.txt.</text>
<text x="800" y="241" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">Great before/after a move.</text>
<line x1="40" y1="288" x2="1140" y2="288" stroke="#2b333f"/>
<text x="40" y="316" font-size="13" font-weight="700" fill="#4f9dff" text-anchor="start">HOW IT TIES TOGETHER</text>
<rect x="40" y="330" width="1100" height="96" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="354" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">The batches (OCR, CAD, schemgraph, vectorize) each write a sidecar + coverage file. /coverage reads them all into one picture. /locate reads the parts index to send you straight to a part&#x27;s figures — which you then Deep-Zoom</text><text x="58" y="369" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">or Vectorize. DOCTOR checks the whole thing is healthy AND that the corpus is still reachable after a move. All read-only, sidecar-only (R1/R6).</text>
<line x1="40" y1="442" x2="1140" y2="442" stroke="#2b333f"/>
<text x="40" y="470" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED / R1</text>
<rect x="40" y="484" width="1100" height="96" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<circle cx="56" cy="503" r="2.6" fill="#2f7d4f"/>
<text x="66" y="506" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">coverage.py / partlocate.py logic-tested in-sandbox on synthetic indexes (percentages + dedup correct).</text>
<circle cx="56" cy="520" r="2.6" fill="#2f7d4f"/>
<text x="66" y="523" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">coverage.html + locate.html pass node --check (added to verify_ui.py); new modules added to VERIFY-099.bat.</text>
<circle cx="56" cy="537" r="2.6" fill="#2f7d4f"/>
<text x="66" y="540" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">doctor.py parses; dep + corpus-path helpers verified. Route registrations pending the host suite (mount truncation).</text>
<circle cx="56" cy="554" r="2.6" fill="#2f7d4f"/>
<text x="66" y="557" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Additive &amp; rollbackable: 3 modules + 3 pages + 4 read-only routes + DOCTOR.bat. Nothing writes the index.</text>
<text x="40" y="690" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Markup. Dark (R3). v0.99.6 · 2026-07-01 · coverage.py //coverage · partlocate.py //locate · doctor.py/DOCTOR.bat. Read-only. R1/R6.</text>
</svg>