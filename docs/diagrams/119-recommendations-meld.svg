<svg viewBox="0 0 1180 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="720" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">All recommendations + the meld   v0.99.15</text>
<text x="40" y="70" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Five recommendations shipped, then proven to fit together: every cross-link a feature emits resolves to a real route, and a fuzz-found crash was fixed.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="116" width="272" height="150" rx="11" fill="#171d26" stroke="#e0564f" stroke-width="1"/>
<text x="53" y="138" font-size="11.5" font-weight="700" fill="#e0564f" text-anchor="start">#2 Fuzz render/vectorize</text>
<text x="53" y="160" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Extended fuzz to vectorize_image.</text>
<text x="53" y="175" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">FOUND a real crash: thin image +</text>
<text x="53" y="190" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">small max_dim → cv2.resize(0).</text>
<text x="53" y="205" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Fixed max(1,int()); reproved 9,000</text>
<text x="53" y="220" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">cases incl. max_dim=1. New invariant.</text>
<rect x="318" y="116" width="272" height="150" rx="11" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="331" y="138" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">#3 Per-part look-alike</text>
<text x="331" y="160" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">jobcard._flag_lookalikes marks</text>
<text x="331" y="175" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">parts that are look-alike variants;</text>
<text x="331" y="190" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">⚠ + /partdiff compare link in the</text>
<text x="331" y="205" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">builder + PDF. Agrees with the cover</text>
<text x="331" y="220" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">warning (silent on format-drift).</text>
<rect x="596" y="116" width="272" height="150" rx="11" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="609" y="138" font-size="11.5" font-weight="700" fill="#1d9e75" text-anchor="start">#4 Drag-drop ingest</text>
<text x="609" y="160" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">/ingest drop-zone + folder detect</text>
<text x="609" y="175" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">(webkitGetAsEntry) + Recent paths.</text>
<text x="609" y="190" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Honest to the server-path model —</text>
<text x="609" y="205" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">no upload subsystem, corpus stays</text>
<text x="609" y="220" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">read-only (R1/R6).</text>
<rect x="874" y="116" width="272" height="150" rx="11" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="887" y="138" font-size="11.5" font-weight="700" fill="#4f9dff" text-anchor="start">#5 Accessibility (WCAG AA)</text>
<text x="887" y="160" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">:focus-visible everywhere (base.css).</text>
<text x="887" y="175" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Palette: listbox/option ARIA,</text>
<text x="887" y="190" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">aria-activedescendant, focus return,</text>
<text x="887" y="205" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">keyboard-operable pill. aria-hidden</text>
<text x="887" y="220" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">on decorative icons.</text>
<line x1="40" y1="282" x2="1140" y2="282" stroke="#2b333f"/>
<text x="40" y="310" font-size="13" font-weight="700" fill="#7fbfff" text-anchor="start">CONGRUENCY — do the pieces mesh? (test_congruency.py)</text>
<rect x="40" y="324" width="1100" height="128" rx="12" fill="#171d26" stroke="#7fbfff" stroke-width="1.3"/>
<circle cx="56" cy="345" r="2.5" fill="#7fbfff"/>
<text x="66" y="348" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Every cross-link a feature emits must resolve to a route the app actually serves — no dangling references as features multiply.</text>
<circle cx="56" cy="364" r="2.5" fill="#7fbfff"/>
<text x="66" y="367" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">figureparts → /dossier, /locate · jobcard part rows → /partdiff, /dossier · palette&#x27;s 22 destinations → real routes/pages.</text>
<circle cx="56" cy="383" r="2.5" fill="#7fbfff"/>
<text x="66" y="386" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">look-alike WARNING (cover) and per-part FLAG use the same &#x27;real difference&#x27; gate — verified they agree (and both stay silent on format-drift).</text>
<circle cx="56" cy="402" r="2.5" fill="#7fbfff"/>
<text x="66" y="405" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">VERIFIED in-sandbox: figureparts links all resolve; all 22 palette destinations resolve; 0 dangling. (full check runs host-side.)</text>
<line x1="40" y1="468" x2="1140" y2="468" stroke="#2b333f"/>
<text x="40" y="496" font-size="13" font-weight="700" fill="#caa24a" text-anchor="start">R9 — NO-TRUNCATION GATE (new standing rule, this project only)</text>
<rect x="40" y="510" width="1100" height="92" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="58" y="534" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">The sandbox mount truncates / stale-caches / null-pads grown host files, so &#x27;it parsed in the sandbox&#x27; is unreliable here. R9: always verify completeness mechanically — a tail sentinel on every generated file + verify_complete.py,</text><text x="58" y="549" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">run HOST-side (bundled into engine/tools/notrunc/ and VERIFY-099.bat) where the files are whole, or via the host-authoritative Read tool. This session that discipline caught the &#x27;# -- END --&#x27; false-tail and confirmed the real files</text><text x="58" y="564" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">are complete.</text>
<line x1="40" y1="618" x2="1140" y2="618" stroke="#2b333f"/>
<text x="40" y="646" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">R1 · all additive: 1 one-line crash fix + 4 feature melds + 1 congruency test + the R9 gate. Nothing writes the index. Read-only, rollbackable.</text>
<text x="40" y="712" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Markup. Dark (R3). v0.99.15 · 2026-07-01 · vectorize fix · jobcard look-alike · ingest drop · a11y · test_congruency · R9. R1/R6.</text>
</svg>