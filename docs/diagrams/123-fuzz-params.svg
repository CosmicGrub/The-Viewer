<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="640" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Hardening the front door — fuzz the param validator   v0.99.19</text>
<text x="40" y="70" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Every route parses user query params through registry.qstr/qint/qflag. Contract: bad input → 400, NEVER a 500. Proved it holds under 878k adversarial cases.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="40" y="114" font-size="13" font-weight="700" fill="#4f9dff" text-anchor="start">THE GUARANTEE</text>
<rect x="40" y="128" width="340" height="118" rx="11" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="55" y="152" font-size="12.5" font-weight="700" fill="#caa24a" text-anchor="start">adversarial query</text>
<text x="55" y="174" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">?n=abc  ?limit=9…40 digits</text>
<text x="55" y="189" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">?doc=- 5  ?page=٣ (unicode)</text>
<text x="55" y="204" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">?x=1_000  ?q=1;DROP TABLE</text>
<text x="55" y="219" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">empty / [None] / multi-value</text>
<rect x="410" y="128" width="340" height="118" rx="11" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="425" y="152" font-size="12.5" font-weight="700" fill="#1d9e75" text-anchor="start">qstr / qint / qflag</text>
<text x="425" y="174" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">central param parsing +</text>
<text x="425" y="189" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">clamping (lo/hi, ABS_MAX).</text>
<text x="425" y="204" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">int() guarded; type coerced.</text>
<rect x="780" y="128" width="340" height="118" rx="11" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="795" y="152" font-size="12.5" font-weight="700" fill="#2f7d4f" text-anchor="start">ParamError → 400</text>
<text x="795" y="174" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">malformed input becomes a</text>
<text x="795" y="189" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">clean 400 — the server never</text>
<text x="795" y="204" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">throws an uncontrolled 500.</text>
<line x1="382" y1="187" x2="408" y2="187" stroke="#1d9e75" stroke-width="2" marker-end="url(#a)"/>
<line x1="752" y1="187" x2="778" y2="187" stroke="#1d9e75" stroke-width="2" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d9e75"/></marker></defs>
<line x1="40" y1="272" x2="1140" y2="272" stroke="#2b333f"/>
<text x="40" y="300" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="start">RESULT</text>
<rect x="40" y="314" width="545" height="108" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="60" y="352" font-size="32" font-weight="700" fill="#7fd8b6" text-anchor="start">878,583</text>
<text x="60" y="374" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">adversarial cases · 0 leaks (nothing but ParamError escaped)</text>
<text x="60" y="396" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">qint always returns a bounded int · qstr str-or-None · qflag bool. No user input can 500 the server.</text>
<text x="604" y="300" font-size="13" font-weight="700" fill="#4f9dff" text-anchor="start">WHY IT MATTERS</text>
<rect x="604" y="314" width="536" height="108" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="622" y="344" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">This is an OFFLINE search engine that takes arbitrary NSNs, part numbers and free text from mechanics. The param front door being crash-proof means a fat-fingered query, a copy-paste with junk, or a malformed link degrades to a</text><text x="622" y="358" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">clean 400 message — never a stack-trace / 500. That&#x27;s the &#x27;above military grade&#x27; robustness bar applied to the input layer.</text>
<line x1="40" y1="438" x2="1140" y2="438" stroke="#2b333f"/>
<text x="40" y="466" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">R1 · test-only; no product code touched. Guarded (skips if module absent). Runs host-side (VERIFY-099 smoke + RUN-HARDENING full). R9 sentinel intact.</text>
<text x="40" y="632" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Markup. Dark (R3). v0.99.19 · 2026-07-01 · test_property_fuzz.py + registry qstr/qint/qflag. Read-only. R1/R6.</text>
</svg>