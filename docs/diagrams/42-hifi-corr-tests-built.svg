<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect x="0" y="0" width="1180" height="860" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="20" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — Hi-fi loupe · correlations · pillar + mutation tests  (v0.28.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">The loupe now re-rasterises the REAL page region at high DPI (sharp at any zoom). Correlations the flat tables implied are connected in a deletable sidecar. The pillars are tested + mutation-checked.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="56" y="116" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">1 · HIGH-FIDELITY LOUPE (server clip render)</text>
<rect x="40" y="126" width="1100" height="148" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="60" y="150" width="250" height="104" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="72" y="172" font-size="10.2" font-weight="700" fill="#e6e9ee" text-anchor="start">1 · Cursor over page</text>
<text x="72" y="190" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">UI computes a normalized box</text><text x="72" y="202" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">(x0,y0,x1,y1) around the cursor</text>
