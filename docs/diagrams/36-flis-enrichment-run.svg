<text x="58" y="466" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">468 of ~501 cover/end-item NSNs were matched. The thousands of individual RPSTL part NSNs aren&#x27;t extracted on viewer.db yet — run `parts` on the full index, then re-run enrich</text><text x="58" y="479" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">--publog-dir to fill those too. Productized as enrich_flis() for monthly re-runs.</text>
