<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1180" height="560" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/><text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Measurements &amp; dimensions — pull every measured value out of the text   v1.1.0</text><line x1="40" y1="70" x2="1140" y2="70" stroke="#2b333f"/><rect x="40" y="92" width="250" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="92" width="6" height="150" rx="3" fill="#4f9dff"/><text x="60" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📄  Text layer (already indexed)</text><circle cx="64" cy="133" r="3" fill="#4f9dff"/><text x="76" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Native PDF text (born-digital)</text><circle cx="64" cy="147" r="3" fill="#4f9dff"/><text x="76" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">OCR layer (scanned pages)</text><circle cx="64" cy="161" r="3" fill="#4f9dff"/><text x="76" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">No new scan needed — reuse FTS</text><rect x="56" y="212" width="218" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="227" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">SOURCE · read-only (R1)</text><rect x="310" y="92" width="300" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="310" y="92" width="6" height="150" rx="3" fill="#1d9e75"/><text x="330" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📐  measures.extract()</text><circle cx="334" cy="133" r="3" fill="#1d9e75"/><text x="346" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">One tolerant regex over the text</text><circle cx="334" cy="147" r="3" fill="#1d9e75"/><text x="346" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Captures value · range X–Y · tol X±Y</text><circle cx="334" cy="161" r="3" fill="#1d9e75"/><text x="346" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Unit ordering: ft-lb&gt;ft, in-lb&gt;in, N-m&gt;N</text><circle cx="334" cy="175" r="3" fill="#1d9e75"/><text x="346" y="178" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">13 dimension types classified</text><rect x="326" y="212" width="268" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="336" y="227" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">PURE · regex · deterministic</text><rect x="630" y="92" width="250" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="630" y="92" width="6" height="150" rx="3" fill="#caa24a"/><text x="650" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🏷  Per-hit record</text><circle cx="654" cy="133" r="3" fill="#caa24a"/><text x="666" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">type · unit (canonical) · value(s)</text><circle cx="654" cy="147" r="3" fill="#caa24a"/><text x="666" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">tolerance · raw · context sentence</text><circle cx="654" cy="161" r="3" fill="#caa24a"/><text x="666" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">cited PAGE + doc + vehicle</text><rect x="646" y="212" width="218" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="656" y="227" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">STRUCTURED</text><rect x="900" y="92" width="240" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="900" y="92" width="6" height="150" rx="3" fill="#7f77dd"/><text x="920" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🖥  /measures + /api/measures</text><circle cx="924" cy="133" r="3" fill="#7f77dd"/><text x="936" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Grouped + filterable by type</text><circle cx="924" cy="147" r="3" fill="#7f77dd"/><text x="936" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Each links to its cited page</text><circle cx="924" cy="161" r="3" fill="#7f77dd"/><text x="936" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Live over FTS — no build step</text><rect x="916" y="212" width="208" height="22" rx="6" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/><text x="926" y="227" font-size="8.8" font-weight="700" fill="#7f77dd" text-anchor="start">OFFLINE UI</text><path d="M290 167 L310 167" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M610 167 L630 167" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M880 167 L900 167" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9aa6b6"/></marker></defs><line x1="40" y1="262" x2="1140" y2="262" stroke="#2b333f"/><text x="40" y="290" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">Dimension types covered</text><rect x="40" y="302" width="60" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="48" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">length</text><rect x="108" y="302" width="44" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="116" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">area</text><rect x="160" y="302" width="52" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="168" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">angle</text><rect x="220" y="302" width="60" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="228" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">weight</text><rect x="288" y="302" width="52" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="296" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">force</text><rect x="348" y="302" width="60" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="356" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">torque</text><rect x="416" y="302" width="76" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="424" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">pressure</text><rect x="500" y="302" width="76" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="508" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">capacity</text><rect x="584" y="302" width="92" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="592" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">electrical</text><rect x="684" y="302" width="100" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="692" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">temperature</text><rect x="792" y="302" width="44" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="800" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">flow</text><rect x="844" y="302" width="52" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="852" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">speed</text><rect x="904" y="302" width="76" height="26" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="912" y="319" font-size="10.5" font-weight="700" fill="#1d9e75" text-anchor="start">rotation</text><text x="40" y="366" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">Optional corpus-wide sidecar</text><rect x="40" y="380" width="540" height="96" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/><text x="58" y="406" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">BUILD-MEASURES.bat → build_measures.py walks every page and writes index/measures.db (append-only, read-only on</text><text x="58" y="421" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">viewer.db — R1/R6). Enables fleet-wide browsing/counts, e.g. &#x27;every torque spec across all vehicles&#x27;. Resumable per</text><text x="58" y="436" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">doc.</text><text x="620" y="366" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">The guarantee</text><rect x="620" y="380" width="520" height="96" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/><text x="638" y="406" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Closes the &#x27;especially measurements/dimensional data&#x27; gap: beyond finding the PAGE, the mechanic gets the</text><text x="638" y="421" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">NUMBERS themselves — value, range, tolerance, unit — cited and machine-checkable. Full map in</text><text x="638" y="436" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">docs/EXTRACTION-COVERAGE.md.</text><text x="40" y="512" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">Additive &amp; rollbackable (R1). Self-test: 19 measurements across all target types — PASS.</text></svg>