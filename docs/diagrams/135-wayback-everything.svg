<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1200" height="620" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/><text x="40" y="46" font-size="17" font-weight="700" fill="#e6e9ee" text-anchor="start">Route every link through the Wayback Machine — harvest missing dimensions from many sources   v1.1.3</text><text x="40" y="64" font-size="11" font-weight="400" fill="#caa24a" text-anchor="start">Corpus stays authoritative · app stays offline (network only in the opt-in ENRICH.bat crawler)</text><line x1="40" y1="80" x2="1160" y2="80" stroke="#2b333f"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9aa6b6"/></marker></defs><text x="40" y="106" font-size="12.5" font-weight="700" fill="#7fbfff" text-anchor="start">① Many link sources (per gap subject)</text><rect x="40" y="116" width="330" height="96" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="116" width="6" height="96" rx="3" fill="#1d9e75"/><text x="60" y="140" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🗄  Internet Archive full-text</text><circle cx="64" cy="157" r="3" fill="#1d9e75"/><text x="76" y="160" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">ia_search → item text (djvu)</text><circle cx="64" cy="171" r="3" fill="#1d9e75"/><text x="76" y="174" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">high-yield, text pulled directly</text><rect x="56" y="182" width="298" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="66" y="197" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">SOURCE A</text><rect x="40" y="220" width="330" height="96" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="220" width="6" height="96" rx="3" fill="#7f77dd"/><text x="60" y="244" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  Web search (optional plugin)</text><circle cx="64" cy="261" r="3" fill="#7f77dd"/><text x="76" y="264" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">enrich_search.py: search()→[urls]</text><circle cx="64" cy="275" r="3" fill="#7f77dd"/><text x="76" y="278" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">DuckDuckGo/Bing/… host-supplied</text><rect x="56" y="286" width="298" height="22" rx="6" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/><text x="66" y="301" font-size="8.8" font-weight="700" fill="#7f77dd" text-anchor="start">SOURCE B</text><rect x="40" y="324" width="330" height="96" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="324" width="6" height="96" rx="3" fill="#caa24a"/><text x="60" y="348" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📌  Your seed list</text><circle cx="64" cy="365" r="3" fill="#caa24a"/><text x="76" y="368" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">index/enrich_seeds.txt</text><circle cx="64" cy="379" r="3" fill="#caa24a"/><text x="76" y="382" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;subject | url&#x27; scoped, or global</text><rect x="56" y="390" width="298" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="66" y="405" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">SOURCE C</text><text x="430" y="106" font-size="12.5" font-weight="700" fill="#2f7d4f" text-anchor="start">② The Wayback gate</text><rect x="430" y="116" width="300" height="304" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/><text x="450" y="142" font-size="11.5" font-weight="700" fill="#e6e9ee" text-anchor="start">EVERY link (B + C) is routed</text><text x="450" y="160" font-size="11.5" font-weight="700" fill="#e6e9ee" text-anchor="start">through the Wayback Machine:</text><circle cx="452" cy="183" r="3" fill="#2f7d4f"/><text x="464" y="186" font-size="10.2" font-weight="400" fill="#9aa6b6" text-anchor="start">availability API → closest snapshot</text><circle cx="452" cy="204" r="3" fill="#2f7d4f"/><text x="464" y="207" font-size="10.2" font-weight="400" fill="#9aa6b6" text-anchor="start">if none &amp; --save → Save Page Now</text><circle cx="452" cy="225" r="3" fill="#2f7d4f"/><text x="464" y="228" font-size="10.2" font-weight="400" fill="#9aa6b6" text-anchor="start">fetch archived copy → strip_html</text><circle cx="452" cy="246" r="3" fill="#2f7d4f"/><text x="464" y="249" font-size="10.2" font-weight="400" fill="#9aa6b6" text-anchor="start">→ pinned, permanent archived text</text><rect x="446" y="350" width="268" height="56" rx="8" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="458" y="372" font-size="9.6" font-weight="400" fill="#8fd6ab" text-anchor="start">Result is tied to an archived URL + snapshot</text><text x="458" y="385" font-size="9.6" font-weight="400" fill="#8fd6ab" text-anchor="start">timestamp — reproducible offline forever.</text><text x="770" y="106" font-size="12.5" font-weight="700" fill="#4f9dff" text-anchor="start">③ Extract &amp; record (gap-only)</text><rect x="770" y="116" width="390" height="96" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="770" y="116" width="6" height="96" rx="3" fill="#4f9dff"/><text x="790" y="140" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📐  measures.extract</text><circle cx="794" cy="157" r="3" fill="#4f9dff"/><text x="806" y="160" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Same engine as the corpus path</text><circle cx="794" cy="171" r="3" fill="#4f9dff"/><text x="806" y="174" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">value · range · tolerance · unit · type</text><rect x="786" y="182" width="358" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="796" y="197" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">EXTRACT</text><rect x="770" y="220" width="390" height="96" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="770" y="220" width="6" height="96" rx="3" fill="#7f77dd"/><text x="790" y="244" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🗂  enrich.db (append-only)</text><circle cx="794" cy="261" r="3" fill="#7f77dd"/><text x="806" y="264" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Keeps ONLY missing dimension types</text><circle cx="794" cy="275" r="3" fill="#7f77dd"/><text x="806" y="278" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Provenance: archived URL + orig URL + ts</text><rect x="786" y="286" width="358" height="22" rx="6" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/><text x="796" y="301" font-size="8.8" font-weight="700" fill="#7f77dd" text-anchor="start">RECORD</text><rect x="770" y="324" width="390" height="96" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="770" y="324" width="6" height="96" rx="3" fill="#caa24a"/><text x="790" y="348" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🖥  /measures — badged</text><circle cx="794" cy="365" r="3" fill="#caa24a"/><text x="806" y="368" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;External — unconfirmed&#x27; block</text><circle cx="794" cy="379" r="3" fill="#caa24a"/><text x="806" y="382" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">archived-date link + source domain</text><rect x="786" y="390" width="358" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="796" y="405" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">OFFLINE READ</text><path d="M370 164 L430 250" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M370 268 L430 250" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M370 372 L430 250" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M730 250 L770 164" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M965 212 L965 220" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M965 316 L965 324" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><line x1="40" y1="444" x2="1160" y2="444" stroke="#2b333f"/><text x="40" y="470" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">Live-verified</text><rect x="40" y="482" width="1120" height="96" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/><text x="58" y="508" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Real searches (HMMWV M998, M35A2) returned spec links; the Wayback availability API confirmed an archived snapshot for every one. Pulling one archived HMMWV spec page, the measurement engine recovered 34 measurements — 12 length, 11 weight, 4</text><text x="58" y="523" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">capacity, plus rpm, volts/amps, speed, angle, power — each pinned to its archived source. This is exactly the missing dimensional data the corpus lacks, filled without ever modifying it.</text></svg>