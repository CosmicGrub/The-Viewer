<text x="66" y="558" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">_parse_procedure tested standalone: materials + tools + cautions + steps captured; refs digit-anchored (no &#x27;LOCKWASHER&#x27;); steps-only pages still parse.</text>
