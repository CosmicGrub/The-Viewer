<text x="66" y="396" font-size="9.2" font-weight="400" fill="#e6e9ee" text-anchor="start">jobcard.build_pdf renders a Materials section + a &#x27;Referenced manuals&#x27; line per procedure.</text>
<circle cx="56" cy="411" r="2.4" fill="#4f9dff"/>
<text x="66" y="414" font-size="9.2" font-weight="400" fill="#e6e9ee" text-anchor="start">Cover gets a ⚠ BEFORE YOU START box when same-name parts differ by UOC/CAGEC/SMR/FSC/part-# (not mere format</text><text x="66" y="427" font-size="9.2" font-weight="400" fill="#e6e9ee" text-anchor="start">drift).</text>
