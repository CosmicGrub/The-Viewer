<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="600" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Phase 2 — chapter-level routing in combined manuals  (v0.75.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">A combined -12/-13/-14 is two books in one cover. Now it opens to YOUR side&#x27;s chapters — not page 1 of the whole book.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="40" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">How a combined manual is split</text>
<rect x="40" y="132" width="1100" height="46" rx="8" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="132" width="440" height="46" rx="8" fill="rgba(47,157,99,.18)" stroke="#2f7d4f"/>
<rect x="480" y="132" width="660" height="46" rx="8" fill="rgba(63,182,176,.16)" stroke="#1d9e75"/>
<text x="54" y="152" font-size="10" font-weight="700" fill="#2f7d4f" text-anchor="start">CH 1 — OPERATING INSTRUCTIONS</text>
<text x="54" y="169" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">operator · p.1–48</text>
<text x="494" y="152" font-size="10" font-weight="700" fill="#1d9e75" text-anchor="start">CH 4 UNIT MAINT · CH 5 DIRECT SUPPORT · MAC · RPSTL</text>
<text x="494" y="169" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">mechanic · p.49–end</text>
<rect x="40" y="200" width="360" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="200" width="6" height="176" rx="3" fill="#4f9dff"/><text x="60" y="224" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📖  Detect (OCR headings)</text><circle cx="64" cy="241" r="3" fill="#4f9dff"/><text x="76" y="244" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Combined manuals only.</text><circle cx="64" cy="255" r="3" fill="#4f9dff"/><text x="76" y="258" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Scan OCR&#x27;d page text for CHAPTER/SECTION headings.</text><circle cx="64" cy="269" r="3" fill="#4f9dff"/><text x="76" y="272" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Lexicon -&gt; operator / mechanic / both; build page ranges</text><text x="76" y="283" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">(same-side chapters merge).</text><rect x="56" y="346" width="328" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="361" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">Uses OCR you already have.</text>
<rect x="412" y="200" width="360" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="200" width="6" height="176" rx="3" fill="#2f7d4f"/><text x="432" y="224" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">⚡  Cache + override + fallback</text><circle cx="436" cy="241" r="3" fill="#2f7d4f"/><text x="448" y="244" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Computed once, cached per doc, persisted to</text><text x="448" y="255" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">chapter_sides.json.</text><circle cx="436" cy="266" r="3" fill="#2f7d4f"/><text x="448" y="269" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">chapter_override.json pins a side&#x27;s landing page.</text><circle cx="436" cy="280" r="3" fill="#2f7d4f"/><text x="448" y="283" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">No headings? -&gt; whole-book fallback (never worse).</text><rect x="428" y="346" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="438" y="361" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Constant speed, RPS-safe.</text>
<rect x="784" y="200" width="356" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="200" width="6" height="176" rx="3" fill="#1d9e75"/><text x="804" y="224" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🧭  Route on open (viewer)</text><circle cx="808" cy="241" r="3" fill="#1d9e75"/><text x="820" y="244" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Open a combined manual on your side -&gt; its first chapter.</text><circle cx="808" cy="255" r="3" fill="#1d9e75"/><text x="820" y="258" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">A specific search hit still lands on its exact page.</text><circle cx="808" cy="269" r="3" fill="#1d9e75"/><text x="820" y="272" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Banner: &#x27;also has a Maintenance section -&gt;&#x27; jumps over.</text><rect x="800" y="346" width="324" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="810" y="361" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Land where you work.</text>
<rect x="40" y="392" width="1100" height="72" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="413" font-size="11.5" font-weight="700" fill="#7f77dd" text-anchor="start">Endpoints</text>
<text x="58" y="433" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">GET /api/chapters?doc= (ranges + per-side landing pages) · GET /api/chapter_jump?doc=&amp;side= · POST /api/chapter_override. All read-only on the index (R1/R6); sidecar JSON only.</text>
<rect x="40" y="474" width="1100" height="90" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="495" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED</text>
<text x="58" y="515" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">chapters_feature end-to-end on a fixture: combined -12 with operator (CH 1) + maintenance (CH 4/5) headings -&gt; ranges operator 1–4, mechanic 5–10; landing op=1 / mech=5; non-combined -10 returns</text><text x="58" y="528" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">whole-book; chapter_override to p.6 takes effect. Routes added to the host suite (RUN-ALL-TESTS.bat) — sandbox mount was serving stale reads at build time, so the live route run is host-side.</text>
<text x="40" y="594" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.75.0 · 2026-06-03 · chapters_feature.py · /api/chapters · /api/chapter_jump · viewer banner. Additive (R1/R6).</text>
</svg>