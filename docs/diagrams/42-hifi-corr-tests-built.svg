<text x="60" y="570" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ NSN parse + routing</text>
<text x="330" y="570" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ keyword FTS</text>
