<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Fastener reference — identify a thread   v0.99.22</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Major diameter (in+mm) and threads-per-inch / pitch for common UNC / UNF / ISO metric sizes — exact standard geometry — with links to torque and manual usage.</text>
