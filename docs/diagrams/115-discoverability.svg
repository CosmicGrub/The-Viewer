<text x="66" y="534" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Root cause found by grepping every ui/*.html: palette.js referenced by 0 pages (only mentioned in help.html text).</text>
<circle cx="56" cy="548" r="2.6" fill="#2f7d4f"/>
<text x="66" y="551" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">palette.js read host-authoritatively: 129 lines, IIFE balanced/closed; new commands + /?q= + deep-link handler present.</text>
<circle cx="56" cy="565" r="2.6" fill="#2f7d4f"/>
<text x="66" y="568" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Script includes confirmed on host via the Read tool (jobcard L95, solve L152, …). Sandbox grep lagged (mount cache) — host is truth.</text>
<circle cx="56" cy="582" r="2.6" fill="#2f7d4f"/>
<text x="66" y="585" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">verify_ui.py extended: node --check of palette.js + deepzoom.js added to VERIFY-099.bat (host-side, since the mount truncates grown files).</text>
<circle cx="56" cy="599" r="2.6" fill="#2f7d4f"/>
<text x="66" y="602" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Additive &amp; rollbackable: pure &lt;script&gt; includes + palette rows + one Tools-menu group + one ?q handler. Nothing writes the index (R1/R6).</text>
<text x="40" y="692" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Markup. Dark (R3). v0.99.11 · 2026-07-01 · palette.js revived + wired · Tools menu · /?q= deep-link. Read-only. R1/R6.</text>
