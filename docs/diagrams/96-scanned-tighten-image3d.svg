<text x="610" y="410" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">OBJ cached; index never written</text>
<text x="856" y="408" font-size="13" font-weight="700" fill="#9aa6b6" text-anchor="start">→</text>
<rect x="868" y="372" width="256" height="72" rx="9" fill="#0f1419" stroke="#caa24a" stroke-width="1"/>
<text x="880" y="394" font-size="11" font-weight="700" fill="#caa24a" text-anchor="start">Approximation tab</text>
<text x="880" y="410" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">loaded in WebGL, watermarked</text>
<text x="58" y="466" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Configure: VIEWER_IMG3D_CMD env or engine/image3d_backend.txt · GET/POST /api/image3d · GET /api/image3d_mesh · docs/IMAGE3D-SETUP.md</text>
<rect x="40" y="490" width="1100" height="76" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="511" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED</text>
<text x="58" y="531" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">Scanned crop: image-only synthetic -&gt; OCR caption at y≈372 -&gt; clip top 49%. image→3D scaffold end-to-end: unconfigured returns a setup pointer; a trivial cube backend -&gt; generate runs -&gt; OBJ parsed to</text><text x="58" y="543" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">V=4/F=2 -&gt; mesh_url served. Routes added to RUN-ALL-TESTS.bat. Honest: AI 3D is an approximation, gated + watermarked + off by default.</text>
<text x="40" y="614" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.77.0 · 2026-06-03 · figures_feature (OCR/density) · image3d_experiment.py · /api/image3d(_mesh). Additive (R1/R6).</text>
