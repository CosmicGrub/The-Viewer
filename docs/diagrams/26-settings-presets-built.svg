<text x="594" y="366" font-size="11" font-weight="700" fill="#e6e9ee" text-anchor="start">localStorage &#x27;viewer_settings&#x27;</text>
<text x="594" y="386" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">per device · legacy keys migrated · Reset restores default</text>
<rect x="580" y="416" width="560" height="96" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="596" y="440" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">INVARIANT CORE — untouched</text>
<text x="596" y="460" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">No change to /api/search, /api/request, the index, or the request payload.</text><text x="596" y="474" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">The end-to-end flow (modal → search → cart → tech gate → 104th PDF) runs</text><text x="596" y="488" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">identically. A startup self-check confirms the core controls exist after</text><text x="596" y="502" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">every layout apply.</text>
<text x="40" y="626" font-size="9.6" font-weight="400" fill="#6b7280" text-anchor="start">Verified: presets flip CSS classes only; search + sheet generation unaffected; JS lint clean. Dark (R3) · CHANGELOG 0.18.0 (R4) · visual panel (R5).</text>
