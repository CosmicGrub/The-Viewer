<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="560" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">PLAN — schematic highlighter mode (clickable schematics)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">A schematic is only clickable if it carries structure. Probed 40 schematics: ~45% vector · ~38% raster scan · ~18% hybrid. So the mode is chosen PER PAGE.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="360" height="198" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="198" rx="3" fill="#2f7d4f"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🖊  Vector overlay  (Phase 1, ~45%)</text><circle cx="64" cy="149" r="3" fill="#2f7d4f"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Read the page&#x27;s drawing ops (get_drawings) + word boxes on</text><text x="76" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">demand — NO conversion.</text><circle cx="64" cy="174" r="3" fill="#2f7d4f"/><text x="76" y="177" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Draw a transparent clickable SVG overlay over the page</text><text x="76" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">image; hover outlines, click highlights, connected</text><text x="76" y="199" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">segments group into a net/element.</text><circle cx="64" cy="210" r="3" fill="#2f7d4f"/><text x="76" y="213" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Crisp, scalable, RPS-safe. Con: vector pages only;</text><text x="76" y="224" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">geometric not semantic.</text><rect x="56" y="276" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="291" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Clickable now on ~half the corpus.</text>
<rect x="412" y="108" width="360" height="198" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="108" width="6" height="198" rx="3" fill="#1d9e75"/><text x="432" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🏷  Callout hotspots  (Phase 1b, any text)</text><circle cx="436" cy="149" r="3" fill="#1d9e75"/><text x="448" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Reuse the callout extractor + OCR word boxes: make</text><text x="448" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">reference designators / item #s / part #s / FIG refs</text><text x="448" y="174" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">clickable.</text><circle cx="436" cy="185" r="3" fill="#1d9e75"/><text x="448" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Click -&gt; highlight the label AND cross-link to the legend</text><text x="448" y="199" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">/ parts list / dossier (with PUB LOG mfr +</text><text x="448" y="210" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">interchangeable).</text><circle cx="436" cy="221" r="3" fill="#1d9e75"/><text x="448" y="224" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Works on raster scans too — now that OCR is 100%.</text><rect x="428" y="276" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="291" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Adds the meaning a shape can&#x27;t.</text>
<rect x="784" y="108" width="356" height="198" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="108" width="6" height="198" rx="3" fill="#caa24a"/><text x="804" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔥  Raster flood-fill  (Phase 2, ~38%)</text><circle cx="808" cy="149" r="3" fill="#caa24a"/><text x="820" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Pure scans have no geometry: click a line, flood-fill the</text><text x="820" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">connected dark pixels to &#x27;follow this wire&#x27;.</text><circle cx="808" cy="174" r="3" fill="#caa24a"/><text x="820" y="177" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Client-side on the canvas; heuristic but useful for</text><text x="820" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">tracing a circuit.</text><circle cx="808" cy="199" r="3" fill="#caa24a"/><text x="820" y="202" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Optional. Con: can over/under-select at crossings; no</text><text x="820" y="213" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">semantics.</text><rect x="800" y="276" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="291" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Tracing for the scans, later.</text>
<rect x="40" y="326" width="1100" height="70" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="348" font-size="11.5" font-weight="700" fill="#4f9dff" text-anchor="start">NO CONVERSION REQUIRED</text>
<text x="58" y="366" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">#1 reads vector geometry on demand, #2 reuses OCR, #3 processes pixels on the fly. The only optional optimisation is caching extracted paths in a small sidecar for instant re-open — additive, never</text><text x="58" y="378" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">touches the corpus (R1).</text>
<rect x="40" y="410" width="1100" height="70" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="432" font-size="11.5" font-weight="700" fill="#7f77dd" text-anchor="start">RECOMMENDATION</text>
<text x="58" y="450" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Build Phase 1 (highlighter toggle + vector overlay + callout hotspots) — medium effort, makes 60%+ of pages interactive, RPS-safe, grounded in the real geometry/text. Add raster flood-fill (Phase 2)</text><text x="58" y="462" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">and a path cache (Phase 3) only if wanted. Two choices to confirm: highlight a single path vs connected-group; include flood-fill from the start or later.</text>
<text x="40" y="552" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">PLAN diagram. Dark (R3). 2026-06-03 · docs/SCHEMATIC-HIGHLIGHTER-PLAN.md · probe via PyMuPDF get_drawings/get_text/get_images. Read-only (R1).</text>
</svg>