<svg viewBox="0 0 1180 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="540" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — most-common part nomenclature  (v0.72.1)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Now that the whole corpus is OCR&#x27;d, rank every cited part and answer: which one comes up THE MOST — by name, by exact NSN, and by official FLIS name.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="360" height="196" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="196" rx="3" fill="#4f9dff"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔢  Three rankings</text><circle cx="64" cy="149" r="3" fill="#4f9dff"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Headline: most-common NOMENCLATURE — the cited RPSTL item</text><text x="76" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">/ figure name (BOLT, GASKET, ...).</text><circle cx="64" cy="174" r="3" fill="#4f9dff"/><text x="76" y="177" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Most-common EXACT NSN — the single physical part that</text><text x="76" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">recurs the most, with vehicle spread.</text><circle cx="64" cy="199" r="3" fill="#4f9dff"/><text x="76" y="202" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Optional --flis: the official FLIS item name (INC -&gt; H6)</text><text x="76" y="213" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">for the top NSNs, joined from PUB LOG.</text><rect x="56" y="274" width="328" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="289" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">Name, exact part, and official name.</text>
<rect x="412" y="108" width="360" height="196" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="108" width="6" height="196" rx="3" fill="#1d9e75"/><text x="432" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🖱  One double-click</text><circle cx="436" cy="149" r="3" fill="#1d9e75"/><text x="448" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">ANSWER-MOST-COMMON-PART.bat runs it on the live index,</text><text x="448" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">prints the answer, and opens the result.</text><circle cx="436" cy="174" r="3" fill="#1d9e75"/><text x="448" y="177" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Saves index/MOST-COMMON-PART.txt — copy the &gt;&gt;&gt; ANSWER</text><text x="448" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">line straight back.</text><circle cx="436" cy="199" r="3" fill="#1d9e75"/><text x="448" y="202" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Read-only open (mode=ro + query_only; immutable fallback)</text><text x="448" y="213" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">— safe to run while OCR / the app is live.</text><rect x="428" y="274" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="289" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">No command line needed.</text>
<rect x="784" y="108" width="356" height="196" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="108" width="6" height="196" rx="3" fill="#caa24a"/><text x="804" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">💽  Why on the PC</text><circle cx="808" cy="149" r="3" fill="#caa24a"/><text x="820" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">The live index is 3.65 GB (891,556 x 4 KB pages per its</text><text x="820" y="163" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">own header).</text><circle cx="808" cy="174" r="3" fill="#caa24a"/><text x="820" y="177" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">The dev sandbox mount serves it ~14.5 MB short (~3,500</text><text x="820" y="188" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">pages) — SQLite reads that as &#x27;malformed&#x27;.</text><circle cx="808" cy="199" r="3" fill="#caa24a"/><text x="820" y="202" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">So this single number is computed on the machine that</text><text x="820" y="213" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">holds the whole file; the file itself is fine.</text><rect x="800" y="274" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="289" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Truncating mount can&#x27;t, your PC can.</text>
<rect x="40" y="320" width="1100" height="86" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="342" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED (logic) + host run pending</text>
<text x="58" y="362" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Ranking SQL fixture-tested in isolation: headline nomenclature (&#x27;BOLT, MACHINE&#x27;), per-NSN frequency excluding nulls, COALESCE name fallback, and distinct vehicle/NSN counts all correct. The number</text><text x="58" y="374" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">itself comes from your run — double-click the bat; it reads index\viewer.db host-side (where it is coherent) and writes index\MOST-COMMON-PART.txt.</text>
<rect x="40" y="414" width="1100" height="60" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="435" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Additive (R1/R6): a new bat + an enhanced read-only script — no schema/route/corpus changes; the old `python top_nomenclature.py` call still works. Optional FLIS join is name-only and read-only</text><text x="58" y="447" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">against PUB LOG CSVs.</text>
<text x="40" y="532" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.72.1 · 2026-06-03 · engine/top_nomenclature.py (+3 views, save-to-txt, --flis) · ANSWER-MOST-COMMON-PART.bat. Additive (R1).</text>
</svg>