<svg viewBox="0 0 1240 1280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1240" height="1280" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="50" font-size="20" font-weight="700" fill="#e6e9ee" text-anchor="start">“Living Schematic” — a CAD-engine equivalent for schematics &amp; diagrams  (proposal)</text>
<text x="40" y="76" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Turn a flat scanned schematic into an interactive diagram with animated flow IN THE DIRECTION of the current/fluid, and click-through component breakdowns.</text>
<line x1="40" y1="92" x2="1200" y2="92" stroke="#2b333f"/>
<text x="40" y="120" font-size="13" font-weight="700" fill="#4f9dff" text-anchor="start">THE ANALOGY</text>
<rect x="40" y="132" width="1160" height="70" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="156" font-size="10.5" font-weight="400" fill="#e6e9ee" text-anchor="start">CAD engine: a PART -&gt; classify shape -&gt; build procedural geometry -&gt; rendered image (tiered, cached). Living Schematic: a SCHEMATIC PAGE -&gt; extract its vectors+labels -&gt; infer the connectivity graph (netlist) -&gt; ANIMATED,</text><text x="58" y="171" font-size="10.5" font-weight="400" fill="#e6e9ee" text-anchor="start">interactive diagram (tiered, cached). Same idea: reconstruct structured meaning from the source, then render something richer than the flat scan.</text>
<line x1="40" y1="214" x2="1200" y2="214" stroke="#2b333f"/>
<text x="40" y="242" font-size="13" font-weight="700" fill="#1d9e75" text-anchor="start">HOW IT WORKS — the pipeline</text>
<rect x="40" y="256" width="226" height="118" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="256" width="5" height="118" rx="2.5" fill="#2f7d4f"/>
<text x="56" y="278" font-size="11" font-weight="700" fill="#2f7d4f" text-anchor="start">1  VECTORIZE</text>
<text x="56" y="298" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">already have it:</text>
<text x="56" y="313" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">schem_overlay.py / /api/schempaths</text>
<text x="56" y="328" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">-&gt; lines, curves + text boxes</text>
<text x="56" y="343" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">(R1/R2/C1, net names, pin #s)</text>
<rect x="274" y="256" width="226" height="118" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="274" y="256" width="5" height="118" rx="2.5" fill="#caa24a"/>
<text x="290" y="278" font-size="11" font-weight="700" fill="#caa24a" text-anchor="start">2  INFER GRAPH</text>
<text x="290" y="298" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">NEW: snap line endpoints at</text>
<text x="290" y="313" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">junctions -&gt; nodes/nets; attach</text>
<text x="290" y="328" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">labelled symbols to nodes</text>
<text x="290" y="343" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">-&gt; a netlist (graph) sidecar</text>
<rect x="508" y="256" width="226" height="118" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="508" y="256" width="5" height="118" rx="2.5" fill="#2f7d4f"/>
<text x="524" y="278" font-size="11" font-weight="700" fill="#2f7d4f" text-anchor="start">3  SIMULATE</text>
<text x="524" y="298" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">already have it:</text>
<text x="524" y="313" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Circuit Lab MNA solver</text>
<text x="524" y="328" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">(circuitsim.js) -&gt; node V,</text>
<text x="524" y="343" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">branch currents + direction</text>
<rect x="742" y="256" width="226" height="118" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="742" y="256" width="5" height="118" rx="2.5" fill="#caa24a"/>
<text x="758" y="278" font-size="11" font-weight="700" fill="#caa24a" text-anchor="start">4  ANIMATE</text>
<text x="758" y="298" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">NEW: schemflow.js overlay —</text>
<text x="758" y="313" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">dashes/particles travel each</text>
<text x="758" y="328" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">wire in the CURRENT&#x27;S direction,</text>
<text x="758" y="343" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">speed ∝ |current|</text>
<rect x="976" y="256" width="226" height="118" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="976" y="256" width="5" height="118" rx="2.5" fill="#caa24a"/>
<text x="992" y="278" font-size="11" font-weight="700" fill="#caa24a" text-anchor="start">5  BREAK DOWN</text>
<text x="992" y="298" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">NEW: click a component -&gt;</text>
<text x="992" y="313" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">its CAD image + part record</text>
<text x="992" y="328" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">(NSN/part#), connected nets,</text>
<text x="992" y="343" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;trace this signal&#x27; walkthrough</text>
<text x="40" y="392" font-size="9.5" font-weight="400" fill="#7f8a99" text-anchor="start">green = building blocks that ALREADY EXIST · amber = the new pieces. Per-page graph cached like figcrop/cadcache (schemgraph.db sidecar, R1).</text>
<line x1="40" y1="408" x2="1200" y2="408" stroke="#2b333f"/>
<text x="40" y="436" font-size="13" font-weight="700" fill="#caa24a" text-anchor="start">THE EXPERIENCE (what the mechanic sees)</text>
<rect x="40" y="450" width="575" height="92" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="56" y="476" font-size="12.5" font-weight="700" fill="#4f9dff" text-anchor="start">Animated flow</text>
<text x="56" y="498" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Current/signal — or hydraulic/pneumatic fluid — flows along the wires/lines in its real direction. Play / pause / speed. Colour = hot/active.</text>
<rect x="625" y="450" width="575" height="92" rx="12" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="641" y="476" font-size="12.5" font-weight="700" fill="#1d9e75" text-anchor="start">Trace-a-net</text>
<text x="641" y="498" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Click a wire or a net name: the whole net lights up and the animation isolates to just that path, end to end, across the page.</text>
<rect x="40" y="552" width="575" height="92" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="56" y="578" font-size="12.5" font-weight="700" fill="#2f7d4f" text-anchor="start">Component breakdown</text>
<text x="56" y="600" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Click a symbol (R12, valve, relay): a panel shows its CAD image, NSN/part #, value/rating, the nets it touches, and where it appears in the TM.</text>
<rect x="625" y="552" width="575" height="92" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="641" y="578" font-size="12.5" font-weight="700" fill="#7f77dd" text-anchor="start">Guided walkthrough</text>
<text x="641" y="600" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Step the signal source -&gt; load in order (like the onboarding tour, on the schematic) — the &#x27;directions of the directions&#x27; as a narrated path.</text>
<line x1="40" y1="666" x2="1200" y2="666" stroke="#2b333f"/>
<text x="40" y="694" font-size="13" font-weight="700" fill="#4f9dff" text-anchor="start">SCALES WITH THE BUILD (RPS), like CAD</text>
<rect x="40" y="708" width="386" height="80" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="56" y="732" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">MODERN</text>
<text x="56" y="752" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">WebGL particle flow along traces + live re-simulation; smooth, many particles.</text>
<rect x="432" y="708" width="386" height="80" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="448" y="732" font-size="12" font-weight="700" fill="#caa24a" text-anchor="start">LITE</text>
<text x="448" y="752" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Lightweight animated SVG dashes (stroke-dashoffset); the same direction + speed, cheaper.</text>
<rect x="824" y="708" width="386" height="80" rx="12" fill="#171d26" stroke="#c4585a" stroke-width="1"/>
<text x="840" y="732" font-size="12" font-weight="700" fill="#c4585a" text-anchor="start">LEGACY</text>
<text x="840" y="752" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">No continuous animation: static highlight + a STEP button that advances the flow one hop at a time</text><text x="840" y="765" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">(RPS-safe, no rAF loop).</text>
<line x1="40" y1="806" x2="1200" y2="806" stroke="#2b333f"/>
<text x="40" y="834" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="start">PROS</text>
<text x="630" y="834" font-size="13" font-weight="700" fill="#c4585a" text-anchor="start">CONS / RISKS</text>
<circle cx="52" cy="853" r="2.6" fill="#2f7d4f"/>
<text x="62" y="856" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Reuses what&#x27;s built: schempaths + Circuit Lab + CAD images + RPS + the part records.</text>
<circle cx="52" cy="873" r="2.6" fill="#2f7d4f"/>
<text x="62" y="876" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Turns a static scan into a teaching tool — flow + direction is how techs actually reason.</text>
<circle cx="52" cy="893" r="2.6" fill="#2f7d4f"/>
<text x="62" y="896" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Generalises beyond circuits: hydraulic/pneumatic/fuel/coolant diagrams animate the same way (fluid flow).</text>
<circle cx="52" cy="913" r="2.6" fill="#2f7d4f"/>
<text x="62" y="916" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Ties every symbol to its real part (NSN) and its CAD image — one unified object model.</text>
<circle cx="52" cy="933" r="2.6" fill="#2f7d4f"/>
<text x="62" y="936" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Offline, deterministic, cached per page; degrades gracefully on legacy.</text>
<circle cx="632" cy="853" r="2.6" fill="#c4585a"/>
<text x="642" y="856" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Graph inference from a SCANNED schematic is the hard part — OCR noise, dense/overlapping lines, hand drawing.</text>
<circle cx="632" cy="873" r="2.6" fill="#c4585a"/>
<text x="642" y="876" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Needs a human-in-the-loop review/override for wrong junctions (an append-only fix queue, like the NIIN review).</text>
<circle cx="632" cy="893" r="2.6" fill="#c4585a"/>
<text x="642" y="896" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Simulation needs component VALUES; many TM schematics omit them — animate topology/direction even without a full</text><text x="642" y="909" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">solve.</text>
<circle cx="632" cy="926" r="2.6" fill="#c4585a"/>
<text x="642" y="929" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Animation cost on big pages; cap particle counts + tier it; cache the graph, not the frames.</text>
<circle cx="632" cy="946" r="2.6" fill="#c4585a"/>
<text x="642" y="949" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Not every &#x27;schematic&#x27; is a graph (block diagrams, exploded views) — detect type, fall back to the highlighter.</text>
<rect x="40" y="1116" width="1160" height="96" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="1140" font-size="12" font-weight="700" fill="#7f77dd" text-anchor="start">Suggested rollout (each step shippable on its own)</text>
<text x="58" y="1160" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">1) schemgraph.py + BUILD-SCHEMGRAPH.bat: host batch infers the netlist per schematic page -&gt; schemgraph.db sidecar (with a confidence score). 2) /api/schemgraph route serves it. 3) schemflow.js: the animated overlay (tiered). 4)</text><text x="58" y="1173" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Component breakdown panel reusing /api/part_record + /cadimg. 5) Review/override queue for bad junctions. 6) Wire it into Circuit Lab + the schematics viewer. Proof-of-concept first on ONE clean wiring page to prove the graph</text><text x="58" y="1186" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">inference, then scale.</text>
<text x="40" y="1270" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Proposal markup. Dark (R3). 2026-06-04 · builds on schem_overlay.py · /api/schempaths · circuitsim.js (MNA) · /api/part_record · /cadimg · RPS tiers.</text>
</svg>