<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect x="0" y="0" width="1180" height="600" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — Solve it: the workflow hub  (v0.48.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">One screen that walks a mechanic from a symptom to a fix — stitching together features that already exist, each step cited. The program now matches the real shop workflow.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="56" y="116" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">THE CHAIN  (/solve — orchestrates the existing endpoints, no new index work)</text>
<rect x="40" y="126" width="1100" height="210" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="58" y="150" width="206" height="150" rx="10" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/>
<text x="70" y="172" font-size="10" font-weight="700" fill="#7f77dd" text-anchor="start">Symptom</text>
<text x="70" y="192" font-size="8.2" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;no-start, not charging&#x27; or a</text><text x="70" y="203" font-size="8.2" font-weight="400" fill="#9aa6b6" text-anchor="start">part / NSN</text>
<path d="M264,225 L274,225" stroke="#7f77dd" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="274" y="150" width="206" height="150" rx="10" fill="#1c2430" stroke="#caa24a" stroke-width="1"/>
<text x="286" y="172" font-size="10" font-weight="700" fill="#caa24a" text-anchor="start">Likely parts</text>
<text x="286" y="192" font-size="8.2" font-weight="400" fill="#9aa6b6" text-anchor="start">/api/faultparts — parts most used</text><text x="286" y="203" font-size="8.2" font-weight="400" fill="#9aa6b6" text-anchor="start">for this fault (your history) +</text><text x="286" y="214" font-size="8.2" font-weight="400" fill="#9aa6b6" text-anchor="start">manual hits (/api/search)</text>
<path d="M480,225 L490,225" stroke="#caa24a" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="490" y="150" width="206" height="150" rx="10" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/>
<text x="502" y="172" font-size="10" font-weight="700" fill="#2f7d4f" text-anchor="start">How to do it</text>
<text x="502" y="192" font-size="8.2" font-weight="400" fill="#9aa6b6" text-anchor="start">/api/procedure — remove/install</text><text x="502" y="203" font-size="8.2" font-weight="400" fill="#9aa6b6" text-anchor="start">steps, tools, WARNINGs (cited)</text>
<path d="M696,225 L706,225" stroke="#2f7d4f" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="706" y="150" width="206" height="150" rx="10" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/>
<text x="718" y="172" font-size="10" font-weight="700" fill="#1d9e75" text-anchor="start">Look-alike check</text>
<text x="718" y="192" font-size="8.2" font-weight="400" fill="#9aa6b6" text-anchor="start">/api/partdiff — don&#x27;t order the</text><text x="718" y="203" font-size="8.2" font-weight="400" fill="#9aa6b6" text-anchor="start">wrong NSN; the UOC is the tell</text>
<path d="M912,225 L922,225" stroke="#1d9e75" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="922" y="150" width="206" height="150" rx="10" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/>
<text x="934" y="172" font-size="10" font-weight="700" fill="#4f9dff" text-anchor="start">Related schematic</text>
<text x="934" y="192" font-size="8.2" font-weight="400" fill="#9aa6b6" text-anchor="start">/api/schematics — open the wiring</text><text x="934" y="203" font-size="8.2" font-weight="400" fill="#9aa6b6" text-anchor="start">in the viewer / Circuit Lab</text>
<text x="58" y="326" font-size="8.8" font-weight="400" fill="#2f7d4f" text-anchor="start">Two stages: (1) symptom → likely parts + the pages that mention it; (2) pick the part → the full fix bundle. Keep-alive (0.46) makes the multi-call orchestration snappy.</text>
<rect x="40" y="358" width="1100" height="100" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="58" y="382" font-size="11" font-weight="700" fill="#caa24a" text-anchor="start">WHY IT MATTERS</text>
<text x="58" y="402" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Until now the mechanic had to bounce between search, the parts catalog, the procedure pages and the schematics by hand. The hub assembles them into one &#x27;case file&#x27; for the job: what</text><text x="58" y="415" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">part, how to replace it, what tools, what to watch, which NSN is right for THIS vehicle, and the wiring — turning a pile of capabilities into a single guided path from broken to fixed.</text>
<rect x="40" y="470" width="1100" height="96" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="494" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">GROUNDED &amp; ADDITIVE (R1/R6)</text>
<text x="58" y="514" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Pure client-side orchestration of endpoints that are already tested — no new database work, nothing written back. Every panel deep-links to the real cited page so the manual stays the</text><text x="58" y="527" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">source of truth, and the UI reminds you to confirm torque, sequence and the exact NSN (UOC) on the sheet. New /solve route only; rollback = remove it. solve.html JS lints clean.</text>
<text x="40" y="588" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.48.0 · 2026-06-02 · engine/ui/solve.html (+ /solve route). Reuses faultparts/search/procedure/partdiff/schematics.</text>
</svg>