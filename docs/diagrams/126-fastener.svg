<text x="560" y="184" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">UNC</text>
<text x="680" y="184" font-size="10" font-weight="400" fill="#4f9dff" text-anchor="start">Torque · In manuals</text>
