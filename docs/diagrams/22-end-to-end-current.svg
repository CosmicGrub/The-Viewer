<svg viewBox="0 0 1180 860" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect x="0" y="0" width="1180" height="860" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="22" font-weight="700" fill="#e6e9ee" text-anchor="start">THE VIEWER — end-to-end process, current state</text>
<text x="40" y="70" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Onboarding → search → manual page → parts cart → tech-status gate → 104th sheet → learns. Everything anchors to the real manual; nothing invented.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="40" y="108" font-size="10" font-weight="700" fill="#9aa6b6" text-anchor="start">GROUNDING:</text>
<rect x="130" y="98" width="14" height="12" rx="3" fill="#2c3f5e" stroke="#2b333f" stroke-width="1"/>
<text x="150" y="108" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">your input</text>
<rect x="238.0" y="98" width="14" height="12" rx="3" fill="#16301f" stroke="#2b333f" stroke-width="1"/>
<text x="258.0" y="108" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">real manual page</text>
<rect x="384.4" y="98" width="14" height="12" rx="3" fill="#3a2f1a" stroke="#2b333f" stroke-width="1"/>
<text x="404.4" y="108" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">verbatim / cited</text>
<rect x="530.8" y="98" width="14" height="12" rx="3" fill="#1a2740" stroke="#2b333f" stroke-width="1"/>
<text x="550.8" y="108" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">learned from logs</text>
<rect x="40" y="124" width="1100" height="78" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="124" width="6" height="78" rx="3" fill="#2c3f5e"/>
<text x="62" y="150" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">1 · Onboarding modal</text>
<text x="62" y="170" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Mirrors the 104th header (live preview). Bumper# + Fault required. Express &#x27;what do you need?&#x27; field set</text><text x="62" y="184" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">apart.</text>
<rect x="960" y="142" width="166" height="30" rx="7" fill="#2c3f5e" stroke="#2b333f" stroke-width="1"/>
<text x="1043" y="162" font-size="9.5" font-weight="600" fill="#e6e9ee" text-anchor="middle">your input</text>
<path d="M90,202 L90,208.1" stroke="#5d6675" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="40" y="208" width="1100" height="78" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="208" width="6" height="78" rx="3" fill="#1a2740"/>
<text x="62" y="234" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">2 · Entry</text>
<text x="62" y="254" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Exact NSN/part in express → jumps straight to the page/hub. Otherwise Home: commonly-requested (learned),</text><text x="62" y="268" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">browse-by-vehicle, recents, rotating example.</text>
<rect x="960" y="226" width="166" height="30" rx="7" fill="#1a2740" stroke="#2b333f" stroke-width="1"/>
<text x="1043" y="246" font-size="9.5" font-weight="600" fill="#e6e9ee" text-anchor="middle">learned + your input</text>
<path d="M90,286 L90,292.1" stroke="#5d6675" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="40" y="292" width="1100" height="78" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="292" width="6" height="78" rx="3" fill="#16301f"/>
<text x="62" y="318" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">3 · Search engine</text>
<text x="62" y="338" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Predictive FTS5 + synonyms + typo-tolerance + part#/FIG + All/Any · Last-4 NSN (cover) · full NSN</text><text x="62" y="352" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">(part/vehicle) · results you&#x27;ve requested float up.</text>
<rect x="960" y="310" width="166" height="30" rx="7" fill="#16301f" stroke="#2b333f" stroke-width="1"/>
<text x="1043" y="330" font-size="9.5" font-weight="600" fill="#e6e9ee" text-anchor="middle">real index</text>
<path d="M90,370 L90,376.1" stroke="#5d6675" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="40" y="376" width="1100" height="78" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="376" width="6" height="78" rx="3" fill="#16301f"/>
<text x="62" y="402" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">4 · Smart results</text>
<text x="62" y="422" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Filter by vehicle / manual-type / text-vs-OCR with counts; ★ requested badge. Cards link to the page or the</text><text x="62" y="436" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">vehicle hub.</text>
<rect x="960" y="394" width="166" height="30" rx="7" fill="#16301f" stroke="#2b333f" stroke-width="1"/>
<text x="1043" y="414" font-size="9.5" font-weight="600" fill="#e6e9ee" text-anchor="middle">real index</text>
<path d="M90,454 L90,460.1" stroke="#5d6675" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="40" y="460" width="1100" height="78" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="460" width="6" height="78" rx="3" fill="#3a2f1a"/>
<text x="62" y="486" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">5 · Viewer  &amp;  Vehicle hub</text>
<text x="62" y="506" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Real manual page (zoom · thumbnails · highlight-the-hit). &#x27;Schematics &amp; install&#x27; panel: cited figure → page →</text><text x="62" y="520" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">vehicle schematic set. Hub groups the whole manual set.</text>
<rect x="960" y="478" width="166" height="30" rx="7" fill="#3a2f1a" stroke="#2b333f" stroke-width="1"/>
<text x="1043" y="498" font-size="9.5" font-weight="600" fill="#e6e9ee" text-anchor="middle">verbatim / cited</text>
<path d="M90,538 L90,544.1" stroke="#5d6675" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="40" y="544" width="1100" height="78" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="544" width="6" height="78" rx="3" fill="#2c3f5e"/>
<text x="62" y="570" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">6 · Parts cart (104th blocks)</text>
<text x="62" y="590" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Add a part → nomenclature auto-derived from the matched line; NSN/part#/FIG/QTY editable; FEDLOG row (manual).</text><text x="62" y="604" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Simple/Advanced view.</text>
<rect x="960" y="562" width="166" height="30" rx="7" fill="#2c3f5e" stroke="#2b333f" stroke-width="1"/>
<text x="1043" y="582" font-size="9.5" font-weight="600" fill="#e6e9ee" text-anchor="middle">page-derived + your input</text>
<path d="M90,622 L90,628.1" stroke="#5d6675" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="40" y="628" width="1100" height="78" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="628" width="6" height="78" rx="3" fill="#3a2f1a"/>
<text x="62" y="654" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">7 · Tech-status gate (mandatory)</text>
<text x="62" y="674" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Suggests status from the fault via PMCS &#x27;Not Fully Mission Capable If&#x27; (cited) or prior history; you confirm.</text><text x="62" y="688" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Sheet can&#x27;t generate while blank.</text>
<rect x="960" y="646" width="166" height="30" rx="7" fill="#3a2f1a" stroke="#2b333f" stroke-width="1"/>
<text x="1043" y="666" font-size="9.5" font-weight="600" fill="#e6e9ee" text-anchor="middle">verbatim / cited</text>
<path d="M90,706 L90,712.1" stroke="#5d6675" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="40" y="712" width="1100" height="78" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="712" width="6" height="78" rx="3" fill="#16301f"/>
<text x="62" y="738" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">8 · Save + generate</text>
<text x="62" y="758" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">sessions / faults / request_items written; the 104th ECC PDF is produced with the header + item blocks filled.</text>
<rect x="960" y="730" width="166" height="30" rx="7" fill="#16301f" stroke="#2b333f" stroke-width="1"/>
<text x="1043" y="750" font-size="9.5" font-weight="600" fill="#e6e9ee" text-anchor="middle">your record</text>
<path d="M1135,752 L1160,752" stroke="#3a4d6e" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<path d="M1160,752 C1175,752 1175,150 1150,150" stroke="#3a4d6e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="1150" y="140" font-size="9" font-weight="400" fill="#7c8696" text-anchor="end">learns</text>
<text x="40" y="846" font-size="10" font-weight="400" fill="#caa24a" text-anchor="start">The one quality lever: OCR coverage. Text-layer manuals are fully searchable/citable now; scanned pages sharpen as OCR completes (search, schematics, and PMCS tech-status all benefit).</text>
</svg>