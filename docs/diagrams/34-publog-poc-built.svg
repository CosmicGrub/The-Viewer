<svg viewBox="0 0 1180 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect x="0" y="0" width="1180" height="680" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="21" font-weight="700" fill="#e6e9ee" text-anchor="start">PUB LOG reference ingest — proof of concept (built)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">v0.22.0 · enrich --publog reads a PUB LOG export and fills NSN→name/part#/CAGE/characteristics/AAC/substitutes. Append-only (R6), cited, offline. Migration 0007.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="104" width="300" height="120" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="58" y="128" font-size="12" font-weight="700" fill="#caa24a" text-anchor="start">ONE-TIME (connected machine)</text>
<text x="58" y="150" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Download PublogDVD.zip (free, no CAC) →</text><text x="58" y="163" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">PUB LOG Batch/SQL export → CSV (NSN,</text><text x="58" y="176" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">item name, part#, CAGE, characteristics,</text><text x="58" y="189" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">AAC, substitutes).</text>
<path d="M340,164 L388,164" stroke="#caa24a" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="388" y="104" width="330" height="120" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="406" y="128" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">enrich --publog &lt;csv&gt;</text>
<text x="406" y="150" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Matches ONLY NSNs already in your index;</text><text x="406" y="163" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">appends a version to ref_nsn_log (R6) and</text><text x="406" y="176" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">UPSERTs ref_nsn. CSV or XLSX.</text>
<path d="M718,164 L766,164" stroke="#2f7d4f" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
<rect x="766" y="104" width="374" height="120" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="784" y="128" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">OFFLINE in the app</text>
<text x="784" y="150" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Cart auto-fills authoritative PART # (MCRD) +</text><text x="784" y="163" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">AAC; shows item name, CAGE, characteristics,</text><text x="784" y="176" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">substitutes — labeled &#x27;📚 External reference</text><text x="784" y="189" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">(cited).&#x27;</text>
<rect x="40" y="244" width="1100" height="120" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="58" y="268" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED ON THE LIVE INDEX (POC)</text>
<rect x="58" y="282" width="1064" height="30" rx="6" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="70" y="302" font-size="10" font-weight="400" fill="#bfe6c5" text-anchor="start">NSN 6115-00-118-1241  →  SCREW, CAP, HEXAGON HEAD · P/N MS90726-60 · CAGE 96906 · AAC D · char: 1/2-13 UNC; GR5; STEEL · subs: 5305-01-310-1234</text>
<text x="58" y="330" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">PUB LOG ingest filtered to in-index NSNs (a bogus NSN was excluded). Every field landed and is queryable via /api/reference; part# + AAC auto-fill the 104th.</text>
<text x="40" y="388" font-size="12" font-weight="700" fill="#caa24a" text-anchor="start">WHAT EACH FIELD CLOSES</text>
<rect x="40" y="404" width="268" height="96" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="404" width="5" height="96" rx="2" fill="#2f7d4f"/>
<text x="56" y="428" font-size="11" font-weight="700" fill="#e6e9ee" text-anchor="start">PART # + CAGE (MCRD)</text>
<text x="56" y="448" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">auto-fills the 104th part# — the</text><text x="56" y="461" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">authoritative number OCR couldn&#x27;t pin</text><text x="56" y="474" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">down</text>
<rect x="318" y="404" width="268" height="96" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="318" y="404" width="5" height="96" rx="2" fill="#4f9dff"/>
<text x="334" y="428" font-size="11" font-weight="700" fill="#e6e9ee" text-anchor="start">Characteristics (CHAR)</text>
<text x="334" y="448" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;1/2-13 UNC&#x27; = the SIZE parameter for</text><text x="334" y="461" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Tier 2.5 parametric 3D (matches</text><text x="334" y="474" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">ref_hardware)</text>
<rect x="596" y="404" width="268" height="96" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="596" y="404" width="5" height="96" rx="2" fill="#caa24a"/>
<text x="612" y="428" font-size="11" font-weight="700" fill="#e6e9ee" text-anchor="start">AAC (MDI&amp;S)</text>
<text x="612" y="448" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">fills the 104th&#x27;s AAC FEDLOG block</text>
<rect x="874" y="404" width="268" height="96" rx="11" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="874" y="404" width="5" height="96" rx="2" fill="#3a4d6e"/>
<text x="890" y="428" font-size="11" font-weight="700" fill="#e6e9ee" text-anchor="start">Substitutes (MDI&amp;S)</text>
<text x="890" y="448" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">real interchangeable NSNs → grounds</text><text x="890" y="461" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">look-alike / substitute warnings</text>
<rect x="40" y="516" width="1100" height="118" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="58" y="540" font-size="12" font-weight="700" fill="#caa24a" text-anchor="start">SCOPE OF THIS POC (honest)</text>
<text x="58" y="562" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">The ingest + schema + UI are proven on synthetic PUB-LOG-shaped rows against real in-index NSNs. The actual fill needs you to do the one-time PUB LOG download + Batch/SQL</text><text x="58" y="575" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">export on a connected machine (the ~GB .ZIP and the IMD product format aren&#x27;t fetched here). Column-name variants are handled; if your export uses different headers we map</text><text x="58" y="588" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">them in minutes. Everything append-only &amp; cited (R6); the engine never goes online.</text>
<text x="40" y="668" font-size="9.2" font-weight="400" fill="#6b7280" text-anchor="start">Built &amp; verified. Dark (R3) · CHANGELOG 0.22.0 (R4) · visual panel (R5) · sourcing in docs/REFERENCE-SOURCING.md.</text>
</svg>