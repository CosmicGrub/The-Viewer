<text x="250" y="378" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">✓ same feature   ~ adapted (Poppler/Tesseract/lite)   – N/A (GPU-only, not applicable)</text>
<text x="56" y="424" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">2 · CHANGELOG-LEGACY.md — entry format (markup)</text>
<rect x="40" y="434" width="560" height="340" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="58" y="458" font-size="8.4" font-weight="700" fill="#e6e9ee" text-anchor="start">## [0.37.0-legacy] — 2026-06-02 — Legacy track created</text>
<text x="58" y="474.2" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Forked from modern 0.37.0 at the complete-compat point.</text>
<text x="58" y="490.4" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Target: Windows 7 / Vista, comparable responsiveness.</text>
<text x="58" y="506.59999999999997" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="start"></text>
<text x="58" y="522.8" font-size="8.4" font-weight="700" fill="#e6e9ee" text-anchor="start">### In this build</text>
<text x="58" y="539.0" font-size="8.4" font-weight="400" fill="#2f7d4f" text-anchor="start">- Core search / vehicle hub / 104th sheet  ✓ same</text>
<text x="58" y="555.2" font-size="8.4" font-weight="400" fill="#caa24a" text-anchor="start">- Page render via Poppler (pdftoppm)        ~ adapted</text>
<text x="58" y="571.4000000000001" font-size="8.4" font-weight="400" fill="#caa24a" text-anchor="start">- OCR via Tesseract (CPU)                   ~ adapted</text>
<text x="58" y="587.6000000000001" font-size="8.4" font-weight="400" fill="#caa24a" text-anchor="start">- ES5 UI bundle + Firefox ESR note          ~ adapted</text>
<text x="58" y="603.8000000000002" font-size="8.4" font-weight="400" fill="#4f9dff" text-anchor="start">- Pre-baked page cache + warm-on-view       + new</text>
<text x="58" y="620.0000000000002" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="start">- GPU acceleration                          – N/A</text>
<text x="58" y="636.2000000000003" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="start"></text>
<text x="58" y="652.4000000000003" font-size="8.4" font-weight="700" fill="#e6e9ee" text-anchor="start">### Parity with modern</text>
<text x="58" y="668.6000000000004" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Matches modern 0.37.0 features; GPU is the only</text>
<text x="58" y="684.8000000000004" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="start">omission (speed, not a feature).</text>
<text x="58" y="701.0000000000005" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="start"></text>
<text x="58" y="717.2000000000005" font-size="8.4" font-weight="700" fill="#e6e9ee" text-anchor="start">## [0.40.0-legacy] — later — backport</text>
<text x="58" y="733.4000000000005" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="start">Backported the alias map + status page from</text>
<text x="58" y="749.6000000000006" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="start">modern 0.40.0 (adapted for the lite UI).</text>
<text x="620" y="424" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">3 · HOW IT FITS + MY RECOMMENDATION</text>
<rect x="604" y="434" width="536" height="340" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<circle cx="620" cy="454" r="3" fill="#2f7d4f"/>
<text x="632" y="458" font-size="9.8" font-weight="700" fill="#e6e9ee" text-anchor="start">Two files, one timeline</text>
<text x="632" y="473.0" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">CHANGELOG.md (modern) + CHANGELOG-LEGACY.md (legacy), plus ONE branched visual</text><text x="632" y="484.5" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">timeline (this) that shows where legacy forked and every backport. Each stays</text><text x="632" y="496.0" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">readable; the diagram shows the relationship.</text>
<circle cx="620" cy="508.5" r="3" fill="#2f7d4f"/>
<text x="632" y="512.5" font-size="9.8" font-weight="700" fill="#e6e9ee" text-anchor="start">Version as &lt;base&gt;-legacy</text>
<text x="632" y="527.5" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Name legacy builds after the modern baseline they branch from (0.37.0-legacy) so the</text><text x="632" y="539.0" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">relationship is always explicit at a glance.</text>
<circle cx="620" cy="551.5" r="3" fill="#2f7d4f"/>
<text x="632" y="555.5" font-size="9.8" font-weight="700" fill="#e6e9ee" text-anchor="start">Parity line on every entry</text>
<text x="632" y="570.5" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Each legacy entry tags features same / adapted / N-A and ends with a &#x27;Parity with</text><text x="632" y="582.0" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">modern&#x27; summary — answers &#x27;is it caught up?&#x27; instantly.</text>
<circle cx="620" cy="594.5" r="3" fill="#2f7d4f"/>
<text x="632" y="598.5" font-size="9.8" font-weight="700" fill="#e6e9ee" text-anchor="start">Backports are first-class</text>
<text x="632" y="613.5" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">When a modern feature lands in legacy, it gets its own dated legacy entry + a dashed</text><text x="632" y="625.0" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">cross-link on the timeline (your &#x27;added in conjunction with overall progress&#x27;).</text>
<circle cx="620" cy="637.5" r="3" fill="#2f7d4f"/>
<text x="632" y="641.5" font-size="9.8" font-weight="700" fill="#e6e9ee" text-anchor="start">R5 visual, automated</text>
<text x="632" y="656.5" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Extend the visual-changelog generator to emit this branched timeline so it stays</text><text x="632" y="668.0" font-size="8.6" font-weight="400" fill="#9aa6b6" text-anchor="start">current with every release (fits rules R4/R5).</text>
<text x="40" y="848" font-size="9.2" font-weight="400" fill="#6b7280" text-anchor="start">MOCKUP — your call. Dark (R3). Concept only; nothing built. Pairs with the Retroactive Post-Support plan (diagram 52).</text>
</svg>