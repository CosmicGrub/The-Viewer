<svg viewBox="0 0 1100 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1100" height="540" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">PMCS finder — the maintenance-check tables, fast   v0.99.23</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Find Preventive Maintenance Checks &amp; Services tables by vehicle, with the interval each page covers, each cited to its real page.</text>
