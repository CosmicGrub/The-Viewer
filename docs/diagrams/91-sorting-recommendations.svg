<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="640" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Tightening the Operator/Mechanic split — recommendations</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Higher accuracy + constant speed + RPS-safe. Ranked by value vs risk. Nothing here touches the live index or breaks legacy.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="40" y="112" font-size="12.5" font-weight="700" fill="#2f7d4f" text-anchor="start">Tier 1 — make it tighter AND faster</text>
<rect x="40" y="124" width="360" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="124" width="6" height="176" rx="3" fill="#2f7d4f"/><text x="60" y="148" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">⚡  Cache the side map</text><circle cx="64" cy="165" r="3" fill="#2f7d4f"/><text x="76" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Classify once; cache keyed on doc-count + MAX(rowid).</text><circle cx="64" cy="179" r="3" fill="#2f7d4f"/><text x="76" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Invalidates only when documents change.</text><circle cx="64" cy="193" r="3" fill="#2f7d4f"/><text x="76" y="196" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">/api/by_side + counts become O(1) after first build.</text><rect x="56" y="270" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="285" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Speed: faster, never slower.</text>
<rect x="412" y="124" width="360" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="124" width="6" height="176" rx="3" fill="#2f7d4f"/><text x="432" y="148" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">✍  Confidence + override sidecar</text><circle cx="436" cy="165" r="3" fill="#2f7d4f"/><text x="448" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">tm_side returns confidence:</text><text x="448" y="179" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">high(code)/med(title)/low(default).</text><circle cx="436" cy="190" r="3" fill="#2f7d4f"/><text x="448" y="193" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">sides_override.json lets you PIN any doc to a side.</text><circle cx="436" cy="204" r="3" fill="#2f7d4f"/><text x="448" y="207" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">One-click fix for the &#x27;uncertain&#x27; tail (append-only).</text><rect x="428" y="270" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="438" y="285" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Accuracy: kills the guesswork.</text>
<rect x="784" y="124" width="356" height="176" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="124" width="6" height="176" rx="3" fill="#2f7d4f"/><text x="804" y="148" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  Cover/MAC corroboration</text><circle cx="808" cy="165" r="3" fill="#2f7d4f"/><text x="820" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">ONLY for docs with no coverage code.</text><circle cx="808" cy="179" r="3" fill="#2f7d4f"/><text x="820" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Peek OCR&#x27;d page 1: &#x27;OPERATOR&#x27;S MANUAL&#x27; -&gt; operator;</text><circle cx="808" cy="193" r="3" fill="#2f7d4f"/><text x="820" y="196" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;MAINTENANCE ALLOCATION CHART&#x27; -&gt; mechanic.</text><rect x="800" y="270" width="324" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="810" y="285" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Accuracy on the few, no global cost.</text>
<text x="40" y="318" font-size="12.5" font-weight="700" fill="#caa24a" text-anchor="start">Tier 2 — polish that complements</text>
<rect x="40" y="330" width="360" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="330" width="6" height="150" rx="3" fill="#caa24a"/><text x="60" y="354" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔗  Combined badge + cross-link</text><circle cx="64" cy="371" r="3" fill="#caa24a"/><text x="76" y="374" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Mark -12/-13/-14 as &#x27;Combined — also on the other side&#x27;.</text><circle cx="64" cy="385" r="3" fill="#caa24a"/><text x="76" y="388" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">So nobody thinks a combined manual is misfiled.</text><rect x="56" y="450" width="328" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="66" y="465" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Clarity, tiny effort.</text>
<rect x="412" y="330" width="360" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="330" width="6" height="150" rx="3" fill="#caa24a"/><text x="432" y="354" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🧹  Operator-side declutter</text><circle cx="436" cy="371" r="3" fill="#caa24a"/><text x="448" y="374" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">De-emphasize parts-request / NSN-dossier CTAs on the</text><circle cx="436" cy="385" r="3" fill="#caa24a"/><text x="448" y="388" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">operator side (still reachable). Presentation-only.</text><rect x="428" y="450" width="328" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="438" y="465" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Simpler operator view.</text>
<rect x="784" y="330" width="356" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="330" width="6" height="150" rx="3" fill="#caa24a"/><text x="804" y="354" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔗  Side in deep links</text><circle cx="808" cy="371" r="3" fill="#caa24a"/><text x="820" y="374" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">?side= on shared links so a link opens the right side.</text><circle cx="808" cy="385" r="3" fill="#caa24a"/><text x="820" y="388" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Server already accepts side= on search.</text><rect x="800" y="450" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="465" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Consistency across users.</text>
<text x="40" y="498" font-size="12.5" font-weight="700" fill="#7f77dd" text-anchor="start">Tier 3 — the one you may not have considered</text>
<rect x="40" y="510" width="1100" height="58" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="531" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">CHAPTER-LEVEL routing inside combined manuals: a -12 has operator chapters AND maintenance chapters on different pages. Use the OCR&#x27;d table-of-contents / chapter headers to send an operator to the</text><text x="58" y="544" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">operator chapters of a -12 (not the whole book). Biggest accuracy leap for combined manuals; reuses OCR you already have; more effort.</text>
<rect x="40" y="576" width="1100" height="40" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="595" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">Guardrails kept throughout: classification stays pure-regex (no network), cache invalidates on a cheap signal, everything is sidecar/in-memory (never writes the 3.65 GB index, R1/R6), and all UI stays</text><text x="58" y="607" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">ES5 for the RPS/legacy build.</text>
<text x="40" y="634" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Recommendations diagram. Dark (R3). v0.73.x candidates · complements patterns.tm_side / /api/by_side / classify_sides.py.</text>
</svg>