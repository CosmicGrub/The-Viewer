<rect x="0" y="0" width="1180" height="660" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Hardening, wider — fuzz the locator + coverage math   v0.99.18</text>
<text x="40" y="70" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Extended the property/fuzz harness to the last untested read helpers. 206,300 cases, 0 violations — these modules are solid.</text>
