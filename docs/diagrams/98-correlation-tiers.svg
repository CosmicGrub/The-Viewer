<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="640" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Part-number correlation — approach tiers &amp; caveats (your call)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Pick any mix. All offline, sidecar/cached, confidence-scored, review-able. Index never written.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="360" height="180" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="180" rx="3" fill="#2f7d4f"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🧱  T1 · RPSTL row parser</text><circle cx="64" cy="149" r="3" fill="#2f7d4f"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Parse the parts-list table into structured rows:</text><circle cx="64" cy="163" r="3" fill="#2f7d4f"/><text x="76" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">item# · SMR · NSN · CAGEC · PART# · nomenclature · qty.</text><circle cx="64" cy="177" r="3" fill="#2f7d4f"/><text x="76" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Multi-signal columns (NSN regex, 5-char CAGEC, SMR</text><circle cx="64" cy="191" r="3" fill="#2f7d4f"/><text x="76" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">codes) + confidence. Host batch -&gt; sidecar.</text><rect x="56" y="258" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="273" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">The core win. Recommended.</text>
<rect x="412" y="108" width="360" height="180" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="108" width="6" height="180" rx="3" fill="#1d9e75"/><text x="432" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔗  T2 · FLIS cross-validate</text><circle cx="436" cy="149" r="3" fill="#1d9e75"/><text x="448" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">PART# + CAGEC -&gt; NSN -&gt; INC official name (PUB LOG).</text><circle cx="436" cy="163" r="3" fill="#1d9e75"/><text x="448" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Repairs OCR&#x27;d nomenclature; fills gaps; flags conflicts.</text><circle cx="436" cy="177" r="3" fill="#1d9e75"/><text x="448" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Uses data already on disk. Disambiguates same part#</text><circle cx="436" cy="191" r="3" fill="#1d9e75"/><text x="448" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">across makers via CAGEC.</text><rect x="428" y="258" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="273" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Accuracy lever. Recommended.</text>
<rect x="784" y="108" width="356" height="180" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="108" width="6" height="180" rx="3" fill="#caa24a"/><text x="804" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🎯  T3 · Callout localization</text><circle cx="808" cy="149" r="3" fill="#caa24a"/><text x="820" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">OCR the figure to find the item-number balloon,</text><circle cx="808" cy="163" r="3" fill="#caa24a"/><text x="820" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">crop tight around that callout (not the whole figure).</text><circle cx="808" cy="177" r="3" fill="#caa24a"/><text x="820" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Confidence-gated; falls back to the whole figure.</text><circle cx="808" cy="191" r="3" fill="#caa24a"/><text x="820" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Harder on dense exploded views — opt-in.</text><rect x="800" y="258" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="273" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Tighter visual. Optional.</text>
<rect x="40" y="304" width="540" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="304" width="6" height="150" rx="3" fill="#7f77dd"/><text x="60" y="328" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  T4 · Part-number-first UX</text><circle cx="64" cy="345" r="3" fill="#7f77dd"/><text x="76" y="348" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Search by PART NUMBER -&gt; the exact item, its figure/callout,</text><circle cx="64" cy="359" r="3" fill="#7f77dd"/><text x="76" y="362" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">FLIS nomenclature, and Look-Alike disambiguation.</text><circle cx="64" cy="373" r="3" fill="#7f77dd"/><text x="76" y="376" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Wildcard suffixes (e.g. -010x) and PN+CAGEC keys.</text><circle cx="64" cy="387" r="3" fill="#7f77dd"/><text x="76" y="390" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Feeds the 3D preview + dossier + procedure views.</text><rect x="56" y="424" width="508" height="22" rx="6" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/><text x="66" y="439" font-size="8.8" font-weight="700" fill="#7f77dd" text-anchor="start">Makes it usable everywhere.</text>
<rect x="596" y="304" width="544" height="150" rx="12" fill="#171d26" stroke="#c4585a" stroke-width="1"/>
<text x="614" y="326" font-size="11.5" font-weight="700" fill="#c4585a" text-anchor="start">Hard caveats (surfaced up front)</text>
<text x="614" y="346" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">• OCR table rows DRIFT -&gt; mis-pairing. Fix: multi-signal</text>
<text x="614" y="363" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">• columns + confidence + a review/override queue.</text>
<text x="614" y="380" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">• Same part# differs by CAGEC (maker) -&gt; key on PN+CAGEC.</text>
<text x="614" y="397" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">• Suffix variants (-010, -010x) -&gt; wildcard + variant grouping.</text>
<text x="614" y="414" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">• Callout match can be wrong on busy figures -&gt; gated + fallback.</text>
<text x="614" y="431" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">• Big corpus -&gt; host-side batch (can&#x27;t run in the sandbox).</text>
<rect x="40" y="470" width="1100" height="96" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="491" font-size="11.5" font-weight="700" fill="#4f9dff" text-anchor="start">Recommended path</text>
<text x="58" y="511" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">T1 (RPSTL row parser) + T2 (FLIS cross-validate) deliver the tight, accurate part#→name→figure correlation you described, using only data we already have — that&#x27;s the safe, high-value core. T4 makes</text><text x="58" y="524" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">it searchable everywhere. T3 (callout localization) is the &#x27;tightest visual&#x27; but the noisiest; I&#x27;d build it confidence-gated with a whole-figure fallback, or defer it. Everything ships with the usual</text><text x="58" y="537" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">changelog + diagram + a review queue like the sides/uncertain pattern.</text>
<text x="40" y="634" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Proposal diagram. Dark (R3). Tiers for part-number↔figure correlation. No build yet — awaiting your final call.</text>
</svg>