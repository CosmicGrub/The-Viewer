<text x="395" y="188" font-size="8.2" font-weight="400" fill="#8fbf9f" text-anchor="middle">append-only decision</text>
<path d="M490,178 L516,178" stroke="#1d9e75" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="520" y="150" width="230" height="56" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="635" y="170" font-size="9.6" font-weight="700" fill="#4f9dff" text-anchor="middle">nsn_aliases(nsn)</text>
<text x="635" y="186" font-size="8.0" font-weight="400" fill="#9aa6b6" text-anchor="middle">decision + correlations variants</text>
<path d="M750,178 L776,178" stroke="#1d9e75" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="780" y="150" width="300" height="56" rx="8" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/>
<text x="930" y="170" font-size="9.4" font-weight="700" fill="#4f9dff" text-anchor="middle">search expands the NSN phrase</text>
<text x="930" y="186" font-size="7.8" font-weight="400" fill="#9aa6b6" text-anchor="middle">&quot;5303 01 674 1467&quot; OR &quot;5305 01 674 1467&quot;</text>
<text x="60" y="238" font-size="10" font-weight="700" fill="#caa24a" text-anchor="start">Example:</text>
<text x="120" y="238" font-size="9.4" font-weight="400" fill="#e6e9ee" text-anchor="start">search 5303-01-674-1467  →  also surfaces pages/cover that wrote it as 5305-01-674-1467 (the confirmed-same bolt).</text>
<text x="60" y="262" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Grounded &amp; reversible: aliases come ONLY from decisions YOU confirmed as &#x27;interchangeable&#x27; — never auto-merged. No decision = no expansion (search is unchanged). Change your mind and</text><text x="60" y="275" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">the latest decision wins; delete reviews.db to undo entirely. The main index is never modified (R1/R6).</text>
<text x="60" y="338" font-size="9" font-weight="400" fill="#2f7d4f" text-anchor="start">Tested: nsn_aliases expands only confirmed NIINs; sparse-query unaffected; alias search surfaces the equivalent NSN&#x27;s pages (23/23 pillar tests).</text>
<text x="56" y="386" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">2 · GPU READINESS + PRIORITIZED OCR QUEUE</text>
<rect x="40" y="396" width="1100" height="250" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<text x="60" y="420" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">python engine\gpu_check.py  →  one clear verdict</text>
<rect x="60" y="432" width="300" height="40" rx="8" fill="#13241c" stroke="#2f7d4f" stroke-width="1"/>
<text x="75" y="457" font-size="9.4" font-weight="700" fill="#bfe6cf" text-anchor="start">GPU READY ✓  (CUDAExecutionProvider)</text>
