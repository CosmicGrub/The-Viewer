<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="600" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Streamlined image search  (v0.85.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Navigate to a TM page -&gt; click an NIIN/NSN/part# -&gt; pick the matching result -&gt; see figure / schematic / 3-D, in a side drawer.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="110" width="250" height="120" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="110" width="6" height="120" rx="3" fill="#4f9dff"/><text x="60" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">1  TM page + Callouts</text><circle cx="64" cy="151" r="3" fill="#4f9dff"/><text x="76" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">open a part&#x27;s manual page</text><circle cx="64" cy="165" r="3" fill="#4f9dff"/><text x="76" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">toggle the callout markers</text><circle cx="64" cy="179" r="3" fill="#4f9dff"/><text x="76" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">NSN / part# / figure are clickable</text><rect x="56" y="200" width="218" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="215" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">/api/callouts (OCR text layer)</text>
<text x="306" y="174" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="322" y="110" width="250" height="120" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="322" y="110" width="6" height="120" rx="3" fill="#caa24a"/><text x="342" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">2  click a number</text><circle cx="346" cy="151" r="3" fill="#caa24a"/><text x="358" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">highlights it ON the page</text><circle cx="346" cy="165" r="3" fill="#caa24a"/><text x="358" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">opens the side drawer</text><circle cx="346" cy="179" r="3" fill="#caa24a"/><text x="358" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">fetches matching results</text><rect x="338" y="200" width="218" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="348" y="215" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">part_record / part_by_number</text>
<text x="588" y="174" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="604" y="110" width="250" height="120" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="604" y="110" width="6" height="120" rx="3" fill="#1d9e75"/><text x="624" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">3  pick a result</text><circle cx="628" cy="151" r="3" fill="#1d9e75"/><text x="640" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">one row per catalogued match</text><circle cx="628" cy="165" r="3" fill="#1d9e75"/><text x="640" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">name + NSN + part#</text><circle cx="628" cy="179" r="3" fill="#1d9e75"/><text x="640" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">click to load its assets</text><rect x="620" y="200" width="218" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="630" y="215" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">the respective match</text>
<text x="870" y="174" font-size="22" fill="#9aa6b6">&#8594;</text>
<rect x="886" y="110" width="254" height="120" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="886" y="110" width="6" height="120" rx="3" fill="#2f7d4f"/><text x="906" y="134" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">4  assets, in place</text><circle cx="910" cy="151" r="3" fill="#2f7d4f"/><text x="922" y="154" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">figure crop (+ loupe magnifier)</text><circle cx="910" cy="165" r="3" fill="#2f7d4f"/><text x="922" y="168" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">live 3-D model (orbit/zoom)</text><circle cx="910" cy="179" r="3" fill="#2f7d4f"/><text x="922" y="182" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">pages/schematics that hold it</text><rect x="902" y="200" width="222" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="912" y="215" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">no leaving the page</text>
<rect x="40" y="256" width="360" height="104" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="278" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">📄 Figure + 🔎 Loupe</text>
<text x="58" y="298" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">The cited figure crop, with the reusable magnifier lens (loupe.js) on it — also wired onto the</text><text x="58" y="311" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">schematics viewer. Hover to magnify, scroll to zoom. Works on any image (barring 3-D).</text>
<rect x="420" y="256" width="360" height="104" rx="12" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="438" y="278" font-size="12" font-weight="700" fill="#1d9e75" text-anchor="start">🧊 Live 3-D (partview.js)</text>
<text x="438" y="298" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">The detailed parametric model embedded in the drawer — PartGeo + GL3D (WebGL), SVG fallback on</text><text x="438" y="311" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">legacy. Same shape engine as the 3-D library.</text>
<rect x="800" y="256" width="340" height="104" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="818" y="278" font-size="12" font-weight="700" fill="#caa24a" text-anchor="start">📃 Pages that hold it</text>
<text x="818" y="298" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Schematics + manual pages referencing the part (threed_refs). Click one -&gt; the viewer jumps</text><text x="818" y="311" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">there AND highlights the matching callout on that page.</text>
<rect x="40" y="378" width="1100" height="52" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="399" font-size="11.5" font-weight="700" fill="#7f77dd" text-anchor="start">Page highlighting (both ends)</text>
<text x="58" y="417" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">The searched number is boxed on the current page when you click it; the resulting part is boxed on the figure/schematic page when you open it — so you always see where the information lives.</text>
<text x="40" y="592" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Diagram. Dark (R3). v0.85.0 · 2026-06-04 · index.html drawer + partview.js + loupe.js · /partview.js /loupe.js. Additive, legacy-safe (R1).</text>
</svg>