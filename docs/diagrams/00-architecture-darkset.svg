<line class="rule" x1="32" y1="836" x2="968" y2="836"/>
<rect x="32" y="852" width="14" height="11" rx="3" fill="#1c2430" stroke="#38414e"/><text x="52" y="861" class="leg">store / table</text>
<rect x="180" y="852" width="14" height="11" rx="3" fill="#1a2740" stroke="#3a4d6e"/><text x="200" y="861" class="leg">engine / user data</text>
<rect x="360" y="852" width="14" height="11" rx="3" fill="#16301f" stroke="#2f5a3e"/><text x="380" y="861" class="leg">text index / output</text>
<rect x="540" y="852" width="14" height="11" rx="3" fill="#3a2f1a" stroke="#6b5526"/><text x="560" y="861" class="leg">queue (OCR/jobs)</text>
<text x="32" y="896" class="sub">All tables added by numbered, additive migrations (R1). New columns are nullable; nothing is dropped destructively; the index is rebuildable from the read-only corpus.</text>
<text x="32" y="914" class="sub">Rule R3 — professional dark theme + PDF export.  Rule R2 — a diagram ships with every addition.  Rule R1 — backwards-compatible, rollbackable.</text>
</svg>
