<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Segoe UI,Arial,sans-serif">
<rect width="1000" height="540" fill="#0d1117"/>
<text x="500" y="42" fill="#e6edf3" font-size="26" font-weight="700" text-anchor="middle">cage.py &#8212; CAGE / NCAGE Code Validator</text>
<text x="500" y="70" fill="#8b949e" font-size="14" text-anchor="middle">v1.12.5 &#183; roadmap Vol.2 #54 &#183; GET /api/cage &#183; structure only &#8212; assignee identity stays PUBLOG's job (R13)</text>

<rect x="80" y="110" width="250" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="205" y="140" fill="#58a6ff" font-size="16" font-weight="700" text-anchor="middle">CAGE token</text>
<text x="205" y="168" fill="#c9d1d9" font-size="13" text-anchor="middle">"19207"  "0VGN7"</text>
<text x="205" y="190" fill="#c9d1d9" font-size="13" text-anchor="middle">"U1234"  "1IO34"</text>
<text x="205" y="216" fill="#8b949e" font-size="12" text-anchor="middle">5-char supplier code on</text>
<text x="205" y="234" fill="#8b949e" font-size="12" text-anchor="middle">every RPSTL part line</text>

<rect x="390" y="95" width="250" height="190" rx="10" fill="#161b22" stroke="#1f6feb"/>
<text x="515" y="124" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">validate() rules</text>
<text x="515" y="150" fill="#c9d1d9" font-size="12.5" text-anchor="middle">exactly 5 characters</text>
<text x="515" y="170" fill="#c9d1d9" font-size="12.5" text-anchor="middle">alphanumeric A-Z / 0-9</text>
<text x="515" y="190" fill="#f0883e" font-size="12.5" text-anchor="middle">no I and no O (hard rule)</text>
<text x="515" y="210" fill="#c9d1d9" font-size="12.5" text-anchor="middle">US: 1st &amp; 5th numeric</text>
<text x="515" y="234" fill="#8b949e" font-size="12" text-anchor="middle">every failed rule &#8594; reasons[]</text>
<text x="515" y="256" fill="#8b949e" font-size="12" text-anchor="middle">scan() only labelled CAGE:/CAGEC</text>

<rect x="700" y="95" width="230" height="80" rx="10" fill="#161b22" stroke="#238636"/>
<text x="815" y="124" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">kind = US</text>
<text x="815" y="148" fill="#c9d1d9" font-size="12" text-anchor="middle">domestic CAGE</text>
<text x="815" y="166" fill="#c9d1d9" font-size="12" text-anchor="middle">19207, 0VGN7</text>

<rect x="700" y="195" width="230" height="90" rx="10" fill="#161b22" stroke="#8957e5"/>
<text x="815" y="222" fill="#a371f7" font-size="15" font-weight="700" text-anchor="middle">kind = NCAGE</text>
<text x="815" y="246" fill="#c9d1d9" font-size="12" text-anchor="middle">NATO/foreign (alpha first)</text>
<text x="815" y="266" fill="#c9d1d9" font-size="12" text-anchor="middle">U1234 &#8212; no name invented</text>

<rect x="230" y="345" width="540" height="92" rx="10" fill="#161b22" stroke="#f0883e"/>
<text x="500" y="374" fill="#f0883e" font-size="15" font-weight="700" text-anchor="middle">R13: structure only, never an assignee</text>
<text x="500" y="399" fill="#c9d1d9" font-size="12.5" text-anchor="middle">invalid token &#8594; valid:false + explicit reasons (I/O, length, charset).</text>
<text x="500" y="419" fill="#c9d1d9" font-size="12.5" text-anchor="middle">company name comes from PUBLOG's CAGE table (/api/publog), not guessed here.</text>

<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/></marker></defs>
<line x1="330" y1="185" x2="388" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
<line x1="640" y1="150" x2="698" y2="135" stroke="#238636" stroke-width="2" marker-end="url(#a)"/>
<line x1="640" y1="215" x2="698" y2="235" stroke="#8957e5" stroke-width="2" marker-end="url(#a)"/>
<line x1="500" y1="285" x2="500" y2="343" stroke="#f0883e" stroke-width="2" marker-end="url(#a)"/>
<text x="500" y="482" fill="#8b949e" font-size="12" text-anchor="middle">stdlib only &#183; pure + unit-testable &#183; additive (R1) &#183; complements nsndecode.py / smrdecode.py / standards.py</text>
<text x="500" y="506" fill="#8b949e" font-size="12" text-anchor="middle">self-test: 19207/0VGN7=US, U1234=NCAGE, 1IO34 rejected (I/O), labelled scan=2</text>
</svg>