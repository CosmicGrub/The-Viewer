<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="620" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Scanned-page crop tightening + image→3D scaffold  (v0.77.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Sharper figure crops on scanned manuals, and an opt-in (clearly-labeled) local image→3D experiment.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="40" y="114" font-size="12.5" font-weight="700" fill="#2f7d4f" text-anchor="start">Figure-crop boundary — now precise on scanned pages</text>
<rect x="40" y="126" width="360" height="168" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="126" width="6" height="168" rx="3" fill="#2f7d4f"/><text x="60" y="150" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔤  OCR word-box caption</text><circle cx="64" cy="167" r="3" fill="#2f7d4f"/><text x="76" y="170" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">No text layer? OCR the page (pytesseract) to find</text><circle cx="64" cy="181" r="3" fill="#2f7d4f"/><text x="76" y="184" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">the &#x27;FIGURE n&#x27; caption, crop the illustration ABOVE it.</text><circle cx="64" cy="195" r="3" fill="#2f7d4f"/><text x="76" y="198" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Gated by VIEWER_FIGCROP_OCR; degrades if no Tesseract.</text><rect x="56" y="264" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="279" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Precise, the requested path.</text>
<rect x="412" y="126" width="360" height="168" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="126" width="6" height="168" rx="3" fill="#1d9e75"/><text x="432" y="150" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📊  Row ink-density fallback</text><circle cx="436" cy="167" r="3" fill="#1d9e75"/><text x="448" y="170" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">No OCR? numpy row-darkness profile finds where the</text><circle cx="436" cy="181" r="3" fill="#1d9e75"/><text x="448" y="184" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">dense parts-table band starts, crop above it.</text><circle cx="436" cy="195" r="3" fill="#1d9e75"/><text x="448" y="198" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Pure CPU, no extra services.</text><rect x="428" y="264" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="279" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Always-available fallback.</text>
<rect x="784" y="126" width="356" height="168" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="126" width="6" height="168" rx="3" fill="#caa24a"/><text x="804" y="150" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">✅  Result</text><circle cx="808" cy="167" r="3" fill="#caa24a"/><text x="820" y="170" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Synthetic image-only page: cropped top 49% via the</text><circle cx="808" cy="181" r="3" fill="#caa24a"/><text x="820" y="184" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">OCR caption (was a loose 62%).</text><circle cx="808" cy="195" r="3" fill="#caa24a"/><text x="820" y="198" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Born-digital pages unchanged. top-62% remains last</text><text x="820" y="209" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">resort.</text><rect x="800" y="264" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="279" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Tighter, verified.</text>
<text x="40" y="316" font-size="12.5" font-weight="700" fill="#7f77dd" text-anchor="start">Local image→3D — EXPERIMENTAL, opt-in, never authoritative</text>
<rect x="40" y="328" width="1100" height="150" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="350" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">Off by default. Watermarked &#x27;ARTISTIC APPROXIMATION — NOT TO SCALE&#x27;. The authoritative image stays the Manual illustration (cited figure).</text>
