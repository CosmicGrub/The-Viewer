<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">v0.19.0 · RPSTL → cited NSN↔figure index · /api/part + /api/coverage · catalog refs in the cart · multi-sheet PDF · suggestion capture. Additive (migration 0004).</text>
