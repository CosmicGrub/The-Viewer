"#1d9e75"/><text x="60" y="304" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔌  jobcard._master_dims()</text><circle cx="64" cy="321" r="3" fill="#1d9e75"/><text x="76" y="324" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">for_subject(subject) → filtered</text><circle cx="64" cy="335" r="3" fill="#1d9e75"/><text x="76" y="338" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">fail-soft → []</text><rect x="56" y="346" width="268" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="66" y="361" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">READER</text><path d="M190 258 L190 280" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="108" width="240" height="268" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="400" y="108" width="6" height="268" rx="3" fill="#4f9dff"/><text x="420" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🧾  Work Order PDF</text><circle cx="424" cy="149" r="3" fill="#4f9dff"/><text x="436" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">New &#x27;Key dimensions &amp; specs&#x27;</text><circle cx="424" cy="163" r="3" fill="#4f9dff"/><text x="436" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">section after Torque</text><circle cx="424" cy="177" r="3" fill="#4f9dff"/><text x="436" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">authoritative vs ext · ranges</text><circle cx="424" cy="191" r="3" fill="#4f9dff"/><text x="436" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">listed in cover contents</text><circle cx="424" cy="205" r="3" fill="#4f9dff"/><text x="436" y="208" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">builds even if only dims</text><rect x="416" y="346" width="208" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="426" y="361" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">/api/jobcard</text><rect x="660" y="108" width="240" height="268" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="660" y="108" width="6" height="268" rx="3" fill="#2f7d4f"/><text x="680" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🛠  Job Card builder</text><circle cx="684" cy="149" r="3" fill="#2f7d4f"/><text x="696" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">&#x27;Key dimensions&#x27; preview card</text><circle cx="684" cy="163" r="3" fill="#2f7d4f"/><text x="696" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">from preview() dimensions_sample</text><circle cx="684" cy="177" r="3" fill="#2f7d4f"/><text x="696" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">counted in readiness total</text><circle cx="684" cy="191" r="3" fill="#2f7d4f"/><text x="696" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">authoritative vs ext tag</text><rect x="676" y="346" width="208" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="686" y="361" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">/jobcard</text><rect x="920" y="108" width="240" height="268" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="920" y="108" width="6" height="268" rx="3" fill="#caa24a"/><text x="940" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📇  Part dossier</text><circle cx="944" cy="149" r="3" fill="#caa24a"/><text x="956" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Lazy &#x27;Key dimensions &amp; specs&#x27;</text><circle cx="944" cy="163" r="3" fill="#caa24a"/><text x="956" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">card fetches /api/master</text><circle cx="944" cy="177" r="3" fill="#caa24a"/><text x="956" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">manual vs ext · unconfirmed</text><circle cx="944" cy="191" r="3" fill="#caa24a"/><text x="956" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">no links · empty-state prompt</text><rect x="936" y="346" width="208" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="946" y="361" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">/dossier</text><path d="M340 300 L400 240" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M340 300 L660 240" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M340 300 L920 240" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><line x1="40" y1="400" x2="1140" y2="400" stroke="#2b333f"/><text x="40" y="426" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">Why it matters</text><rect x="40" y="438" width="1120" height="62" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/><text x="58" y="460" font-size="10.4" font-weight="400" fill="#9aa6b6" text-anchor="start">The dimensional data recovered across the whole wave — measured from the manuals, gap-filled from the Wayback-archived web, consolidated in the Masterfile — now lands directly on the bay-ready Work Order and the part dossier, where a mechanic</text><text x="58" y="475" font-size="10.4" font-weight="400" fill="#9aa6b6" text-anchor="start">actually needs a clearance, capacity, or torque. Manuals stay the source of truth; external values are labelled and unlinked.</text></svg>