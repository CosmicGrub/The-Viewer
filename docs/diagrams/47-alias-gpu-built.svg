<svg viewBox="0 0 1180 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect x="0" y="0" width="1180" height="700" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="20" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — NSN alias map in search + GPU readiness  (v0.33.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Confirmed-interchangeable NSNs now find each other in search; a one-command GPU check + a prioritized OCR queue make the OCR run fast and useful.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="56" y="116" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">1 · CONFIRMED-INTERCHANGEABLE ALIAS MAP (grounded)</text>
<rect x="40" y="126" width="1100" height="228" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="60" y="150" width="210" height="56" rx="8" fill="#1c2430" stroke="#2b333f" stroke-width="1"/>
<text x="165" y="170" font-size="9.6" font-weight="700" fill="#e6e9ee" text-anchor="middle">you mark a NIIN group</text>
<text x="165" y="186" font-size="8.4" font-weight="400" fill="#9aa6b6" text-anchor="middle">&#x27;interchangeable&#x27; on /status</text>
<path d="M270,178 L296,178" stroke="#1d9e75" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="300" y="150" width="190" height="56" rx="8" fill="#13241c" stroke="#2f7d4f" stroke-width="1"/>
