<text x="395" y="452" font-size="9.4" font-weight="700" fill="#f0b3b0" text-anchor="start">CPU ONLY + exact fix</text>
<text x="395" y="466" font-size="8" font-weight="400" fill="#cf9a98" text-anchor="start">(driver / onnxruntime-gpu / CUDA match)</text>
<text x="60" y="500" font-size="10.5" font-weight="700" fill="#e6e9ee" text-anchor="start">OCR queue — prioritized (parts catalogs first):</text>
