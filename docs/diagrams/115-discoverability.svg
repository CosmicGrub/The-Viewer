<svg viewBox="0 0 1180 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="700" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Discoverability — the palette was dead; now it opens everywhere   v0.99.11</text>
<text x="40" y="70" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Everything built this session was reachable only by typing the URL. Fix: revive Ctrl+K (it loaded on NO page), and surface the tools in the menu.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<text x="40" y="112" font-size="13" font-weight="700" fill="#e06b5a" text-anchor="start">THE BUG</text>
<rect x="40" y="126" width="545" height="150" rx="12" fill="#171d26" stroke="#e06b5a" stroke-width="1"/>
<circle cx="56" cy="147" r="2.4" fill="#e06b5a"/>
<text x="66" y="150" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">palette.js existed + /palette.js was served — but NO html page included it.</text>
<circle cx="56" cy="166" r="2.4" fill="#e06b5a"/>
<text x="66" y="169" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">So &#x27;press Ctrl+K anywhere&#x27; (in the Help link) did literally nothing.</text>
<circle cx="56" cy="185" r="2.4" fill="#e06b5a"/>
<text x="66" y="188" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Its &#x27;Search&#x27; action went to /?ex= — a param the home page never reads,</text>
<circle cx="56" cy="204" r="2.4" fill="#e06b5a"/>
<text x="66" y="207" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">so even when opened, searching from the palette silently did nothing.</text>
<circle cx="56" cy="223" r="2.4" fill="#e06b5a"/>
<text x="66" y="226" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">Net effect: a whole command palette shipped dark for weeks.</text>
<text x="604" y="112" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="start">THE FIX</text>
<rect x="604" y="126" width="536" height="150" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<circle cx="620" cy="147" r="2.4" fill="#2f7d4f"/>
<text x="630" y="150" font-size="9.6" font-weight="400" fill="#e6e9ee" text-anchor="start">Added &lt;script src=&quot;/palette.js&quot;&gt; to home + 8 tool pages (solve, procedure,</text>
<text x="634" y="169" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">dossier, partdiff, locate, coverage, jobcard, deepzoom). Ctrl+K now opens.</text>
<circle cx="620" cy="185" r="2.4" fill="#2f7d4f"/>
<text x="630" y="188" font-size="9.6" font-weight="400" fill="#e6e9ee" text-anchor="start">Search action → /?q=, plus a home ?q= deep-link handler in palette.js that</text>
<text x="634" y="207" font-size="9.6" font-weight="400" fill="#9aa6b6" text-anchor="start">prefills #q and calls runSearch — /?q=&lt;query&gt; actually runs now.</text>
<circle cx="620" cy="223" r="2.4" fill="#2f7d4f"/>
<text x="630" y="226" font-size="9.6" font-weight="400" fill="#e6e9ee" text-anchor="start">verify_ui.py now node --checks palette.js + deepzoom.js host-side too.</text>
<line x1="40" y1="292" x2="1140" y2="292" stroke="#2b333f"/>
<text x="40" y="320" font-size="13" font-weight="700" fill="#4f9dff" text-anchor="start">NOW REACHABLE IN ONE KEYSTROKE (Ctrl+K) OR THE 🧰 TOOLS MENU</text>
