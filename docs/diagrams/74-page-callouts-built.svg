<svg viewBox="0 0 1180 612" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa6b6"/></marker></defs>
<rect x="0" y="0" width="1180" height="612" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">BUILT — OCR-driven page callouts  (v0.60.0)   ·  Batch 2 of 3</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">Turn the part numbers, NSNs and figure references buried in a page&#x27;s text into clickable jumps — straight to the part dossier, Look-Alike Parts, or the cited figure.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="224" height="92" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="58" y="133" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">📄  One page&#x27;s body_text</text>
<text x="58" y="153" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">read a single indexed row —</text><text x="58" y="164" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">native-text OR OCR&#x27;d page (OCR fills</text><text x="58" y="175" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">body_text).</text>
<rect x="300" y="108" width="224" height="92" rx="12" fill="#171d26" stroke="#1d9e75" stroke-width="1"/>
<text x="318" y="133" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  Extract callouts</text>
<text x="318" y="153" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">NSN regex · labeled P/N · FIG refs —</text><text x="318" y="164" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">deduped (dashed + bare NSN collapse</text><text x="318" y="175" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">to one).</text>
<rect x="560" y="108" width="224" height="92" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="578" y="133" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">📐  Anchor to word boxes</text>
<text x="578" y="153" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">match each token to a</text><text x="578" y="164" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">get_text(&#x27;words&#x27;) box → normalized</text><text x="578" y="175" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">coords (native pages only).</text>
<rect x="820" y="108" width="320" height="92" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="838" y="133" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">🏷  Hotspots + chip bar</text>
<text x="838" y="153" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">numbered dots on the image where boxes exist; a</text><text x="838" y="164" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">clickable chip bar always (works on OCR pages with</text><text x="838" y="175" font-size="9" font-weight="400" fill="#9aa6b6" text-anchor="start">no coords).</text>
<line x1="264" y1="154" x2="300" y2="154" stroke="#9aa6b6" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="524" y1="154" x2="560" y2="154" stroke="#9aa6b6" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="784" y1="154" x2="820" y2="154" stroke="#9aa6b6" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="220" width="360" height="206" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="220" width="6" height="206" rx="3" fill="#caa24a"/><text x="60" y="244" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🏷  Three callout kinds → one click</text><circle cx="64" cy="261" r="3" fill="#caa24a"/><text x="76" y="264" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">NSN (most precise, incl. bare 13-digit) → opens the part</text><text x="76" y="275" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">dossier.</text><circle cx="64" cy="286" r="3" fill="#caa24a"/><text x="76" y="289" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Labeled part number (P/N: …, PART NO. …) → opens</text><text x="76" y="300" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Look-Alike Parts.</text><circle cx="64" cy="311" r="3" fill="#caa24a"/><text x="76" y="314" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">FIG / FIGURE n(-n) → find-in-manual jump to that figure in</text><text x="76" y="325" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">THIS document.</text><circle cx="64" cy="336" r="3" fill="#caa24a"/><text x="76" y="339" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Deduped; capped at 60 per page; verbatim from the manual —</text><text x="76" y="350" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">never invented.</text><rect x="56" y="396" width="328" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="66" y="411" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Buried tokens become one-tap jumps.</text>
<rect x="412" y="220" width="360" height="206" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="220" width="6" height="206" rx="3" fill="#1d9e75"/><text x="432" y="244" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📐  Positioned where we can locate it</text><circle cx="436" cy="261" r="3" fill="#1d9e75"/><text x="448" y="264" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Native-text pages: each token is matched to its PyMuPDF</text><text x="448" y="275" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">word box → a numbered dot sits ON the spot; dots follow</text><text x="448" y="286" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">tilt/zoom and flip with the page.</text><circle cx="436" cy="297" r="3" fill="#1d9e75"/><text x="448" y="300" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">OCR-only pages have body_text but no word boxes → no dots,</text><text x="448" y="311" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">but the SAME callouts appear in the chip bar.</text><circle cx="436" cy="322" r="3" fill="#1d9e75"/><text x="448" y="325" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Honest: we only place a dot we can actually locate.</text><rect x="428" y="396" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="411" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Dots on native pages · chips everywhere.</text>
<rect x="784" y="220" width="356" height="206" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="220" width="6" height="206" rx="3" fill="#2f7d4f"/><text x="804" y="244" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🛡  Read-only &amp; safe with the scan</text><circle cx="808" cy="261" r="3" fill="#2f7d4f"/><text x="820" y="264" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">One /api/callouts fetch per page — a single indexed row +</text><text x="820" y="275" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">the page&#x27;s word list. No writes (R1/R6).</text><circle cx="808" cy="286" r="3" fill="#2f7d4f"/><text x="820" y="289" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">WAL → these reads never block the OCR writer; runs fine</text><text x="820" y="300" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">mid-scan.</text><circle cx="808" cy="311" r="3" fill="#2f7d4f"/><text x="820" y="314" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Wired into the main viewer (🏷 Callouts toggle) AND the</text><text x="820" y="325" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Schematics gate (chip bar).</text><circle cx="808" cy="336" r="3" fill="#2f7d4f"/><text x="820" y="339" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Shared extractor page_callouts() — Batch 3 (3D) reuses</text><text x="820" y="350" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">it.</text><rect x="800" y="396" width="324" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="810" y="411" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Read-only · no OCR contention · reused by Batch 3.</text>
<rect x="40" y="448" width="1100" height="84" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="470" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED</text>
<text x="58" y="488.0" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Isolation test of the extractor: on a native page, a dashed NSN and its bare-digit twin collapsed to one dossier link, two labeled part numbers and two FIG refs were found, and the NSN</text><text x="58" y="500.5" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">anchored to its word box. On an OCR-only page (no boxes) the same NSN + FIG came through as chips with no coords — exactly the fallback. Main-viewer callout JS and the Schematics chip</text><text x="58" y="513.0" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">loader both syntax-checked and run. Server function + /api/callouts route confirmed on the host.</text>
<text x="40" y="600" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.60.0 · 2026-06-02 · viewer_app.py (page_callouts + /api/callouts) · index.html (🏷 toggle, hotspots+chips) · schematics.html (chip bar). Additive (R1/R6).</text>
</svg>