<text x="76" y="594" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">5  everything else</text>
<text x="360" y="594" font-size="9.4" font-weight="700" fill="#e6e9ee" text-anchor="start">59,240 pages</text>
<text x="60" y="624" font-size="9.2" font-weight="400" fill="#2f7d4f" text-anchor="start">Status: 1.6% done · 93.5% of all pages already searchable · 275 stuck pages recovered. The run itself is GPU time on your box (resumable).</text>
<text x="640" y="520" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">A partial run already helps: the pages mechanics search most (parts catalogs)</text><text x="640" y="533" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">are OCR&#x27;d first. Watch live progress on /status; stop and re-run anytime. OCR</text><text x="640" y="546" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">only ADDS text (R6).</text>
<text x="40" y="690" font-size="9.2" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.33.0 · 2026-06-02 · companions: SETUP-GPU.md, OCR-RUN-GUIDE.md.</text>
