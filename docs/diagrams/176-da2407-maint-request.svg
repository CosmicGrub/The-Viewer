<text x="505" y="200" fill="#c9d1d9" font-size="12" text-anchor="middle">FAULT / DEFICIENCY block</text>
<text x="505" y="220" fill="#c9d1d9" font-size="12" text-anchor="middle">WORK REQUESTED block</text>
<text x="505" y="240" fill="#c9d1d9" font-size="12" text-anchor="middle">remarks + signature lines</text>
<text x="505" y="264" fill="#8b949e" font-size="11" text-anchor="middle">pure &#8594; PDF bytes, 503 if no reportlab</text>

<rect x="710" y="105" width="230" height="80" rx="10" fill="#161b22" stroke="#238636"/>
<text x="825" y="134" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">GET /api/form_2407</text>
