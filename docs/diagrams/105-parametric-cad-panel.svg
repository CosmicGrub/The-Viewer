<svg viewBox="0 0 1180 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="520" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Live parametric CAD panel  (v0.81.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">The 3-D models were already procedural; now you can drive the parameters and the geometry rebuilds live.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="200" rx="3" fill="#4f9dff"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🎛  Edit parameters</text><circle cx="64" cy="149" r="3" fill="#4f9dff"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Family selector + Length / Width / Height /</text><circle cx="64" cy="163" r="3" fill="#4f9dff"/><text x="76" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Diameter / Bore — plus Teeth (gears) and</text><circle cx="64" cy="177" r="3" fill="#4f9dff"/><text x="76" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Coils/turns (springs).</text><circle cx="64" cy="191" r="3" fill="#4f9dff"/><text x="76" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Cited from FLIS, but editable.</text><rect x="56" y="278" width="328" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="293" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">Real parametric inputs.</text>
<rect x="412" y="108" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="108" width="6" height="200" rx="3" fill="#2f7d4f"/><text x="432" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">⚙  Procedural rebuild</text><circle cx="436" cy="149" r="3" fill="#2f7d4f"/><text x="448" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">partgeo.js generates the mesh from the params</text><circle cx="436" cy="163" r="3" fill="#2f7d4f"/><text x="448" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">(hex head + threads, races+balls, gear teeth,</text><circle cx="436" cy="177" r="3" fill="#2f7d4f"/><text x="448" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">helical coils, holed gaskets…). Edits rebuild</text><circle cx="436" cy="191" r="3" fill="#2f7d4f"/><text x="448" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">the geometry live — WebGL or SVG fallback.</text><rect x="428" y="278" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="438" y="293" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Generated, not a fixed model.</text>
<rect x="784" y="108" width="356" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="108" width="6" height="200" rx="3" fill="#1d9e75"/><text x="804" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">↺  Cited + reset</text><circle cx="808" cy="149" r="3" fill="#1d9e75"/><text x="820" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Dimensions come from FLIS characteristics.</text><circle cx="808" cy="163" r="3" fill="#1d9e75"/><text x="820" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">↺ Reset to FLIS dims restores the cited values.</text><circle cx="808" cy="177" r="3" fill="#1d9e75"/><text x="820" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">13 families, all verified valid; teeth/turns</text><circle cx="808" cy="191" r="3" fill="#1d9e75"/><text x="820" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">measurably change the geometry.</text><rect x="800" y="278" width="324" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="810" y="293" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Explore, then snap back.</text>
<rect x="40" y="324" width="1100" height="76" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="58" y="345" font-size="11.5" font-weight="700" fill="#caa24a" text-anchor="start">What this is (and isn&#x27;t)</text>
<text x="58" y="365" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">This is procedural / parametric CAD: the geometry is computed from named parameters, so a bolt, gear or spring is a function of its dimensions — change a value and the model reflects it. It is NOT a</text><text x="58" y="377" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">scanned solid model of the exact OEM part (those are ITAR-controlled); it&#x27;s a dimensionally-grounded representative built from the cited FLIS data, paired with the authoritative Manual illustration</text><text x="58" y="389" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">tab for the real exploded view.</text>
<rect x="40" y="408" width="1100" height="66" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="58" y="429" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED</text>
<text x="58" y="449" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">All 13 families build valid meshes with the new params; gear teeth (12 vs 40) and spring turns (4 vs 20) change the geometry; backward-compatible with no extra params. Client-only, ES5 + WebGL with</text><text x="58" y="461" font-size="9.3" font-weight="400" fill="#9aa6b6" text-anchor="start">SVG fallback (RPS-safe).</text>
<text x="40" y="514" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.81.0 · 2026-06-03 · partgeo.js (parametric) · threed.html PARAMETRIC CAD panel + live rebuild.</text>
</svg>