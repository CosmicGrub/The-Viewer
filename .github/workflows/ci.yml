name: CI

# Previously nothing enforced pytest, tsc -b, or a frontend build before
# merge (finding #10) — this runs the same checks documented in the
# README's Testing/Frontend sections on every push and PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        # test_extraction.py is a bare import/sanity check for the
        # extraction dependencies installed just above; every other test
        # module is hermetic (mocked Meilisearch, stubbed OCR stack — see
        # tests/test_extract_pdf_ocr.py) and needs no live services.
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc -b --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
