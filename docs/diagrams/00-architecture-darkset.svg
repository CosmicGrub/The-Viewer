<path class="edge" d="M356,468 L390,468"/>
<path class="edge" d="M540,468 L574,468"/>
<path class="edge" d="M734,468 L768,468"/>

<!-- SECTION D: data model -->
<line class="rule" x1="32" y1="528" x2="968" y2="528"/>
<text x="32" y="558" class="sec">4 · Data Model (versioned · additive)</text>

<!-- documents -->
<rect x="32" y="576" width="210" height="150" rx="9" fill="#1c2430" stroke="#38414e"/>
<text x="42" y="596" class="lbl">documents</text><line x1="42" y1="604" x2="232" y2="604" stroke="#2a2f37"/>
<text x="42" y="620" class="mono">id PK · path · fingerprint</text>
<text x="42" y="636" class="mono">type · tm_number · nsn</text>
<text x="42" y="652" class="mono">title · vehicle</text>
<text x="42" y="668" class="mono">page_count · status</text>
<text x="42" y="692" class="sub">one row per source file</text>

<!-- pages -->
<rect x="272" y="576" width="210" height="150" rx="9" fill="#1c2430" stroke="#38414e"/>
<text x="282" y="596" class="lbl">pages</text><line x1="282" y1="604" x2="472" y2="604" stroke="#2a2f37"/>
<text x="282" y="620" class="mono">id PK · document_id FK</text>
<text x="282" y="636" class="mono">page_number</text>
<text x="282" y="652" class="mono">body_text · char_count</text>
<text x="282" y="668" class="mono">source · ocr_status</text>
<text x="282" y="692" class="sub">one row per page</text>

<!-- pages_fts -->
<rect x="512" y="576" width="210" height="72" rx="9" fill="#16301f" stroke="#2f5a3e"/>
<text x="522" y="596" class="lbl">pages_fts</text><line x1="522" y1="604" x2="712" y2="604" stroke="#2a3b2e"/>
<text x="522" y="622" class="mono">FTS5 full-text index</text>
<text x="522" y="638" class="mono">(mirrors pages.body_text)</text>

<!-- jobs -->
<rect x="512" y="660" width="210" height="66" rx="9" fill="#3a2f1a" stroke="#6b5526"/>
<text x="522" y="680" class="lbl">jobs</text><line x1="522" y1="688" x2="712" y2="688" stroke="#4a3c22"/>
<text x="522" y="704" class="mono">page_id · stage · state</text>
<text x="522" y="720" class="mono">attempts · last_error</text>

<!-- right column: parts/variants/procedures/sessions -->
<rect x="752" y="576" width="216" height="44" rx="9" fill="#1c2430" stroke="#38414e"/>
<text x="762" y="595" class="lbl">parts</text>
<text x="762" y="611" class="mono">name · part_number · nsn</text>

<rect x="752" y="628" width="216" height="44" rx="9" fill="#1c2430" stroke="#38414e"/>
<text x="762" y="647" class="lbl">part_variants</text>
<text x="762" y="663" class="mono">differs_how · how_to_tell</text>

<rect x="752" y="680" width="216" height="46" rx="9" fill="#1c2430" stroke="#38414e"/>
<text x="762" y="699" class="lbl">procedures</text>
<text x="762" y="715" class="mono">kind · steps · tools</text>

<!-- sessions row -->
<rect x="32" y="744" width="330" height="64" rx="9" fill="#1a2740" stroke="#3a4d6e"/>
<text x="42" y="764" class="lbl">sessions  (onboarding)</text><line x1="42" y1="772" x2="352" y2="772" stroke="#27344d"/>
<text x="42" y="788" class="mono">mechanic · bumper_number · tm</text>
<text x="42" y="802" class="mono">uoc · tech_status · motor_sergeant</text>

<rect x="382" y="744" width="270" height="64" rx="9" fill="#1a2740" stroke="#3a4d6e"/>
<text x="392" y="764" class="lbl">faults</text><line x1="392" y1="772" x2="642" y2="772" stroke="#27344d"/>
<text x="392" y="788" class="mono">session_id FK</text>
<text x="392" y="802" class="mono">description (damage/work)</text>

<rect x="672" y="744" width="296" height="64" rx="9" fill="#1a2740" stroke="#3a4d6e"/>
<text x="682" y="764" class="lbl">request_items  (104th sheet)</text><line x1="682" y1="772" x2="958" y2="772" stroke="#27344d"/>
<text x="682" y="788" class="mono">item_name · nsn · qty · fig · part</text>
<text x="682" y="802" class="mono">unit_price · aac · arc (FEDLOG)</text>

<!-- relationships -->
<path class="edge" d="M242,650 L272,650"/>
<path class="edge" d="M482,620 L512,612"/>
