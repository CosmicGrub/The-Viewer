<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>THE VIEWER OCR indexing build and feature set</title>
<desc>The shipped indexing engine: a read-only corpus feeds resumable crawl and OCR commands that write a versioned SQLite FTS5 index, which powers offline search. Includes the durable job queue, the database tables, the shipped files, and the real counts from this session.</desc>
