<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>THE VIEWER — Express modal + Schematics-on-every-query (PROPOSAL, dark)</title>
<desc>Proposal: the onboarding modal doubles as an express search that can bypass to the page/hub for exact input; and every query always shows a graphic via a fallback chain (cited figure, else the manual page, else the vehicle schematic set), with a smart install-location prompt. Precision grows via a figures inventory and OCR.</desc>
<style>
  .bg{fill:#0f1419}.title{font-size:18px;font-weight:700;fill:#e6e9ee}
  .sub{font-size:10px;fill:#9aa6b6}.lbl{font-size:12px;font-weight:600;fill:#e6e9ee}
  .s{font-size:9.3px;fill:#9aa6b6}.h{font-size:11px;font-weight:700;fill:#93a1b3;letter-spacing:.5px}
  .edge{stroke:#9aa5b1;stroke-width:1.6;fill:none;marker-end:url(#a)}.edge.d{stroke-dasharray:5 4}
  .leg{font-size:10px;fill:#9aa6b6}.tag{font-size:9px;fill:#caa24a}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="600"/>
<text x="32" y="40" class="title">THE VIEWER — Express modal + Schematics on every query</text>
<text x="32" y="60" class="sub">PROPOSAL · dark (R3) · guarantee = a relevant graphic is ALWAYS shown (fallback chain) · nothing invented (R1)</text>
<line x1="32" y1="74" x2="968" y2="74" stroke="#2a2f37"/>

<!-- express modal -->
<text x="32" y="100" class="h">① EXPRESS MODAL (bypass when exact)</text>
<rect x="32" y="112" width="200" height="78" rx="10" fill="#1a2740" stroke="#3a4d6e"/>
<text x="132" y="136" text-anchor="middle" class="lbl">Onboarding modal</text>
<text x="132" y="153" text-anchor="middle" class="s">bumper# · fault · TM</text>
<text x="132" y="170" text-anchor="middle" class="s">+ "What do you need?" (opt.)</text>
<rect x="268" y="100" width="150" height="42" rx="9" fill="#16301f" stroke="#2f5a3e"/>
<text x="343" y="120" text-anchor="middle" class="lbl">Exact NSN / part#</text>
<text x="343" y="135" text-anchor="middle" class="s">→ jump to page / hub</text>
<rect x="268" y="150" width="150" height="42" rx="9" fill="#1c2430" stroke="#38414e"/>
<text x="343" y="170" text-anchor="middle" class="lbl">Otherwise</text>
<text x="343" y="185" text-anchor="middle" class="s">→ becomes first search</text>
<path class="edge" d="M232,140 L268,121"/>
<path class="edge" d="M232,160 L268,171"/>

<!-- every query -> schematics panel -->
<text x="460" y="100" class="h">② EVERY QUERY → SCHEMATICS &amp; INSTALL PANEL</text>
<rect x="460" y="112" width="150" height="78" rx="10" fill="#1c2430" stroke="#38414e"/>
<text x="535" y="140" text-anchor="middle" class="lbl">Result / part</text>
<text x="535" y="158" text-anchor="middle" class="s">found</text>
<rect x="646" y="92" width="150" height="40" rx="9" fill="#16301f" stroke="#2f5a3e"/>
<text x="721" y="110" text-anchor="middle" class="s">Best: cited FIG #</text>
<text x="721" y="124" text-anchor="middle" class="s">(from matched line)</text>
<rect x="646" y="138" width="150" height="40" rx="9" fill="#16301f" stroke="#2f5a3e"/>
<text x="721" y="156" text-anchor="middle" class="s">Good: the manual page</text>
<text x="721" y="170" text-anchor="middle" class="s">(itself a diagram)</text>
<rect x="646" y="184" width="150" height="40" rx="9" fill="#16301f" stroke="#2f5a3e"/>
<text x="721" y="202" text-anchor="middle" class="s">Always: vehicle</text>
<text x="721" y="216" text-anchor="middle" class="s">schematic set</text>
<text x="646" y="86" class="tag">fallback chain — never empty</text>
<path class="edge" d="M610,138 L646,112"/>
<path class="edge" d="M610,150 L646,158"/>
<path class="edge" d="M610,165 L646,200"/>

<rect x="828" y="120" width="140" height="84" rx="10" fill="#1a2740" stroke="#3a4d6e"/>
<text x="898" y="146" text-anchor="middle" class="lbl">Smart prompt</text>
<text x="898" y="164" text-anchor="middle" class="s">"Installs at FIG 84 —</text>
<text x="898" y="178" text-anchor="middle" class="s">see on [vehicle]"</text>
<text x="898" y="194" text-anchor="middle" class="s">+ location (verbatim)</text>
<path class="edge" d="M796,150 L828,158"/>

<line x1="32" y1="250" x2="968" y2="250" stroke="#2a2f37"/>
<!-- data work -->
<text x="32" y="276" class="h">③ DATA WORK — makes it precise (progressive)</text>
<rect x="32" y="288" width="190" height="64" rx="10" fill="#3a2f1a" stroke="#6b5526"/>
<text x="127" y="314" text-anchor="middle" class="lbl">Figures inventory</text>
<text x="127" y="332" text-anchor="middle" class="s">extract FIG refs → figures table</text>
<rect x="258" y="288" width="210" height="64" rx="10" fill="#3a2f1a" stroke="#6b5526"/>
<text x="363" y="310" text-anchor="middle" class="lbl">Link schematics → vehicle/part</text>
<text x="363" y="328" text-anchor="middle" class="s">~6,300 .svgz + "Schematics" folders</text>
<text x="363" y="343" text-anchor="middle" class="s">+ DWF / embedded figures</text>
<rect x="504" y="288" width="190" height="64" rx="10" fill="#16301f" stroke="#2f5a3e"/>
<text x="599" y="314" text-anchor="middle" class="lbl">Precise: part → FIG</text>
<text x="599" y="332" text-anchor="middle" class="s">exact install figure, cited</text>
<rect x="730" y="288" width="238" height="64" rx="10" fill="#1c2430" stroke="#38414e"/>
<text x="849" y="310" text-anchor="middle" class="lbl">OCR dependency</text>
<text x="849" y="328" text-anchor="middle" class="s">scanned manuals' FIG citations</text>
<text x="849" y="343" text-anchor="middle" class="s">appear after OCR (→ GPU)</text>
<path class="edge" d="M222,320 L258,320"/>
<path class="edge" d="M468,320 L504,320"/>
<path class="edge d" d="M694,330 L730,330"/>

<line x1="32" y1="386" x2="968" y2="386" stroke="#2a2f37"/>
<text x="32" y="412" class="h">PHASES</text>
<rect x="32" y="424" width="300" height="40" rx="8" fill="#1a2740" stroke="#3a4d6e"/><text x="182" y="449" text-anchor="middle" class="s">A (now): modal express / bypass</text>
<rect x="350" y="424" width="320" height="40" rx="8" fill="#16301f" stroke="#2f5a3e"/><text x="510" y="449" text-anchor="middle" class="s">B (now): always-on Schematics &amp; install panel + smart prompt</text>
<rect x="688" y="424" width="280" height="40" rx="8" fill="#3a2f1a" stroke="#6b5526"/><text x="828" y="449" text-anchor="middle" class="s">C (progressive): figures inventory + linkage</text>

<rect x="32" y="492" width="14" height="11" rx="3" fill="#1a2740" stroke="#3a4d6e"/><text x="52" y="501" class="leg">input / prompt</text>
<rect x="180" y="492" width="14" height="11" rx="3" fill="#16301f" stroke="#2f5a3e"/><text x="200" y="501" class="leg">graphic shown (anchored)</text>
<rect x="400" y="492" width="14" height="11" rx="3" fill="#3a2f1a" stroke="#6b5526"/><text x="420" y="501" class="leg">extraction / linkage</text>
<rect x="560" y="492" width="14" height="11" rx="3" fill="#1c2430" stroke="#38414e"/><text x="580" y="501" class="leg">result / dependency</text>
<text x="32" y="536" class="sub">Guarantee: a relevant graphic ALWAYS appears (page + vehicle schematics as the floor); part-specific figure surfaced &amp; cited when the manual provides it.</text>
<text x="32" y="556" class="sub">Honesty: install locations &amp; figure refs are verbatim from the manual with TM#/page — never AI-invented. Precision grows with OCR.</text>
<text x="32" y="576" class="sub">Rule R1 read-only/anchored · R2 this diagram · R3 dark+PDF · (R4 changelog + R5 visual panel added when built).</text>
</svg>
