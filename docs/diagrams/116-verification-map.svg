<text x="54" y="164" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">restructure kept the 0.90–0.95</text>
<text x="54" y="179" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">imagery/CAD/schematic stack wired;</text>
<text x="54" y="194" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">CAD_VERSION 7, routes registered,</text>
<text x="54" y="209" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">material_for, schemgraph, localmodel.</text>
<rect x="316" y="118" width="268" height="150" rx="11" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="330" y="142" font-size="11.5" font-weight="700" fill="#4f9dff" text-anchor="start">test_features_modules</text>
<text x="330" y="164" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">every features/*.py imports;</text>
<text x="330" y="179" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">registry populated; new schemgraph</text>
