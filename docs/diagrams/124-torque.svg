<svg viewBox="0 0 1180 650" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="650" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">Torque quick-reference   v0.99.20</text>
<text x="40" y="70" font-size="11.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Torque is safety-critical and looked up constantly — but it had no page (only buried in procedures/Work Order). New /torque surfaces it, with a unit converter.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="110" width="1100" height="250" rx="12" fill="#171d26" stroke="#7fbfff" stroke-width="1.2"/>
<text x="58" y="138" font-size="14" font-weight="700" fill="#7fbfff" text-anchor="start">🔩 Torque quick-reference</text>
<rect x="58" y="152" width="520" height="78" rx="10" fill="#10151c" stroke="#223" stroke-width="1"/>
<text x="70" y="172" font-size="10.5" font-weight="600" fill="#7fbfff" text-anchor="start">Converter — ft-lb · in-lb · N·m</text>
<rect x="70" y="182" width="150" height="34" rx="8" fill="#16202b" stroke="#26333f" stroke-width="1"/>
<text x="82" y="200" font-size="15" font-weight="700" fill="#cfe" text-anchor="start">30</text>
<text x="82" y="212" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">ft-lb</text>
<rect x="235" y="182" width="150" height="34" rx="8" fill="#16202b" stroke="#26333f" stroke-width="1"/>
<text x="247" y="200" font-size="15" font-weight="700" fill="#cfe" text-anchor="start">360</text>
<text x="247" y="212" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">in-lb</text>
<rect x="400" y="182" width="150" height="34" rx="8" fill="#16202b" stroke="#26333f" stroke-width="1"/>
<text x="412" y="200" font-size="15" font-weight="700" fill="#cfe" text-anchor="start">40.67</text>
<text x="412" y="212" font-size="8.5" font-weight="400" fill="#9aa6b6" text-anchor="start">N·m</text>
<rect x="58" y="240" width="1064" height="96" rx="10" fill="#10151c" stroke="#223" stroke-width="1"/>
<text x="72" y="262" font-size="15" font-weight="700" fill="#2f7d4f" text-anchor="start">30–35 ft-lb</text>
<text x="190" y="262" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">= 360…420 in-lb · 40.67…47.45 N·m</text>
<text x="72" y="282" font-size="10" font-weight="400" fill="#cdd8e4" text-anchor="start">“Tighten the alternator mounting bolts to 30-35 ft-lb in the sequence shown.”</text>
<text x="72" y="316" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">HMMWV M998 · TM 9-2320-280-24P · p.215</text>
<rect x="370" y="306" width="82" height="16" rx="6" fill="#16202b" stroke="#2f4858" stroke-width="1"/>
<text x="380" y="318" font-size="8.4" font-weight="400" fill="#4f9dff" text-anchor="start">view page ↗</text>
<line x1="40" y1="376" x2="1140" y2="376" stroke="#2b333f"/>
<text x="40" y="404" font-size="13" font-weight="700" fill="#4f9dff" text-anchor="start">WHAT IT DOES</text>
<rect x="40" y="418" width="545" height="118" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="442" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Search a part / NSN / fastener → every cited torque value</text>
<text x="58" y="460" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">(from /api/torque), each with context + page citation that</text>
<text x="58" y="478" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">opens the real page in Deep-Zoom.</text>
<text x="58" y="496" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Live converter + per-result conversion to the other two units.</text>
<text x="58" y="514" font-size="9.8" font-weight="400" fill="#9aa6b6" text-anchor="start">Parses &#x27;30–35 ft-lb&#x27;, &#x27;18 in-lb&#x27;, &#x27;45 N·m&#x27; (ranges handled).</text>
<text x="604" y="404" font-size="13" font-weight="700" fill="#2f7d4f" text-anchor="start">VERIFIED / R1</text>
<rect x="604" y="418" width="536" height="118" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<circle cx="620" cy="437" r="2.4" fill="#2f7d4f"/>
<text x="632" y="440" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">inline JS passes node --check; math verified (30 ft-lb = 40.67 N·m = 360 in-lb).</text>
<circle cx="620" cy="453" r="2.4" fill="#2f7d4f"/>
<text x="632" y="456" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">FOUND &amp; FIXED a parse bug: unit normalizer didn&#x27;t strip the &#x27;·&#x27; in N·m → 45 N·m returned null.</text>
<circle cx="620" cy="469" r="2.4" fill="#2f7d4f"/>
<text x="632" y="472" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Wired: /torque in _PAGES · 🔩 in palette + Tools menu · in verify_ui.py. Citations → /deepzoom.</text>
<circle cx="620" cy="485" r="2.4" fill="#2f7d4f"/>
<text x="632" y="488" font-size="9.2" font-weight="400" fill="#9aa6b6" text-anchor="start">Additive &amp; rollbackable: one page + one route + two menu entries. No index writes (R1/R6).</text>
<text x="40" y="642" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Markup. Dark (R3). v0.99.20 · 2026-07-01 · ui/torque.html + /torque + converter. Read-only. R1/R6.</text>
</svg>