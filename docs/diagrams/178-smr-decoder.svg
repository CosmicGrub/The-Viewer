<text x="167" y="232" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">Source (1-2)</text>
<text x="167" y="256" fill="#c9d1d9" font-size="11.5" text-anchor="middle">how it is obtained</text>
<text x="167" y="276" fill="#c9d1d9" font-size="11.5" text-anchor="middle">PA = procured &amp; stocked</text>
<text x="167" y="296" fill="#8b949e" font-size="11" text-anchor="middle">25 curated source codes</text>
<text x="167" y="314" fill="#8b949e" font-size="11" text-anchor="middle">(P*/K*/M*/A*/X*)</text>

<rect x="285" y="205" width="215" height="120" rx="10" fill="#161b22" stroke="#238636"/>
<text x="392" y="232" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">Use (3)</text>
<text x="392" y="256" fill="#c9d1d9" font-size="11.5" text-anchor="middle">who may R&amp;R</text>
<text x="392" y="276" fill="#c9d1d9" font-size="11.5" text-anchor="middle">O = unit/org level</text>
<text x="392" y="298" fill="#8b949e" font-size="11" text-anchor="middle">C/O/F/H/L/D/Z/B</text>

<rect x="510" y="205" width="215" height="120" rx="10" fill="#161b22" stroke="#8957e5"/>
<text x="617" y="232" fill="#a371f7" font-size="14" font-weight="700" text-anchor="middle">Repair (4)</text>
<text x="617" y="256" fill="#c9d1d9" font-size="11.5" text-anchor="middle">lowest full-repair level</text>
<text x="617" y="276" fill="#c9d1d9" font-size="11.5" text-anchor="middle">Z = no repair authorized</text>
<text x="617" y="298" fill="#8b949e" font-size="11" text-anchor="middle">shared level table</text>

<rect x="735" y="205" width="205" height="120" rx="10" fill="#161b22" stroke="#f0883e"/>
<text x="837" y="232" fill="#f0883e" font-size="14" font-weight="700" text-anchor="middle">Recoverability (5)</text>
<text x="837" y="256" fill="#c9d1d9" font-size="11.5" text-anchor="middle">what to do on failure</text>
<text x="837" y="276" fill="#c9d1d9" font-size="11.5" text-anchor="middle">Z = discard (nonreparable)</text>
<text x="837" y="298" fill="#8b949e" font-size="11" text-anchor="middle">Z/O/F/H/D/L/A</text>

<rect x="230" y="370" width="540" height="86" rx="10" fill="#161b22" stroke="#f0883e"/>
<text x="500" y="399" fill="#f0883e" font-size="15" font-weight="700" text-anchor="middle">R13 safety guard</text>
<text x="500" y="424" fill="#c9d1d9" font-size="12.5" text-anchor="middle">unknown source pair / level letter &#8594; raw code, meaning = None.</text>
<text x="500" y="444" fill="#c9d1d9" font-size="12.5" text-anchor="middle">A mis-decoded SMR could scrap a repairable part &#8212; so never guess.</text>

