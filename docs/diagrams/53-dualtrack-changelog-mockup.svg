<text x="40" y="46" font-size="20" font-weight="700" fill="#e6e9ee" text-anchor="start">MOCKUP — Dual-track changelog: Modern + Legacy (Retroactive Post-Support)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">The Legacy line BRANCHES at the exact version it was created, runs in parallel, and each entry notes what&#x27;s shared vs. backported from the modern track.</text>
