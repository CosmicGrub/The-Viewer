<text x="330" y="209" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">sidecar round-trips.</text>
<rect x="592" y="118" width="268" height="150" rx="11" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="606" y="142" font-size="11.5" font-weight="700" fill="#2f7d4f" text-anchor="start">test_jobcard  (NEW)</text>
<text x="606" y="164" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">figureparts dedup + fig meta + urls;</text>
<text x="606" y="179" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">jobcard intent/order/warning/preview;</text>
