<svg viewBox="0 0 1240 1240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1240" height="1240" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="50" font-size="21" font-weight="700" fill="#e6e9ee" text-anchor="start">THE auto-CAD function — what it does, how it works, how to make it better</text>
<text x="40" y="76" font-size="12" font-weight="400" fill="#9aa6b6" text-anchor="start">Turns every catalogued part into a shaded, dimensioned CAD image from its name + NSN + FLIS dimensions. Offline, pure Python + Pillow.</text>
<line x1="40" y1="92" x2="1200" y2="92" stroke="#2b333f"/>
<text x="40" y="120" font-size="14" font-weight="700" fill="#4f9dff" text-anchor="start">WHAT IT DOES</text>
<rect x="40" y="132" width="1160" height="78" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="156" font-size="11" font-weight="400" fill="#e6e9ee" text-anchor="start">Most of the 20,869 representative parts have no manufacturer CAD model and often no manual figure — just a name and FLIS dimensions. The auto-CAD function manufactures a recognizable engineering picture for each one: it infers the</text><text x="58" y="171" font-size="11" font-weight="400" fill="#e6e9ee" text-anchor="start">part&#x27;s shape, scales it to the real dimensions, and renders a clean three-quarter CAD view with dimension callouts and a title block. The result looks like a drafting-room approximation and is labeled as such — a fast visual identity</text><text x="58" y="186" font-size="11" font-weight="400" fill="#e6e9ee" text-anchor="start">for a part that otherwise had none.</text>
<line x1="40" y1="228" x2="1200" y2="228" stroke="#2b333f"/>
<text x="40" y="256" font-size="14" font-weight="700" fill="#1d9e75" text-anchor="start">HOW IT WORKS  ·  the pipeline (engine/cad_render.py)</text>
<rect x="40" y="270" width="282" height="112" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="270" width="5" height="112" rx="2.5" fill="#4f9dff"/>
<text x="56" y="292" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">1  CLASSIFY</text>
<circle cx="59" cy="309" r="2.4" fill="#4f9dff"/>
<text x="68" y="312" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">name -&gt; family() (24 keyword rules)</text>
<circle cx="59" cy="325" r="2.4" fill="#4f9dff"/>
<text x="68" y="328" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">if unknown -&gt; NSN Federal Supply Class</text>
<circle cx="59" cy="341" r="2.4" fill="#4f9dff"/>
<text x="68" y="344" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">22 shape families (bolt..canister)</text>
<rect x="330" y="270" width="282" height="112" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="330" y="270" width="5" height="112" rx="2.5" fill="#1d9e75"/>
<text x="346" y="292" font-size="12" font-weight="700" fill="#1d9e75" text-anchor="start">2  DIMENSION</text>
<circle cx="349" cy="309" r="2.4" fill="#1d9e75"/>
<text x="358" y="312" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">parse FLIS characteristics text</text>
<circle cx="349" cy="325" r="2.4" fill="#1d9e75"/>
<text x="358" y="328" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">DIAMETER/LENGTH/WIDTH/HEIGHT/THK</text>
<circle cx="349" cy="341" r="2.4" fill="#1d9e75"/>
<text x="358" y="344" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">-&gt; L, W, H, dia, bore (inches)</text>
<rect x="620" y="270" width="282" height="112" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="620" y="270" width="5" height="112" rx="2.5" fill="#caa24a"/>
<text x="636" y="292" font-size="12" font-weight="700" fill="#caa24a" text-anchor="start">3  BUILD MESH</text>
<circle cx="639" cy="309" r="2.4" fill="#caa24a"/>
<text x="648" y="312" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">family builder -&gt; {V, F}</text>
<circle cx="639" cy="325" r="2.4" fill="#caa24a"/>
<text x="648" y="328" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">primitives: cyl/prism/tube/torus/</text>
<circle cx="639" cy="341" r="2.4" fill="#caa24a"/>
<text x="648" y="344" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">sphere/helix/gear/box, scaled</text>
<rect x="910" y="270" width="282" height="112" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="910" y="270" width="5" height="112" rx="2.5" fill="#7f77dd"/>
<text x="926" y="292" font-size="12" font-weight="700" fill="#7f77dd" text-anchor="start">4  PROJECT</text>
<circle cx="929" cy="309" r="2.4" fill="#7f77dd"/>
<text x="938" y="312" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">rotate (three-quarter iso)</text>
<circle cx="929" cy="325" r="2.4" fill="#7f77dd"/>
<text x="938" y="328" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">orthographic to 2-D</text>
<circle cx="929" cy="341" r="2.4" fill="#7f77dd"/>
<text x="938" y="344" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">fit + centre to canvas</text>
<rect x="40" y="392" width="282" height="112" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="40" y="392" width="5" height="112" rx="2.5" fill="#2f7d4f"/>
<text x="56" y="414" font-size="12" font-weight="700" fill="#2f7d4f" text-anchor="start">5  SHADE</text>
<circle cx="59" cy="431" r="2.4" fill="#2f7d4f"/>
<text x="68" y="434" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">painter&#x27;s sort by depth</text>
<circle cx="59" cy="447" r="2.4" fill="#2f7d4f"/>
<text x="68" y="450" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">per-face normal . light</text>
<circle cx="59" cy="463" r="2.4" fill="#2f7d4f"/>
<text x="68" y="466" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">facet colour = material x brightness</text>
<rect x="330" y="392" width="282" height="112" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="330" y="392" width="5" height="112" rx="2.5" fill="#4f9dff"/>
<text x="346" y="414" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">6  ANNOTATE</text>
<circle cx="349" cy="431" r="2.4" fill="#4f9dff"/>
<text x="358" y="434" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">overall-dimension callouts (in.)</text>
<circle cx="349" cy="447" r="2.4" fill="#4f9dff"/>
<text x="358" y="450" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">title block: NSN / name / shape</text>
<circle cx="349" cy="463" r="2.4" fill="#4f9dff"/>
<text x="358" y="466" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">drafting grid + &#x27;REPRESENTATIVE&#x27;</text>
<rect x="620" y="392" width="282" height="112" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="620" y="392" width="5" height="112" rx="2.5" fill="#1d9e75"/>
<text x="636" y="414" font-size="12" font-weight="700" fill="#1d9e75" text-anchor="start">7  OUTPUT</text>
<circle cx="639" cy="431" r="2.4" fill="#1d9e75"/>
<text x="648" y="434" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">2x supersample -&gt; LANCZOS down</text>
<circle cx="639" cy="447" r="2.4" fill="#1d9e75"/>
<text x="648" y="450" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">PNG to index/cadcache/ sidecar</text>
<circle cx="639" cy="463" r="2.4" fill="#1d9e75"/>
<text x="648" y="466" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">cache key = nsn + CAD_VERSION</text>
<rect x="910" y="392" width="282" height="112" rx="10" fill="#171d26" stroke="#2b333f" stroke-width="1"/>
<rect x="910" y="392" width="5" height="112" rx="2.5" fill="#caa24a"/>
<text x="926" y="414" font-size="12" font-weight="700" fill="#caa24a" text-anchor="start">8  SERVE</text>
<circle cx="929" cy="431" r="2.4" fill="#caa24a"/>
<text x="938" y="434" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">/cadimg?nsn= render-on-demand</text>
<circle cx="929" cy="447" r="2.4" fill="#caa24a"/>
<text x="938" y="450" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">MAKE-CAD.bat pre-renders all</text>
<circle cx="929" cy="463" r="2.4" fill="#caa24a"/>
<text x="938" y="466" font-size="8.9" font-weight="400" fill="#9aa6b6" text-anchor="start">shown as the 3-D card thumbnail</text>
<text x="40" y="524" font-size="10" font-weight="400" fill="#7f8a99" text-anchor="start">Faithful to partgeo.js: the same 22 families + the same NSN/FSC fallback, so the CAD image always matches the live WebGL model and the card tag.</text>
