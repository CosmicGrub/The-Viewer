<svg viewBox="0 0 1160 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1160" height="470" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/><text x="40" y="46" font-size="17" font-weight="700" fill="#e6e9ee" text-anchor="start">Cheap-wins bundle — more R12 methods, no GPU, all feed the mechanic views   v1.2.2</text><line x1="40" y1="72" x2="1120" y2="72" stroke="#2b333f"/><rect x="40" y="92" width="350" height="170" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="92" width="6" height="170" rx="3" fill="#e8a06a"/><text x="60" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">⚠  cautions.py  §3.9</text><circle cx="64" cy="133" r="3" fill="#e8a06a"/><text x="76" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">WARNING / CAUTION / NOTE / DANGER</text><circle cx="64" cy="147" r="3" fill="#e8a06a"/><text x="76" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">pulled as severity-ranked objects</text><circle cx="64" cy="161" r="3" fill="#e8a06a"/><text x="76" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">DANGER sorts first · cited to page</text><circle cx="64" cy="175" r="3" fill="#e8a06a"/><text x="76" y="178" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">/api/cautions + dossier card</text><rect x="56" y="232" width="318" height="22" rx="6" fill="#1c2430" stroke="#e8a06a" stroke-width="1"/><text x="66" y="247" font-size="8.8" font-weight="700" fill="#e8a06a" text-anchor="start">SAFETY CALLOUTS</text><rect x="405" y="92" width="350" height="170" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="405" y="92" width="6" height="170" rx="3" fill="#1d9e75"/><text x="425" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🎚  textquality.py  §9.1</text><circle cx="429" cy="133" r="3" fill="#1d9e75"/><text x="441" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Post-hoc OCR quality score 0..1</text><circle cx="429" cy="147" r="3" fill="#1d9e75"/><text x="441" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">garbage-char · vowel-less · stray-tok</text><circle cx="429" cy="161" r="3" fill="#1d9e75"/><text x="441" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">clean / suspect / poor flag</text><circle cx="429" cy="175" r="3" fill="#1d9e75"/><text x="441" y="178" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">flags callouts from bad-OCR pages</text><rect x="421" y="232" width="318" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="431" y="247" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">CONFIDENCE</text><rect x="770" y="92" width="350" height="170" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="770" y="92" width="6" height="170" rx="3" fill="#7f77dd"/><text x="790" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📑  pdfmeta  §5.4 / §5.5</text><circle cx="794" cy="133" r="3" fill="#7f77dd"/><text x="806" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">AcroForm fields (fillable IETMs)</text><circle cx="794" cy="147" r="3" fill="#7f77dd"/><text x="806" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">embedded files (CAD/CSV inside PDF)</text><circle cx="794" cy="161" r="3" fill="#7f77dd"/><text x="806" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">folded into /api/pdfmeta</text><circle cx="794" cy="175" r="3" fill="#7f77dd"/><text x="806" y="178" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">fitz API verified on synthetic PDF</text><rect x="786" y="232" width="318" height="22" rx="6" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/><text x="796" y="247" font-size="8.8" font-weight="700" fill="#7f77dd" text-anchor="start">PDF-NATIVE +</text><line x1="40" y1="284" x2="1120" y2="284" stroke="#2b333f"/><text x="40" y="310" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">Progress toward the self-standing repository (R12)</text><rect x="40" y="322" width="1080" height="118" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/><text x="58" y="346" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Catalog status now: §3.2 units · §3.6 leading-particulars · §3.7/3.8 thread/MIL-SPEC · §3.9 safety callouts · §5.1/5.2/5.3/5.8 PDF outline/metadata/links/annotations · §5.4/5.5 form fields/attachments — all ✅; §4.9 barcodes &amp; §9.1 OCR-confidence ◐.</text><text x="58" y="362" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Every value lands in the linkless Masterfile, dual-unit and confidence-flagged, corpus authoritative. Next cheap lanes: acronym expansion (§3.10), header/footer strip (§2.6); then borderless + cross-page tables (§2.2/2.3) and the heavy ceiling</text><text x="58" y="378" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">(§2.4/4.6/6.2/10.1).</text></svg>