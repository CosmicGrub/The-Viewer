<svg viewBox="0 0 1160 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1160" height="440" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/><text x="40" y="46" font-size="17" font-weight="700" fill="#e6e9ee" text-anchor="start">Rotation-aware dimension-line scanner — the spatial-data marquee   v1.3.1</text><line x1="40" y1="72" x2="1120" y2="72" stroke="#2b333f"/><rect x="40" y="92" width="340" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="92" width="6" height="150" rx="3" fill="#4f9dff"/><text x="60" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📐  dimscan.py  §4.6</text><circle cx="64" cy="133" r="3" fill="#4f9dff"/><text x="76" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">OpenCV Canny + probabilistic Hough</text><circle cx="64" cy="147" r="3" fill="#4f9dff"/><text x="76" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">finds leader/dimension lines at ANY angle</text><circle cx="64" cy="161" r="3" fill="#4f9dff"/><text x="76" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">classify H / V / diagonal (rotated)</text><rect x="56" y="212" width="308" height="22" rx="6" fill="#1c2430" stroke="#4f9dff" stroke-width="1"/><text x="66" y="227" font-size="8.8" font-weight="700" fill="#4f9dff" text-anchor="start">GEOMETRY (no GPU)</text><rect x="400" y="92" width="340" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="400" y="92" width="6" height="150" rx="3" fill="#1d9e75"/><text x="420" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔎  locate numbers in context</text><circle cx="424" cy="133" r="3" fill="#1d9e75"/><text x="436" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">each line → where its dimension text sits</text><circle cx="424" cy="147" r="3" fill="#1d9e75"/><text x="436" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">even rotated/vertical callouts</text><circle cx="424" cy="161" r="3" fill="#1d9e75"/><text x="436" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">host-side OCR reads the number</text><rect x="416" y="212" width="308" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="426" y="227" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">§4.6 host step</text><rect x="760" y="92" width="360" height="150" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="760" y="92" width="6" height="150" rx="3" fill="#7f77dd"/><text x="780" y="116" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🧩  → Masterfile dimension</text><circle cx="784" cy="133" r="3" fill="#7f77dd"/><text x="796" y="136" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">value tied to the feature it measures</text><circle cx="784" cy="147" r="3" fill="#7f77dd"/><text x="796" y="150" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">dual-unit + confidence flagged</text><circle cx="784" cy="161" r="3" fill="#7f77dd"/><text x="796" y="164" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">/api/dimscan?doc=&amp;page=</text><rect x="776" y="212" width="328" height="22" rx="6" fill="#1c2430" stroke="#7f77dd" stroke-width="1"/><text x="786" y="227" font-size="8.8" font-weight="700" fill="#7f77dd" text-anchor="start">SPATIAL DATA</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9aa6b6"/></marker></defs><path d="M380 167 L400 167" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><path d="M740 167 L760 167" stroke="#9aa6b6" stroke-width="2" marker-end="url(#a)"/><line x1="40" y1="264" x2="1120" y2="264" stroke="#2b333f"/><text x="40" y="290" font-size="13" font-weight="700" fill="#e6e9ee" text-anchor="start">Where the catalog stands after this autonomous push</text><rect x="40" y="302" width="1080" height="110" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/><text x="58" y="326" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">✅ done: §2.2/2.3/2.6 tables+cleanup · §3.2/3.6-3.11 semantic extractors · §5.1-5.5/5.8 PDF-native · §6.2 IETM/S1000D · §7.4 knowledge graph. ◐ partial: §4.9 barcodes (QR now), §9.1 OCR-confidence, §4.6 dimension geometry (number-OCR host-side). ○</text><text x="58" y="342" font-size="10.5" font-weight="400" fill="#9aa6b6" text-anchor="start">remaining (need GPU/heavy models, host-side): §4.5 callout-number OCR (easyocr), §2.4 full layout analysis (LayoutParser), §10.1 vision-language page QA. The repository now answers on its own across the whole cheap+structural span (R12).</text></svg>