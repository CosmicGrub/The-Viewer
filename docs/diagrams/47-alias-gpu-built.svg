<rect x="60" y="565" width="8" height="8" rx="2" fill="#caa24a"/>
<text x="76" y="575" font-size="9.4" font-weight="400" fill="#9aa6b6" text-anchor="start">3  operator (-10)</text>
<text x="360" y="575" font-size="9.4" font-weight="700" fill="#e6e9ee" text-anchor="start">7,606 pages</text>
