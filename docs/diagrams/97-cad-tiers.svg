<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="560" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#e6e9ee" text-anchor="start">CAD detail level = the program build (RPS tier)  (v0.89.0)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">The auto-CAD engine renders the look each build can afford: richer on capable hardware, lightweight (and numpy-free) on legacy.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="110" width="360" height="210" rx="12" fill="#171d26" stroke="#c4585a" stroke-width="1"/>
<text x="58" y="140" font-size="14" font-weight="700" fill="#c4585a" text-anchor="start">LEGACY build</text>
<text x="330" y="140" font-size="16" font-weight="700" fill="#c4585a" text-anchor="start">→ v1</text>
<circle cx="62" cy="165" r="2.6" fill="#c4585a"/>
<text x="72" y="168" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">flat diffuse shading</text>
<circle cx="62" cy="188" r="2.6" fill="#c4585a"/>
<text x="72" y="191" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">head-down (original projection)</text>
<circle cx="62" cy="211" r="2.6" fill="#c4585a"/>
<text x="72" y="214" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">no colour parse, NO TEXTURE</text>
<circle cx="62" cy="234" r="2.6" fill="#c4585a"/>
<text x="72" y="237" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">no numpy / no GPU needed</text>
<circle cx="62" cy="257" r="2.6" fill="#c4585a"/>
<text x="72" y="260" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">runs on Win 7 / Vista, low-RAM</text>
<rect x="56" y="286" width="328" height="24" rx="6" fill="#1c2430" stroke="#c4585a" stroke-width="1"/>
<text x="66" y="302" font-size="9" font-weight="700" fill="#c4585a" text-anchor="start">cache: &lt;nsn&gt;_v1.png  (per-tier, separate)</text>
<rect x="410" y="110" width="360" height="210" rx="12" fill="#171d26" stroke="#caa24a" stroke-width="1"/>
<text x="428" y="140" font-size="14" font-weight="700" fill="#caa24a" text-anchor="start">LITE build</text>
<text x="700" y="140" font-size="16" font-weight="700" fill="#caa24a" text-anchor="start">→ v2</text>
<circle cx="432" cy="165" r="2.6" fill="#caa24a"/>
<text x="442" y="168" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">right-side-up orientation</text>
<circle cx="432" cy="188" r="2.6" fill="#caa24a"/>
<text x="442" y="191" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">Blinn-Phong specular + metallic</text>
<circle cx="432" cy="211" r="2.6" fill="#caa24a"/>
<text x="442" y="214" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">no surface texture (lighter)</text>
<circle cx="432" cy="234" r="2.6" fill="#caa24a"/>
<text x="442" y="237" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">good on mid machines</text>
<circle cx="432" cy="257" r="2.6" fill="#caa24a"/>
<text x="442" y="260" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">numpy optional</text>
<rect x="426" y="286" width="328" height="24" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/>
<text x="436" y="302" font-size="9" font-weight="700" fill="#caa24a" text-anchor="start">cache: &lt;nsn&gt;_v2.png  (per-tier, separate)</text>
<rect x="780" y="110" width="360" height="210" rx="12" fill="#171d26" stroke="#2f7d4f" stroke-width="1"/>
<text x="798" y="140" font-size="14" font-weight="700" fill="#2f7d4f" text-anchor="start">MODERN build</text>
<text x="1070" y="140" font-size="16" font-weight="700" fill="#2f7d4f" text-anchor="start">→ v3</text>
<circle cx="802" cy="165" r="2.6" fill="#2f7d4f"/>
<text x="812" y="168" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">+ FLIS colour (olive drab, CARC…)</text>
<circle cx="802" cy="188" r="2.6" fill="#2f7d4f"/>
<text x="812" y="191" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">+ per-material surface texture</text>
<circle cx="802" cy="211" r="2.6" fill="#2f7d4f"/>
<text x="812" y="214" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">(brushed / grain / rubber / paint)</text>
<circle cx="802" cy="234" r="2.6" fill="#2f7d4f"/>
<text x="812" y="237" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">the full &#x27;product render&#x27;</text>
<circle cx="802" cy="257" r="2.6" fill="#2f7d4f"/>
<text x="812" y="260" font-size="10" font-weight="400" fill="#9aa6b6" text-anchor="start">the default</text>
<rect x="796" y="286" width="328" height="24" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/>
<text x="806" y="302" font-size="9" font-weight="700" fill="#2f7d4f" text-anchor="start">cache: &lt;nsn&gt;_v3.png  (per-tier, separate)</text>
<rect x="40" y="344" width="1100" height="70" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="368" font-size="12" font-weight="700" fill="#4f9dff" text-anchor="start">How /cadimg picks the level</text>
<text x="58" y="388" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Explicit ?style=v1|v2|v3 wins; else ?tier=modern|lite|legacy; else the server&#x27;s own RPS_MODE (set from the machine profile at startup). cad_render.TIER_STYLE maps tier→style. Response carries X-CAD-Style. So a</text><text x="58" y="401" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">build serves — and only renders/ships — the detail it can afford; nothing wasted.</text>
<rect x="40" y="430" width="1100" height="54" rx="12" fill="#171d26" stroke="#7f77dd" stroke-width="1"/>
<text x="58" y="452" font-size="11.5" font-weight="700" fill="#7f77dd" text-anchor="start">Populate a tier</text>
<text x="58" y="470" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">MAKE-CAD.bat (or make_cad.py --style v1|v2|v3) pre-renders a chosen tier into the per-tier cache; the legacy build renders v1 on-demand with zero extra dependencies. Backwards-compatible: default stays v3</text><text x="58" y="482" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">(R1).</text>
<text x="40" y="552" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">Diagram. Dark (R3). v0.89.0 · 2026-06-04 · cad_render.TIER_STYLE + ensure(style=) · /cadimg ?style/?tier/RPS_MODE · make_cad --style. R1.</text>
</svg>