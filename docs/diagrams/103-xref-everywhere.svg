<svg viewBox="0 0 1180 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="470" rx="0" fill="#0f1419" stroke="#0f1419" stroke-width="1"/>
<text x="40" y="46" font-size="18" font-weight="700" fill="#e6e9ee" text-anchor="start">Cross-reference everywhere — Ops + procedure + 3-D  (v0.79.1)</text>
<text x="40" y="70" font-size="11" font-weight="400" fill="#9aa6b6" text-anchor="start">The unified part record now surfaces across the app, and Ops shows how resolved the corpus is.</text>
<line x1="40" y1="86" x2="1140" y2="86" stroke="#2b333f"/>
<rect x="40" y="108" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="40" y="108" width="6" height="200" rx="3" fill="#2f7d4f"/><text x="60" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">📊  Ops coverage card</text><circle cx="64" cy="149" r="3" fill="#2f7d4f"/><text x="76" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Parsed rows · with NSN (%) · FLIS-validated (%) ·</text><circle cx="64" cy="163" r="3" fill="#2f7d4f"/><text x="76" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">in-review (low-confidence %).</text><circle cx="64" cy="177" r="3" fill="#2f7d4f"/><text x="76" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">From xref_coverage(); links to 🔧 Part# review.</text><circle cx="64" cy="191" r="3" fill="#2f7d4f"/><text x="76" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">See at a glance how much is decided vs needs a human.</text><rect x="56" y="278" width="328" height="22" rx="6" fill="#1c2430" stroke="#2f7d4f" stroke-width="1"/><text x="66" y="293" font-size="8.8" font-weight="700" fill="#2f7d4f" text-anchor="start">Know where you stand.</text>
<rect x="412" y="108" width="360" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="412" y="108" width="6" height="200" rx="3" fill="#1d9e75"/><text x="432" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🧰  3-D modal cross-reference</text><circle cx="436" cy="149" r="3" fill="#1d9e75"/><text x="448" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Opened part&#x27;s side panel now shows: FLIS name (OCR</text><circle cx="436" cy="163" r="3" fill="#1d9e75"/><text x="448" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">conflict noted), manufacturer (CAGEC→company),</text><circle cx="436" cy="177" r="3" fill="#1d9e75"/><text x="448" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">vehicles it fits, interchangeable / superseded,</text><circle cx="436" cy="191" r="3" fill="#1d9e75"/><text x="448" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">colloquial name, confidence + sources.</text><rect x="428" y="278" width="328" height="22" rx="6" fill="#1c2430" stroke="#1d9e75" stroke-width="1"/><text x="438" y="293" font-size="8.8" font-weight="700" fill="#1d9e75" text-anchor="start">Full context where you look.</text>
<rect x="784" y="108" width="356" height="200" rx="12" fill="#171d26" stroke="#2b333f" stroke-width="1"/><rect x="784" y="108" width="6" height="200" rx="3" fill="#caa24a"/><text x="804" y="132" font-size="12.5" font-weight="700" fill="#e6e9ee" text-anchor="start">🔧  Procedure parts enriched</text><circle cx="808" cy="149" r="3" fill="#caa24a"/><text x="820" y="152" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">Each part in a how-to now resolves inline to its</text><circle cx="808" cy="163" r="3" fill="#caa24a"/><text x="820" y="166" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">name + the vehicles it fits (+ manufacturer).</text><circle cx="808" cy="177" r="3" fill="#caa24a"/><text x="820" y="180" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">So a step&#x27;s NSNs aren&#x27;t just numbers — they&#x27;re</text><circle cx="808" cy="191" r="3" fill="#caa24a"/><text x="820" y="194" font-size="8.7" font-weight="400" fill="#9aa6b6" text-anchor="start">named, placed, and cross-referenced.</text><rect x="800" y="278" width="324" height="22" rx="6" fill="#1c2430" stroke="#caa24a" stroke-width="1"/><text x="810" y="293" font-size="8.8" font-weight="700" fill="#caa24a" text-anchor="start">Parts in context, in the fix.</text>
<rect x="40" y="326" width="1100" height="86" rx="12" fill="#171d26" stroke="#4f9dff" stroke-width="1"/>
<text x="58" y="347" font-size="11.5" font-weight="700" fill="#4f9dff" text-anchor="start">All from one source</text>
<text x="58" y="367" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">Ops, the part card, the dossier, the 3-D modal, and the procedure page all read the same unified /api/part_record (FLIS-validated, provenance-tracked, offline). Run BUILD-RPSTL.bat (+ BUILD-XREF.bat</text><text x="58" y="380" font-size="9.5" font-weight="400" fill="#9aa6b6" text-anchor="start">for manufacturer/NSN recovery); the Ops card then shows your real coverage. Additive, ES5, index never written (R1/R6).</text>
<text x="40" y="464" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">BUILT diagram. Dark (R3). v0.79.1 · 2026-06-03 · ops xref card · 3-D + procedure cross-reference · /api/part_record · /api/xref_coverage.</text>
</svg>