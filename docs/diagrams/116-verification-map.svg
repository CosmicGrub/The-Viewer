<text x="882" y="142" font-size="11.5" font-weight="700" fill="#caa24a" text-anchor="start">test_routes / _search / _hardening</text>
<text x="882" y="164" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">route table shape; search quality</text>
<text x="882" y="179" font-size="8.8" font-weight="400" fill="#9aa6b6" text-anchor="start">(ranking/dedup); hardening (POST cap,</text>
